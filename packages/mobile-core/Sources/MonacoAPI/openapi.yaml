  # api/spec/funding.yaml
    Balance:
      type: object
      description: The member wallet's on-chain USDC and currently spendable platform balance.
      required: [available_micros, on_chain_micros, in_flight_micros, deposit_address, as_of]
      properties:
        arriving_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            USDC deposited on another chain and still being forwarded to Solana, in micros. Not spendable
            and not part of available_micros. Absent until the multichain deposit work lands.
          examples: ["0"]
        unspendable_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            USDC the member wallet received in a token account other than its associated token account.
            It is part of on_chain_micros and not part of available_micros, because sends and withdrawals
            spend only from the associated account. Absent when there is none. Support recovers it.
          examples: ["5000000"]
        available_micros: {type: string, pattern: "^[0-9]+$", examples: ["22500000"]}
        on_chain_micros: {type: string, pattern: "^[0-9]+$", examples: ["25000000"]}
        in_flight_micros: {type: string, pattern: "^[0-9]+$", examples: ["2500000"]}
        deposit_address: {type: string, examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]}
        as_of:
          type: string
          format: date-time
          description: When on_chain_micros was read from the chain. Up to 10 minutes old when the chain is unreachable.
          examples: ["2026-10-03T15:00:00Z"]
    BounceQueue:
      type: object
      description: The pending bounces, oldest first.
      examples:
        - items: []
      required: [items]
      properties:
        items:
          type: array
          description: The paused cabals.
          items: {$ref: "#/components/schemas/PendingBounce"}
    CreateOnrampSessionRequest:
      type: object
      description: What to prefill on the fund page.
      properties:
        suggested_amount_micros:
          $ref: "#/components/schemas/OnrampMicros"
        cabal_id:
          type: string
          format: uuid
          description: The cabal the user came from, when they did.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
    ExchangeOnrampTokenRequest:
      type: object
      description: The token from the fund page URL.
      required: [token]
      properties:
        token:
          type: string
          description: The `s` query parameter of the fund page URL.
          minLength: 1
          maxLength: 128
          examples: ["q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
    OnrampExchange:
      type: object
      description: What the fund page needs to start the provider flow.
      required: [session_id, privy_user_id, wallet_address, suggested_amount_micros, usdc_mint]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        privy_user_id:
          type: string
          description: The Privy user the session belongs to. The fund page checks the signed-in Privy user against it before opening the provider flow.
          examples: ["did:privy:cm1abcdefghijklmnopqrstuv"]
        wallet_address:
          type: string
          description: The member wallet the provider sends USDC to.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount to prefill in USDC micros, or null to let the user choose.
          examples: ["25000000"]
        usdc_mint:
          type: string
          description: The Solana USDC mint.
          examples: [EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]
    OnrampMicros:
      type: string
      description: A USDC amount in micros, as a decimal string.
      pattern: "^[1-9][0-9]{0,19}$"
      examples: ["25000000"]
    OnrampSession:
      type: object
      description: A card deposit session.
      required: [session_id, status, suggested_amount_micros, created_at, completed_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          type: string
          enum: [created, opened, confirmed, submitted, cancelled, failed, expired]
          description: Where the session is in its status machine.
          examples: [confirmed]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount the app suggested in USDC micros, or null.
          examples: ["25000000"]
        created_at:
          type: string
          format: date-time
          description: When the session was created.
          examples: ["2026-10-03T15:00:00Z"]
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the session reached a final status, or null while it is live.
          examples: ["2026-10-03T15:04:00Z"]
    OnrampSessionCreated:
      type: object
      description: A new onramp session and the page that runs it.
      required: [session_id, url, expires_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        url:
          type: string
          description: The fund page URL with its one-time token. Open it in the browser.
          examples: ["https://monacolabs.xyz/fund?s=q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
        expires_at:
          type: string
          format: date-time
          description: When the token stops working.
          examples: ["2026-10-03T15:10:00Z"]
    PauseReason:
      type: string
      description: Why trading is paused. `ops` is an operator's pause, `external_deposit` is an unreturned direct transfer.
      enum: [external_deposit, ops]
      examples: [ops]
    PauseState:
      type: object
      description: Whether trading is paused in a scope and why.
      examples:
        - {paused: true, reasons: [ops], since: "2026-10-07T12:00:00Z"}
      required: [paused, reasons, since]
      properties:
        paused: {type: boolean, description: True while any pause is open., examples: [true]}
        reasons:
          type: array
          description: The reasons that are open, a global pause first.
          items: {$ref: "#/components/schemas/PauseReason"}
        since:
          type: [string, "null"]
          format: date-time
          description: When the oldest open pause began. Null while nothing is paused.
          examples: ["2026-10-07T12:00:00Z"]
    PendingBounce:
      type: object
      description: One cabal paused for a direct transfer that has not been sent back.
      examples:
        - {cabal_id: 019cc330-2222-7000-8000-000000000001, since: "2026-10-07T12:00:00Z"}
      required: [cabal_id, since]
      properties:
        cabal_id: {type: string, format: uuid, description: The paused cabal., examples: [019cc330-2222-7000-8000-000000000001]}
        since: {type: string, format: date-time, description: When the pause began., examples: ["2026-10-07T12:00:00Z"]}
    ReportOnrampStatusRequest:
      type: object
      description: How the provider flow ended.
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, submitted, cancelled, failed]
          description: >-
            confirmed when the user finished the provider flow, submitted when they left before
            confirmation, cancelled or failed when it threw.
          examples: [confirmed]
        provider:
          type: string
          description: The on-ramp provider Privy chose, when the page knows it.
          minLength: 1
          maxLength: 64
          examples: [moonpay]
    WithdrawAccepted:
      type: object
      description: A signed and sent withdrawal.
      required: [withdrawal_id, status, tx_signature]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        tx_signature: {type: string, examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]}
    WithdrawPreviewRequest:
      type: object
      description: >-
        A withdrawal to preview. Every field is optional, so the keypad can ask for the fee and the most the
        caller can send before an amount or an address is typed.
      properties:
        destination_kind:
          type: string
          enum: [solana, evm]
          default: solana
          description: Where `to_address` lives. Missing means solana.
          examples: [solana]
        network:
          type: string
          enum: [solana, base, arbitrum, ethereum]
          default: solana
          description: The destination chain. Missing means solana. Required when destination_kind is evm.
          examples: [solana]
        amount_micros:
          type: string
          pattern: "^[0-9]+$"
          description: USDC micros. Any amount is answered; one under 1000000 sets `below_min`.
          examples: ["2000000"]
        to_address:
          type: string
          description: >-
            The destination: a Solana wallet, or for destination_kind evm a 0x address on `network`. Checked
            only when given.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
    WithdrawRequest:
      type: object
      description: A withdrawal of platform balance to a Solana address or to an address on an EVM network.
      required: [amount_micros, to_address]
      properties:
        destination_kind:
          type: string
          enum: [solana, evm]
          description: Where `to_address` lives. Missing means solana.
          examples: [solana]
        network:
          type: string
          enum: [solana, base, arbitrum, ethereum]
          description: The destination chain. Missing means solana. Required when destination_kind is evm.
          examples: [solana]
        amount_micros:
          type: string
          pattern: "^[0-9]+$"
          description: USDC micros, at least 1000000.
          examples: ["2000000"]
        to_address:
          type: string
          description: >-
            The destination: a Solana wallet, which cannot be the caller's own member wallet, or for
            destination_kind evm a 0x address on `network`.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
    Withdrawal:
      type: object
      description: One withdrawal and where it stands.
      required: [withdrawal_id, status, amount_micros, to_address, tx_signature, fail_code, created_at, completed_at]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["2000000"]}
        to_address: {type: string, examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]}
        tx_signature:
          type: [string, "null"]
          description: Null until the transfer is signed.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        fail_code:
          type: [string, "null"]
          description: The error code a failed withdrawal ended with. Null otherwise.
          examples: [privy_unavailable]
        created_at: {type: string, format: date-time, examples: ["2026-10-04T15:00:00Z"]}
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the withdrawal confirmed or failed. Null while it is in flight.
          examples: ["2026-10-04T15:00:10Z"]
    WithdrawalAuthorization:
      type: object
      description: A single-use confirmation of one exact withdrawal.
      required: [authorization_id, expires_at]
      properties:
        authorization_id:
          type: string
          format: uuid
          description: The id to send in the `Withdrawal-Authorization` header.
          examples: [01890a5d-ac96-774b-bcce-b302099a8059]
        expires_at:
          type: string
          format: date-time
          description: When the confirmation stops working.
          examples: ["2026-10-21T12:05:00Z"]
    WithdrawalPreview:
      type: object
      description: What a withdrawal on one network costs, the most the caller can send and, with an amount, what arrives.
      required: [available_micros, fee_micros, fee_known, fee_mode, max_amount_micros, receive_micros, over_micros, below_min, min_micros, arrival_seconds, expires_at]
      properties:
        available_micros:
          type: string
          pattern: "^[0-9]+$"
          description: The caller's available cash, the same figure as `GET /v1/me/balance`.
          examples: ["500000000"]
        fee_micros:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: >-
            The network's withdraw fee in USDC micros. 0 on Solana, where the relayer sponsors the network fee.
            On an EVM network it is Privy's cut from the last quote for that network (kept 5 minutes), or null
            when `fee_known` is false.
          examples: ["0"]
        fee_known:
          type: boolean
          description: False on an EVM network until an amount and an address have been quoted.
          examples: [true]
        fee_mode:
          type: string
          enum: [included, on_top]
          description: >-
            `included` means the fee comes out of the amount (EVM); `on_top` means it is added to the amount
            (Solana, with a fee of 0 today).
          examples: [on_top]
        max_amount_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            The most the caller can send. On top, available cash less the fee, never below 0; included, the
            available cash.
          examples: ["500000000"]
        receive_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            USDC micros the destination receives. "0" when nothing arrives: without an amount, below the minimum,
            over the maximum, or on an EVM network without a valid address. An estimate for an EVM network, exact
            for Solana.
          examples: ["9992500"]
        over_micros:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: How much the amount is over `max_amount_micros`, 0 when it is not. Null without an amount and below the minimum.
          examples: ["150500000"]
        below_min:
          type: boolean
          description: The amount is under `min_micros`. Answered with 200, never an error.
          examples: [false]
        min_micros:
          type: string
          pattern: "^[0-9]+$"
          description: The smallest withdrawal, in USDC micros.
          examples: ["1000000"]
        arrival_seconds:
          type: integer
          description: How long the network takes to deliver a withdrawal, in seconds.
          examples: [60]
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the EVM quote expires. Null for Solana, which has no quote, and without a quote.
          examples: ["2026-10-11T10:30:00Z"]
    WithdrawalStatus:
      type: string
      description: created, then submitted, then confirmed. created or submitted can end in failed.
      enum: [created, submitted, confirmed, failed]
  # api/spec/governance.yaml
    AdminProposal:
      type: object
      description: One proposal as the admin panel shows it.
      required:
        - id
        - cabal_id
        - proposer
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - expires_at
        - created_at
        - tally
        - voters
        - swap
        - status_history
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer: {$ref: "#/components/schemas/AdminProposer"}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
