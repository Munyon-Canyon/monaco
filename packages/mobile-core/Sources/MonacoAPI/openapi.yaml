                proposal_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
                kind: {type: string, enum: [buy, sell], examples: [buy]}
                symbol: {type: string, examples: [NVDA]}
                right: {type: boolean, examples: [true]}
            is_viewer: {type: boolean, description: True on the caller's own row., examples: [false]}
            is_mine: {type: boolean, description: True on a cabal the caller is a member of. Always false on a person., examples: [false]}
        below:
          type: [object, "null"]
          description: The row ranked directly below `me`. Null when `me` is last or null.
          examples: [null]
