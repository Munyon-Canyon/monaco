          pot_micros: "80000000"
          platform_balance_micros: "20000000"
          total_value_held_micros: "100000000"
          buckets: []
          series: []
      required: [from, to, bucket, as_of, pot_micros, platform_balance_micros, total_value_held_micros, buckets, series]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        as_of: {type: [string, "null"], format: date-time, description: When the latest valuation run priced the pots. Null before the first run., examples: ["2026-09-30T23:55:00Z"]}
        pot_micros: {$ref: "#/components/schemas/DashboardMicros"}
        platform_balance_micros: {$ref: "#/components/schemas/DashboardMicros"}
        total_value_held_micros: {$ref: "#/components/schemas/DashboardMicros"}
        buckets:
          type: array
          description: The buckets with activity, oldest first.
          items: {$ref: "#/components/schemas/MoneyBucket"}
        series:
          type: array
          description: Card onramp status changes per bucket and status, oldest first.
          items: {$ref: "#/components/schemas/DashboardPoint"}
    SafetyDashboard:
      type: object
      description: Pauses, outside deposits, bans and administrator actions.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          banned_users: 2
          banned_cabals: 1
          series: []
      required: [from, to, bucket, banned_users, banned_cabals, series]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        banned_users: {type: integer, format: int64, description: Users whose account is banned now., examples: [2]}
        banned_cabals: {type: integer, format: int64, description: Cabals that are banned now., examples: [1]}
        series:
          type: array
          description: Events per bucket, metric and group, oldest first.
          items: {$ref: "#/components/schemas/DashboardPoint"}
    SocialDashboard:
      type: object
      description: The size and activity of the social graph.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          users_total: 130
          cabals: {total: 12, banned: 1, members_p50: 4, members_p90: 9, members_max: 15}
          user_states: []
          series: []
      required: [from, to, bucket, users_total, cabals, user_states, series]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        users_total: {type: integer, format: int64, description: "Users in every state, deleted accounts included.", examples: [130]}
        cabals: {$ref: "#/components/schemas/DashboardCabals"}
        user_states:
          type: array
          description: Users by auth state and account status.
          items: {$ref: "#/components/schemas/UserStateCount"}
        series:
          type: array
          description: Events per bucket, metric and group, oldest first.
          items: {$ref: "#/components/schemas/DashboardPoint"}
    UserStateCount:
      type: object
      description: The users in one auth state and account status.
      examples:
        - auth_state: ONBOARDING_COMPLETED
          account_status: active
          users: 120
      required: [auth_state, account_status, users]
      properties:
        auth_state: {type: string, description: The auth state., examples: [ONBOARDING_COMPLETED]}
        account_status: {type: string, description: The account status., examples: [active]}
        users: {type: integer, format: int64, description: Users in this state., examples: [120]}
  # api/spec/app.yaml
    AppConfig:
      type: object
      description: What the app needs to know at launch.
      required: [min_ios_build, store_url]
      properties:
        min_ios_build:
          type: integer
          format: int32
          minimum: 0
          description: The lowest iOS build number allowed to run. 0 means no gate.
          examples: [120]
        store_url:
          type: string
          description: Where the update screen sends people.
          examples: ["https://testflight.apple.com/join/monaco"]
      examples:
        - {min_ios_build: 120, store_url: "https://testflight.apple.com/join/monaco"}
  # api/spec/base.yaml
    Network:
      type: string
      enum: [solana, base, arbitrum, ethereum, robinhood]
      description: The chain a wallet, listing or step lives on.
      examples: [solana]
    PriceComparison:
      type: object
      description: >-
        Every venue quoted for one trade, best first, by underlying shares received for a buy or USDC
        received for a sell, after every cost of the route.
      required: [winner_listing_id, quotes, unavailable]
      properties:
        winner_listing_id: {type: string, format: uuid, description: The listing the trade routes to., examples: [01928a6e-0000-7000-8000-000000000001]}
        quotes:
          type: array
          description: Every quote compared, best first.
          items: {$ref: "#/components/schemas/RouteQuote"}
          examples: [[]]
        unavailable:
          type: array
          description: Every enabled venue the router couldn't quote for this trade. It never affects the winner.
          items: {$ref: "#/components/schemas/UnavailableVenue"}
          examples: [[{listing_id: 01928a6e-0000-7000-8000-000000000002, network: base, venue: uniswap, reason: simulation_failed}]]
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
    Reaction:
      type: object
      description: One emoji on a feed item, how many users reacted with it and whether the caller did.
      required: [emoji, count, mine]
      properties:
        emoji: {type: string, minLength: 1, maxLength: 32, description: "One emoji, such as 🎉 or 👍🏽.", examples: ["🎉"]}
        count: {type: integer, format: int32, minimum: 1, description: "The number of users who reacted with this emoji.", examples: [5]}
        mine: {type: boolean, description: "True when the caller reacted with this emoji.", examples: [true]}
    ReasonBody:
      type: object
      description: The reason an administrator gives for an action.
      examples:
        - reason: spam
      required: [reason]
      properties:
        reason:
          type: string
          description: >-
            Free text. The server trims it and requires 3 to 500 characters, otherwise it answers
            reason_required.
          minLength: 1
          maxLength: 500
          examples: [spam]
    RouteCost:
      type: object
      description: One cost of a route, in USDC micros.
      required: [kind, micros]
      properties:
        kind: {type: string, enum: [price_impact, pool_fee, bridge, gas, privy_fee], description: What the cost pays for., examples: [bridge]}
        micros: {type: string, pattern: "^[0-9]+$", description: The cost in USDC micros., examples: ["7500"]}
    RouteQuote:
      type: object
      description: One venue's all-in quote for the trade.
      required: [listing_id, issuer, network, venue, net_share_nanos, net_micros, costs, quoted_at, expires_at]
      properties:
        listing_id: {type: string, format: uuid, description: The listing quoted., examples: [01928a6e-0000-7000-8000-000000000001]}
        issuer: {type: string, description: The token issuer., examples: [xstocks]}
        network: {$ref: "#/components/schemas/Network"}
        venue: {type: string, enum: [jupiter, uniswap], description: Where the swap would run., examples: [jupiter]}
        net_share_nanos: {type: string, pattern: "^[0-9]+$", description: "Underlying shares after every cost, in billionths of a share.", examples: ["40000000"]}
        net_micros: {type: string, pattern: "^[0-9]+$", description: "USDC after every cost, in micros. For a buy it is the amount spent.", examples: ["10000000"]}
        costs:
          type: array
          description: Every cost of the route.
          items: {$ref: "#/components/schemas/RouteCost"}
          examples: [[{kind: bridge, micros: "7500"}]]
        quoted_at: {type: string, format: date-time, description: When the quote was taken., examples: ["2026-10-10T12:00:00Z"]}
        expires_at: {type: string, format: date-time, description: When the quote stops being valid., examples: ["2026-10-10T12:00:30Z"]}
    UnavailableVenue:
      type: object
      description: An enabled venue left out of the comparison, and why.
      required: [listing_id, network, venue, reason]
      properties:
        listing_id: {type: string, format: uuid, description: The listing that couldn't be quoted., examples: [01928a6e-0000-7000-8000-000000000002]}
        network: {$ref: "#/components/schemas/Network"}
        venue: {type: string, enum: [jupiter, uniswap], description: Where the swap would run., examples: [uniswap]}
        reason:
          type: string
          enum: [no_route, stale, expired, simulation_failed, impact]
          x-enum-varnames: [UnavailableNoRoute, UnavailableStale, UnavailableExpired, UnavailableSimulationFailed, UnavailableImpact]
          description: >-
            Why the venue couldn't be quoted: no route, a stale price or quote, an expired quote, a failed quote
            simulation, or price impact past the limit.
          examples: [simulation_failed]
        reason_detail:
          type: string
          description: >-
            Optional words that say more about the reason, for the app to show beside "Unavailable". Set when a
            chain can't be simulated yet, as "not set up on this chain yet".
          examples: [not set up on this chain yet]
  # api/spec/cabal.yaml
    AccessDecisionRequest:
      type: object
      description: How to decide a pending request or invite.
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, deny], examples: [approve]}
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      required:
        [id, name, picture_url, status, rules, creator, member_count, created_at, open_proposal_count, voter_count, members, me, my_access_request, invite_code, treasury_address]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Kai]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        status: {type: string, description: "`active` or `banned`.", examples: [active]}
        rules: {$ref: "#/components/schemas/CabalRules", examples: [{join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}]}
        creator: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        member_count: {type: integer, format: int32, examples: [1]}
        created_at: {type: string, format: date-time, description: When the cabal was created., examples: ["2026-09-30T12:00:00Z"]}
        open_proposal_count: {type: integer, format: int32, description: Proposals open for a vote right now., examples: [1]}
        voter_count: {type: integer, format: int32, description: Members who can vote., examples: [1]}
        admins: {type: array, items: {$ref: "#/components/schemas/CabalPerson"}, description: "The cabal's admins, the creator first. Always present.", examples: [[{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]]}
        members:
          type: array
          description: "Deprecated, but kept for builds that predate the paged route. Every member, which costs the whole membership on each read. Page `GET /v1/cabals/{id}/members` instead."
          items: {$ref: "#/components/schemas/CabalMember"}
          examples: [[]]
        me:
          type: [object, "null"]
          description: "Null when the caller is not a member."
          examples: [null]
          x-go-type-name: CabalMembership
          required: [role, can_vote, can_propose]
          properties:
            role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
            can_vote: {type: boolean, examples: [true]}
            can_propose: {type: boolean, description: "Whether the caller may propose a trade under `rules.who_can_propose`.", examples: [true]}
        my_access_request:
          type: [object, "null"]
          description: "The caller's pending access request or invite, else their latest access request when the creator denied it, else null. Always null for a member."
          examples: [null]
          x-go-type: CabalAccess
          required: [id, direction, status]
          properties:
            id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
            direction: {type: string, description: "`request` or `invite`.", examples: [request]}
            status: {type: string, examples: [pending]}
        invite_code: {type: [string, "null"], description: "Retired. Always null: cabals have no invite codes.", examples: [null]}
        treasury_address: {type: string, description: Solana address of the app-owned treasury wallet., examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]}
    CabalAccess:
      type: object
      description: A pending request or invite.
      required: [id, direction, status]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        direction: {type: string, description: "`request` or `invite`.", examples: [request]}
        status: {type: string, examples: [pending]}
    CabalAccessRequest:
      type: object
      description: A pending request to join a cabal, as an admin sees it.
      required: [id, user, via, created_at]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        via:
          description: The member whose link the request came through. Null when it came through no link or a code that names no member.
          type: [object, "null"]
          x-go-type: CabalPerson
          required: [user_id, handle, display_name, photo_url]
          properties:
            user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
            handle: {type: [string, "null"], examples: [jordan]}
            display_name: {type: string, examples: [Jordan]}
            photo_url: {type: [string, "null"], examples: [null]}
          examples: [null]
        created_at: {type: string, format: date-time, examples: ["2026-10-02T15:00:00Z"]}
    CabalAccessRequestBody:
      type: object
      description: Optional context for a request to join.
      properties:
        via_code: {type: string, description: "The referral code or handle from the link the invitee opened.", examples: [jordan]}
    CabalInvite:
      type: object
      description: A pending invite, as its invitee sees it.
      required: [request_id, cabal, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, description: The id to accept or decline., examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        cabal: {$ref: "#/components/schemas/CabalInviteCabal", examples: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CabalInviteCabal:
      type: object
      description: The cabal an invite opens.
      required: [id, name, picture_url, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalMember:
      type: object
      description: A cabal member, including vote standing.
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
    CabalMemberPage:
      type: object
      description: One page of a cabal's members.
      required: [items, next_cursor, totals]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalMemberRow"}
          examples: [[]]
        next_cursor: {type: [string, "null"], description: Null on the last page., examples: [null]}
        totals: {$ref: "#/components/schemas/CabalMemberTotals", examples: [{admins: 2, voters: 6, members: 0}]}
    CabalMemberRow:
      type: object
      description: A cabal member on the paged read, with share, month record and crown.
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at, ownership_bps, month, crown]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, enum: [creator, admin, member], description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
        ownership_bps: {type: integer, format: int32, minimum: 0, maximum: 10000, description: "The member's share units over the cabal's total, rounded down.", examples: [3500]}
        month: {$ref: "#/components/schemas/MemberMonth", examples: [{right: 7, resolved: 9, voted: 11, eligible: 11}]}
        crown: {type: boolean, description: True for the one member ranked first in this cabal this month with at least five resolved calls., examples: [false]}
    CabalMemberTotals:
      type: object
      description: The whole cabal's people by group, the same on every page. Admins count creator and admin, voters the other members who can vote, members the rest.
      required: [admins, voters, members]
      properties:
        admins: {type: integer, format: int32, examples: [2]}
        voters: {type: integer, format: int32, examples: [6]}
        members: {type: integer, format: int32, examples: [0]}
    CabalPerson:
      type: object
      description: A user as shown on a cabal.
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    CabalPreview:
      type: object
      description: What a non-member sees of a cabal before joining it.
      required: [id, name, picture_url, join_mode, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        join_mode: {type: string, description: "`open` (anyone joins at once) or `request` (the creator approves each request).", examples: [request]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalRules:
      type: object
      description: How the cabal admits members and how it votes.
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps, show_sides, show_sides_since, max_trade_bps, who_can_propose]
      properties:
        join_mode: {type: string, examples: [open]}
        voter_mode: {type: string, examples: [all]}
        threshold: {type: string, examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, examples: [86400]}
        slippage_bps: {type: integer, format: int32, examples: [100]}
        show_sides: {type: boolean, description: "Whether who voted which way shows after a vote closes. Off unless the cabal turned it on.", examples: [false]}
        show_sides_since: {type: [string, "null"], format: date-time, description: "When show_sides last changed. Null while it has never changed.", examples: [null]}
        max_trade_bps: {type: [integer, "null"], format: int32, description: "Cap on one trade as basis points of the treasury's cash. Null means no cap.", examples: [2000]}
        who_can_propose: {type: string, enum: [voters], description: Who may propose a trade., examples: [voters]}
    CabalSearchItem:
