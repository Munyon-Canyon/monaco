          $ref: "#/components/schemas/CabalRef"
        value_micros: {type: integer, format: int64, description: The stake's value in USDC micros., examples: [1000000]}
        share_units: {type: integer, format: int64, description: The caller's share units., examples: [100]}
        net_contributed_micros: {type: integer, format: int64, description: Contributed minus withdrawn in USDC micros., examples: [900000]}
        pnl_micros: {type: integer, format: int64, description: "Value minus the net contributed, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The return in basis points. Null when nothing is contributed., examples: [250]}
        slice_bps: {type: integer, format: int64, description: "This cabal's weight in the caller's portfolio, in basis points of the portfolio's total value. It is not the caller's share of the cabal's pot, which is `ownership_bps`.", examples: [5000]}
        ownership_bps: {type: integer, format: int32, minimum: 0, maximum: 10000, description: "The caller's share of this cabal's pot in basis points, the same figure as `CabalPot.me.slice_bps` read at the same moment. It is the current split, while the value and the return are as the latest run valued them. 0 when the stake was cashed out after that run.", examples: [3500]}
        role: {type: string, enum: [admin, member], description: "The caller's role in this cabal. `admin` is the cabal's creator or one of its admins.", examples: [admin]}
        can_vote: {type: boolean, description: Whether the caller votes on this cabal's proposals., examples: [true]}
        pot_value_micros: {type: integer, format: int64, description: "The cabal's treasury value in USDC micros at the latest snapshot, the figure `ownership_bps` is a share of. 0 when the cabal has no snapshot yet.", examples: [20000000000]}
        member_count: {type: integer, format: int32, minimum: 0, description: The cabal's member count., examples: [8]}
        open_vote_count: {type: integer, format: int32, minimum: 0, description: "The cabal's open proposals, the same for every member. It does not count the caller's own ballots.", examples: [1]}
    SharedCabal:
      type: object
      description: One shared cabal and its pot figures.
      required: [cabal, value_micros, pnl_micros, return_bps]
      properties:
        cabal:
          $ref: "#/components/schemas/CabalRef"
        value_micros: {type: integer, format: int64, description: The pot value in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "The pot value minus the net contributed, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The pot's return in basis points. Null when nothing is contributed., examples: [250]}
    SharedCabals:
      type: object
      description: The cabals two users share.
      required: [cabals]
      properties:
        cabals:
          type: array
          description: The shared cabals, largest pot first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/SharedCabal"
    UserCabal:
      type: object
      description: One cabal the user is in.
      required: [cabal, member_count, role, can_vote, shared, ownership_bps]
      properties:
        cabal:
          $ref: "#/components/schemas/CabalRef"
        member_count: {type: integer, format: int32, minimum: 0, description: The cabal's member count., examples: [12]}
        role: {type: string, enum: [admin, member], description: "The user's role in this cabal. `admin` is the cabal's creator or one of its admins.", examples: [admin]}
        can_vote: {type: boolean, description: Whether the user votes on this cabal's proposals., examples: [true]}
        shared: {type: boolean, description: Whether the caller is a member of this cabal too., examples: [true]}
        ownership_bps: {type: [integer, "null"], format: int32, minimum: 0, maximum: 10000, description: "The user's share of this cabal's pot in basis points, the same figure as `CabalPot.me.slice_bps` read as that user. 0 when they hold no units. Null when they hide their performance and the caller is not that user.", examples: [2000]}
    UserCabals:
      type: object
      description: The cabals one user is in.
      required: [cabals]
      properties:
        cabals:
          type: array
          description: The user's cabals, shared ones first, then largest share first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/UserCabal"
  # api/spec/referrals.yaml
    AttachReferralRequest:
      type: object
      description: An invite code to attach to the caller.
      required: [code, source]
      examples:
        - code: k7m4qx2p
          source: manual
      properties:
        code:
          type: string
          description: A random invite code or an unlocked handle.
          examples: [k7m4qx2p]
        source:
          $ref: "#/components/schemas/ReferralSource"
    AttachedReferral:
      type: object
      description: The attribution that was stored.
      required: [referrer]
      examples:
        - referrer:
            {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: null, handle: kaicenat}
      properties:
        referrer:
          $ref: "#/components/schemas/ReferralReferrer"
    MyReferralCode:
      type: object
      description: The caller's invite code and the links that carry it.
      examples:
        - code: k7m4qx2p
          link: https://monacolabs.xyz/r/k7m4qx2p
          handle_link: https://monacolabs.xyz/r/kaicenat
          handle_unlocked: true
      required: [code, link, handle_link, handle_unlocked]
      properties:
        code:
          type: string
          description: The random 8-character code. It never changes.
          pattern: "^[23456789abcdefghjkmnpqrstuvwxyz]{8}$"
          examples: [k7m4qx2p]
        link:
          type: string
          description: The invite link for the random code.
          examples: ["https://monacolabs.xyz/r/k7m4qx2p"]
        handle_link:
          type: [string, "null"]
          description: The invite link for the caller's handle, or null until the first deposit unlocks it.
          examples: ["https://monacolabs.xyz/r/kaicenat"]
        handle_unlocked:
          type: boolean
          description: True once the caller's first deposit is credited.
          examples: [true]
    ReferralCabal:
      type: object
      description: >-
        The cabal an invite link points to, as the invite landing draws it before sign-in, or `cabal` null
        when the link does not resolve.
      required: [inviter, cabal, return_1m_bps, turnout_month_bps, open_proposal]
      examples:
        - inviter: {display_name: Andres, photo_url: "https://img.example/andres.png"}
          cabal:
            id: "01890a5d-ac96-774b-bcce-b302099a8058"
            name: AC Capital
            picture_url: null
            member_count: 8
            since: "2026-08-14"
            join_mode: request
            first_members:
              - {display_name: Christelle, photo_url: null}
            pot_value_micros: "20000000000"
          return_1m_bps: -410
          turnout_month_bps: 9400
          open_proposal:
            id: "01890a5d-ac96-774b-bcce-b302099a8057"
            kind: buy
            symbol: NVDAx
            asset_name: NVIDIA
            asset_logo_url: null
            usdc_micros: "400000000"
            proposer_name: Mia
            title: small add before earnings
            "yes": 4
            "no": 1
            voted: 5
            eligible: 8
            replies: 6
            expires_at: "2026-10-28T16:00:00Z"
        - inviter: null
          cabal: null
          return_1m_bps: null
          turnout_month_bps: null
          open_proposal: null
      properties:
        inviter:
          type: [object, "null"]
          description: >-
            The member whose link it is, or null when the code does not resolve. It stays set when the
            code resolves but the cabal does not, so the page can still name who invited the visitor.
          examples: [null]
          x-go-type-name: ReferralCabalInviter
          required: [display_name, photo_url]
          properties:
            display_name:
              type: string
              description: The inviter's display name.
              examples: [Andres]
            photo_url:
              type: [string, "null"]
              description: The inviter's photo, or null when they have none.
              examples: ["https://img.example/andres.png"]
        cabal:
          type: [object, "null"]
          description: The cabal's public facts, or null when the link does not resolve.
          examples: [null]
          x-go-type-name: ReferralCabalFacts
          required: [id, name, picture_url, member_count, since, join_mode, first_members, pot_value_micros]
          properties:
            id:
              type: string
              format: uuid
              description: The cabal id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
            name:
              type: string
              description: The cabal's name.
              examples: [AC Capital]
            picture_url:
              type: [string, "null"]
              description: The cabal's picture, or null when it has none. Clients draw the initials crest then.
              examples: [null]
            member_count:
              type: integer
              format: int32
              description: Current members, the inviter included.
              examples: [8]
            since:
              type: string
              format: date
              description: The day the cabal was created, in UTC.
              examples: ["2026-08-14"]
            join_mode:
              type: string
              description: "`open` joins at once; `request` makes a request the creator decides."
              enum: [open, request]
              examples: [request]
            first_members:
              type: array
              description: >-
                Up to four current members other than the inviter, earliest joiner first, then by user id
                for a tie.
              maxItems: 4
              items:
                $ref: "#/components/schemas/ReferralCabalPerson"
              examples: [[]]
            pot_value_micros:
              type: string
              pattern: "^[0-9]+$"
              description: The pot's value in USDC micros, the figure `getCabalPot` returns.
              examples: ["20000000000"]
        return_1m_bps:
          type: [integer, "null"]
          format: int32
          description: The cabal's one-month return in basis points. Null until it is filled.
          examples: [-410]
        turnout_month_bps:
          type: [integer, "null"]
          format: int32
          description: The share of eligible votes cast this month, in basis points. Null until it is filled.
          examples: [9400]
        open_proposal:
          type: [object, "null"]
          description: The open proposal, read-only. Null when there is none or until it is filled.
          examples: [null]
          x-go-type-name: ReferralCabalProposal
          required:
            [id, kind, symbol, asset_name, asset_logo_url, usdc_micros, proposer_name, title, "yes", "no", voted, eligible, replies, expires_at]
          properties:
            id:
              type: string
              format: uuid
              description: The proposal id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
            kind:
              type: string
              description: "`buy` or `sell`."
              examples: [buy]
            symbol:
              type: string
              description: The asset's symbol.
              examples: [NVDAx]
            asset_name:
              type: string
              description: The asset's display name.
              examples: [NVIDIA]
            asset_logo_url:
              type: [string, "null"]
              description: The asset's logo, or null when it has none.
              examples: [null]
            usdc_micros:
              type: [string, "null"]
              pattern: "^[0-9]+$"
              description: USDC a buy spends, in micros. Null on a sell, which is sized in shares.
              examples: ["400000000"]
            proposer_name:
              type: string
              description: The proposer's display name.
              examples: [Mia]
            title:
              type: string
              description: The proposal's thesis line.
              examples: [small add before earnings]
            "yes":
              type: integer
              format: int32
              description: Yes ballots so far.
              examples: [4]
            "no":
              type: integer
              format: int32
              description: No ballots so far.
              examples: [1]
            voted:
              type: integer
              format: int32
              description: Members who have voted.
              examples: [5]
            eligible:
              type: integer
              format: int32
              description: Members who can vote.
              examples: [8]
            replies:
              type: [integer, "null"]
              format: int32
              description: Replies on the proposal. Null when they are not counted.
              examples: [6]
            expires_at:
              type: string
              format: date-time
              description: When voting ends.
              examples: ["2026-10-28T16:00:00Z"]
    ReferralCabalPerson:
      type: object
      description: A person on the public cabal preview. It has no id and no handle.
      required: [display_name, photo_url]
      examples:
        - display_name: Mia
          photo_url: "https://img.example/mia.png"
      properties:
        display_name:
          type: string
          description: The person's display name.
          examples: [Mia]
        photo_url:
          type: [string, "null"]
          description: The person's photo, or null when they have none.
          examples: ["https://img.example/mia.png"]
    ReferralClickRequest:
      type: object
      description: The invite code a visitor tapped Get Monaco for.
      required: [code]
      examples:
        - code: k7m4qx2p
      properties:
        code:
          type: string
          description: A random invite code or an unlocked handle, as it appears in the page URL.
          minLength: 1
          maxLength: 40
          examples: [k7m4qx2p]
    ReferralLookup:
      type: object
      description: The referrer behind an invite code, or null when the code does not resolve.
      required: [referrer]
      examples:
        - referrer:
            {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: "https://img.example/kai.png", handle: kaicenat}
        - referrer: null
      properties:
        referrer:
          type: [object, "null"]
          description: The referrer, or null when the code does not resolve.
          examples: [null]
          x-go-type: ReferralReferrer
          required: [user_id, display_name, photo_url, handle]
          properties:
            user_id:
              type: string
              format: uuid
              description: The referrer's user id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
            display_name:
              type: string
              description: The referrer's display name.
              examples: [Kai]
            photo_url:
              type: [string, "null"]
              description: The referrer's photo, or null when they have none.
              examples: ["https://img.example/kai.png"]
            handle:
              type: string
              description: The referrer's handle.
              examples: [kaicenat]
    ReferralReferrer:
      type: object
      description: The person behind an invite code.
      required: [user_id, display_name, photo_url, handle]
      examples:
        - user_id: "01890a5d-ac96-774b-bcce-b302099a8058"
          display_name: Kai
          photo_url: "https://img.example/kai.png"
          handle: kaicenat
      properties:
        user_id:
          type: string
          format: uuid
          description: The referrer's user id.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        display_name:
          type: string
          description: The referrer's display name.
          examples: [Kai]
        photo_url:
          type: [string, "null"]
          description: The referrer's photo, or null when they have none.
          examples: ["https://img.example/kai.png"]
        handle:
          type: string
          description: The referrer's handle.
          examples: [kaicenat]
    ReferralSource:
      type: string
      description: Where the caller found the invite code.
      enum: [universal_link, clipboard, manual]
      examples: [manual]
  # api/spec/social.yaml
    AdminReport:
      type: object
      description: One report in the moderation queue.
      required: [id, reporter, kind, target_id, reason, note, status, created_at]
      properties:
        id: {type: string, format: uuid}
        reporter:
          $ref: "#/components/schemas/AdminReporter"
        kind: {type: string, enum: [message, comment, user, cabal], examples: [user]}
        target_id: {type: string, format: uuid}
        reason: {type: string, enum: [spam, abuse, other], examples: [spam]}
        note: {type: [string, "null"], examples: [null]}
        status: {type: string, enum: [open, resolved], examples: [open]}
        created_at: {type: string, format: date-time}
    AdminReporter:
      type: object
      description: Who filed the report. The handle is empty for a deleted account.
      required: [user_id, handle]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
    AdminReports:
      type: object
      description: One page of reports, oldest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/AdminReport"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    BlockedUser:
      type: object
      description: A user the caller blocks.
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
        display_name: {type: string, examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], examples: ["https://img.example/maya.png"]}
    BlockedUsers:
      type: object
      description: The users the caller blocks, newest block first.
      required: [users]
      properties:
        users:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/BlockedUser"
    ChatAuthor:
      type: object
      description: The author of a chat message. A deleted account has a null handle and an empty name.
      required: [id, handle, display_name, photo_url]
      properties:
        id: {type: string, format: uuid, description: "The author's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    ChatChannelPage:
      type: object
      description: One page of a cabal's chat channel.
      required: [messages]
      properties:
        messages:
          type: array
          description: Newest first, or oldest first for an `after` request.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      description: One chat message.
      required: [id, author, body, created_at, parent_id, also_in_channel, reply_count, last_reply_at, proposal_id, deleted, seen_count]
      properties:
        id: {type: string, format: uuid, description: "The message id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        author:
          $ref: "#/components/schemas/ChatAuthor"
        body: {type: [string, "null"], description: Null on a deleted message., examples: [gm]}
        created_at: {type: string, format: date-time, description: When the server stored it., examples: ["2026-10-03T12:00:00Z"]}
        parent_id:
          type: [string, "null"]
          format: uuid
          description: The top-level message this replies to. Null on a top-level message.
          examples: [null]
        also_in_channel: {type: boolean, description: True on a reply that also shows in the channel., examples: [false]}
        reply_count: {type: integer, description: The replies to a top-level message. 0 on a reply., examples: [0]}
        last_reply_at:
          type: [string, "null"]
          format: date-time
          description: When the newest reply was posted. Null with no replies.
          examples: [null]
        proposal_id:
          type: [string, "null"]
          format: uuid
          description: The proposal a proposal card message is about. Null otherwise.
          examples: [null]
        deleted: {type: boolean, description: True on a deleted top-level message kept for its thread., examples: [false]}
        seen_count:
          type: [integer, "null"]
          description: >-
            How many other members have seen the message. Set only on the newest channel message
            of a channel read without `before`, and null everywhere else.
          examples: [null]
    ChatSeenBy:
      type: object
      description: The members who have seen a message.
      required: [count, members]
      properties:
        count: {type: integer, description: How many other members have seen it., examples: [1]}
        members:
          type: array
          description: Newest watermark first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatSeenMember"
    ChatSeenMark:
      type: object
      description: The caller's seen watermark.
      required: [last_seen_at]
      properties:
        last_seen_at: {type: string, format: date-time, description: The watermark after the call., examples: ["2026-10-03T12:00:00Z"]}
    ChatSeenMember:
      type: object
      description: A member who has seen a message. A deleted account has a null handle and an empty name.
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, description: "The member's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    ChatThread:
      type: object
      description: A top-level message and one page of its replies.
      required: [parent, replies]
      properties:
        parent:
          $ref: "#/components/schemas/ChatMessage"
        replies:
          type: array
          description: Oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatMessage"
    Comment:
      type: object
      description: One comment on a feed item.
      required: [id, parent_comment_id, author, reply_to_handle, body, body_display, is_mine, reactions, reaction_count, created_at]
      properties:
        id: {type: string, format: uuid, description: "The comment id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        parent_comment_id:
          type: [string, "null"]
          format: uuid
          description: The top-level comment this sits under. Set only on an answer by the item's author, folded under the comment it answers. Null on every other comment, including a reply by anyone else.
          examples: [null]
        root_comment_id:
          type: [string, "null"]
          format: uuid
          description: On a folded answer, the top-level comment it sits under, equal to `parent_comment_id`. Null on a top-level comment.
          examples: [null]
        author:
          $ref: "#/components/schemas/CommentAuthor"
        reply_to_handle:
          type: [string, "null"]
          description: Deprecated, use `reply_to`. The handle of the person a reply answers. Null on a comment that answers none.
          examples: [null]
        reply_to:
          $ref: "#/components/schemas/CommentQuote"
        body: {type: [string, "null"], description: Null on a deleted comment and on a reply that is only an attachment., examples: [nice]}
        body_display: {type: string, description: "The body, `GIF` for a GIF-only reply, `Comment deleted` once the author deletes it, or `Removed by Monaco` once a moderator removes it.", examples: [nice]}
        attachment:
          $ref: "#/components/schemas/CommentAttachment"
          examples: [{kind: poll, question: "Trim to 40% before earnings?", closes_at: "2026-10-04T08:00:00Z", closed: false, options: [{position: 0, label: "Yes", count: 3}, {position: 1, label: Wait for earnings, count: 2}], total: 5, my_position: 1}]
        is_mine: {type: boolean, description: True when the caller wrote it., examples: [true]}
        reactions:
          type: array
          maxItems: 20
          description: >-
            The comment's reactions, one per emoji, most used first, then the emoji first used earliest. At most the top
            20; `reaction_count` still counts every reaction. Empty on a deleted comment.
          items: {$ref: "#/components/schemas/Reaction"}
          examples: [[{emoji: "😂", count: 3, mine: false}, {emoji: "❤️", count: 1, mine: true}]]
        reaction_count: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the comment, over every emoji.", examples: [3]}
        created_at: {type: string, format: date-time, description: When the server stored it., examples: ["2026-10-03T12:00:00Z"]}
    CommentAttachment:
      description: A reply's attachment, keyed by `kind`.
      examples:
        - {kind: thesis_quote, proposal_id: 0b6c5a3e-6d2f-4f7e-9a51-2c8d1e4f7a90, text: Small add to the position., proposer_name: Ada}
      oneOf:
        - $ref: "#/components/schemas/GifAttachment"
        - $ref: "#/components/schemas/ThesisQuoteAttachment"
        - $ref: "#/components/schemas/StockAttachment"
        - $ref: "#/components/schemas/PollAttachment"
      discriminator:
        propertyName: kind
        mapping:
          gif: "#/components/schemas/GifAttachment"
          thesis_quote: "#/components/schemas/ThesisQuoteAttachment"
          stock: "#/components/schemas/StockAttachment"
          poll: "#/components/schemas/PollAttachment"
    CommentAttachmentInput:
      description: The attachment of a reply, keyed by `kind`. At most one per reply.
      examples:
        - {kind: thesis_quote, start: 0, end: 25}
      oneOf:
        - $ref: "#/components/schemas/GifAttachmentInput"
        - $ref: "#/components/schemas/ThesisQuoteAttachmentInput"
        - $ref: "#/components/schemas/StockAttachmentInput"
        - $ref: "#/components/schemas/PollAttachmentInput"
      discriminator:
        propertyName: kind
        mapping:
          gif: "#/components/schemas/GifAttachmentInput"
          thesis_quote: "#/components/schemas/ThesisQuoteAttachmentInput"
          stock: "#/components/schemas/StockAttachmentInput"
          poll: "#/components/schemas/PollAttachmentInput"
    CommentAuthor:
      type: object
      description: The author of a comment. A deleted account has a null handle and an empty name. Monaco's own reply on a closed proposal has `kind` system, the nil UUID as id, a null handle and the display name Monaco.
      required: [kind, id, handle, display_name, photo_url, return_1m_bps, return_private]
      properties:
        kind: {type: string, enum: [user, system], description: "`system` for Monaco's own reply on a closed proposal. It takes no reply, reaction or report: each is invalid_input with `reason=system_reply`.", examples: [user]}
        id: {type: string, format: uuid, description: "The author's user id. The nil UUID on a system reply.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
        return_1m_bps: {type: [integer, "null"], format: int64, description: "The author's one-month return in basis points, from the people board's `1M` range as of the last valuation run, not a live figure. Null when the author hides it or has no ranked row.", examples: [820]}
        return_private: {type: boolean, description: "True only when the author chose to hide their return. False for an author with no ranked row.", examples: [false]}
    CommentPage:
      type: object
      description: One page of comment threads, oldest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CommentThread"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    CommentQuote:
      type: object
      description: The comment a reply answers, as the quote above the reply.
      required: [comment_id, root_comment_id, author_display_name, excerpt, is_deleted, is_folded, has_attachment]
      properties:
        comment_id: {type: string, format: uuid, description: "The answered comment.", examples: ["01920000-0000-7000-8000-000000000006"]}
        root_comment_id: {type: string, format: uuid, description: "The answered comment's top-level comment: its parent, or itself when it is top-level. The app expands this comment before it jumps.", examples: ["01920000-0000-7000-8000-000000000006"]}
        author_display_name: {type: string, description: "The answered comment's author, `Someone` once that account is deleted.", examples: [Andres]}
        excerpt: {type: [string, "null"], description: "The first 120 characters of the answered comment, `GIF` when it is only a GIF. Null once it is deleted or removed, and when the caller blocked its author.", examples: [Good timing on this one.]}
        is_deleted: {type: boolean, description: True when the answered comment is deleted or removed., examples: [false]}
        has_attachment: {type: boolean, description: "True when the answered comment is live and has an attachment.", examples: [false]}
        is_folded: {type: boolean, description: "True when the answered comment is a folded answer, so the app expands its root before it jumps.", examples: [false]}
    CommentThread:
      type: object
      description: A top-level comment and all its replies.
      required: [comment, replies]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
        replies:
          type: array
          description: The replies, oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Comment"
    ContactMatch:
      type: object
      description: A person from the caller's contacts who has a Monaco account.
      required: [user_id, handle, display_name, photo_url, followed_by_me]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
        display_name: {type: string, examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], examples: ["https://img.example/maya.png"]}
        followed_by_me: {type: boolean, examples: [false]}
    ContactMatchPage:
      type: object
      description: One page of contact matches, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/ContactMatch"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ContactMatchRequest:
      type: object
      description: Lowercase SHA-256 hex hashes of E.164 phone numbers.
      required: [hashes]
      properties:
        hashes:
          type: array
          description: One to 2000 hashes. Each is 64 lowercase hex characters.
          items: {type: string}
          examples: [["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]]
    CreateCommentRequest:
      type: object
      description: A comment to post.
      properties:
        body:
          type: string
          description: The text, trimmed by the server to 1 to 1000 Unicode scalars. Optional when `attachment` is present, otherwise required.
          examples: [nice]
        attachment:
          $ref: "#/components/schemas/CommentAttachmentInput"
          examples: [{kind: poll, question: "Trim to 40% before earnings?", options: ["Yes", Wait for earnings], closes_in_hours: 24}]
        parent_comment_id:
          type: string
          format: uuid
          description: The comment this replies to, on the same item. Absent for a top-level comment.
          examples: ["01920000-0000-7000-8000-000000000007"]
    FeedItem:
      type: object
      description: One feed item with its display strings rendered.
      required: [id, kind, ref_type, ref_id, cabal_id, cabal_name, cabal_picture_url, actor_id, actor_name, actor_photo_url, asset_id, asset_logo_url, symbol, title, detail, body, status, tone, action, usdc_micros, asset_name, token_amount, token_decimals, price_micros, share_of_pot_bps, change_bps, mark_micros, prev_close_micros, proposal_id, tally, expires_at, outcome, shape, caller, asset_kind, fill_state, filled_token_amount, filled_usdc_micros, filled_at, trade_failed, return_bps, chart, comment_count, thread_item_id, reply_count, can_reply, can_react, reply_rule, reply_rule_cabal_name, like_count, liked_by_me, reactions, reaction_count, return_1m_bps, return_private, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, description: "The item's id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        kind:
          type: string
          description: >-
            `proposal`, `trade`, `price_move`, `cabal_created`, `member_joined`, `reply`, `result` or `threshold`.
            A `trade` is older items only: a proposal's fills are recorded on its `result`.
            A `reply` is a comment on a proposal's feed item, with the comment text as `body` and the
            commenter as the actor. A `result` is one post per closed proposal, with its `outcome`, `shape`,
            `caller` and final `tally`. A `threshold` is a proposal that passed and awaits execution; only older
            items are `threshold`, no new one is written. A `proposal` carries `tally` and `expires_at`; every other
            kind has `expires_at` null, and only a `result` besides it has a `tally`.
          examples: [trade]
        ref_type:
          type: string
          description: >-
            The source the item points at, such as `swaps` for a trade, `feed_comments` for a reply
            (`ref_id` is the comment's id) or `proposals` for a proposal, a result or a threshold item.
          examples: [swaps]
        ref_id: {type: string, format: uuid, description: "The source row's id.", examples: ["01920000-0000-7000-8000-000000000008"]}
        cabal_id:
          type: [string, "null"]
          format: uuid
          description: The cabal the item is about. Null for a price move.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        cabal_name: {type: [string, "null"], description: "The cabal's current name. Null for a price move.", examples: [Alpha Cabal]}
        cabal_picture_url: {type: [string, "null"], description: "The cabal's current picture URL. Null for a price move or a cabal with no picture.", examples: [null]}
        actor_id:
          type: [string, "null"]
          format: uuid
          description: The user who acted. Null for a system item.
          examples: [null]
        actor_name: {type: [string, "null"], description: "The acting user's display name, as of the item's last rename, so it follows a rename. Null for a system item.", examples: [null]}
        actor_photo_url: {type: [string, "null"], description: "The acting user's current profile photo URL. Null for a system item or a member with no photo.", examples: [null]}
        asset_id:
          type: [string, "null"]
          format: uuid
          description: The stock's id, the target of an asset mute. Null when the item is not about a stock.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]
        asset_logo_url: {type: [string, "null"], description: "The stock's logo URL. Null when the item is not about a stock or the stock has no logo.", examples: [null]}
        symbol: {type: [string, "null"], description: "The stock symbol, if the item is about one.", examples: [AAPLx]}
        title: {type: string, description: "The rendered headline.", examples: ["Alpha Cabal bought $500 of AAPLx"]}
        detail: {type: [string, "null"], description: "A rendered second line, if the item has one.", examples: [Apple]}
        body: {type: [string, "null"], description: "Free text, such as a proposal's thesis.", examples: [null]}
        status:
          type: [string, "null"]
          description: >-
            The source's status, for proposals: `open`, `passed`, `execution_failed`, `failed`, `expired`,
            `withdrawn`, `voided`, `executed` or `execution_blocked`.
          examples: [null]
        tone:
          type: string
          description: "`neutral`, `positive` or `negative`, so the app can color the item without reading amounts."
          examples: [neutral]
        action:
          type: [string, "null"]
          description: "`buy` or `sell` for a proposal or trade. Null for any other kind."
          examples: [buy]
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: "A proposal's buy amount, or the USDC a trade spent or received, in micros. Null when the item has none."
          examples: [500000000]
        asset_name: {type: [string, "null"], description: "The stock's display name. Null when the item is not about a stock.", examples: [Apple]}
        token_amount:
          type: [integer, "null"]
          format: int64
          description: "Token base units: a sell proposal's amount or a trade's fill. Null when the item has none."
          examples: [250000000]
        token_decimals:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Decimals of `token_amount` and of `filled_token_amount`. Null when both are null.
          examples: [8]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: "USDC micros per whole token a trade filled at. Null unless the item is a trade."
          examples: [200000000]
        share_of_pot_bps:
          type: [integer, "null"]
          format: int64
          description: "A proposal's amount as basis points of the cabal pot when it was made, on a proposal, reply or threshold item. Null on other kinds and on proposals made before this field shipped."
          examples: [1000]
        change_bps:
          type: [integer, "null"]
          format: int64
          description: "A price move's change since the previous close, in signed basis points; 0 for a flat move. Null on every other kind."
          examples: [1000]
        mark_micros:
          type: [integer, "null"]
          format: int64
          description: "A price move's latest price in USDC micros. Null on every other kind."
          examples: [212400000]
        prev_close_micros:
          type: [integer, "null"]
          format: int64
          description: "A price move's previous close in USDC micros. Null on every other kind and when the move has no previous close."
          examples: [193100000]
        proposal_id:
          type: [string, "null"]
          format: uuid
          description: "The proposal a proposal, trade, reply, result or threshold item is about. Null on other kinds."
          examples: ["01920000-0000-7000-8000-000000000009"]
        comment_count: {type: integer, format: int32, description: "Deprecated, read `reply_count` instead. The number of comments on this item itself.", examples: [0]}
        thread_item_id:
          type: string
          format: uuid
          description: "The item whose thread this one opens: the item itself, or the proposal's item for a cabal's result, a threshold or a reply."
          examples: ["01920000-0000-7000-8000-00000000000a"]
        reply_count: {type: integer, format: int32, description: "The number of comments in the item's thread, the same on a proposal, its result, its threshold and its replies.", examples: [4]}
        can_reply: {type: boolean, description: "True when the caller can comment in the item's thread. False on a thread that is a proposal of a cabal the caller is not in.", examples: [true]}
        can_react: {type: boolean, description: "True when the caller can react to the item, which is every item the caller can see.", examples: [true]}
        reply_rule:
          type: string
          enum: [anyone, members]
          description: "Who can reply in the item's thread: `members` when the thread is a proposal (only its cabal's members), else `anyone`."
          examples: [members]
        reply_rule_cabal_name:
          type: [string, "null"]
          description: "The name of the cabal whose members can reply. Null when `reply_rule` is `anyone`."
          examples: ["Pilates"]
        like_count: {type: integer, format: int32, description: "Deprecated, read `reactions` instead. The number of users who reacted with ❤️.", examples: [3]}
        liked_by_me: {type: boolean, description: "Deprecated, read `reactions` instead. True when the caller reacted with ❤️.", examples: [true]}
        reactions:
          type: array
          maxItems: 20
          description: >-
            The item's reactions, one per emoji, most used first, then the emoji first used earliest. At most the top 20;
            `reaction_count` still counts every reaction.
          items: {$ref: "#/components/schemas/Reaction"}
        reaction_count: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the item, over every emoji.", examples: [7]}
        tally:
          type: [object, "null"]
          description: "A proposal's live vote count, read from governance on each request, or a `result`'s stored final tally, `needed` included. Null on every other kind."
          examples: [null]
          x-go-type-name: FeedTally
          required: [yes, no, voters, needed]
          properties:
            yes: {type: integer, minimum: 0, description: "Ballots cast yes.", examples: [4]}
            no: {type: integer, minimum: 0, description: "Ballots cast no.", examples: [1]}
            voters: {type: integer, minimum: 0, description: "Members who can vote.", examples: [8]}
            needed: {type: integer, minimum: 0, description: "Yes ballots the proposal's threshold needs.", examples: [5]}
        expires_at: {type: [string, "null"], format: date-time, description: "When voting closes. Null except on a `proposal`.", examples: [null]}
        outcome:
          type: [string, "null"]
          enum: [passed, failed, null]
          description: "How a `result` closed: `passed`, or `failed` when the vote failed or expired. Null on every other kind."
          examples: [passed]
        shape:
          type: [string, "null"]
          enum: [cabal, member, null]
          description: "Who heads a `result` post: the `cabal`, or the `member` who proposed it. Null on every other kind."
          examples: [cabal]
        caller:
          type: [object, "null"]
          description: "Who called a passed `result` (the proposer). Null on a failed result and on every other kind."
          examples: [null]
          x-go-type-name: FeedCaller
          required: [id, name, photo_url]
          properties:
            id: {type: string, format: uuid, description: "The caller's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8060"]}
            name: {type: string, description: "The caller's display name when the proposal closed.", examples: [Christelle]}
            photo_url: {type: [string, "null"], description: "The caller's current profile photo URL. Null for a member with no photo.", examples: [null]}
        asset_kind:
          type: [string, "null"]
          enum: [equity, pre_ipo, null]
          description: "Whether the stock is listed (`equity`) or `pre_ipo`. Set on a `proposal` and a `result`, null on every other kind."
          examples: [equity]
        fill_state:
          type: [string, "null"]
          enum: [pending, filled, partial, failed, null]
          description: "How a passed `result`'s order stands: `pending` until every swap reported, `filled` when every swap confirmed, `partial` when some confirmed and some failed, `failed` when every swap failed. Null on a failed vote and on every other kind."
          examples: [filled]
        filled_token_amount:
          type: [integer, "null"]
          format: int64
          description: "Token base units filled so far across the order's confirmed swaps, at `token_decimals`. Null on a `result` with no fill and on every other kind."
          examples: [42000000]
        filled_usdc_micros: {type: [integer, "null"], format: int64, description: "USDC micros the confirmed swaps spent or received. Null on a `result` with no fill and on every other kind.", examples: [300000000]}
        filled_at: {type: [string, "null"], format: date-time, description: "When the latest swap confirmed. Null on a `result` with no fill and on every other kind.", examples: ["2026-10-03T08:41:00Z"]}
        trade_failed: {type: boolean, description: "True when a `result`'s order is `partial` or `failed`. False on every other item.", examples: [false]}
        return_bps:
          type: [integer, "null"]
          format: int64
          description: "Since the fill for a buy; the sale's gain over the average cost of what it sold for a sale, in basis points, truncated toward zero. Null when unknown or for Pre-IPO."
          examples: [109]
        chart:
          type: [object, "null"]
          description: "The line and the buy and sell markers behind `return_bps`. Null when `return_bps` is null or the asset has no price history in the window, and on every other kind."
          examples: [null]
          x-go-type-name: FeedChart
          required: [points, markers]
          properties:
            points:
              type: array
              maxItems: 32
              description: "Evenly spaced closes, oldest first."
              items:
                type: object
                x-go-type-name: FeedChartPoint
                required: [at, price_micros]
                properties:
                  at: {type: string, format: date-time, description: "The bucket time.", examples: ["2026-10-03T08:41:00Z"]}
                  price_micros: {type: integer, format: int64, description: "The close in USDC micros per whole token.", examples: [716520000]}
            markers:
              type: array
              maxItems: 6
              description: "Where the cabal bought and sold this stock, oldest first. Empty on a buy."
              items:
                type: object
                x-go-type-name: FeedChartMarker
                required: [at, side, price_micros]
                properties:
                  at: {type: string, format: date-time, description: "When the swap confirmed.", examples: ["2026-10-03T08:41:00Z"]}
                  side: {type: string, enum: [buy, sell], description: "`buy` or `sell`.", examples: [buy]}
                  price_micros: {type: integer, format: int64, description: "The swap's price in USDC micros per whole token.", examples: [716520000]}
        return_1m_bps: {type: [integer, "null"], format: int64, description: "The author's one-month return in basis points, from the people board's `1M` range as of the last valuation run, not a live figure. Null when the author hides it, has no ranked row, or the item is a system item.", examples: [820]}
        return_private: {type: boolean, description: "True only when the author chose to hide their return. False for a system item or an author with no ranked row.", examples: [false]}
        created_at: {type: string, format: date-time, description: "When the item was created.", examples: ["2026-10-03T08:00:00Z"]}
        updated_at: {type: string, format: date-time, description: "When the item last changed.", examples: ["2026-10-03T08:00:00Z"]}
    FeedItemDetail:
      type: object
      description: One feed item, whether it passes the request's filters and whether the caller can comment on it.
      required: [item, visible, can_comment]
      properties:
        item:
          $ref: "#/components/schemas/FeedItem"
        visible:
          type: boolean
          description: True when the item passes the filters sent with the request.
          examples: [true]
        can_comment:
          type: boolean
          description: >-
            Deprecated, read `item.can_reply` instead, which is equal. False on a post whose thread is a proposal of a cabal the caller is not in (the proposal, a cabal's
            result, a threshold or a reply on it), which only members can comment in. True otherwise.
          examples: [true]
    FeedMute:
      type: object
      description: One muted feed target.
      required: [target_type, target_id, created_at]
      properties:
        target_type: {type: string}
        target_id: {type: string, examples: [AAPLx]}
        label: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    FeedMuteRequest:
      type: object
      description: The feed target to mute.
      required: [target_type, target_id]
      properties:
        target_type: {type: string, enum: [kind, cabal, asset, user, item], examples: [asset]}
        target_id: {type: string, maxLength: 64, examples: [AAPLx]}
    FeedPage:
      type: object
      description: One page of feed items, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FollowRequest:
      type: object
      description: Where a follow came from.
      properties:
        source:
          type: string
          description: >-
            One of `profile`, `phone`, `x`, `cabal`, `feed` or `suggested`. Defaults to `profile`.
          examples: [profile]
    FollowState:
      type: object
      description: Whether the caller follows the user after the call.
      required: [following]
      properties:
        following:
          type: boolean
          description: True after a follow and false after an unfollow.
          examples: [true]
    FollowUser:
      type: object
      description: A listed user, with whether the caller follows them.
      required: [user_id, handle, display_name, photo_url, followed_by_me]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string}
        display_name: {type: string}
        photo_url: {type: [string, "null"]}
        followed_by_me: {type: boolean}
    FollowsPage:
      type: object
      description: One page of a user's followers or following, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/FollowUser"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    GifAttachment:
      type: object
      description: A GIF attached to a reply.
      required: [kind, id, title, still, preview, original]
      properties:
        kind: {type: string, enum: [gif], description: The attachment kind., examples: [gif]}
        id: {type: string, description: The GIPHY id., examples: [xT9IgDEI1iZyb2wqo8]}
        title: {type: string, description: The GIF's title., examples: [happy dance]}
        still:
          $ref: "#/components/schemas/GifMedia"
        preview:
          $ref: "#/components/schemas/GifMedia"
        original:
          $ref: "#/components/schemas/GifMedia"
    GifAttachmentInput:
      type: object
      description: Attach a GIF.
      required: [kind, gif]
      properties:
        kind: {type: string, enum: [gif], description: The attachment kind., examples: [gif]}
        gif:
          $ref: "#/components/schemas/GifInput"
    GifInput:
      type: object
      description: A GIF as the GIPHY SDK returned it. Every URL must be https on a GIPHY media host and carry the GIF's id in its path; the server drops each URL's query string.
      required: [id, title, still, preview, original]
      properties:
        id: {type: string, description: "The GIPHY id, 1 to 64 letters and digits.", examples: [xT9IgDEI1iZyb2wqo8]}
        title: {type: string, description: "The GIF's title, at most 140 characters.", examples: [happy dance]}
        still:
          $ref: "#/components/schemas/GifMedia"
        preview:
          $ref: "#/components/schemas/GifMedia"
        original:
          $ref: "#/components/schemas/GifMedia"
    GifMedia:
      type: object
      description: One rendition of a GIF.
      required: [url, width, height]
      properties:
        url: {type: string, description: "The GIPHY media URL.", examples: ["https://media.giphy.com/media/xT9IgDEI1iZyb2wqo8/200.gif"]}
        width: {type: integer, minimum: 1, maximum: 2000, description: Width in pixels., examples: [200]}
        height: {type: integer, minimum: 1, maximum: 2000, description: Height in pixels., examples: [150]}
    PollAttachment:
      type: object
      description: A poll on a reply. Who voted for what is never returned.
      required: [kind, question, closes_at, closed, options, total]
      properties:
        kind: {type: string, enum: [poll], description: The attachment kind., examples: [poll]}
        question: {type: string, description: The question., examples: ["Trim to 40% before earnings?"]}
        closes_at: {type: string, format: date-time, description: When votes stop changing., examples: ["2026-10-04T08:00:00Z"]}
        closed: {type: boolean, description: True once `closes_at` has passed., examples: [false]}
        options:
          type: array
          description: The options in order.
          items:
            $ref: "#/components/schemas/PollOption"
          examples: [[{position: 0, label: "Yes", count: 3}, {position: 1, label: Wait for earnings, count: 2}]]
        total: {type: integer, minimum: 0, description: Votes across all options., examples: [5]}
        my_position: {type: [integer, "null"], description: The option the caller voted for. Absent when they have not voted., examples: [1]}
    PollAttachmentInput:
      type: object
      description: >-
        A poll attached to a reply. It is a show of hands that moves no money. The reply's `body_display` is the
        question. Anyone who can see the thread may vote once, and may change the vote until the poll closes.
      required: [kind, question, options]
      properties:
        kind: {type: string, enum: [poll], description: The attachment kind., examples: [poll]}
        question: {type: string, description: "The question, trimmed by the server to 1 to 100 Unicode scalars. Otherwise invalid_input with `reason=poll_question`.", examples: ["Trim to 40% before earnings?"]}
        options:
          type: array
          description: "2 to 4 options of 1 to 40 characters each, trimmed and distinct ignoring case. Otherwise invalid_input with `reason=poll_options`."
          minItems: 2
          maxItems: 4
          items: {type: string, maxLength: 40, examples: [Yes]}
          examples: [[Yes, Wait for earnings]]
        closes_in_hours: {type: integer, minimum: 1, maximum: 168, description: "Hours until the poll closes, 1 to 168. Defaults to 24. Otherwise invalid_input with `reason=poll_close`.", examples: [24]}
    PollOption:
      type: object
      description: One option of a poll and the votes it holds.
      required: [position, label, count]
      properties:
        position: {type: integer, minimum: 0, maximum: 3, description: "The option's place, from 0.", examples: [0]}
        label: {type: string, description: The option's text., examples: [Yes]}
        count: {type: integer, minimum: 0, description: "Votes for this option. Always shown, before and after you vote.", examples: [3]}
    PollState:
      type: object
      description: The live counts of a poll.
      required: [closes_at, closed, options, total]
      properties:
        closes_at: {type: string, format: date-time, description: When votes stop changing., examples: ["2026-10-04T08:00:00Z"]}
        closed: {type: boolean, description: True once `closes_at` has passed., examples: [false]}
        options:
          type: array
          description: The options in order.
          items:
            $ref: "#/components/schemas/PollOption"
          examples: [[{position: 0, label: "Yes", count: 3}, {position: 1, label: Wait for earnings, count: 2}]]
        total: {type: integer, minimum: 0, description: Votes across all options., examples: [5]}
        my_position: {type: [integer, "null"], description: The option the caller voted for. Absent when they have not voted., examples: [1]}
    PollVoteRequest:
      type: object
      description: The option to vote for.
      required: [position]
      properties:
        position: {type: integer, minimum: 0, maximum: 3, description: "The option's position, from 0. An unknown position is invalid_input with `reason=poll_option`.", examples: [1]}
    PostChatMessageRequest:
      type: object
      description: A chat message to post.
      required: [body]
      properties:
        body:
          type: string
          description: The text, trimmed by the server to 1 to 2000 Unicode scalars.
          examples: [gm]
        parent_id:
          type: string
          format: uuid
          description: The top-level message this replies to. Absent for a top-level message.
          examples: ["01920000-0000-7000-8000-000000000007"]
        also_in_channel:
          type: boolean
          description: Show the reply in the channel too. Needs a parent_id. Defaults to false.
          examples: [false]
    ProposalCommentPage:
      type: object
      description: One page of comment threads on a proposal, oldest first.
      required: [feed_object_id, items, next_cursor]
      properties:
        feed_object_id:
          type: string
          format: uuid
          description: The id of the proposal's feed item.
          examples: ["01920000-0000-7000-8000-000000000007"]
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CommentThread"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ReactionSummary:
      type: object
      description: A feed item's reactions after a change.
      required: [reactions, total]
      properties:
        reactions:
          type: array
          maxItems: 20
          description: >-
            One entry per emoji, most used first, then the emoji first used earliest. At most the top 20; `total`
            still counts every reaction.
          items: {$ref: "#/components/schemas/Reaction"}
          examples: [[{emoji: "🎉", count: 5, mine: true}]]
        total: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the item, over every emoji.", examples: [7]}
    RealtimeTokenRequest:
      type: object
      description: >-
        An Ably token request, signed with the app key. The app passes it to Ably unchanged.
      required: [keyName, clientId, capability, timestamp, ttl, nonce, mac]
      properties:
        keyName: {type: string, description: "The Ably key name, not its secret.", examples: ["appid.keyid"]}
        clientId: {type: string, description: "The caller's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        capability:
          type: string
          description: A JSON object that maps each cabal channel to `["subscribe"]`.
          examples: ['{"cabal:01920000-0000-7000-8000-000000000001":["subscribe"]}']
        timestamp: {type: integer, format: int64, description: "When it was signed, in milliseconds since the epoch.", examples: [1791300000000]}
        ttl: {type: integer, format: int64, description: "How long the token lives, in milliseconds.", examples: [900000]}
        nonce: {type: string, description: A one-time value that stops a replay., examples: [d3b07384d113edec]}
        mac: {type: string, description: The signature over the other fields., examples: [c2lnbmF0dXJl]}
    ReportCreated:
      type: object
      description: The open report.
      required: [id]
      properties:
        id: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-0000000000a1"]}
    ReportRequest:
      type: object
      description: What is reported and why.
      required: [kind, target_id, reason]
      properties:
        kind: {type: string, enum: [message, comment, user, cabal], examples: [user]}
        target_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        reason: {type: string, enum: [spam, abuse, other], examples: [spam]}
        note:
          type: string
          description: Optional context, at most 500 characters.
          maxLength: 500
          examples: [Sends the same link to everyone.]
    StockAttachment:
      type: object
      description: A stock card in a reply. Price and change are read live.
      required: [kind, asset_id, symbol, name, logo_url, is_pre_ipo, price_micros, change_bps]
      properties:
        kind: {type: string, enum: [stock], description: The attachment kind., examples: [stock]}
        asset_id: {type: string, format: uuid, description: The shared asset., examples: ["01890a5d-ac96-774b-bcce-b302099a8070"]}
        symbol: {type: string, description: The ticker when the stock was shared., examples: [AAPL]}
        name: {type: string, description: The stock's name when it was shared., examples: [Apple]}
        logo_url: {type: string, description: The logo URL when the stock was shared., examples: ["https://example.com/aapl.png"]}
        is_pre_ipo: {type: boolean, description: True for a Pre-IPO stock., examples: [false]}
        price_micros: {type: [integer, "null"], format: int64, description: "The latest price in USDC micros, the estimate for a Pre-IPO stock. Null when the asset is gone from the catalog.", examples: [180000000]}
        change_bps: {type: [integer, "null"], format: int32, description: "The change against 24 hours ago in basis points. Null for a Pre-IPO stock and when no earlier price exists.", examples: [-80]}
    StockAttachmentInput:
      type: object
      description: Share a stock.
      required: [kind, asset_id]
      properties:
        kind: {type: string, enum: [stock], description: The attachment kind., examples: [stock]}
        asset_id: {type: string, format: uuid, description: The asset to share., examples: ["01890a5d-ac96-774b-bcce-b302099a8070"]}
    ThesisQuoteAttachment:
      type: object
      description: The proposal's thesis, or a part of it, quoted in a reply.
      required: [kind, proposal_id, text, proposer_name]
      properties:
        kind: {type: string, enum: [thesis_quote], description: The attachment kind., examples: [thesis_quote]}
        proposal_id: {type: string, format: uuid, description: The proposal whose thesis is quoted., examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
        text: {type: string, description: "The quoted text, cut by the server from the thesis.", examples: [Small add to the position.]}
        proposer_name: {type: string, description: The proposer's display name when the quote was made., examples: [Mia]}
    ThesisQuoteAttachmentInput:
      type: object
      description: Quote the thesis of the proposal this thread is on. The server cuts the text; the client never sends it.
      required: [kind]
      properties:
        kind: {type: string, enum: [thesis_quote], description: The attachment kind., examples: [thesis_quote]}
        start: {type: integer, minimum: 0, description: "The first rune of the thesis to quote. Defaults to 0.", examples: [0]}
        end: {type: integer, minimum: 0, description: "The rune offset where the quote ends, exclusive. Defaults to the end of the thesis.", examples: [40]}
    UserActivity:
      description: >-
        One thing the member did, told apart by `kind`: `voted`, `proposed`, `replied` or `topped_board`.
        `choice` appears only on your own `voted` rows.
      oneOf:
        - $ref: "#/components/schemas/UserActivityVoted"
        - $ref: "#/components/schemas/UserActivityProposed"
        - $ref: "#/components/schemas/UserActivityReplied"
        - $ref: "#/components/schemas/UserActivityToppedBoard"
      discriminator:
        propertyName: kind
        mapping:
          voted: "#/components/schemas/UserActivityVoted"
          proposed: "#/components/schemas/UserActivityProposed"
          replied: "#/components/schemas/UserActivityReplied"
          topped_board: "#/components/schemas/UserActivityToppedBoard"
    UserActivityCabal:
      type: object
      description: The cabal a row happened in.
      required: [id, name, picture_url]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [AC Capital]}
        picture_url: {type: [string, "null"], examples: [null]}
    UserActivityPage:
      type: object
      description: One page of a member's activity, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/UserActivity"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    UserActivityProposed:
      type: object
      description: The member put a proposal to their cabal.
      required: [kind, at, title, cabal, proposal_id, subject, symbol, usdc_micros, status, result]
      properties:
        kind: {type: string, enum: [proposed], examples: [proposed]}
        at: {type: string, format: date-time, description: "When the proposal was made.", examples: ["2026-10-28T12:00:00Z"]}
        title: {type: string, examples: [Proposed]}
        cabal: {$ref: "#/components/schemas/UserActivityCabal"}
        proposal_id: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000008"]}
        subject: {type: string, examples: [Buy META]}
        symbol: {type: string, examples: [META]}
        usdc_micros: {type: [integer, "null"], format: int64, examples: [1500000000]}
        status:
          type: string
          description: "`open`, `passed`, `failed`, `expired`, `withdrawn`, `voided`, `executed` or `execution_blocked`."
          examples: [passed]
        result:
          type: [object, "null"]
          description: The yes and no counts once the proposal is decided. Null while it is open.
          required: [yes, no]
          properties:
            yes: {type: integer, examples: [4]}
            no: {type: integer, examples: [1]}
    UserActivityReplied:
      type: object
      description: The member commented on a proposal.
      required: [kind, at, cabal, comment_id, proposal_id, body, subject, usdc_micros]
      properties:
        kind: {type: string, enum: [replied], examples: [replied]}
        at: {type: string, format: date-time, description: "When the comment was posted.", examples: ["2026-10-28T12:00:00Z"]}
        cabal: {$ref: "#/components/schemas/UserActivityCabal"}
        comment_id: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000009"]}
        proposal_id: {type: string, format: uuid, description: "The proposal the comment is on, for the tap.", examples: ["01920000-0000-7000-8000-000000000008"]}
        body: {type: string, description: "The comment, cut to 140 characters on a grapheme boundary.", examples: [Concentration is a feature]}
        subject: {type: string, description: "The thread's proposal as a phrase.", examples: [Buy NVDA]}
        usdc_micros: {type: [integer, "null"], format: int64, description: "The thread's proposal amount in USDC micros.", examples: [1500000000]}
    UserActivityToppedBoard:
      type: object
      description: The member ranked first on the People board for a closed month.
      required: [kind, at, title, period_start, right, resolved]
      properties:
        kind: {type: string, enum: [topped_board], examples: [topped_board]}
        at: {type: string, format: date-time, description: "When the month closed.", examples: ["2026-10-01T00:00:00Z"]}
        title: {type: string, examples: [Topped the board]}
        period_start: {type: string, format: date, description: "The first day of the month, UTC.", examples: ["2026-09-01"]}
        right: {type: integer, description: "The calls the member got right that month.", examples: [11]}
        resolved: {type: integer, description: "The calls that were decided that month.", examples: [12]}
    UserActivityVoted:
      type: object
      description: >-
        The member cast a vote. `choice` is `yes` or `no` and is present only when the caller is the member,
        because sides are private.
      required: [kind, at, title, cabal, proposal_id, subject, symbol, usdc_micros]
      properties:
        kind: {type: string, enum: [voted], examples: [voted]}
        at: {type: string, format: date-time, description: "When the vote was cast.", examples: ["2026-10-28T12:00:00Z"]}
        title: {type: string, description: "The rendered headline.", examples: [Voted]}
        cabal: {$ref: "#/components/schemas/UserActivityCabal"}
        proposal_id: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000008"]}
        subject: {type: string, description: "The proposal as a phrase.", examples: [Buy NVDA]}
        symbol: {type: string, examples: [NVDA]}
        usdc_micros: {type: [integer, "null"], format: int64, description: "The proposal's amount in USDC micros.", examples: [1500000000]}
        choice: {type: string, enum: [yes, no], description: "The side the member voted. Only on your own activity.", examples: [yes]}
  # api/spec/system.yaml
    Ping:
      type: object
      description: A recorded ping.
      required: [id, note, echoed]
      properties:
        id:
          type: string
          format: uuid
          description: The ping id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        note:
          type: string
          description: The note sent with the ping.
          maxLength: 140
          examples: [hi]
        echoed:
          type: boolean
          description: True once the `system.echo` consumer has handled the ping.
          examples: [true]
    PingRequest:
      type: object
      description: A note to record with the ping.
      required: [note]
      properties:
        note:
          type: string
          description: Free text, at most 140 characters.
          maxLength: 140
          examples: [hi]
  # api/spec/trading.yaml
    SwapDetail:
      type: object
      description: One trade a cabal made.
      required: [id, cabal_id, source, action, symbol, asset_name, token_decimals, usdc_micros, token_amount, status, failure_code, failure_message, tx_signature, created_at, confirmed_at, retryable]
      properties:
        route:
          description: >-
            The price comparison the trade routed on. Absent for trades placed before routing, and until
            the multichain trading work lands.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        steps:
          type: array
          description: The journaled steps of a routed trade, in order. Absent for a single Solana swap.
          items: {$ref: "#/components/schemas/TradeStep"}
          examples: [[{step: swap, network: solana, status: succeeded, amount_micros: "10000000", updated_at: "2026-10-10T12:00:10Z"}]]
        id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal whose treasury traded., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        source:
          type: object
          description: What asked for the trade.
          x-go-type-name: SwapSource
          required: [kind, id]
          properties:
            kind:
              type: string
              description: A passed proposal or a cash out.
              enum: [proposal, cashout]
              examples: [proposal]
            id: {type: string, format: uuid, description: The proposal or cash out id., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        action:
          type: string
          description: Whether the treasury bought or sold the asset.
          enum: [buy, sell]
          examples: [buy]
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        asset_name: {type: string, description: The asset's display name., examples: [Apple]}
        token_decimals: {type: integer, minimum: 0, maximum: 255, description: Decimals of `token_amount`., examples: [8]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC spent or received, in micros. Null until a sell confirms.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units bought or sold. Null until a buy confirms.
          examples: [null]
        status:
          type: string
          description: Where the trade is.
          enum: [created, submitted, confirmed, failed]
          examples: [failed]
        failure_code:
          type: [string, "null"]
          description: Why the trade failed. Null unless `status` is `failed`.
          examples: [jupiter_failed]
        failure_message:
          type: [string, "null"]
          description: The user-facing message for a failed trade. Null unless `status` is `failed`.
          examples: [The trade did not go through.]
        tx_signature:
          type: [string, "null"]
          description: The Solana transaction signature. Null before the trade is submitted.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        created_at: {type: string, format: date-time, description: When the swap row was created., examples: ["2026-10-03T15:00:00Z"]}
        confirmed_at:
          type: [string, "null"]
          format: date-time
          description: When the trade confirmed on chain. Null until then.
          examples: [null]
        retryable:
          type: boolean
          description: Whether the retry route would accept this swap.
          examples: [true]
    SwapRetryAccepted:
      type: object
      description: A retry the trade engine will run.
      required: [swap_id, status]
      properties:
        swap_id:
          type: string
          format: uuid
          description: The failed swap the retry starts from.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          type: string
          description: Always `retry_requested`.
          enum: [retry_requested]
          examples: [retry_requested]
    SwapRetryRequest:
      type: object
      description: How to retry a swap that failed because the price moved.
      properties:
        at_current_price:
          type: boolean
          description: Hold the retry to the cabal's slippage around the current quote. Only for a `price_moved` swap.
          examples: [true]
    TradeStep:
      type: object
      description: One journaled step of a routed trade.
      required: [step, network, status, amount_micros, updated_at]
      properties:
        step: {type: string, enum: [bridge_out, swap, bridge_back], description: What the step does., examples: [swap]}
        network: {$ref: "#/components/schemas/Network"}
        status: {type: string, enum: [pending, submitted, succeeded, failed], description: Where the step is., examples: [succeeded]}
        amount_micros: {type: string, pattern: "^[0-9]+$", description: "The USDC the step moves, in micros.", examples: ["10000000"]}
        updated_at: {type: string, format: date-time, description: When the step last changed., examples: ["2026-10-10T12:00:10Z"]}
  # api/spec/treasury.yaml
    CabalActivity:
      type: object
      description: One buy, sell, fund or cash out in a cabal.
      required: [id, kind, status, asset, usdc_micros, units, price_micros, actor, tx_signature, occurred_at]
      properties:
        id: {type: string, format: uuid, description: The source id. For a buy or sell it is the swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        kind:
          type: string
          description: What happened.
          enum: [buy, sell, fund, cash_out]
          examples: [buy]
        status:
          type: string
          description: Where it is. A confirmed or failed row never goes back to pending.
          enum: [pending, confirmed, failed]
          examples: [confirmed]
        asset:
          type: [object, "null"]
          description: The stock bought or sold. Null when there is none or the catalog does not know it.
          examples: [{symbol: AAPLx, name: Apple}]
          x-go-type-name: ActivityAsset
          required: [symbol, name]
          properties:
            symbol: {type: string, description: The token symbol., examples: [AAPLx]}
            name: {type: string, description: The display name., examples: [Apple]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC spent or received, in micros. Null until known.
          examples: [25000000]
        units:
          type: [integer, "null"]
          format: int64
          description: Token base units bought or sold. Null until known.
          examples: [105000000]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: >-
            The price of one share as the user sees it, in USDC micros, from the fill and the share multiplier in
            force when the trade happened, rounded down. Null for a fund, a cash out, a trade not yet confirmed,
            and a stock the catalog does not know.
          examples: [23809523]
        actor:
          type: [object, "null"]
          description: The member who acted. Null for a trade the cabal voted for.
          examples: [null]
          x-go-type-name: ActivityActor
          required: [user_id, handle, display_name]
          properties:
            user_id: {type: string, format: uuid, description: The member., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
            handle: {type: string, description: The member's handle., examples: [ana]}
            display_name: {type: string, description: The member's display name., examples: [Ana]}
        tx_signature:
          type: [string, "null"]
          description: The Solana transaction signature. Null until the transaction is sent.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        occurred_at: {type: string, format: date-time, description: When it started., examples: ["2026-10-03T15:00:00Z"]}
    CabalActivityPage:
      type: object
      description: One page of a cabal's activity.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CabalActivity"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    CabalHolding:
      type: object
      description: One stock the cabal holds, valued at the latest market price.
      required: [symbol, display_name, kind, units, token_amount, price_micros, value_micros, weight_bps, cost_basis_micros, pnl_micros, avg_entry_micros, first_bought_at]
      properties:
        listings:
          type: array
          description: >-
            The holding split by the tokenized listing it is held in, for the detail view. Absent until the
            multichain valuation work lands.
          items: {$ref: "#/components/schemas/HoldingListing"}
          examples: [[{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, token_amount: "73000000", value_micros: 60000000}]]
        symbol: {type: string, description: "The token symbol.", examples: [AAPLx]}
        display_name: {type: string, description: "The display name.", examples: [Apple]}
        kind: {type: string, enum: [equity, pre_ipo], description: "Whether the token tracks a listed equity or a pre-IPO company.", examples: [equity]}
        units: {type: string, pattern: "^(0|[1-9][0-9]*)\\.[0-9]{4}$", description: "Shares as the user sees them, rounded down to 4 decimal places.", examples: ["0.7300"]}
        token_amount: {type: integer, format: int64, minimum: 1, description: "The token base units the cabal holds, what a sell of all of it spends.", examples: [73000000]}
        price_micros: {type: integer, format: int64, description: "The latest price of one share, in USDC micros.", examples: [30000000]}
        value_micros: {type: integer, format: int64, description: "The holding's value, in USDC micros.", examples: [60000000]}
        weight_bps: {type: integer, format: int32, description: "The holding's share of the pot in basis points.", examples: [5000]}
        cost_basis_micros: {type: integer, format: int64, description: "What the cabal paid for the holding, in USDC micros.", examples: [40000000]}
        pnl_micros: {type: integer, format: int64, description: "Signed gain, value minus cost basis, in micros.", examples: [20000000]}
        avg_entry_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: "The average price paid for one share as the user sees it, cost basis over units, in USDC micros, rounded down. Null when the holding has no shares to divide by.", examples: ["54794520"]}
        first_bought_at: {type: [string, "null"], format: date-time, description: "When the cabal's first confirmed buy of this stock happened. Null when no buy is recorded.", examples: ["2026-06-03T14:30:00Z"]}
    CabalPot:
      type: object
      description: A cabal's pot valued from one price read, with the caller's slice.
      required: [cabal_id, pot_value_micros, cash_micros, cash_weight_bps, pnl_micros, return_bps, prices_as_of, holdings, me]
      properties:
        cabal_id: {type: string, format: uuid, description: "The cabal id.", examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        pot_value_micros: {type: integer, format: int64, description: "Cash plus every holding's value, less what a cash out still owes beyond the cash, in USDC micros.", examples: [120000000]}
        cash_micros: {type: integer, format: int64, description: "The cabal's USDC not reserved for a cash out, in micros.", examples: [60000000]}
        cash_weight_bps: {type: integer, format: int32, description: "Cash's share of the pot in basis points. With every holding's weight it sums to 10000, or all are 0 when the pot is empty.", examples: [5000]}
        pnl_micros: {type: integer, format: int64, description: "Signed all-time gain, the pot value minus what members put in net of what they took out.", examples: [20000000]}
        return_bps:
          type: [integer, "null"]
          format: int32
          description: The all-time gain over net contributed, in basis points, truncated toward zero. Null when net contributed is zero or less.
          examples: [2000]
        prices_as_of: {type: string, format: date-time, description: "The oldest price used. The read time when the pot holds only USDC.", examples: ["2026-10-03T15:00:00Z"]}
        holdings:
          type: array
          description: Every stock the cabal holds, largest value first, ties by symbol.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CabalHolding"
        me:
          type: [object, "null"]
          description: The caller's slice. Null when the caller is not a member; every field is 0 for a member with no shares.
          examples: [null]
          x-go-type-name: CabalPotSlice
          required: [share_units, value_micros, slice_bps, net_contributed_micros, pnl_micros, first_funded_at]
          properties:
            share_units: {type: integer, format: int64, description: "The caller's share units.", examples: [100000000]}
            value_micros: {type: integer, format: int64, description: "What the caller's shares are worth now, in USDC micros.", examples: [120000000]}
            slice_bps: {type: integer, format: int32, description: "The caller's share of the pot in basis points. Every member's slice sums to 10000.", examples: [10000]}
            net_contributed_micros: {type: integer, format: int64, description: "Signed USDC the caller put in minus what they took out, in micros.", examples: [100000000]}
            pnl_micros: {type: integer, format: int64, description: "Signed gain, value minus net contributed, in micros.", examples: [20000000]}
            first_funded_at: {type: [string, "null"], format: date-time, description: "When the caller first funded this cabal, kept after a full cash out. Null when they never have.", examples: ["2026-08-04T15:00:00Z"]}
    CashOutJob:
      type: object
      description: An asynchronous cash-out job.
      required: [id, cabal_id, user_id, share_units, payout_micros, sell_usdc_micros, status, result_code, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        cabal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        user_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        share_units: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100"]}
        payout_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        sell_usdc_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["0"]}
        status: {type: string, enum: [started, selling, paying, completed, partial, failed], examples: [started]}
        result_code: {type: [string, "null"], examples: [null]}
        created_at: {type: string, format: date-time, examples: ["2026-10-03T15:00:00Z"]}
        updated_at: {type: string, format: date-time, examples: ["2026-10-03T15:00:00Z"]}
    CashOutPreview:
      type: object
      description: The caller's cash-out value and whether it is paused.
      required: [slice_micros, share_units, min_micros, pause]
      properties:
        slice_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        share_units: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100"]}
        min_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100000"]}
        pause: {type: [object, "null"], required: [reasons, since], examples: [null], properties: {reasons: {type: array, items: {type: string}}, since: {type: string, format: date-time}}}
    CashOutRequest:
      type: object
      description: A choice between cashing out all shares or a USDC amount.
      properties:
        usdc_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        all: {type: boolean, examples: [true]}
    FundAccepted:
      type: object
      description: A fund transfer that is signed and submitted.
      required: [transfer_id, status]
      properties:
        transfer_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/FundTransferStatus"}
    FundPreview:
      type: object
      description: What the Fund this cabal keypad shows before a submit.
      required: [available_micros, min_micros, slice_bps_now, slice_bps_after, over_micros, paused, first_funded_at]
      properties:
        available_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", description: "The caller's cash available to fund, in USDC micros.", examples: ["500000000"]}
        min_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", description: "The smallest fund, in USDC micros.", examples: ["1000000"]}
        slice_bps_now: {type: integer, format: int32, description: "The caller's share of the pot now, in basis points.", examples: [3500]}
        slice_bps_after: {type: [integer, "null"], format: int32, description: "The caller's share after the fund, in basis points, computed for at most the available cash. Null without an amount or below the minimum.", examples: [3600]}
        over_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", description: "How far the amount is over the available cash, in USDC micros. 0 when it is not.", examples: ["0"]}
        paused: {type: boolean, description: "True when the cabal is paused and a fund would be refused.", examples: [false]}
        first_funded_at: {type: [string, "null"], format: date-time, description: "When the caller first funded this cabal. Null when they never have.", examples: ["2026-10-03T15:00:00Z"]}
    FundRequest:
      type: object
      description: How much platform balance to move into the cabal.
      required: [amount_micros]
      properties:
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["5000000"]}
    FundTransfer:
      type: object
      description: One fund transfer as its owner sees it.
      required: [status, amount_micros, share_units, slice_bps, fail_code]
      properties:
        status: {$ref: "#/components/schemas/FundTransferStatus"}
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["5000000"]}
        share_units: {type: [string, "null"], pattern: "^[0-9]+$", examples: ["5000000"]}
        slice_bps: {type: [integer, "null"], format: int32, description: "The caller's share of the pot in basis points at read time. Set only when the status is settled.", examples: [3600]}
        fail_code: {type: [string, "null"], examples: [fund_not_sent]}
    FundTransferStatus:
      type: string
      description: Where the transfer is. `landed` means final on chain with shares not yet minted.
      enum: [created, submitted, landed, settled, failed]
      examples: [submitted]
    HeldList:
      type: object
      description: Every holding of the caller's cabals, valued from one price read, with their total.
      required: [total_value_micros, cabal_count, prices_as_of, holdings]
      properties:
        total_value_micros: {type: integer, format: int64, description: "The sum of every row's value, in USDC micros. 0 when there are no rows.", examples: [19627710000]}
        cabal_count: {type: integer, format: int32, description: "How many distinct cabals the rows come from.", examples: [3]}
        prices_as_of: {type: string, format: date-time, description: "The oldest price used across every cabal. The read time when there are no rows.", examples: ["2026-10-03T15:00:00Z"]}
        holdings:
          type: array
          description: One row per cabal and stock with shares, largest value first, ties by symbol.
          examples: [[]]
          items: {$ref: "#/components/schemas/HeldRow"}
    HeldRow:
      type: object
      description: One stock one of the caller's cabals holds.
      required: [cabal, logo_url, holding]
      properties:
        cabal:
          type: object
          description: The cabal that holds it.
          x-go-type-name: HeldCabal
          required: [id, name, picture_url]
          properties:
            id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
            name: {type: string, description: The cabal name., examples: [AC Capital]}
            picture_url: {type: [string, "null"], description: The cabal picture. Null when it has none., examples: [null]}
        logo_url: {type: [string, "null"], description: The stock's logo. Null when the catalog has none., examples: ["https://cdn.example.com/NVDAx.png"]}
        holding:
          $ref: "#/components/schemas/CabalHolding"
    HoldingListing:
      type: object
      description: The part of a holding kept in one listing.
      required: [listing_id, issuer, network, token_amount, value_micros]
      properties:
        listing_id: {type: string, format: uuid, description: The listing held., examples: [01928a6e-0000-7000-8000-000000000001]}
        issuer: {type: string, description: The token issuer., examples: [xstocks]}
        network: {$ref: "#/components/schemas/Network"}
        token_amount: {type: string, pattern: "^[0-9]+$", description: Token base units held in this listing., examples: ["73000000"]}
        value_micros: {type: integer, format: int64, description: This part's value in USDC micros., examples: [60000000]}
    HoldingPerformance:
      type: object
      description: What a cabal made selling one stock, replayed from its confirmed buys and sells.
      required: [avg_sell_micros, realized_pnl_micros, series]
      properties:
        avg_sell_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: "The average price one share sold for, the proceeds of every sell over the shares sold, in USDC micros, rounded down. Null when nothing was sold.", examples: ["250000000"]}
        realized_pnl_micros: {type: integer, format: int64, description: "Signed profit locked in by selling, each sell's proceeds less the average cost of the units it removed, in USDC micros. Zero when nothing was sold.", examples: [30000000]}
        series:
          type: object
          description: The position P&L over time for each chart range. Every range is an empty array for a symbol the cabal never held.
          x-go-type-name: HoldingPnLSeries
          required: ["1W", "1M", "3M", "1Y", "ALL"]
          examples: [{"1W": [{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}], "1M": [], "3M": [], "1Y": [], "ALL": []}]
          properties:
            "1W": {type: array, maxItems: 48, description: "The position P&L over the 1W range, oldest first, ending at now.", items: {$ref: "#/components/schemas/HoldingPnLPoint"}, examples: [[{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}]]}
            "1M": {type: array, maxItems: 48, description: "The position P&L over the 1M range, oldest first, ending at now.", items: {$ref: "#/components/schemas/HoldingPnLPoint"}, examples: [[{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}]]}
            "3M": {type: array, maxItems: 48, description: "The position P&L over the 3M range, oldest first, ending at now.", items: {$ref: "#/components/schemas/HoldingPnLPoint"}, examples: [[{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}]]}
            "1Y": {type: array, maxItems: 48, description: "The position P&L over the 1Y range, oldest first, ending at now.", items: {$ref: "#/components/schemas/HoldingPnLPoint"}, examples: [[{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}]]}
            "ALL": {type: array, maxItems: 48, description: "The position P&L over the ALL range, oldest first, ending at now.", items: {$ref: "#/components/schemas/HoldingPnLPoint"}, examples: [[{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}]]}
    HoldingPnLPoint:
      type: object
      description: The position P&L at one moment, the current value of the units held less the remaining cost basis plus the realized P&L.
      required: [at, pnl_micros]
      properties:
        at: {type: string, format: date-time, description: When the P&L was valued., examples: ["2026-10-30T12:00:00Z"]}
        pnl_micros: {type: integer, format: int64, description: "Signed position P&L in USDC micros.", examples: [-12000000]}
    UserTxn:
      type: object
      description: One inbound, outbound or cabal transfer affecting the caller.
      required: [id, kind, status, usdc_micros, cabal, tx_signature, created_at]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        kind: {type: string, enum: [deposit, withdrawal, fund, cash_out], description: What happened., examples: [deposit]}
        status: {type: string, enum: [pending, settled, failed], description: Where the transaction is., examples: [settled]}
        usdc_micros: {type: string, pattern: "^-?(0|[1-9][0-9]*)$", description: Signed USDC amount in micros from the caller's wallet perspective., examples: ["25000000"]}
        cabal:
          type: [object, "null"]
          description: The cabal involved, when it remains available. Null for deposits, withdrawals, and deleted cabals.
          examples: [null]
          x-go-type-name: UserTxnCabal
          required: [id, name]
          properties:
            id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
            name: {type: string, description: The cabal name., examples: [Moneymakers]}
        tx_signature: {type: [string, "null"], description: The Solana transaction signature. Null until sent., examples: [null]}
        created_at: {type: string, format: date-time, description: When the transaction was created., examples: ["2026-10-03T15:00:00Z"]}
    UserTxnPage:
      type: object
      description: One page of the caller's transaction history.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page, newest first.
          examples: [[]]
          items: {$ref: "#/components/schemas/UserTxn"}
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
