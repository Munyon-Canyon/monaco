        scope:
          type: string
          enum: [this_session, all_sessions]
          description: >-
            `this_session` ends the session of the token that made the call. `all_sessions` ends every session
            the caller has, including this one.
          examples: [this_session]
    SetHandle:
      type: object
      description: A handle to claim for the caller.
