      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        member_count: {type: integer, format: int32}
        join_mode: {type: string, examples: [open]}
        is_member: {type: boolean}
        my_access_request_status: {type: [string, "null"], examples: [pending, null]}
    CabalSearchPage:
      type: object
      description: One page of public cabals.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalSearchItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], examples: [null]}
    CabalSentInvite:
      type: object
      description: A pending invite, as a member of its cabal sees it.
      required: [request_id, user, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CreateCabalRequest:
      type: object
      description: The name and rules for a new cabal.
      required: [name, voter_mode, threshold, proposal_expiry_seconds]
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Kai]}
        join_mode: {type: string, description: "`open` (anyone joins at once, the default when omitted) or `request` (the creator approves each request).", default: open, examples: [open]}
        voter_mode: {type: string, description: "all, or list starting with the creator.", examples: [all]}
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300. Omitted means 100.", examples: [100]}
        max_trade_bps: {type: [integer, "null"], format: int32, description: "Cap on one trade as basis points of the treasury's cash, from 100 to 10000 in steps of 100. Omitted or null means no cap.", examples: [2000]}
    InviteMemberRequest:
      type: object
      description: Who to invite to a cabal.
      required: [handle]
      properties:
        handle: {type: string, description: The invitee's handle., examples: [kai]}
    MemberMonth:
      type: object
      description: A member's calls in this cabal over the calendar month in UTC.
      required: [right, resolved, voted, eligible]
      properties:
        right: {type: integer, format: int32, description: Votes that matched how the trade did., examples: [7]}
        resolved: {type: integer, format: int32, description: Votes whose trade has resolved., examples: [9]}
        voted: {type: integer, format: int32, description: Ballots the member cast., examples: [11]}
        eligible: {type: integer, format: int32, description: Votes that were open to the member., examples: [11]}
    MyCabal:
      type: object
      description: A cabal the caller belongs to.
      required: [id, name, picture_url, role, can_vote, member_count, joined_at, pending_request_count, unread_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean}
        member_count: {type: integer, format: int32}
        joined_at: {type: string, format: date-time}
        pending_request_count: {type: integer, format: int32}
        unread_count: {type: integer, description: "Chat messages in the channel the caller has not seen, at most 100.", examples: [3]}
    PutMyCabalOrderRequest:
      type: object
      description: The caller's cabals in their own order.
      required: [cabal_ids]
      properties:
        cabal_ids:
          type: array
          maxItems: 100
          description: Cabal ids, first to last. At most 100, no duplicates.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
    UpdateCabalRequest:
      type: object
      description: The cabal fields to change. An omitted field keeps its value.
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Work pot]}
        join_mode: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [request]}
        voter_mode: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [list]}
        voter_ids:
          type: array
          description: Refused with 409 RulesChangeByProposal. Rules change by proposal.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
        threshold: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [unanimous]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [3600]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300.", examples: [50]}
