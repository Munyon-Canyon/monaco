            rate_pct: {type: [integer, "null"], format: int32, description: "The rate as a whole percent rounded half up, as the app shows it. Null when not ranked.", examples: [78]}
            right: {type: integer, format: int32, description: Right calls in the period., examples: [7]}
            resolved: {type: integer, format: int32, description: Resolved calls in the period., examples: [9]}
            voted: {type: integer, format: int32, description: Proposals voted on in the period., examples: [11]}
            eligible: {type: integer, format: int32, description: Proposals the subject could vote on in the period., examples: [12]}
            turnout_bps: {type: integer, format: int32, description: Voted as basis points of eligible., examples: [9166]}
            needed: {type: [integer, "null"], format: int32, description: Resolved calls still needed to rank. Null when ranked., examples: [null]}
            movement:
              $ref: "#/components/schemas/CallBoardMovement"
            last_call:
              type: [object, "null"]
              description: The subject's latest resolved call. Null when it has none.
              examples: [null]
              x-go-type-name: CallBoardLastCall
              required: [proposal_id, kind, symbol, right]
