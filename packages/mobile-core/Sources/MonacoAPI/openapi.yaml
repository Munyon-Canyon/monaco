        swap:
          type: [object, "null"]
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          x-go-type-name: LinkedSwap
          required: [swap_id, status, failure_code, failure_message, tx_signature, retryable, usdc_micros, token_amount, token_decimals, price_micros]
          properties:
            swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
            status:
              type: string
              description: Where the trade is.
              enum: [created, submitted, confirmed, failed]
              examples: [confirmed]
            failure_code:
              type: [string, "null"]
              description: Why the trade failed. Null unless `status` is `failed`.
              examples: [null]
            failure_message:
              type: [string, "null"]
              description: The user-facing message for a failed trade. Null unless `status` is `failed`.
              examples: [null]
            tx_signature:
              type: [string, "null"]
              description: The Solana transaction signature. Null before the trade is submitted.
              examples: [null]
            retryable: {type: boolean, description: Whether a failed trade can be retried., examples: [false]}
            usdc_micros:
              type: [integer, "null"]
              format: int64
              description: USDC spent or received, in micros. Null until a sell confirms.
              examples: [25000000]
            token_amount:
              type: [integer, "null"]
              format: int64
              description: Token base units bought or sold. Null until a buy confirms.
              examples: [12500000]
            token_decimals: {type: integer, minimum: 0, maximum: 255, description: Decimals of `token_amount`., examples: [8]}
            price_micros:
              type: [integer, "null"]
              format: int64
              description: >-
                USDC micros per whole token, the floor of `usdc_micros` ÷ the whole units in `token_amount`.
                Null until `status` is `confirmed`.
              examples: [200000000]
            fee_micros:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: >-
                The fee the confirmed trade paid, in USDC micros, as recorded on the swap. Null until `status` is
                `confirmed`, and when the swap recorded none.
              examples: [400000]
            filled_at:
              type: [string, "null"]
              format: date-time
              description: When the trade confirmed on chain. Null until `status` is `confirmed`.
              examples: ["2026-10-04T13:41:00Z"]
    ProposalKind:
      type: string
      description: Whether the proposal spends USDC on the token, sells the token for USDC, or changes one of the cabal's rules.
      enum: [buy, sell, rule]
      examples: [buy]
    ProposalList:
      type: object
      description: One page of proposals.
      required: [proposals, next_cursor]
      properties:
        proposals:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalPriceComparison:
      type: object
      description: An open buy proposal's trade quoted again now.
      required: [quote_out_amount, quoted_at]
      properties:
        price_comparison:
          description: Every venue quoted now, best first. Absent when the venues could not be compared.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        quote_out_amount:
          type: integer
          format: int64
          description: >-
            The quoted output, in the output asset's base units, from the winning venue or, without a
            comparison, from Jupiter. 0 when the proposal is pinned to a chain with no live quote, and
            `price_comparison` then lists that chain as unavailable.
          examples: [40000000]
        quoted_at:
          type: string
          format: date-time
          description: When the quotes were taken.
          examples: ["2026-10-10T12:00:00Z"]
    ProposalProposer:
      type: object
      description: The member who proposed it, as the share card shows them.
      required: [id, display_name, photo_url]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        display_name: {type: string, description: Empty when the user has none or deleted the account., examples: [Mia]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    ProposalReminder:
      type: object
      description: The caller's reminder for one proposal.
      required: [proposal_id, reminder_set, due_at]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        reminder_set:
          type: boolean
          description: True while an unsent reminder is stored for the caller.
          examples: [true]
        due_at:
          type: [string, "null"]
          format: date-time
          description: When the reminder falls due. Null when none is stored.
          examples: ["2026-10-04T14:00:00Z"]
    ProposalStats:
      type: object
      description: >-
        Facts about a proposal. `treasury_share_bps`, `closes_at` and `closed_at` are recorded when the proposal opens
        or closes. `price_micros` and `since_bps` are live, read at request time from the price book, and
        `shares_atomics` is an estimate until the trade fills.
      required: [treasury_share_bps, closes_at, closed_at]
      properties:
        treasury_share_bps:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            The trade's share of the cabal's pot when the proposal opened, in basis points, rounded down: `usdc_micros`
            for a buy, `quote_out_amount` for a sell. Null when the pot was not recorded (a proposal opened before the
            figure was stored) or was zero.
          examples: [200]
        closes_at:
          type: string
          format: date-time
          description: When voting closes. The same instant as `expires_at`.
          examples: ["2026-10-04T15:00:00Z"]
        closed_at:
          type: [string, "null"]
          format: date-time
          description: When the proposal left `open`. Null while open, and for proposals closed before close times were recorded.
          examples: [null]
        price_micros:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >-
            The asset's live price in USDC micros per whole token, from the price book at request time. On a proposal
            that was just opened it is the quote's price. Null when the asset has no accepted price, never zero.
          examples: [220000000]
        shares_atomics:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >-
            The trade's shares in base units of `token_decimals`. A sell is its `token_amount`, exact. A buy is the
            filled amount once the swap confirms, exact, and before that `usdc_micros` ÷ `price_micros` rounded down, an
            estimate. Null for an unfilled buy with no `price_micros`.
          examples: [182000000]
        shares_exact:
          type: boolean
          description: True when `shares_atomics` is the trade's own amount, false when it is the estimate.
          examples: [false]
        token_decimals:
          type: integer
          minimum: 0
          maximum: 255
          description: Decimals of `shares_atomics`.
          examples: [8]
        since_bps:
          type: [integer, "null"]
          format: int64
          description: >-
            The change from the fill price (`swap.price_micros`) to `price_micros`, in basis points of the fill price,
            rounded toward zero. Negative when the price fell. Null until the swap confirms, and when either price is
            missing.
          examples: [30]
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    ProposalVoteItem:
      type: object
      description: One member of the proposal's frozen voter set with their card and ballot.
      required: [user_id, voted, handle, display_name, photo_url, choice, cast_at]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        voted: {type: boolean, description: "Whether the voter has cast a ballot. Always set, even while their side is private.", examples: [true]}
        handle: {type: [string, "null"], description: The voter handle. Null until onboarding sets one., examples: [mia]}
        display_name: {type: string, description: The voter name. Empty when the user has none., examples: [Mia]}
        photo_url: {type: [string, "null"], description: The voter photo. Null when the user has none., examples: [null]}
        choice:
          description: The voter's ballot. Null until they vote, and null for every voter but the caller, because the side of a ballot is private.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote, and null for every voter but the caller.
          examples: ["2026-10-03T16:00:00Z"]
    ProposalVotePage:
      type: object
      description: One page of a proposal's voters.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ProposalVoteItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], description: Null on the last page., examples: [null]}
    ProposalVoter:
      type: object
      description: One member of the proposal's frozen voter set.
      required: [user_id, voted, choice, cast_at, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        voted: {type: boolean, description: "Whether the voter has cast a ballot. Always set, even while their side is private.", examples: [true]}
        choice:
          description: The voter's ballot. Null until they vote, and null for every voter but the caller while the cabal keeps sides private.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote, and null for every voter but the caller while the cabal keeps sides private.
          examples: ["2026-10-03T16:00:00Z"]
        display_name: {type: string, description: "The voter's name. Empty when the account is gone.", examples: [Mia]}
        photo_url: {type: [string, "null"], description: "The voter's photo. Null when they have none.", examples: [null]}
    ProposeTradeRequest:
      type: object
      description: A trade to propose. A buy sets `usdc_micros` only, and a sell sets `token_amount` only.
      required: [kind, symbol]
      properties:
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, minLength: 1, maxLength: 32, description: The token symbol from the catalog., examples: [TSLAx]}
        usdc_micros:
          type: integer
          format: int64
          minimum: 1
          description: USDC a buy spends, in micros.
          examples: [5000000]
        token_amount:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Token base units a sell spends. For a sell on an EVM chain these are that listing's token base
            units.
          examples: [1000000]
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [earnings]}
        network:
          description: >-
            The chain the trade executes on. A buy must have a listing in the comparison quoted now. A sell
            sells the cabal's holding on that chain and is refused when the cabal holds none there or the
            sale has no route. Absent means the best price on any chain for a buy; a sell with no network
            sells the Solana holding, or the only EVM holding when there is no Solana one.
          $ref: "#/components/schemas/Network"
          examples: [base]
    RetractVoteResult:
      type: object
      description: The proposal after the caller's ballot was removed.
      required: [proposal_id, status, tally]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
    RuleChangeRequest:
      type: object
      description: A change to one cabal rule to propose.
      required: [change]
      examples: [{change: {rule: show_sides, to: true}, thesis: Let everyone see who voted what.}]
      properties:
        change:
          type: object
          description: >-
            The rule and the value it should take. `to` is a boolean for `show_sides`, `voter` and `admin`,
            an integer or null for `max_trade_bps`, an integer for `proposal_expiry_seconds` and a string for
            `threshold` and `join_mode`. `user_id` names the member a `voter` or `admin` change targets.
          examples: [{rule: show_sides, to: true}]
          x-go-type-name: RuleChangeRequestChange
          required: [rule, to]
          properties:
            rule:
              type: string
              description: Which rule to change.
              enum: [show_sides, max_trade_bps, threshold, proposal_expiry_seconds, join_mode, voter, admin]
              examples: [show_sides]
            to: {description: The value the rule should take., examples: [true]}
            user_id: {type: string, format: uuid, description: The member a `voter` or `admin` change targets., examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [Let everyone see who voted what.]}
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    TradePreview:
      type: object
      description: What proposing the trade would quote, and the first check it fails.
      required: [quote_out_amount, advisory_code, advisory_message, pot_value_micros]
      properties:
        price_comparison:
          description: >-
            Every venue checked for the trade, best first. Absent until the multichain routing work lands.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        quote_out_amount:
          type: [integer, "null"]
          format: int64
          description: The quoted output, in the output asset's base units. Null when Jupiter has no route or the asset is unknown.
          examples: [21000000]
        advisory_code:
          type: [string, "null"]
          description: >-
            The error code a proposal of this trade would fail with now: asset_not_found,
            asset_untradable, asset_paused, no_route, pot_exceeded, insufficient_funds or invalid_network.
            Null when every check passes.
          examples: [null]
        advisory_message:
          type: [string, "null"]
          description: The user-facing message for `advisory_code`. Null when `advisory_code` is null.
          examples: [null]
        pot_value_micros:
          type: integer
          format: int64
          description: The cabal's total value, USDC plus priced holdings, in micros.
          examples: [100000000]
        spendable_cash_micros:
          type: integer
          format: int64
          description: >-
            The USDC on the cabal's Solana treasury wallet, the cash a buy draws on, in micros. Absent
            for a sell.
          examples: [990000]
        max_buy_micros:
          type: integer
          format: int64
          description: >-
            The largest buy this token's transfer fee leaves the cash able to cover, in micros. Absent
            for a sell.
          examples: [985000]
    VoidedProposal:
      type: object
      description: A proposal after a moderator voided it.
      required: [id, status, void_reason]
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {type: string, description: Always `voided`., enum: [voided], examples: [voided]}
        void_reason: {type: string, description: The reason the moderator gave., examples: [spam proposal]}
    VoteResult:
      type: object
      description: The proposal after the caller's ballot.
      required: [proposal_id, status, tally, my_ballot, undo_until, my_vote]
      properties:
        my_vote:
          $ref: "#/components/schemas/MyVote"
          description: Where the caller's ballot falls in the vote after this ballot.
          examples: [{order: 6, of: 8, yes_order: 5, no_order: 0, decided: true}]
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
        my_ballot:
          $ref: "#/components/schemas/BallotChoice"
        undo_until:
          type: [string, "null"]
          format: date-time
          description: >-
            Until when the caller can undo this ballot. Null when the ballot settled the proposal or has
            changed side.
          examples: ["2026-10-03T16:00:15Z"]
  # api/spec/identity.yaml
    AccountStatus:
      type: string
      description: >-
        The user's standing. A suspended account is read-only apart from withdraw and cash out, and a
        banned account can only withdraw and cash out.
      examples: [active]
      enum: [active, suspended, banned]
    AuthState:
      type: string
      description: >-
        Where the user is in onboarding. `CREATED` means onboarding has not finished, `AWAITING_PHONE`
        and `AWAITING_SOCIALS` mean the user still owes that step, and `ONBOARDING_COMPLETED` means the
        phone and X are both linked. The app routes the first-run flow and shows nudge banners from it.
      examples: [CREATED]
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
    DepositAddress:
      type: object
      description: Where to send USDC on one network.
      required: [network, address, asset]
      properties:
        network: {$ref: "#/components/schemas/Network"}
        address:
          type: string
          description: A base58 Solana address, or a lowercase 0x EVM address.
          examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]
        asset: {type: string, enum: [USDC], description: The token to send., examples: [USDC]}
        estimated_fee_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            An estimate, in USDC micros, of the fee the bridge keeps from a deposit on this network: what the
            most recent completed deposit on this network paid. The member pays it: the deposit is credited
            net of it. Absent for Solana, for a network with no completed deposit yet, and when the estimate
            can't be read.
          examples: ["163867"]
    DepositAddresses:
      type: object
      description: Every address the caller can deposit USDC to.
      required: [addresses]
      properties:
        addresses:
          type: array
          description: One entry per network, Solana first.
          items: {$ref: "#/components/schemas/DepositAddress"}
          examples: [[{network: solana, address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, asset: USDC}]]
    DevXLink:
      type: object
      description: A fake X account for a dev user.
      properties:
        username:
          type: string
          description: The X username to store, without the @.
          pattern: "^[A-Za-z0-9_]{1,15}$"
          examples: [qa_x]
    HandleAvailability:
      type: object
      description: Whether the caller can claim a handle, and the reason when they cannot.
      examples:
        - handle: admin
          available: false
          reason: reserved
      required: [handle, available]
      properties:
        handle:
          type: string
          description: The handle that was checked, in lowercase.
          examples: [admin]
        available:
          type: boolean
          description: True when the caller can claim the handle, including when it is already theirs.
          examples: [false]
        reason:
          $ref: "#/components/schemas/HandleAvailabilityReason"
          description: Why the handle is not available. Absent when `available` is true.
    HandleAvailabilityReason:
      type: string
      description: >-
        Why a handle cannot be claimed. `reserved` covers the reserved list, profanity and
        referral-code shape. `taken` covers another user, including a deleted one, and another
        user's X username.
      examples: [reserved]
      enum: [taken, reserved, invalid, too_soon]
    LoginProvider:
      type: string
      description: The method a user signed up with.
      examples: [sms]
      enum: [sms, email, apple, google]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          login_provider: sms
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          bio: "Building in public.\nNYC"
          share_performance: true
          created_at: "2026-09-30T12:00:00Z"
      required:
        - id
        - display_name
        - share_performance
        - auth_state
        - account_status
        - login_provider
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        login_provider:
          $ref: "#/components/schemas/LoginProvider"
          description: How the user signed up. The app skips the phone number entry for `sms`.
          examples: [sms]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        bio:
          type: [string, "null"]
          maxLength: 160
          description: The profile bio, up to 160 characters with newlines kept. Null when the user has none.
          examples: ["Building in public.\nNYC"]
        share_performance:
          type: boolean
          description: >-
            True (the default) when the user's one-month return shows on their feed posts and
            comments, false when they hide it.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    PublicProfile:
      type: object
      description: >-
        A user's public profile with their bio, join date, cabal count, follow counts and one-month
        return. The return and P&L come from the 1M people board as of the last valuation run and are
        null unless the user shares performance and is ranked.
      required:
        - id
        - handle
        - display_name
        - photo_url
        - bio
        - created_at
        - cabal_count
        - follower_count
        - following_count
        - followed_by_me
        - blocked_by_me
        - return_1m_bps
        - pnl_1m_micros
        - return_period
        - return_private
        - standing
