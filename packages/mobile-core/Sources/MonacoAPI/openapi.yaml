        step:
          type: string
          enum: [phone, socials]
          examples: [phone]
    UpdateProfileRequest:
      type: object
      description: >-
        The profile fields a signed-in user may update. Send at least one field, or the call is
        `invalid_input`.
      examples: [{display_name: Kai Cenat}, {share_performance: false}, {bio: "Building in public.\nNYC"}]
      properties:
        display_name:
          type: string
          description: The caller's display name, normalized before it is stored. Omit it to leave the name alone.
          examples: [Kai Cenat]
        bio:
          type: [string, "null"]
          x-go-type: rawjson.RawMessage
          x-go-type-import: {name: rawjson, path: encoding/json}
          x-go-type-skip-optional-pointer: true
          description: >-
            The caller's bio, up to 160 characters once trimmed. Newlines are kept and other control
            characters are `invalid_input`. Send null or an empty string to clear it, and omit it to
            leave the bio alone.
          examples: ["Building in public.\nNYC"]
        share_performance:
          type: boolean
          description: >-
            Whether the caller's one-month return shows on their feed posts and comments. Omit it to
            leave the setting alone.
          examples: [false]
    UserSearchResult:
