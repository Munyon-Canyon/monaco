          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close for an equity, or against the first
            sample of the UTC day for a pre-IPO token. Null when that reference does not exist.
          examples: [1000]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        volume_24h_micros:
          type: [integer, "null"]
          format: int64
          description: >-
            The token's trading volume over the last 24 hours in USD micros, as CoinGecko reports it
            across the venues it tracks. Null when there is no reading from the last 36 hours.
          examples: [2500000000000]
        volume_24h_as_of:
          type: [string, "null"]
          format: date-time
          description: When that reading was taken. Null when `volume_24h_micros` is null.
          examples: ["2026-03-04T05:00:00Z"]
        quotable:
          type: boolean
          description: >-
            False when Jupiter has not priced this asset in the last 15 minutes, so a buy would find
            no route. The app marks it Paused and disables Buy.
          examples: [true]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
        tradable:
          type: boolean
          description: >-
            True when this asset can be bought. For a `pre_ipo` asset, `true` is "Eligible" (a cabal can vote
            to buy it) and `false` is "Research only".
          examples: [true]
        cabal_count:
          type: integer
          minimum: 3
          description: >-
            How many active cabals hold this asset. Set only on rows of the `in_cabals` filter that
            ranked by it, never below three, and absent everywhere else.
          examples: [41]
        estimate:
          type: [object, "null"]
          description: >-
            The secondary estimate of a `pre_ipo` company, per share. Null for equities and for a Pre-IPO asset
            without a profile; the field is then absent. A Pre-IPO screen shows it instead of `price_micros`.
          examples: [{price_micros: 185000000, as_of: "2026-10-20"}]
          x-go-type: PreIpoEstimate
          required: [price_micros, as_of]
          properties:
            price_micros: {type: integer, format: int64, description: The estimate per share in USD micros., examples: [185000000]}
            as_of: {type: string, format: date, description: The day the estimate was set., examples: ["2026-10-20"]}
    ChartPoint:
      type: object
      description: One bucket of open, high, low and close, in USD micros.
      examples:
        - t: "2026-03-04T14:55:00Z"
          open_micros: 100000000
          high_micros: 130000000
          low_micros: 90000000
          close_micros: 110000000
      required:
        - t
        - open_micros
        - high_micros
        - low_micros
        - close_micros
      properties:
        t:
          type: string
          format: date-time
          description: The start of the bucket.
          examples: ["2026-03-04T14:55:00Z"]
        open_micros:
          type: integer
          format: int64
          description: The first sample in the bucket, in USD micros.
          examples: [100000000]
        high_micros:
          type: integer
          format: int64
          description: The highest sample in the bucket, in USD micros.
          examples: [130000000]
        low_micros:
          type: integer
          format: int64
          description: The lowest sample in the bucket, in USD micros.
          examples: [90000000]
        close_micros:
          type: integer
          format: int64
          description: The last sample in the bucket, in USD micros.
          examples: [110000000]
    MarketSession:
      type: object
      description: The session the asset is in, computed on the server.
      examples:
        - state: open
          continuous: false
          holiday: ""
          early_close: false
          next_state: after_hours
          next_transition: "2026-03-04T21:00:00Z"
      required: [state, continuous, holiday, early_close, next_state, next_transition]
      properties:
        state:
          $ref: "#/components/schemas/MarketState"
          description: The session state at the time of the response.
          examples: [open]
        continuous:
          type: boolean
          description: True for a pre-IPO token, which trades without a US session.
          examples: [false]
        holiday:
          type: string
          description: The US market holiday name. Empty when the day is not a holiday.
          examples: [""]
        early_close:
          type: boolean
          description: True when the regular session closes early today.
          examples: [false]
        next_state:
          description: The next session state. Null when the asset trades continuously.
          examples: [after_hours]
          type: [string, "null"]
          enum: [pre_market, open, after_hours, closed, null]
        next_transition:
          type: [string, "null"]
          format: date-time
          description: When `next_state` begins. Null when the asset trades continuously.
          examples: ["2026-03-04T21:00:00Z"]
    MarketState:
      type: string
      description: Where the underlying US session is.
      examples: [open]
      enum: [pre_market, open, after_hours, closed]
    PreIpoEstimate:
      type: object
      description: The secondary estimate of a Pre-IPO company, per share.
      examples:
        - price_micros: 185000000
          as_of: "2026-10-20"
      required: [price_micros, as_of]
      properties:
        price_micros: {type: integer, format: int64, description: The estimate per share in USD micros., examples: [185000000]}
        as_of: {type: string, format: date, description: The day the estimate was set., examples: ["2026-10-20"]}
    PreIpoRound:
      type: object
      description: One funding round of a Pre-IPO company.
      examples:
        - on: "2026-06-01"
          price_micros: 165000000
      required: [on, price_micros]
      properties:
        on: {type: string, format: date, description: The day the round priced., examples: ["2026-06-01"]}
        price_micros: {type: integer, format: int64, description: The round price per share in USD micros., examples: [165000000]}
    PreIpoSellWindow:
      type: string
      description: "`any_time` sells at any time; `tender_quarterly` sells in a quarterly tender."
      enum: [any_time, tender_quarterly]
      examples: [any_time]
    UiMultiplier:
      type: object
      description: The whole tokens in one display unit, as an exact fraction.
      examples:
        - num: 1
          den: 1
      required: [num, den]
      properties:
        num:
          type: integer
          format: int64
          description: The numerator.
          examples: [1]
        den:
          type: integer
          format: int64
          description: The denominator.
          examples: [1]
  # api/spec/notify.yaml
    CatchUp:
      type: object
      description: The caller's Catch up.
      required: [count, cabals, waiting, replies, invites, results, cleared]
      properties:
        count: {type: integer, minimum: 0, description: Active items across all sections., examples: [6]}
        cabals:
          type: array
          description: Every cabal the caller belongs to, by join date, even when every section is empty.
          examples: [[{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: AC Capital, picture_url: null}]]
          items: {$ref: "#/components/schemas/CatchUpCabal"}
        waiting: {type: array, items: {$ref: "#/components/schemas/CatchUpItem"}, examples: [[]]}
        replies: {type: array, items: {$ref: "#/components/schemas/CatchUpItem"}, examples: [[]]}
        invites: {type: array, items: {$ref: "#/components/schemas/CatchUpItem"}, examples: [[]]}
        results: {type: array, items: {$ref: "#/components/schemas/CatchUpItem"}, examples: [[]]}
        cleared: {type: array, items: {$ref: "#/components/schemas/CatchUpItem"}, examples: [[]]}
    CatchUpCabal:
      type: object
      description: A cabal on a Catch up item.
      required: [id, name, picture_url]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [AC Capital]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
    CatchUpComment:
      type: object
      description: The incoming comment, which is the reply or mention itself.
      required: [feed_item_id, comment_id, parent_comment_id, root_comment_id, proposal_id, cabal_id, author, body, created_at, reactions, reaction_count]
      properties:
        feed_item_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8060"]}
        comment_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8061"]}
        parent_comment_id: {type: [string, "null"], format: uuid, examples: [null]}
        root_comment_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8061"]}
        proposal_id: {type: [string, "null"], format: uuid, examples: [null]}
        cabal_id: {type: [string, "null"], format: uuid, examples: [null]}
        author: {$ref: "#/components/schemas/CatchUpPerson"}
        body: {type: string, examples: ["Still out: @Andres, Jordan?"]}
        created_at: {type: string, format: date-time, examples: ["2026-10-28T21:40:00Z"]}
        reactions:
          type: array
          description: The reactions on the comment, most used first, as the comment's thread draws them.
          items: {$ref: "#/components/schemas/Reaction"}
          examples: [[{emoji: "❤️", count: 1, mine: false}]]
        reaction_count: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the comment, over every emoji.", examples: [1]}
    CatchUpCount:
      type: object
      description: The number of active Catch up items.
      required: [count]
      properties:
        count: {type: integer, minimum: 0, description: Active items across all sections., examples: [6]}
    CatchUpInvite:
      type: object
      description: The cabal facts an invite row draws.
      required: [id, member_count, top_holding_name]
      properties:
        id: {type: string, format: uuid, description: The invite request id., examples: ["01890a5d-ac96-774b-bcce-b302099a8062"]}
        member_count: {type: integer, minimum: 0, examples: [5]}
        top_holding_name: {type: [string, "null"], description: Null when the cabal holds nothing., examples: [OpenAI]}
    CatchUpItem:
      type: object
      description: One Catch up item.
      required: [key, kind, unread, at]
      properties:
        key: {type: string, description: "The item key: proposal:<id>, comment:<id>, chat:<id> or invite:<id>.", examples: ["proposal:01890a5d-ac96-774b-bcce-b302099a8057"]}
        kind: {type: string, enum: [waiting_vote, reply, mention, invite, result], examples: [waiting_vote]}
        unread: {type: boolean, examples: [true]}
        at: {type: string, format: date-time, examples: ["2026-10-28T18:00:00Z"]}
        cleared_reason: {type: string, enum: [voted, replied, joined, cleared], examples: [voted]}
        actor: {$ref: "#/components/schemas/CatchUpPerson"}
        cabal: {$ref: "#/components/schemas/CatchUpCabal"}
        proposal: {$ref: "#/components/schemas/CatchUpProposal"}
        post: {$ref: "#/components/schemas/CatchUpPost"}
        comment: {$ref: "#/components/schemas/CatchUpComment"}
        quote: {$ref: "#/components/schemas/CatchUpQuote"}
        invite: {$ref: "#/components/schemas/CatchUpInvite"}
    CatchUpPerson:
      type: object
      description: A person on a Catch up item.
      required: [id, name, photo_url]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        name: {type: string, description: Empty when the user has none., examples: [Christelle]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    CatchUpPost:
      type: object
      description: The post a reply is on when it is not a proposal.
      required: [feed_item_id, kind, label, actor_name]
      properties:
        feed_item_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8060"]}
        kind: {type: string, examples: [trade]}
        label: {type: string, examples: [sale]}
        actor_name: {type: string, examples: [Logan]}
    CatchUpProposal:
      type: object
      description: >-
        The proposal facts a Catch up row and card draw. The amount and asset fields are null on a rule proposal. The
        outcome, your_choice and filled fields appear only on a result or a proposal the caller voted on.
      required:
        - id
        - kind
        - symbol
        - asset_name
        - asset_logo_url
        - usdc_micros
        - token_amount
        - proposer
        - created_at
        - expires_at
        - status
        - yes
        - no
        - voted
        - eligible
        - reply_count
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
        kind: {type: string, description: The proposal kind., examples: [buy]}
        symbol: {type: string, examples: [NVDAx]}
        asset_name: {type: string, examples: [NVIDIA]}
        asset_logo_url: {type: [string, "null"], examples: [null]}
        usdc_micros: {type: [integer, "null"], format: int64, description: "USDC a buy spends, in micros.", examples: [400000000]}
        token_amount: {type: [integer, "null"], format: int64, description: Token base units a sell spends., examples: [null]}
        proposer: {$ref: "#/components/schemas/CatchUpPerson"}
        created_at: {type: string, format: date-time, examples: ["2026-10-28T18:00:00Z"]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-28T22:00:00Z"]}
        status: {type: string, description: The proposal status., examples: [open]}
        yes: {type: integer, minimum: 0, examples: [4]}
        no: {type: integer, minimum: 0, examples: [1]}
        voted: {type: integer, minimum: 0, description: Ballots cast so far., examples: [5]}
        eligible: {type: integer, minimum: 0, description: Members who can vote., examples: [8]}
        reply_count: {type: integer, minimum: 0, examples: [6]}
        outcome:
          type: string
          description: How a result ended.
          enum: [filled, fill_failed, failed, expired]
          examples: [filled]
        your_choice:
          type: string
          description: The caller's ballot, when they voted.
          enum: [yes, no]
          examples: [yes]
        filled: {type: boolean, description: Whether the trade filled. Set on results only., examples: [true]}
    CatchUpQuote:
      type: object
      description: The text a list row quotes.
      required: [author_name, is_you, text]
      properties:
        author_name: {type: string, examples: [Christelle]}
        is_you: {type: boolean, examples: [false]}
        text: {type: string, examples: ["Still out: @Andres, Jordan?"]}
    DeviceEnvironment:
      type: string
      description: The APNs environment that issued the token.
      enum: [sandbox, production]
      examples: [production]
    DeviceRegistration:
      type: object
      description: A device token to register for the caller.
      required: [token, environment]
      examples:
        - token: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
          environment: production
      properties:
        token:
          type: string
          description: The APNs device token, 64 to 200 lowercase hex characters.
          examples: ["0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"]
        environment:
          $ref: "#/components/schemas/DeviceEnvironment"
    NotificationPreferences:
      type: object
      description: Whether each push category is on for the caller.
      required: [decision_requests, replies_and_mentions]
      examples:
        - decision_requests: false
          replies_and_mentions: true
      properties:
        decision_requests:
          type: boolean
          description: Proposals, trades and pauses in the caller's cabals.
        replies_and_mentions:
          type: boolean
          description: Replies to the caller's comments, chat mentions and chat thread replies.
