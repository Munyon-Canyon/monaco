  # api/spec/analytics.yaml
  /v1/admin/dashboards/governance:
    get:
      operationId: getGovernanceDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the governance dashboard.
      description: >-
        Returns proposal activity per day or week, read in a read-only transaction with a 5 second statement timeout.
        A bucket counts the proposal events recorded in it: created, passed, failed, expired and execution blocked.
        Buckets with no events are omitted. `median_seconds_to_pass` is the median time from creation to pass over the
        proposals that passed in the range, null when none did. `participation` has one row per cabal that opened a
        proposal in the range, with the votes cast out of the votes eligible. `open_proposals` counts the proposals
        open now. `to` is exclusive and the range cannot exceed 400 days.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The governance dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/GovernanceDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dashboards/money:
    get:
      operationId: getMoneyDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the money dashboard.
      description: >-
        Returns USDC moving through the platform per day or week, read from the ledger on the primary database
        in a read-only transaction with a 5 second statement timeout. A bucket holds the settled deposits, funds
        into cabals, cash-outs and withdrawals as a count and USDC micros, and the settled swap volume bought and
        sold. `series` holds the `onramp_status_changes` events per status, whose `completed` group is the card deposits.
        Buckets with no activity are omitted. `total_value_held_micros` is the latest value of every cabal pot
        plus the platform balance of every member wallet, and `as_of` is when the latest valuation run priced the pots,
        null before the first run. `to` is exclusive and the range cannot exceed 400 days. A longer range, a `to`
        not after `from` or an unknown bucket is invalid_input. A read over the timeout is dashboard_timeout.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The money dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/MoneyDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dashboards/safety:
    get:
      operationId: getSafetyDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the safety dashboard.
      description: >-
        Returns the safety signals, read in a read-only transaction with a 5 second statement timeout. `series` is
        long-format and time-bucketed, one row per bucket, metric and group with events in it: `cabals_paused`
        grouped by pause reason, `external_deposits_detected`, `external_deposits_bounced` and `admin_actions`
        grouped by action. Buckets with no events are omitted. `banned_users` and `banned_cabals` are the banned
        accounts now. `to` is exclusive and the range cannot exceed 400 days.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The safety dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/SafetyDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dashboards/social:
    get:
      operationId: getSocialDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the social dashboard.
      description: >-
        Returns the size and activity of the social graph, read in a read-only transaction with a 5 second statement
        timeout. `series` is long-format and time-bucketed, one row per bucket, metric and group with events in it:
        `users_created`, `follows_created` grouped by source, `follows_removed`, `comments_created` and
        `replies_created`. Buckets with no events are omitted. `cabals` is the cabal count and how many members the
        median, the 90th percentile and the largest cabal have. `user_states` counts users by auth state and account
        status, and `users_total` sums them, deleted accounts included. `to` is exclusive and the range cannot
        exceed 400 days.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The social dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/SocialDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  # api/spec/app.yaml
  /v1/app/config:
    get:
      operationId: getAppConfig
      tags: [app]
      security: []
      x-rate-limit: {ip: {rate: 60, per: 1m, burst: 60}}
      summary: Read the app's launch configuration.
      description: >-
        Public, called by the app on launch and after it returns to the foreground. `min_ios_build` is the
        lowest build number allowed to run, and 0 means no gate. A build below it shows an update screen
        that opens `store_url`.
      responses:
        "200":
          description: The minimum build number and where to get the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/cabal.yaml
  /v1/cabals:
    get:
      operationId: getCabals
      tags: [cabal]
      summary: Search public cabals.
      description: Returns non-banned cabals with members, optionally filtered by a case-insensitive name substring.
      parameters:
        - name: query
          in: query
          required: false
          description: An empty, whitespace-only, or case-insensitive cabal-name substring.
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          description: An opaque cursor returned by the previous page.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: The number of cabals to return, from 1 through 50. Defaults to 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: The matching cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalSearchPage"
              example: {items: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3, join_mode: open, is_member: false, my_access_request_status: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabal
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 10
          per: 1h
          burst: 10
      summary: Create a cabal and its treasury wallet.
      description: >-
        Opens an app-owned treasury wallet, then writes the cabal, its creator and that wallet.
        The creator can vote. An omitted slippage_bps is 100. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The name and rules of the new cabal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCabalRequest"
            example: {name: Kai, join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400}
      responses:
        "201":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}:
    get:
      operationId: getCabal
      tags: [cabal]
      summary: Read one cabal.
      description: Any signed-in user can read any cabal. me is null for a non-member.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The cabal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: null, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchCabal
      tags: [cabal]
      x-idempotent: true
      summary: Rename a cabal or change its slippage.
      description: >-
        Creator only. Every field is optional, and an omitted field keeps its value. Only name and slippage_bps
        change here. join_mode, voter_mode, voter_ids, threshold or proposal_expiry_seconds in the body returns 409
        RulesChangeByProposal, because those rules change by a passed rule proposal. A body that changes nothing
        returns the cabal unchanged. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCabalRequest"
            example: {name: Work pot, slippage_bps: 50}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Work pot, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 50, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests:
    get:
      operationId: getCabalAccessRequests
      tags: [cabal]
      summary: List the pending requests to join a cabal.
      description: Admins only. Returns pending requests, newest first, each with the member whose link it came through when known. Invites are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending requests.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalAccessRequest"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, via: {user_id: "01890a5d-ac96-774b-bcce-b302099a8057", handle: jordan, display_name: Jordan, photo_url: null}, created_at: "2026-10-02T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      summary: Ask to join a request cabal.
      description: >-
        Files a pending request that the creator approves or denies. An open cabal refuses with
        request_not_needed, so the app joins it instead. An optional via_code names the link the invitee
        came through; a code that names no current member is ignored. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: Optional. The code from the invite link the invitee opened.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabalAccessRequestBody"
            example: {via_code: jordan}
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}:
    delete:
      operationId: deleteCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      summary: Withdraw a pending request or invite.
      description: >-
        The requester withdraws their own request. The inviter or the creator withdraws an invite.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The request or invite, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: revoked}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}/decision:
    post:
      operationId: postCabalAccessDecision
      tags: [cabal]
      x-idempotent: true
      summary: Approve or deny a pending request or invite.
      description: >-
        The creator decides a request. The invitee accepts or declines an invite. Approving adds the
        member in the same transaction; the member can vote when the cabal's voter_mode is all.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The decision.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionRequest"
            example: {decision: approve}
      responses:
        "200":
          description: The request or invite after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: approved}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/invites:
    get:
      operationId: getCabalInvites
      tags: [cabal]
      summary: List the pending invites of a cabal.
      description: >-
        Members only. Returns invites that are pending and not yet past their expiry, oldest first.
        Requests to join are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalSentInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalInvite
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Invite a user to a cabal by handle.
      description: >-
        Only an admin of the cabal invites, whatever its join mode. The invite
        stays pending for 7 days, and the invitee accepts or declines it through the decision route.
        A user with a pending request or invite is refused with request_pending. A replay returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Who to invite.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
            example: {handle: kai}
      responses:
        "201":
          description: The pending invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: invite, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members:
    get:
      operationId: getCabalMembers
      tags: [cabal]
      summary: Page through a cabal's members.
      description: >-
        Returns one page of the cabal's members, each with the user card, vote standing, share, this month's record in
        this cabal and the crown. The default `role_share` order lists creator and admins, then voters, then non-voting
        members, each by `ownership_bps` descending, then join time, then user id; `joined` lists the oldest joiner first.
        Page with the `next_cursor` of the previous page until it is null. The cursor is keyed on the sort key of the
        last row, so a member who joins or leaves between pages never repeats or skips another row, and a share that
        changes between pages moves a member at most once. `totals` describe the whole cabal on every page.
        `GET /v1/cabals/{id}` keeps `members` only for builds that predate this route.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          required: false
          description: The number of members to return, from 1 through 200. Defaults to 50.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: order
          in: query
          required: false
          description: "`role_share` (the default) or `joined`. Send the same order with every cursor."
          schema: {type: string, enum: [role_share, joined], default: role_share}
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalMemberPage"
              example: {items: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null, role: creator, can_vote: true, joined_at: "2026-09-30T12:00:00Z", ownership_bps: 10000, month: {right: 0, resolved: 0, voted: 0, eligible: 0}, crown: false}], next_cursor: null, totals: {admins: 1, voters: 0, members: 0}}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalMember
      tags: [cabal]
      x-idempotent: true
      summary: Join an open cabal.
      description: >-
        Adds the caller as a member of an open cabal at once. The caller can vote when the cabal's voter_mode is all.
        A cabal whose join_mode is request refuses with join_needs_request, so the app files an access request instead.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its new member sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 2, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 2, members: [], me: {role: member, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members/me:
    delete:
      operationId: deleteCabalMemberMe
      tags: [cabal]
      x-idempotent: true
      summary: Leave a cabal.
      description: >-
        Removes the caller from the cabal, banned or not. A caller holding shares is refused with
        leave_holds_shares, so the app routes them to cash out first. The last member is refused with
        leave_last_member_pot_not_empty while the pot holds money, and the creator with
        leave_creator_with_members while other members remain. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller is no longer a member.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/picture:
    put:
      operationId: putCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Set a cabal's picture.
      description: >-
        Creator only. Stores one JPEG, PNG or WebP picture of at most 2 MB, checked by its bytes, and replaces the
        cabal's picture. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG or WebP image in the required picture field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [picture]
              properties:
                picture: {type: string, format: binary, examples: [cabal.png]}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: "https://example.supabase.co/storage/v1/object/public/avatars/cabals/01890a5d-ac96-774b-bcce-b302099a8058/01890a5d-ac96-774b-bcce-b302099a8059.png", status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Remove a cabal's picture.
      description: Creator only. Clears the cabal's picture. A cabal with no picture is returned unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/invite-codes/{code}:
    get:
      operationId: getCabalByCode
      tags: [cabal]
      summary: Look up a cabal by its invite code.
      description: "Retired. Always refuses with not_found: invite codes no longer exist."
      parameters:
        - name: code
          in: path
          required: true
          description: The cabal's invite code.
          schema: {type: string}
      responses:
        "200":
          description: The cabal the code opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPreview"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, join_mode: request, member_count: 3}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabal-invites:
    get:
      operationId: getMyCabalInvites
      tags: [cabal]
      summary: List the invites waiting on the caller.
      description: >-
        Returns the caller's pending invites that are not yet past their expiry, oldest first.
        Invites into a banned cabal are left out.
      responses:
        "200":
          description: The caller's pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", cabal: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabals:
    get:
      operationId: getMyCabals
      tags: [cabal]
      x-allow-restricted: true
      summary: List the caller's cabals.
      description: >-
        Returns every cabal the caller belongs to, in the caller's own order (see putMyCabalOrder). A cabal
        joined after the last reorder comes last, in join order. Each row carries the server-computed `unread_count` of the cabal's chat, capped at 100.
      responses:
        "200":
          description: The caller's cabals.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MyCabal"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, role: creator, can_vote: true, member_count: 3, joined_at: "2026-10-02T15:00:00Z", pending_request_count: 1, unread_count: 3}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabals/order:
    put:
      operationId: putMyCabalOrder
      tags: [cabal]
      x-idempotent: true
      summary: Save the order of the caller's cabals.
      description: >-
        Lists the caller's cabals first, in the given order. Ids that are not the caller's cabals are ignored,
        because a cabal may have been left on another device. Every cabal left out keeps its prior relative order
        after the listed ones. The result is one complete order that getMyCabals and getMyPortfolio follow. At most
        100 ids, with no duplicates, or the call is refused with invalid_input. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The cabal ids in the order the caller wants them.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMyCabalOrderRequest"
            example: {cabal_ids: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "204":
          description: The order is saved.
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/funding.yaml
  /v1/admin/cabals/{id}/pause:
    post:
      operationId: pauseAdminCabal
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Pause trading in one cabal.
      description: >-
        Writes an `ops` pause for the cabal and appends `cabal.paused` and `admin.action` in one transaction,
        then answers the cabal's pause state. A paused cabal gets no executions, no funding and no cash outs.
        A cabal that already has an open `ops` pause answers already_paused, and an unknown cabal answers
        cabal_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["019cc330-2222-7000-8000-000000000001"]}
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: investigating}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/cabals/{id}/resume:
    post:
      operationId: resumeAdminCabal
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Resume trading in one cabal.
      description: >-
        Resolves the cabal's open `ops` pause and appends `cabal.resumed` and `admin.action` in one transaction,
        then answers the cabal's pause state. It never clears an external-deposit pause: when one is still open
        the `ops` pause is resolved and audited, and the answer is cabal_still_paused. A cabal with no open
        `ops` pause answers no_ops_pause.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["019cc330-2222-7000-8000-000000000001"]}
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: resolved}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/pause:
    post:
      operationId: pauseAdminAll
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Pause trading in every cabal.
      description: >-
        Writes a global `ops` pause and appends `cabal.paused` and `admin.action` in one transaction, then
        answers the global pause state. An open global `ops` pause answers already_paused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: incident 7}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/queues/bounces:
    get:
      operationId: getBounceQueue
      tags: [funding]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List cabals waiting for a bounce.
      description: >-
        Lists the open pauses with reason `external_deposit`, oldest first: a direct transfer into a cabal
        treasury that has not been sent back yet. Each row names the paused cabal, which the cabal lookup
        resolves. A resume never clears one of these pauses.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 200.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
      responses:
        "200":
          description: The pending bounces, oldest first.
          content: {application/json: {schema: {$ref: "#/components/schemas/BounceQueue"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/resume:
    post:
      operationId: resumeAdminAll
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Resume trading in every cabal.
      description: >-
        Resolves the global `ops` pause and appends `cabal.resumed` and `admin.action` in one transaction, then
        answers the global pause state. It never clears a cabal's own pause. With no open global `ops` pause it
        answers no_ops_pause.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: resolved}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/balance:
    get:
      operationId: getMyBalance
      tags: [funding]
      summary: Read the caller's available platform balance.
      x-allow-restricted: true
      responses:
        "200":
          description: The current balance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
              example: {available_micros: "22500000", on_chain_micros: "25000000", in_flight_micros: "2500000", deposit_address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, as_of: "2026-10-03T15:00:00Z"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals:
    post:
      operationId: withdraw
      tags: [funding]
      x-idempotent: true
      x-allow-restricted: true
      x-rate-limit: {actor: {rate: 10, per: 1m, burst: 5}}
      summary: Send platform balance to a Solana address.
      description: >-
        Signs a USDC transfer from the caller's member wallet to `to_address`, stores its signature,
        then broadcasts it. The withdrawal confirms later. A replay with the same Idempotency-Key returns
        the first response and sends nothing new. A banned or suspended user can still withdraw. A caller is
        limited per minute, and may send to at most five new Solana addresses in 24 hours: past either limit
        the answer is rate_limited and nothing is signed. An address the caller has not received funds at, or an
        amount of 1,000 USDC or more, also needs the `Withdrawal-Authorization` header from
        `POST /v1/me/withdrawals/authorizations` for the same amount, network and address: without it the call is
        `step_up_required`, and with a different amount, network or address it is `step_up_mismatch`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WithdrawalAuthorizationId"
      requestBody:
        description: The amount and the destination address.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawRequest"}
            example: {amount_micros: "2000000", to_address: 9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P}
      responses:
        "202":
          description: The transfer is signed and sent. `status` is `submitted` until it confirms.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WithdrawAccepted"}
              example: {withdrawal_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals/authorizations:
    post:
      operationId: authorizeWithdrawal
      tags: [funding]
      x-idempotent: false
      x-allow-restricted: true
      summary: Confirm one exact withdrawal before sending it.
      description: >-
        Records a single-use confirmation for this amount, network and address, tied to the session that asks.
        Send its `authorization_id` in the `Withdrawal-Authorization` header of `POST /v1/me/withdrawals`. A withdrawal to an address the caller has not
        yet received funds at, or of 1,000 USDC or more, is `step_up_required` without one. The confirmation lasts
        five minutes and works once. Changing the amount, the network or the address after confirming is
        `step_up_mismatch`, and a confirmation from another session is `step_up_required`. The caller's access
        token must have been issued in the last two minutes, so a token copied earlier is `reauth_required`; the
        app refreshes the session first. Validates the request like `POST /v1/me/withdrawals` and moves nothing.
        A banned or suspended user can still confirm and withdraw.
      requestBody:
        description: The exact withdrawal to confirm.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawRequest"}
            example: {amount_micros: "2000000", to_address: 9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P}
      responses:
        "201":
          description: The confirmation, valid until `expires_at`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WithdrawalAuthorization"}
              example: {authorization_id: 01890a5d-ac96-774b-bcce-b302099a8059, expires_at: "2026-10-21T12:05:00Z"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals/preview:
    post:
      operationId: previewWithdrawal
      tags: [funding]
      x-idempotent: false
      x-allow-restricted: true
      summary: Show what a withdrawal would deliver.
      description: >-
        Answers the withdraw keypad before an amount is typed. The amount and the address are optional, and
        the response always carries the network's fee, the caller's available cash and the most they can send.
        The fee is reported, never invented: a Solana withdrawal has no fee (`on_top`, 0), and an EVM
        withdrawal is bridged from Solana at exact input, so its fee comes out of the amount (`included`) and is
        Privy's cut. With an amount it also carries `over_micros`, and `below_min` when the amount is under
        `min_micros`. Both are answered without a bridge quote. With an amount in range, an EVM network and a
        valid address, `receive_micros` is Privy's estimate after its fees and `expires_at` is when that quote
        ends. A Solana withdrawal receives the full amount. An address is validated only when one is given.
        Nothing is held or sent.
      requestBody:
        description: The withdrawal to preview. Today's full withdrawal body still works.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawPreviewRequest"}
            example: {amount_micros: "10000000", destination_kind: evm, network: base, to_address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed"}
      responses:
        "200":
          description: The fee, the most the caller can send and, with an amount, what arrives.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WithdrawalPreview"}
              example: {available_micros: "500000000", fee_micros: "7500", fee_known: true, fee_mode: included, max_amount_micros: "500000000", receive_micros: "9992500", over_micros: "0", below_min: false, min_micros: "1000000", arrival_seconds: 120, expires_at: "2026-10-11T10:30:00Z"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals/{id}:
    get:
      operationId: getMyWithdrawal
      tags: [funding]
      x-allow-restricted: true
      summary: Read one of the caller's withdrawals.
      description: Returns the withdrawal's status. Another user's withdrawal is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The withdrawal id from the create response.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The withdrawal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Withdrawal"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/onramp/sessions:
    post:
      operationId: createOnrampSession
      tags: [funding]
      x-idempotent: true
      summary: Start a card deposit.
      description: >-
        Creates an onramp session for the caller and returns the one-time fund page URL. The URL carries
        a single-use token that expires 10 minutes after creation and never the wallet address. The
        server stores only the token's SHA-256 and appends `onramp.status_changed` with `to: created`.
        A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: An optional amount to prefill on the fund page and the cabal the user came from.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnrampSessionRequest"
      responses:
        "201":
          description: The session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSessionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/exchange:
    post:
      operationId: exchangeOnrampToken
      tags: [funding]
      security: []
      x-idempotent: false
      x-cors: web
      x-rate-limit:
        ip:
          rate: 30
          per: 1m
          burst: 30
      summary: Exchange a fund page token for the deposit address.
      description: >-
        Called by the fund page with the token from its URL. Opens the session and returns the member
        wallet address, the suggested amount and the USDC mint. The token works once:
        a used or unknown token is onramp_link_invalid, and a token past its 10 minutes is
        onramp_link_expired.
      requestBody:
        description: The token from the fund page URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeOnrampTokenRequest"
      responses:
        "200":
          description: The session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampExchange"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/{id}:
    get:
      operationId: getOnrampSession
      tags: [funding]
      summary: Read one of the caller's card deposits.
      description: >-
        Returns the session's status for the app's "Purchase processing" state. Another user's
        session is not_found.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: reportOnrampStatus
      tags: [funding]
      x-idempotent: true
      x-cors: web
      summary: Report how the provider flow ended.
      description: >-
        Called by the fund page with the Privy access token from its own login as the bearer.
        Moves an opened session to the reported status, appends `onramp.status_changed` and sends
        the owner an `onramp_changed` hint on `/v1/stream`. Another user is forbidden, and any move
        the status machine does not allow, such as confirmed to cancelled, is onramp_invalid_transition.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The status the provider flow ended in.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportOnrampStatusRequest"
      responses:
        "200":
          description: The session after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/governance.yaml
  /v1/admin/cabals/{id}/proposals:
    get:
      operationId: getAdminCabalProposals
      tags: [governance]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first, with the same items and filters as the
        member list. `status` keeps proposals still taking ballots (`open`), those with a given status
        (`passed`, `executed`, `failed`), or every status but `open` (`closed`). No ballot or permission
        belongs to the caller, so `my_ballot` is null and `can_vote` is false. An unknown cabal answers
        cabal_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: status
          in: query
          required: false
          description: Which proposals to return.
          schema: {type: string, enum: [open, passed, executed, failed, closed, all], default: all, examples: [open]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20, examples: [20]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512, examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]}
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProposalList"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/proposals/{id}:
    get:
      operationId: getAdminProposal
      tags: [governance]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up one proposal.
      description: >-
        Returns the proposal with every member of its frozen voter set, their ballots and cast times, the
        statuses it went through from its `proposal.*` events, its latest linked trade, and the 20 newest
        admin actions on it. The proposer shows as an id and a handle only. An unknown proposal answers
        proposal_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the proposal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminProposal"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/proposals/{id}/void:
    post:
      operationId: voidAdminProposal
      tags: [governance]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Void a proposal.
      description: >-
        Moves an `open` proposal, or a `passed` one with no live transaction, to `voided` and appends
        `proposal.voided` and `admin.action` in one transaction. A proposal whose swap is `submitted`
        answers live_swap_exists, a proposal already closed answers proposal_closed, an unknown one answers
        proposal_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the
        same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the proposal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
      requestBody:
        description: Why the moderator voids the proposal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: spam proposal}
      responses:
        "200":
          description: The voided proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoidedProposal"}
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, status: voided, void_reason: spam proposal}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/proposals:
    get:
      operationId: getCabalProposals
      tags: [governance]
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first. Every cabal is public, so any
        signed-in user can read them. A non-member sees the same items with `my_ballot` null.
        `open` keeps proposals still taking ballots, `passed` and `executed` keep those statuses,
        `failed` keeps `failed`, `expired` and `execution_blocked`, and `closed` keeps every status but `open`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, passed, executed, failed, closed, all]
            default: all
            examples: [open]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a trade for the cabal to vote on.
      description: >-
        Checks that the caller is a member and is in the cabal's voter set (a non-voter gets
        `not_a_voter`), that the asset is in the catalog and Jupiter can route
        it, and that a buy fits the pot or a sell fits the cabal's holding. These checks are advisory:
        the trade engine repeats them at execution. The voter set is copied from the cabal and never
        changes after. The proposer casts no ballot of their own. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The trade to propose. A buy sets `usdc_micros`, and a sell sets `token_amount`.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeTradeRequest"
            example: {kind: buy, symbol: TSLAx, usdc_micros: 5000000, thesis: earnings}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/preview:
    get:
      operationId: getCabalProposalPreview
      tags: [governance]
      summary: Preview a trade before proposing it.
      description: >-
        Runs the checks a proposal runs and writes nothing. A trade the checks refuse still answers
        200, with the refusal in `advisory_code` and `advisory_message`, so the review screen can show
        it. Only members can preview.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: true
          description: Whether the trade buys or sells the token.
          schema:
            $ref: "#/components/schemas/ProposalKind"
        - name: symbol
          in: query
          required: true
          description: The token symbol from the catalog.
          schema: {type: string, minLength: 1, maxLength: 32, examples: [TSLAx]}
        - name: usdc_micros
          in: query
          required: false
          description: >-
            USDC a buy spends, in micros. A buy that leaves it out returns only the pot and the spendable
            cash.
          schema: {type: integer, format: int64, minimum: 1, examples: [5000000]}
        - name: token_amount
          in: query
          required: false
          description: >-
            Token base units a sell spends. For a sell pinned to an EVM chain these are that listing's
            token base units, as `token_amount` on the holding's listing reports them.
          schema: {type: integer, format: int64, minimum: 1, examples: [1000000]}
        - name: network
          in: query
          required: false
          description: >-
            The chain a trade is pinned to. A buy's quote is that chain's best listing, and a chain with no
            listing quoted sets `advisory_code` to invalid_network. A sell's quote is the sale of the
            cabal's holding on that chain, and a chain the cabal holds none on sets `advisory_code` to
            invalid_network. Absent means the best price on any chain for a buy, and the holding for a sell.
          schema:
            $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: The quote and the first check the trade fails, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradePreview"
              example: {quote_out_amount: 21000000, advisory_code: null, advisory_message: null, pot_value_micros: 100000000}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/{proposal_id}/price-comparison:
    get:
      operationId: getCabalProposalPriceComparison
      tags: [governance]
      x-allow-restricted: true
      summary: Compare venues for an open buy proposal now.
      description: >-
        Quotes the proposal's buy again across every venue and returns the result as of now, so a member
        voting later sees the current best route. One result per proposal is reused for 15 seconds. The
        comparison stored with the proposal does not change. When the venues cannot be compared,
        `price_comparison` is absent and `quote_out_amount` is the Solana quote. Only members can read it,
        and only for an open buy; a sell or a closed proposal answers not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: proposal_id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The comparison as of `quoted_at`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPriceComparison"
              example: {quote_out_amount: 40000000, quoted_at: "2026-10-10T12:00:00Z", price_comparison: {winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/rule-proposals:
    post:
      operationId: postCabalRuleProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a change to a cabal rule for the cabal to vote on.
      description: >-
        Checks that the caller is a member and is in the cabal's voter set (a non-voter gets
        `not_a_voter`). `from` is read from the cabal now and the voter set and threshold are copied from it,
        so a rule proposal is voted on and settled like a trade. A value the rule already has gets
        `rule_unchanged`. Removing the last admin, making a non-voter an admin and targeting the proposer
        get `invalid_input`. A second open proposal for the same rule, or for the same member's `voter` or
        `admin` rule, gets `rule_change_open`. A replay with the same Idempotency-Key returns the first
        response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The rule change to propose.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleChangeRequest"
            example: {change: {rule: show_sides, to: true}, thesis: Let everyone see who voted what.}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/market-facts:
    get:
      operationId: getMyMarketFacts
      tags: [governance]
      summary: Say what Monaco knows about each of the caller's watched stocks.
      description: >-
        Returns one entry per requested symbol, in request order. The fact is the first that matches: `vote_open`
        when an open proposal for the symbol sits in one of the caller's current cabals and the caller is in its
        frozen voter set, then `held` when the caller's cabals hold the stock, then `called` when a proposal for
        it passed (or was then executed) in the last 7 days in one of the caller's current cabals. A stock with
        none of these, or an unknown symbol, has a null fact.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols, 1 to 50, each at most 64 characters. More than 50 is `invalid_input`.
          schema: {type: string, minLength: 1, examples: ["NVDAx,AAPLx,METAx,MSFTx"]}
      responses:
        "200":
          description: One fact per requested symbol.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MarketFacts"}
              example: {facts: [{symbol: NVDAx, fact: {kind: vote_open, cabal_name: AC Capital, count: 1}}, {symbol: AAPLx, fact: {kind: held, units: "24.0000", cabal_count: 1}}, {symbol: METAx, fact: {kind: called, proposer_name: Christelle}}, {symbol: MSFTx, fact: null}]}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pending-votes:
    get:
      operationId: getMyPendingVotes
      tags: [governance]
      summary: List the open proposals waiting on the caller's ballot.
      description: >-
        Returns up to 50 open proposals, across every cabal, whose frozen voter set holds the caller
        and that have no ballot from the caller yet, soonest to expire first. Each row carries what its card
        draws: the amount, the asset's name and logo, the proposer, the tally, the ballots cast and the replies.
      responses:
        "200":
          description: The proposals waiting on the caller.
          content:
            application/json:
              schema: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/PendingVote"}}
              example: [{proposal_id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, kind: buy, rule_change: null, symbol: NVDAx, usdc_micros: 400000000, token_amount: null, asset_name: NVIDIA, asset_logo_url: null, proposer: {user_id: 01890a5d-ac96-774b-bcce-b302099a8059, handle: mia, display_name: Mia, photo_url: null}, tally: {"yes": 4, "no": 1, voters: 8, needed: 5}, voted_count: 5, reply_count: 6, created_at: "2026-10-04T09:00:00Z", expires_at: "2026-10-04T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/proposals:
    get:
      operationId: getMyProposals
      tags: [governance]
      summary: List the caller's proposals across every cabal.
      description: >-
        Returns one page of the proposals whose frozen voter set holds the caller, across every cabal,
        newest first. `closed` keeps every status but `open` and is the default, `open` keeps proposals
        still taking ballots, and `all` keeps both.
      parameters:
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, closed, all]
            default: closed
            examples: [closed]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the caller's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
              example: {proposals: [{id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: executed, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 2, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", can_vote: false, reply_count: 0}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}:
    get:
      operationId: getProposal
      tags: [governance]
      summary: Read one proposal.
      description: >-
        Returns the proposal as the list shows it, plus every member of its frozen voter set with
        their name, photo and whether they voted, whether the caller can vote on it or withdraw it,
        and the latest trade linked to it. Vote counts are always live, but which way each member
        voted is private: every voter's `choice` and `cast_at` are null except the caller's own,
        until the proposal closes in a cabal whose "Show who voted what" rule was on when it opened
        (`sides_visible`). A non-member sees the same proposal with `can_vote` and `can_withdraw` false.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, proposer: {id: 01890a5d-ac96-774b-bcce-b302099a8059, display_name: Mia, photo_url: null}, proposer_return_1m_bps: 820, proposer_return_private: false, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: open, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, choice: "yes", cast_at: "2026-10-03T16:00:00Z", display_name: Mia, photo_url: null}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: false, choice: null, cast_at: null, display_name: Kai, photo_url: null}], sides_visible: false, can_vote: true, can_withdraw: true, swap: null, stats: {treasury_share_bps: 250, closes_at: "2026-10-04T15:00:00Z", closed_at: null, price_micros: 220000000, shares_atomics: 11363636, shares_exact: false, token_decimals: 8, since_bps: null}, passed_price_micros: null, my_vote: {order: 1, of: 2, yes_order: 1, no_order: 0, decided: false}, reply_count: 6, reminder_set: false}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposal
      tags: [governance]
      x-idempotent: true
      summary: Withdraw the caller's proposal.
      description: >-
        Moves the caller's open proposal to `withdrawn` and appends `proposal.withdrawn`. Only the
        proposer can withdraw, and only before any other member has voted; the proposer's own ballot
        does not count. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The withdrawn proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, proposer: {id: 01890a5d-ac96-774b-bcce-b302099a8059, display_name: Mia, photo_url: null}, proposer_return_1m_bps: 820, proposer_return_private: false, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: withdrawn, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, choice: "yes", cast_at: "2026-10-03T16:00:00Z", display_name: Mia, photo_url: null}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: false, choice: null, cast_at: null, display_name: Kai, photo_url: null}], sides_visible: false, can_vote: false, can_withdraw: false, swap: null, stats: {treasury_share_bps: 250, closes_at: "2026-10-04T15:00:00Z", closed_at: "2026-10-03T16:30:00Z", price_micros: 220000000, shares_atomics: 11363636, shares_exact: false, token_decimals: 8, since_bps: null}, passed_price_micros: null, my_vote: {order: 1, of: 2, yes_order: 1, no_order: 0, decided: false}, reply_count: 0, reminder_set: false}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/reminder:
    put:
      operationId: putProposalReminder
      tags: [governance]
      x-idempotent: true
      summary: Ask to be reminded shortly before an open proposal closes.
      description: >-
        Stores the caller's request for a one-shot nudge and returns when it falls due: one hour before
        `expires_at`, or now when less than an hour is left. A second call moves nothing but resets a sent
        reminder. A caller who has already voted gets `reminder_set: false` and no row stored. A proposal that is
        no longer open answers proposal_closed, and a caller outside the proposal's frozen voter set answers
        not_a_voter. Voting deletes the reminder. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The reminder is stored, or the caller had already voted and nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalReminder"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposalReminder
      tags: [governance]
      x-idempotent: true
      summary: Drop the caller's reminder for a proposal.
      description: >-
        Deletes the caller's own reminder. It is a self-cleanup that never refuses for the proposal's state or the
        caller's membership: a closed proposal, a non-voter and a missing reminder all answer 200 with
        `reminder_set: false`. Only an unknown proposal answers proposal_not_found. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The caller has no reminder for the proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalReminder"
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/votes:
    get:
      operationId: getProposalVotes
      tags: [governance]
      summary: Page through a proposal's voters and their ballots.
      description: >-
        Returns one page of the proposal's frozen voter set, ordered by user id, each with the user card and
        whether they voted. A voter's side is private: `choice` and `cast_at` are set only on the caller's own row. Page with the `next_cursor` of the
        previous page until it is null. A non-member reads the same page as a member.
        `GET /v1/proposals/{id}` keeps `voters` only for builds that predate this route.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          required: false
          description: The number of voters to return, from 1 through 200. Defaults to 50.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: One page of voters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalVotePage"
              example: {items: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, handle: mia, display_name: Mia, photo_url: null, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: true, handle: kai, display_name: Kai, photo_url: null, choice: null, cast_at: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Cast or change the caller's ballot on an open proposal.
      description: >-
        Stores the caller's ballot and tallies it against the proposal's frozen voter set and the
        cabal's threshold rule. A deciding ballot moves the proposal to `passed` or `failed` in the
        same transaction. Execution of a passed proposal is asynchronous, so the client sees
        `executed` or `execution_blocked` later. A replay with the same Idempotency-Key returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's choice.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVoteRequest"
      responses:
        "200":
          description: The ballot was stored. `status` is the proposal's status after the tally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Undo the caller's ballot on an open proposal.
      description: >-
        Removes the caller's own ballot and returns the tally without it. A ballot can be undone for 15
        seconds after it was first cast (`undo_until` on the vote result), and only while it has never changed
        side. The ballot that settled the proposal cannot be undone: the proposal has left `open`, so the call
        answers proposal_closed. A caller outside the proposal's frozen voter set answers not_a_voter, a caller
        with no ballot answers vote_not_found, and a ballot past the window or changed since the first cast
        answers undo_expired. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The ballot was removed. `tally` no longer counts it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetractVoteResult"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/identity.yaml
  /v1/admin/handles/{handle}/reassign:
    post:
      operationId: reassignHandle
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Reassign a handle.
      description: >-
        Moves the handle to a verified owner in one transaction, bypassing the 30-day change limit. The current holder, if any, loses the handle and picks a new one. The target's previous handle is freed. Appends `user.profile_updated` for each user changed and one `admin.action`. A target who already holds the handle is left as is. A deleted or unknown target answers user_deleted or user_not_found, a malformed handle answers handle_invalid, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: handle
          in: path
          required: true
          description: The handle to move.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [kai_one]}
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignHandleBody"
            example: {to_user_id: 01890a5d-ac96-774b-bcce-b302099a8058, reason: verified owner}
      responses:
        "204": {description: The handle is reassigned.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}/ban:
    post:
      operationId: banUser
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Ban a user.
      description: >-
        Moves an `active` or `suspended` account to `banned` and appends `user.account_status_changed` and `admin.action` in one transaction. A banned user can still withdraw and cash out. A user already banned answers already_banned, a deleted one answers user_deleted, an unknown one answers user_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: fraud}
      responses:
        "204": {description: The user is banned.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}/handle/revoke:
    post:
      operationId: revokeHandle
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Revoke a handle.
      description: >-
        Sets the user's handle to null and appends `user.profile_updated` and `admin.action` in one transaction. The freed handle can be claimed again, and the app sends the user to the handle screen on next launch. A user with no handle is left as is. A deleted user answers user_deleted, an unknown one answers user_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: impersonation}
      responses:
        "204": {description: The handle is revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}/unban:
    post:
      operationId: unbanUser
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Lift a ban.
      description: >-
        Moves a `banned` account back to `active` and appends `user.account_status_changed` and `admin.action` in one transaction. A user who is not banned answers not_banned, a deleted one answers user_deleted, and an unknown one answers user_not_found. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: appeal upheld}
      responses:
        "204": {description: The ban is lifted.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/auth/session:
    post:
      operationId: postAuthSession
      tags: [identity]
      security: []
      x-idempotent: false
      x-rate-limit:
        ip:
          rate: 60
          per: 1m
          burst: 60
      summary: Open a session from a Privy access token.
      description: >-
        Verifies the Privy access token in the Authorization header, finds or creates the user by
        their Privy id, reuses the user's one member wallet and returns the account. The first call
        for a Privy user creates the account and appends `user.created`. Calling it again changes
        nothing, so it takes no Idempotency-Key. It also brings the account back in line with the
        phone and X accounts linked in Privy. Sign-in is by phone number or email through Privy; a
        Privy user with neither is login_method_not_allowed, and a deleted account is account_deleted.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: >-
            The Privy access token as `Bearer <token>`. The route is public because no account exists
            on the first call, so the server verifies this header itself and answers unauthorized when
            it is missing or invalid.
          schema:
            type: string
            examples: ["Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaWQ6cHJpdnk6cWEtMSJ9.c2lnbmF0dXJl"]
      responses:
        "200":
          description: The caller's account, with its `auth_state`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dev/me/x-link:
    post:
      operationId: postDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Link a fake X account to a dev user.
      description: >-
        Outside production only. Stores a fake X account for a caller whose Privy email is
        `dev-<suffix>@example.com`, so `POST /v1/me/onboarding/socials` and the next session link it as
        if Privy reported it. The X user id is `dev:<suffix>`, and the username defaults to
        `dev_x_<suffix>`. Calling it again replaces the stored username. Any other caller, and every
        caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fake X username. Omit it for `dev_x_<suffix>`.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevXLink"
            example:
              username: qa_x
      responses:
        "204":
          description: The fake X account is stored for the caller.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Remove a dev user's fake X account.
      description: >-
        Outside production only. Deletes the caller's fake X account, so the next session unlinks X as a
        real Privy unlink does. A caller with no fake X account also gets 204. A caller whose Privy email
        is not `dev-<suffix>@example.com`, and every caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller has no fake X account.
        default:
          $ref: "#/components/responses/Problem"
  /v1/handles/{handle}/availability:
    get:
      operationId: getHandleAvailability
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Check whether the caller can claim a handle.
      description: >-
        Compares the handle with the reserved list, the profanity list, the referral-code shape,
        other users' X usernames and the caller's own handle. `available` is false with a `reason`
        of `invalid`, `reserved`, `taken` or `too_soon`. The caller's current handle is available.
        Profanity and code shape are reported as `reserved`, and another user's X username as
        `taken`.
      parameters:
        - name: handle
          in: path
          required: true
          description: The handle to check, before it is stored. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [KaiCenat]
      responses:
        "200":
          description: Whether the handle is available to the caller, and why not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      x-allow-restricted: true
      tags: [identity]
      summary: Read the signed-in user's account.
      description: >-
        Returns the caller's own `Me`: handle, display name, `auth_state`, `account_status` and the
        member wallet address. A suspended or banned user gets it too, so the app can show the notice
        screen. A deleted account is user_not_found.
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchMe
      x-idempotent: true
      tags: [identity]
      summary: Update the signed-in user's profile.
      description: Replaces the caller's normalized display name; an unchanged name is a no-op.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The display name to normalize and save for the caller.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProfileRequest"}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteMe
      x-idempotent: true
      x-allow-restricted: true
      tags: [identity]
      summary: Delete the signed-in user's account.
      description: >-
        Deletes the caller's account once nothing is left in it. A stake in any cabal is
        account_has_positions and any platform balance is account_has_balance; cash out and withdraw
        first. Deletion scrubs the caller's personal fields and keeps the handle, so no one can claim it.
        A suspended or banned user may delete too. Every later request with the same token is
        account_deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The account is deleted.
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/deposit-addresses:
    get:
      operationId: getMyDepositAddresses
      tags: [identity]
      x-allow-restricted: true
      summary: List the addresses the caller can deposit USDC to, one per network.
      description: >-
        Returns the caller's Solana member wallet and one EVM address that serves Base, Arbitrum and
        Ethereum. USDC sent to the EVM address is forwarded to the Solana member wallet and shows as
        `arriving_micros` on the balance until it lands. The bridge keeps a fee from each EVM deposit, which
        the member pays: the deposit is credited net of it. Each EVM item carries `estimated_fee_micros`,
        the fee the last completed deposit on that network paid, when one exists.
      responses:
        "200":
          description: The caller's deposit addresses.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DepositAddresses"}
              example: {addresses: [{network: solana, address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, asset: USDC}, {network: base, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC, estimated_fee_micros: "163867"}, {network: arbitrum, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC}, {network: ethereum, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC}]}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/handle:
    put:
      operationId: putMeHandle
      tags: [identity]
      x-idempotent: true
      summary: Set the caller's handle.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's new handle.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetHandle"
            example:
              handle: kai_one
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/phone:
    post:
      operationId: postOnboardingPhone
      tags: [identity]
      x-idempotent: true
      summary: Store the phone the caller linked in Privy.
      description: >-
        Reads the verified phone from the caller's Privy user, never from the request, stores it and
        advances `auth_state`. A caller with no handle gets handle_required, and a caller with no phone
        linked in Privy gets phone_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/skip:
    post:
      operationId: postOnboardingSkip
      tags: [identity]
      x-idempotent: true
      summary: Skip an onboarding step.
      description: >-
        Skipping `phone` moves a CREATED caller to AWAITING_PHONE. Skipping `socials` changes no state,
        and the app moves on. A skip never clears a stored phone or X account. A caller with no handle
        gets handle_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The step to skip.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipOnboardingStep"
            example:
              step: phone
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/socials:
    post:
      operationId: postOnboardingSocials
      tags: [identity]
      x-idempotent: true
      summary: Store the X account the caller linked in Privy.
      description: >-
        Reads the X user id and username from the caller's Privy user, never from the request, stores
        them and advances `auth_state`. A caller with no handle gets handle_required, and a caller with
        no X account linked in Privy gets x_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/profile-photo:
    post:
      operationId: postProfilePhoto
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      tags: [identity]
      summary: Upload a profile photo.
      description: Stores a JPEG, PNG, or WebP profile photo for the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG, or WebP image in the required photo field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary, examples: [avatar.png]}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/sessions/revoke:
    post:
      operationId: revokeSessions
      tags: [identity]
      x-idempotent: true
      x-allow-restricted: true
      summary: End the caller's session, or every session.
      description: >-
        Makes the server refuse tokens that were issued for the ended session. `this_session` ends the session
        of the token in the Authorization header, so a copy of that token is unauthorized from then on.
        `all_sessions` ends every session the caller has now, on every device, and is the emergency control
        after a token is lost or stolen. Neither depends on the account's standing, so a banned or suspended user
        can end a session and still withdraw. Calling it again changes nothing. The app calls it on sign-out,
        before it asks Privy to log out.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Which sessions to end.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionsRequest"
            example: {scope: this_session}
      responses:
        "204":
          description: The sessions are ended.
        default:
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: searchUsers
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}}
      summary: Search people by handle or display name.
      parameters:
        - name: query
          in: query
          required: true
          description: A handle prefix or display-name substring to find.
          schema: {type: string, minLength: 1, maxLength: 50}
      responses:
        "200":
          description: Matching people.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSearchResult"}
              example:
                users:
                  - user_id: 01890a5d-ac96-774b-bcce-b302099a8058
                    handle: maya
                    display_name: Maya Angelou
                    photo_url: https://img.example/maya.png
                    followed_by_me: false
        default: {$ref: "#/components/responses/Problem"}
  /v1/users/{id}:
    get:
      operationId: getUser
      tags: [identity]
      summary: Read a user's public profile.
      description: >-
        Returns the user's handle, display name, photo and bio with the date they joined, the number of
        cabals they belong to today, and their follower and following counts, and whether the caller
        follows and blocks them. It also returns their one-month return and P&L from the 1M people board as
        of the last valuation run. Both are null when the user hides performance, is not ranked, or the
        caller blocks them, and a ranked row with no return gives a null return and still sets the P&L.
        return_private is true only when the user chose to hide it, and the caller still gets their own
        return and P&L on their own profile. standing is the user's right-call standing for the current UTC
        month, crown is true at rank 1, and cabals_in_common counts the cabals the caller and the user
        share. Hiding performance does not hide the standing. The counts are of live follows and include members who were banned or
        deleted after following. blocked_by_me says nothing about whether they block the caller. An
        unknown, banned or deleted user is user_not_found.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user's public profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProfile"}
              example:
                id: 01890a5d-ac96-774b-bcce-b302099a8058
                handle: maya
                display_name: Maya Angelou
                photo_url: https://img.example/maya.png
                bio: "Poet.\nSan Francisco"
                created_at: "2026-09-30T12:00:00Z"
                cabal_count: 3
                follower_count: 12
                following_count: 7
                followed_by_me: true
                blocked_by_me: false
                return_1m_bps: 820
                pnl_1m_micros: 41250000
                return_period: 1M
                return_private: false
                standing: {period: month, period_start: "2026-10-01", rate_bps: 7800, right: 7, resolved: 9, rank: 8, ranked_count: 24, more_to_rank: 0}
                crown: false
                cabals_in_common: 2
        default: {$ref: "#/components/responses/Problem"}
  # api/spec/market.yaml
  /v1/assets:
    get:
      operationId: getAssets
      tags: [market]
      summary: List tradable assets.
      description: >-
        Returns the tradable catalog, one page at a time. `q` matches the start of a symbol or any
        part of a display name, ignoring case. `popular` orders by the curated rank. `pre_ipo`
        keeps only pre-IPO tokens. `movers` orders priced, tradable stocks by the size of today's
        move, largest first; it never lists Pre-IPO. `in_cabals` orders tradable assets, Pre-IPO
        included, by how many active cabals hold them, most first, and carries `cabal_count`; an
        asset held by fewer than three active cabals has no count, and when fewer than `limit`
        assets qualify the list is completed from `popular` without a count. It defaults to 5
        rows, has no pages and takes no `cursor`. A price the hold rule has not accepted is null, never zero.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive symbol prefix or display-name search. Absent lists the filter.
          schema:
            type: string
            maxLength: 80
            examples: [apple]
        - name: filter
          in: query
          required: false
          description: Which tradable assets to return, and how to order them.
          schema:
            type: string
            enum: [all, popular, pre_ipo, movers, in_cabals]
            default: all
            examples: [popular]
        - name: sort
          in: query
          required: false
          description: "Order of `filter=all`: `symbol` (default), `name` A to Z by display name, `price` highest first. Other filters have their own order."
          schema:
            type: string
            enum: [symbol, name, price]
            examples: [name]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["c0FBUEx4ADAxOTIwMDAwLTAwMDAtNzAwMC04MDAwLTAwMDAwMDAwMDAwMQ"]
      responses:
        "200":
          description: One page of tradable assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}:
    get:
      operationId: getAsset
      tags: [market]
      summary: Read one asset.
      description: >-
        Returns one known asset, tradable or not, with the held price and the other listings of the
        same company. An unknown symbol is `asset_not_found`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [AAPLx]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/best-chain:
    get:
      operationId: getAssetBestChain
      tags: [market]
      summary: Read the best chain to buy one asset on.
      description: >-
        Quotes a $1 buy of the asset on every enabled listing and returns the winner with every chain's
        figures. The answer is shared by every member and kept per symbol: a figure under 20 seconds old
        is served as is, one under 60 seconds old is served while a refresh runs, and an older one is
        refreshed before the answer, for at most about a second: when the refresh is slower or fails, the
        last good answer under an hour old is returned with `stale` true. The figure is for display and
        for choosing the chain to pin a preview to; a trade quotes again when it runs. An unknown symbol is `asset_not_found`, one that
        cannot be bought is `asset_untradable`, and no chain to quote is `no_route` or
        `quote_unavailable`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
      responses:
        "200":
          description: The best chain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetBestChain"}
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/chart:
    get:
      operationId: getAssetChart
      tags: [market]
      summary: Read one asset's chart.
      description: >-
        Buckets the asset's stored prices for the requested range. A held spike is left out of the
        buckets. An unknown symbol is `asset_not_found`. `ALL` starts at the first stored sample.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
        - name: range
          in: query
          required: true
          description: "The preset: the default interval and the first window."
          schema: {type: string, enum: [1H, 1D, 1W, 1M, 3M, 6M, 1Y, ALL], examples: [1D]}
        - name: interval
          in: query
          required: false
          description: >-
            The bar width. Absent means the range default, `1H` 1m, `1D` 5m, `1W`/`1M`/`3M` 1h, `6M`/`1Y`/`ALL` 1d.
            Allowed per range, `1H` 1m 5m; `1D` and `1W` 5m 15m 30m 1h 4h 1d; `1M` 15m 30m 1h 4h 1d;
            `3M` 30m 1h 4h 1d 1w; `6M` 1h 4h 1d 1w; `1Y` and `ALL` 4h 1d 1w. Weekly bars start on Monday 00:00 UTC.
            Any other pair is `invalid_input`.
          schema: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w], examples: [15m]}
        - name: before
          in: query
          required: false
          description: >-
            Bars that start before this instant, aligned down to the interval. The read then reaches back
            to the asset's first sample, not just the range.
          schema: {type: string, format: date-time, examples: ["2026-03-04T14:55:00Z"]}
        - name: limit
          in: query
          required: false
          description: >-
            The most bars one response returns, the newest ones, in time order. Without `before` and
            without `limit` the response holds the whole preset window, uncapped. With `before` and
            without `limit` it holds at most 500 bars. An explicit `limit` always applies.
          schema: {type: integer, minimum: 1, maximum: 1000, examples: [500]}
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetChart"}
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/notify.yaml
  /v1/devices:
    post:
      operationId: postDevice
      tags: [notify]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 30
          per: 1m
          burst: 30
      summary: Register the caller's APNs device token.
      description: >-
        Saves the token for the caller and marks it active. Registering a token again bumps its
        last-seen time and clears a disabled mark. A token another user registered moves to the
        caller, so one device belongs to one account. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The device token and the APNs environment it was issued for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "204":
          description: The token is registered to the caller.
        default:
          $ref: "#/components/responses/Problem"
  /v1/devices/{token}:
    delete:
      operationId: deleteDevice
      tags: [notify]
      x-idempotent: true
      summary: Remove one of the caller's device tokens.
      description: >-
        Deletes the token when it belongs to the caller. A token that is unknown or belongs to
        another user also answers 204, so the route reveals nothing about other users' devices.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: token
          in: path
          required: true
          description: The APNs device token to remove, as registered with POST /v1/devices.
          schema:
            type: string
            examples: ["0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"]
      responses:
        "204":
          description: The caller no longer has this token registered.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/catch-up:
    get:
      operationId: getMyCatchUp
      tags: [notify]
      summary: Read everything the Catch up screens draw.
      description: >-
        Returns the caller's active Catch up items in five sections and the count behind the bell badge. Waiting is
        the caller's open proposals with no ballot yet, soonest close first. Replies holds replies and mentions of
        the last 30 days, newest first. Invites holds pending cabal invites, newest first. Results holds proposal
        results of the last 30 days, newest first. Cleared holds what the caller cleared since the given time, drawn
        from the item as it was when it was cleared. The caller's cabals come back even when every section is empty.
        A deleted account is unauthorized.
      parameters:
        - name: since
          in: query
          required: false
          description: Start of the caller's local day, which bounds the Cleared section. Defaults to 24 hours ago.
          schema:
            type: string
            format: date-time
            examples: ["2026-10-28T00:00:00-04:00"]
      responses:
        "200":
          description: The caller's Catch up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatchUp"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/catch-up/count:
    get:
      operationId: getMyCatchUpCount
      tags: [notify]
      summary: Read the number of active Catch up items.
      description: >-
        Returns how many items are active in the caller's Catch up, which is the number on Home's bell. A deleted
        account is unauthorized.
      responses:
        "200":
          description: The active count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatchUpCount"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/catch-up/items/{key}/clear:
    post:
      operationId: clearCatchUpItem
      tags: [notify]
      x-idempotent: true
      summary: Clear one Catch up item.
      description: >-
        Moves the item to Cleared with the reason cleared and stores the item as it is now. A newer source row reopens it. An item that is not active in the caller's Catch up, or a key that is not the caller's, is not_found.
        A replay with the same Idempotency-Key answers 204 and writes once. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CatchUpItemKey"
      responses:
        "204":
          description: The item is cleared.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/catch-up/items/{key}/keep:
    post:
      operationId: keepCatchUpItem
      tags: [notify]
      x-idempotent: true
      summary: Keep one Catch up item.
      description: >-
        Marks the item read and keeps it active, so clearing elsewhere does not remove it. An item that is not active in the caller's Catch up, or a key that is not the caller's, is not_found.
        A replay with the same Idempotency-Key answers 204 and writes once. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CatchUpItemKey"
      responses:
        "204":
          description: The item is kept.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/catch-up/items/{key}/read:
    post:
      operationId: readCatchUpItem
      tags: [notify]
      x-idempotent: true
      summary: Mark one Catch up item read.
      description: >-
        Sets the item read now, so it stops showing unread until a newer source row arrives. An item that is not active in the caller's Catch up, or a key that is not the caller's, is not_found.
        A replay with the same Idempotency-Key answers 204 and writes once. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CatchUpItemKey"
      responses:
        "204":
          description: The item is read.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [notify]
      summary: Read the caller's notification preferences.
      description: >-
        Returns whether each push category is on. A category the caller never set is on. Kinds
        outside both categories (deposits, follows, nudges, access requests) are always on. A
        deleted account is unauthorized.
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putNotificationPreferences
      tags: [notify]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 30
          per: 1m
          burst: 30
      summary: Replace the caller's notification preferences.
      description: >-
        Stores both categories at once and returns what was stored. A body missing either field or
        carrying another field is invalid input. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Whether each push category is on.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/platform.yaml
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Report that the API process is serving.
      description: Returns ok while the process accepts requests. It checks no dependency.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/stream:
    get:
      operationId: getStream
      x-allow-restricted: true
      tags: [stream]
      summary: Stream re-fetch hints for the caller.
      description: >-
        Opens a server-sent event stream. Each `hint` event names a key the caller may read
        (`user:<id>`, `cabal:<id>` or `global`) and what changed; the app re-fetches that screen
        through its normal GET. Hints are droppable, so a missed hint costs one re-fetch. A comment
        line arrives every 15 seconds as a heartbeat. A reconnect that sends Last-Event-ID first
        gets one `resync` event, telling the app to re-fetch everything it shows.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the app received before it reconnected.
          schema:
            type: string
            examples: ["42"]
      responses:
        "200":
          description: >-
            The stream. `event: hint` carries `data: {"key":"cabal:<id>","what":"updated"}` and an
            `id`. `event: resync` carries `data: {}`.
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "id: 1\nevent: hint\ndata: {\"key\":\"global\",\"what\":\"feed\"}\n\n"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/ranking.yaml
  /v1/cabals/{id}/leaderboard:
    get:
      operationId: getCabalLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read a cabal's members leaderboard.
      description: >-
        Returns one page of the cabal's members ranked by return, best first, from the latest
        finished run, and the caller's own row in `me` when the caller is on the board. Members with
        no stake rank after the ranked ones with a null `return_bps`. Any signed-in user may read it.
        An unknown cabal is cabal_not_found. An unknown range, a limit outside 1 to 50 or a cursor the
        server did not write is invalid_input.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/value-history:
    get:
      operationId: getCabalValueHistory
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read a cabal's value history.
      description: >-
        Returns the cabal's pot value, NAV per share and P&L over the range, one point per bucket,
        oldest first. P&L is the pot value minus the net contributed at the same snapshot, so a fund
        or a cash out is not a gain or a loss. A bucket with no snapshot at or before it is left out.
        Before the first run `prices_as_of` is null and `points` is empty. Any signed-in user may
        read it. An unknown cabal is cabal_not_found and an unknown range is invalid_input.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - $ref: "#/components/parameters/ValueHistoryRange"
      responses:
        "200":
          description: The cabal's value history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalValueHistory"
        default:
          $ref: "#/components/responses/Problem"
  /v1/leaderboards/cabals:
    get:
      operationId: getCabalsLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the cabals leaderboard.
      description: >-
        Returns one page of cabals ranked by return, best first, from the latest finished run. Before
        the first run `run_id` is null and `rows` is empty. A range with no rows yet also returns an
        empty page. An unknown range, sort or membership, a min_members outside 0 to 10000, a limit
        outside 1 to 50 or a cursor the server did not write is invalid_input. `me` is always null on
        this board. With `sort` other than `return_pct`, or with `membership` or `min_members` set,
        the board holds the cabals that pass the filters in that order, and `rank`, the cursor and
        `me` use the position in that board. Ties break by return rank.
      parameters:
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
        - $ref: "#/components/parameters/LeaderboardSort"
        - $ref: "#/components/parameters/LeaderboardMembership"
        - $ref: "#/components/parameters/LeaderboardMinMembers"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/leaderboards/calls:
    get:
      operationId: getCallLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read a whole right-call leaderboard screen.
      description: >-
        Returns everything one Leaderboard C screen draws for a board and a period, from the latest
        call-board run: the period, the top three, the caller's row with the row above and the row below
        it, the gap line, the climb bar, the not-ranked-yet card, the rows around the caller and the not
        ranked yet list. People and Friends rank people on right calls, and Cabals ranks cabals. `me` is
        the caller on People and Friends, and the caller's best-ranked cabal on Cabals. It is null when
        the caller is not ranked, and then `above`, `below` and `gap` are null too. `gap` is also null
        when `me` is the only ranked row. `around.rows` never repeats the top three on People and
        Friends, and on Cabals it starts at the caller's best cabal even on the podium. A cursor from an
        earlier run is cursor_stale; with a cursor only `around` holds rows and the other parts are empty.
        An unknown board, period or filter, `filter=friends` with `board=cabals`, or a cursor the server
        did not write is invalid_input.
      parameters:
        - name: board
          in: query
          required: false
          description: "`people` ranks people and `cabals` ranks cabals. Defaults to `people`."
          schema: {type: string, enum: [people, cabals], default: people, examples: [people]}
        - name: period
          in: query
          required: false
          description: The period. Defaults to `month`.
          schema: {type: string, enum: [week, month, all], default: month, examples: [month]}
        - $ref: "#/components/parameters/LeaderboardFilter"
        - name: cursor
          in: query
          required: false
          description: The `around.after_cursor` from the previous response. Absent reads the whole screen.
          schema: {type: string, maxLength: 128, examples: [eyJydW4iOiIwMTg5MGE1ZCIsInJhbmsiOjEyfQ]}
      responses:
        "200":
          description: The screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallBoard"
        default:
          $ref: "#/components/responses/Problem"
  /v1/leaderboards/people:
    get:
      operationId: getPeopleLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the people leaderboard.
      description: >-
        Returns one page of people ranked by return, best first, from the latest finished run, and
        the caller's own row in `me` whatever page is read. `me` is null when the caller has no
        ranked row. Before the first run `run_id` is null and `rows` is empty. An unknown range, a
        limit outside 1 to 50, a cursor the server did not write, a sort other than `return_pct`,
        `pnl` and `name` or a filter other than `all` and `friends` is invalid_input. With `sort`
        other than `return_pct`, `rank`, the cursor and `me` use the position in that order, and ties
        break by return rank. With `filter=friends` the board holds the people the caller
        follows and the caller, ranked densely from 1 in board order, and `rank`, the cursor and
        `me` all use that friends rank. A caller who follows nobody gets their own row only, or an
        empty page when they are not ranked.
      parameters:
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
        - $ref: "#/components/parameters/LeaderboardFilter"
        - $ref: "#/components/parameters/LeaderboardSort"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/ledgers/latest:
    get:
      operationId: getMyLatestLedger
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's latest weekly Ledger.
      description: >-
        Returns the most recent Ledger stored for the caller, exactly as it was built. It never
        recomputes. With none stored the answer is ledger_not_found.
      responses:
        "200":
          description: The caller's latest Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ledger"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/ledgers/{week}:
    get:
      operationId: getMyLedger
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's weekly Ledger for one week.
      description: >-
        Returns the Ledger stored for the caller and the ISO week, exactly as it was built. It never
        recomputes. A week that is not `YYYY-Www` is invalid_input, and a week with no Ledger stored is
        ledger_not_found.
      parameters:
        - name: week
          in: path
          required: true
          description: The ISO week, for example `2026-W42`.
          schema: {type: string, pattern: "^\\d{4}-W\\d{2}$", examples: ["2026-W42"]}
      responses:
        "200":
          description: The caller's Ledger for the week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ledger"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pnl-history:
    get:
      operationId: getMyPnlHistory
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's P&L history.
      description: >-
        Returns the caller's equity and P&L across every cabal they have held a stake in, one point
        per bucket, oldest first. At each bucket a cabal's stake is read at the time of its latest
        snapshot, so a fund or a cash out between two snapshots is not a gain or a loss. P&L is equity
        minus the net contributed, so it keeps the gain a member realised after a cash out. A bucket
        where a held cabal has no snapshot yet is left out. Before the first run, or with no stake,
        `points` is empty. An unknown range is invalid_input.
      parameters:
        - $ref: "#/components/parameters/ValueHistoryRange"
        - name: cabal_id
          in: query
          required: false
          description: "Only this cabal: the caller's stake value and P&L in it."
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "200":
          description: The caller's P&L history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPnlHistory"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/portfolio:
    get:
      operationId: getMyPortfolio
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's portfolio.
      description: >-
        Returns the caller's stake in each cabal they hold, as the latest run valued it, in the caller's own
        cabal order (see putMyCabalOrder) rather than by value, with the
        total, the P&L, the return and each cabal's share of the total in basis points. The slices
        sum to 10000, with the remainder on the largest cabal, and are all 0 when the total is 0.
        Cash on the platform is not included. A cabal with no snapshot yet is left out of the rows
        and the total. Before the first run `cabals` is empty, the total is 0 and the times are null.
        The P&L and the return cover current holdings only: realised P&L from cabals the user has fully
        left is not in them. A cabal whose stake outgrows its latest snapshot is left out as well.
      responses:
        "200":
          description: The caller's portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPortfolio"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/cabals:
    get:
      operationId: getUserCabals
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the cabals another user is in.
      description: >-
        Returns every cabal the user is a member of, the ones the caller is in too first, then by
        the user's share of the pot, largest first. Each row carries the user's role, whether they
        vote, and whether the caller is a member as well. `ownership_bps` is the user's share of the
        pot, and is null when they hide their performance, unless the caller reads their own cabals.
        A cabal with no snapshot yet stays in the list. A block in either direction returns an empty
        list. An unknown user is user_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The user's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "200":
          description: The user's cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCabals"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/shared-cabals:
    get:
      operationId: getSharedCabals
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the cabals the caller and another user share.
      description: >-
        Returns the cabals both the caller and the user are members of, largest pot first, with the
        pot's value, its P&L and its return as the latest run valued it. These are the cabal's own
        figures, never the other user's stake. A shared cabal with no snapshot yet is left out. An
        unknown user is user_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The other user's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "200":
          description: The shared cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedCabals"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/referrals.yaml
  /v1/me/referral:
    post:
      operationId: postMeReferral
      tags: [referrals]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1h, burst: 5}}
      summary: Attribute the caller to an invite code.
      description: >-
        Resolves the code, refuses a self invite, an invite already used, or a caller outside the
        new-account window, then stores the attribution. A replay of the same idempotency key
        returns the first 201. A banned, suspended, deleted or locked referrer is an unknown code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The invite code and where the caller found it.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachReferralRequest"
            example: {code: k7m4qx2p, source: manual}
      responses:
        "201":
          description: The referrer the caller is now attributed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedReferral"
              example:
                referrer:
                  {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: null, handle: kaicenat}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/referral-code:
    get:
      operationId: getMyReferralCode
      tags: [referrals]
      summary: Read the caller's invite code and links.
      description: >-
        Returns the caller's random code and its link. `handle_link` is set and `handle_unlocked` is
        true once the caller's first deposit is credited. A user whose code is not minted yet gets
        referral_code_pending, a retryable 503, so the app tries again.
      responses:
        "200":
          description: The caller's invite code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReferralCode"
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/clicks:
    post:
      operationId: recordReferralClick
      tags: [referrals]
      security: []
      x-idempotent: true
      x-cors: web
      x-rate-limit: {ip: {rate: 20, per: 1m, burst: 10}}
      summary: Count one tap on the invite page's Get Monaco button.
      description: >-
        Public, called by the landing page for each tap on "Get Monaco". Adds one to the count for the
        code on the current UTC day. Send a new random UUID as the Idempotency-Key for each tap,
        because two taps that share a key and a code count once, whoever sent them. A code that does
        not resolve is not counted and still answers 204. The stored count holds only the code, the
        UTC day and a number.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The invite code from the page URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralClickRequest"
            example: {code: k7m4qx2p}
      responses:
        "204":
          description: The tap was counted, or the code does not resolve.
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/{code}:
    get:
      operationId: getReferral
      tags: [referrals]
      security: []
      x-rate-limit: {ip: {rate: 60, per: 1m, burst: 60}}
      summary: Look up the referrer behind an invite code.
      description: >-
        Public, for the invite landing page. Returns the referrer's id, display name, photo and handle
        for a random code or an unlocked handle. A code that does not resolve gets the same 200 with
        `referrer` null, whether it is unknown, a locked handle, or owned by a banned, suspended or
        deleted user, so the answer never says which. Both answers carry
        `Cache-Control: public, max-age=300`.
      parameters:
        - name: code
          in: path
          required: true
          description: A random invite code or an unlocked handle. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 40
            examples: [k7m4qx2p]
      responses:
        "200":
          description: The referrer, or null when the code does not resolve.
          headers:
            Cache-Control:
              description: Always `public, max-age=300`.
              required: true
              schema:
                type: string
                examples: ["public, max-age=300"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralLookup"
              example:
                referrer:
                  {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: "https://img.example/kai.png", handle: kaicenat}
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/{code}/cabals/{cabal_id}:
    get:
      operationId: getReferralCabal
      tags: [referrals]
      security: []
      x-rate-limit: {ip: {rate: 60, per: 1m, burst: 60}}
      summary: Preview the cabal an invite link points to.
      description: >-
        Public, for the cabal invite landing before sign-in. The link is `https://monacolabs.xyz/r/<code>?c=<cabal_id>`.
        It answers only when the code resolves to a user who is a current member of that cabal. Every
        other case (an unknown code, a locked handle, a banned or deleted owner, a non-member, an unknown
        or banned cabal) gets the same 200 with `cabal` null, so the answer never says which. The inviter
        card carries a display name and photo only; no answer carries a user id, a handle, a share or a
        vote side. The month facts (`return_1m_bps`, `turnout_month_bps`, `open_proposal`) are null until
        they are filled. The tally is live: the answer is never cached and carries `Cache-Control: no-cache`.
      parameters:
        - name: code
          in: path
          required: true
          description: The inviter's random invite code or unlocked handle. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 40
            examples: [k7m4qx2p]
        - name: cabal_id
          in: path
          required: true
          description: The cabal the link points to.
          schema:
            type: string
            format: uuid
            examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
      responses:
        "200":
          description: The cabal and its inviter, or `cabal` null when the link does not resolve.
          headers:
            Cache-Control:
              description: Always `no-cache`.
              required: true
              schema:
                type: string
                examples: [no-cache]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCabal"
              example:
                inviter: {display_name: Andres, photo_url: "https://img.example/andres.png"}
                cabal:
                  id: "01890a5d-ac96-774b-bcce-b302099a8058"
                  name: AC Capital
                  picture_url: null
                  member_count: 8
                  since: "2026-08-14"
                  join_mode: request
                  first_members:
                    - {display_name: Christelle, photo_url: "https://img.example/christelle.png"}
                    - {display_name: Logan, photo_url: null}
                    - {display_name: Mia, photo_url: "https://img.example/mia.png"}
                  pot_value_micros: "20000000000"
                return_1m_bps: null
                turnout_month_bps: null
                open_proposal: null
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/social.yaml
  /v1/admin/comments/{id}:
    delete:
      operationId: removeComment
      tags: [social]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Remove a comment.
      description: >-
        Soft-deletes the comment as a moderator. It keeps its place in its thread, reads as `Removed by
        Monaco`, and the item's `comment_count` drops by one. Appends `comment.deleted` and
        `admin.action` in one transaction, and never copies the body into the audit. A comment that is
        already deleted returns 204 and changes nothing. An unknown comment is comment_not_found, and a
        reason shorter than 3 characters is reason_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: Why the moderator removes the comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: abuse}
      responses:
        "204":
          description: The comment is removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reports:
    get:
      operationId: getAdminReports
      tags: [social]
      x-admin-role: moderator
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List reports for moderators.
      description: >-
        Reports with the given status, oldest first. The default status is open. A cursor the server
        did not write is invalid_input.
      parameters:
        - name: status
          in: query
          required: false
          description: Which reports to list. Defaults to open.
          schema: {type: string, enum: [open, resolved], default: open}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          description: The page size, 50 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReports"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/chat/seen:
    post:
      operationId: markChatSeen
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 10}}
      summary: Mark the cabal's chat as seen.
      description: >-
        Moves the caller's seen watermark to the server's clock and never moves it backwards, so
        a replay or a slow client cannot undo a later call. Only a member can mark, otherwise
        not_cabal_member. Nothing is appended to the event log. Open screens get the new "seen
        by" count from a `seen.updated` event on the cabal channel, sent at most once per member
        every 5 seconds.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
      responses:
        "200":
          description: The watermark after the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSeenMark"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getChatSeenBy
      tags: [social]
      summary: List who has seen a chat message.
      description: >-
        Returns the other members whose seen watermark is at or after the message, newest first,
        and their count. The message's author is left out, and so is a member who left the cabal.
        A message that is not in this cabal is chat_message_not_found. Only a member can read,
        otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - name: message_id
          in: query
          required: true
          description: The message to read the seen list of.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "200":
          description: Who has seen the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSeenBy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages:
    post:
      operationId: postChatMessage
      tags: [social]
      x-idempotent: true
      summary: Post a message to a cabal's chat.
      description: >-
        Stores the message and appends `chat.message_posted`. Only a member can post, otherwise
        not_cabal_member. The body is trimmed and must be 1 to 2000 Unicode scalars, otherwise
        chat_body_invalid. A reply names its `parent_id`, which must be a live top-level message
        in the same cabal: an unknown, deleted or other-cabal parent is chat_parent_not_found and
        a parent that is itself a reply is chat_parent_is_reply. `also_in_channel` shows the reply
        in the channel too and needs a `parent_id`, otherwise invalid_input. A replay returns the
        first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
      requestBody:
        description: The message.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageRequest"
            example: {body: gm}
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getChatMessages
      tags: [social]
      summary: Read a cabal's chat channel.
      description: >-
        Returns the channel view: top-level messages and replies sent with `also_in_channel`.
        Without a cursor it returns the newest page, newest first. `before` returns the page older
        than that message, newest first. `after` returns the messages newer than that message,
        oldest first, for catching up after a reconnect. Sending both is invalid_input, and a
        cursor that is not a message in this cabal is chat_message_not_found. A deleted top-level
        message that has replies comes back with `deleted: true` and a null body; other deleted
        messages are left out. Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - name: before
          in: query
          required: false
          description: A message id. Returns the messages older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: after
          in: query
          required: false
          description: A message id. Returns the messages newer than it, oldest first.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannelPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}:
    delete:
      operationId: deleteChatMessage
      tags: [social]
      x-idempotent: true
      summary: Delete one of the caller's chat messages.
      description: >-
        Soft-deletes the message. Only its author can delete it, otherwise
        chat_message_not_owned. A message that is unknown or in another cabal is
        chat_message_not_found. Deleting a deleted message changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
      responses:
        "204":
          description: The message is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}/thread:
    get:
      operationId: getChatThread
      tags: [social]
      summary: Read a chat thread.
      description: >-
        Returns the top-level message and a page of its live replies, oldest first. Without
        `before` the page is the newest replies; with it, the replies older than that reply. A
        parent that is unknown, in another cabal, or deleted with no replies is
        chat_message_not_found, and a message that is itself a reply is chat_parent_is_reply.
        Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
        - name: before
          in: query
          required: false
          description: A reply id. Returns the replies older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000008"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: The parent and one page of replies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed:
    get:
      operationId: getFeed
      tags: [social]
      summary: Read the feed.
      description: >-
        Returns feed items, newest first unless `sort` says otherwise, one page at a time. Every filter narrows the page, and
        an unknown kind, scope or sort, a limit outside 1 to 50 or a cursor the server did not
        write is invalid_input. The server renders every display string.
      parameters:
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created`, `member_joined`, `reply` and `threshold`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: actor_id
          in: query
          required: false
          description: Include only items whose actor is this user.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves). `network` is the caller's cabals plus the
            people the caller follows; `others` is every cabal the caller is not in.
          schema: {type: string, enum: [all, following, mine, network, others], default: all, examples: [network]}
        - name: status
          in: query
          required: false
          description: >-
            `open` keeps only items whose `status` is `open`, such as open proposals; use it with
            `kind=proposal`.
          schema: {type: string, enum: [open], examples: [open]}
        - name: sort
          in: query
          required: false
          description: >-
            `new` (the default): newest first. `top`: the items from the last 24 hours, most comments
            first, then newest first. A cursor is valid only for the sort that wrote it.
          schema: {type: string, enum: [new, top], default: new, examples: [top]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of feed items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/comments/{comment_id}:
    delete:
      operationId: deleteFeedComment
      tags: [social]
      x-idempotent: true
      summary: Delete your comment.
      description: >-
        Author only, otherwise comment_not_author. An unknown comment is comment_not_found. The comment
        keeps its place in its thread with a null body, and the item's `comment_count` drops by one. A
        second delete returns 204 and changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The comment is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/comments/{comment_id}/poll/vote:
    put:
      operationId: putCommentPollVote
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Vote in a reply's poll.
      description: >-
        Records the caller's one vote, or moves it to another option, and returns the poll's counts. Anyone who can
        see the thread may vote, members or not, by the same rule as reacting. A poll is not a cabal vote. An unknown
        or deleted comment, or one without a poll, is comment_not_found. A comment on an item the caller cannot see is
        feed_item_not_found. A poll past its `closes_at` is poll_closed. An unknown position is invalid_input with
        `reason=poll_option`. Appends `comment.poll_voted`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment that carries the poll.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: The option to vote for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVoteRequest"
      responses:
        "200":
          description: The poll's counts after the vote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollState"
              example: {closes_at: "2026-10-04T08:00:00Z", closed: false, options: [{position: 0, label: Yes, count: 3}, {position: 1, label: Wait for earnings, count: 2}], total: 5, my_position: 1}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCommentPollVote
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Withdraw your vote from a reply's poll.
      description: >-
        Removes the caller's vote and returns the poll's counts. Withdrawing a vote the caller does not have changes
        nothing. The same visibility, comment_not_found and poll_closed rules as voting apply.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment that carries the poll.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "200":
          description: The poll's counts after the withdrawal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollState"
              example: {closes_at: "2026-10-04T08:00:00Z", closed: false, options: [{position: 0, label: Yes, count: 3}, {position: 1, label: Wait for earnings, count: 1}], total: 4}
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/comments/{comment_id}/reactions/{emoji}:
    put:
      operationId: putCommentReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: React to a reply with an emoji.
      description: >-
        Adds the caller's reaction with one emoji to a reply and returns the reply's reactions. Reacting with an emoji
        the caller already used changes nothing. A caller holds at most 10 distinct emoji on a reply, and an 11th is
        invalid_input with `reason=reaction_limit`. An emoji that is not exactly one emoji is invalid_input with
        `field=emoji`. A deleted or removed comment, or an unknown one, is comment_not_found. A reply on an item the
        caller cannot see is feed_item_not_found, and on an item the caller may not react to is reaction_not_allowed.
        The emoji sits in the path, like `PUT /v1/feed/{id}/reactions/{emoji}`, because a body route would overlap it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to add, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The reply's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCommentReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Remove your emoji reaction from a reply.
      description: >-
        Removes the caller's reaction with that emoji, and only theirs, then returns the reply's reactions. Removing a
        reaction the caller does not have changes nothing. An emoji that is not exactly one emoji is invalid_input with
        `field=emoji`. A deleted or removed comment, or an unknown one, is comment_not_found. A reply on an item the
        caller cannot see is feed_item_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to remove, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The reply's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/likes/{id}:
    put:
      operationId: putFeedLike
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Like a feed item.
      description: >-
        Adds the caller's like, which raises the item's `like_count` by one and sets its `liked_by_me`.
        Liking an item the caller already likes changes nothing and returns 204. An item the caller cannot
        see, or an unknown one, is feed_item_not_found. The path puts `likes` before the id so it cannot
        overlap `DELETE /v1/feed/comments/{comment_id}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The item is liked.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFeedLike
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Unlike a feed item.
      description: >-
        Removes the caller's like. Unliking an item the caller does not like changes nothing and returns
        204. An item the caller cannot see, or an unknown one, is feed_item_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The item is not liked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}:
    get:
      operationId: getFeedItem
      tags: [social]
      summary: Read one feed item.
      description: >-
        Returns the item and whether it passes the filters sent with the request, which take the
        same names as the list. An unknown id is feed_item_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created`, `member_joined`, `reply` and `threshold`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: actor_id
          in: query
          required: false
          description: Include only items whose actor is this user.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves). `network` is the caller's cabals plus the
            people the caller follows; `others` is every cabal the caller is not in.
          schema: {type: string, enum: [all, following, mine, network, others], default: all, examples: [network]}
      responses:
        "200":
          description: The feed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItemDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}/comments:
    post:
      operationId: postFeedComment
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1m, burst: 5}, ip: {rate: 30, per: 1m, burst: 30}}
      summary: Comment on a feed item.
      description: >-
        Stores the comment, adds one to the item's `comment_count` and appends `comment.created`. The
        body is trimmed and must be 1 to 1000 Unicode scalars, otherwise invalid_input. An unknown
        item is feed_item_not_found. Every item has one thread. A proposal is its own thread, and so are
        a member's buy or sale and every other post; a `result` that a cabal heads, a `threshold` and a
        `reply` share their proposal's thread, so the comment is stored there and counted on the proposal
        item (feed_item_pending, retryable, while that item is missing). Only a member of the cabal can
        comment in a proposal's thread, otherwise comment_members_only; anyone who can see any other post
        can comment on it. A reply names its `parent_comment_id`, the comment it answers, which must be a
        comment on the same thread, otherwise comment_parent_mismatch. When the item's author replies, the
        answer folds under the top-level comment it answers (`parent_comment_id` and `root_comment_id`
        name that comment); a reply by anyone else is top-level. Either way the response carries
        `reply_to`, a quote of the comment it answers. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: The comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example: {body: nice}
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getFeedComments
      tags: [social]
      summary: Read the comments on a feed item.
      description: >-
        Returns the top-level comments oldest first, one page at a time, each with all its folded
        answers oldest first. A reply by anyone but the item's author is top-level and carries `reply_to`,
        a quote of the comment it answers; the quoted comment's `root_comment_id` is on the same or an
        earlier page. A deleted comment keeps its place with a null `body` and the `body_display`
        `Comment deleted`, or `Removed by Monaco` once a moderator removes it. On a `result` that a cabal heads, a
        `threshold` or a `reply` item it returns the page of the proposal's thread. An unknown item is feed_item_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size, counted in top-level comments. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of comment threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}/reactions/{emoji}:
    put:
      operationId: putFeedReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: React to a feed item with an emoji.
      description: >-
        Adds the caller's reaction with one emoji and returns the item's reactions. Reacting with an emoji the caller
        already used changes nothing and returns the same reactions. A caller holds at most 10 distinct emoji on an
        item, and an 11th is invalid_input with `reason=reaction_limit`. An emoji that is not exactly one emoji is
        invalid_input with `field=emoji`. An item the caller cannot see, or an unknown one, is feed_item_not_found.
        An item the caller may not react to is reaction_not_allowed. The emoji sits in the path, after the id, so the
        route cannot overlap `PUT /v1/feed/likes/{id}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to add, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The item's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFeedReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Remove your emoji reaction from a feed item.
      description: >-
        Removes the caller's reaction with that emoji, and only theirs, then returns the item's reactions. Removing a
        reaction the caller does not have changes nothing. An emoji that is not exactly one emoji is invalid_input with
        `field=emoji`. An item the caller cannot see, or an unknown one, is feed_item_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to remove, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The item's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/blocks:
    get:
      operationId: getMeBlocks
      tags: [social]
      summary: List the users the caller blocks.
      description: >-
        Newest block first, at most 500. Banned and deleted users stay in the list so they can be
        unblocked. A deleted user carries an empty handle, display name and photo.
      responses:
        "200":
          description: The blocked users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUsers"
              example:
                users:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/contacts/match:
    post:
      operationId: postMeContactsMatch
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1h, burst: 10}, ip: {rate: 30, per: 1h, burst: 30}}
      summary: Match address-book hashes to people on Monaco.
      description: >-
        The body is 1 to 2000 lowercase SHA-256 hex hashes of E.164 numbers. Duplicates collapse.
        An empty list or a hash that is not 64 lowercase hex characters is contact_hashes_invalid.
        More than 2000 hashes is too_many_contact_hashes. A match is stored only for a verified
        phone of an active user who is not the caller. Unmatched hashes are not stored or logged.
        Matching again does not clear a dismissed row. The response lists the caller's live matches,
        the same body as GET /v1/me/contacts/matches.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The address-book hashes to match.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMatchRequest"
            example:
              hashes: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
      responses:
        "200":
          description: The caller's live contact matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMatchPage"
              example:
                items:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: "https://img.example/maya.png", followed_by_me: false}
                next_cursor: null
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/contacts/matches:
    get:
      operationId: getMeContactsMatches
      tags: [social]
      summary: List people from the caller's contacts who are on Monaco.
      description: >-
        Live matches, newest first. Banned and deleted users are omitted. followed_by_me is true
        when the caller has a live follow. limit defaults to 30 and cannot exceed 50. A cursor the
        server did not write is invalid_input.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The next_cursor from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
      responses:
        "200":
          description: One page of contact matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMatchPage"
              example:
                items:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: "https://img.example/maya.png", followed_by_me: false}
                next_cursor: null
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes:
    get:
      operationId: getMeFeedMutes
      tags: [social]
      summary: List feed mutes.
      responses:
        "200":
          description: Feed mutes newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedMute"
              example:
                - {target_type: asset, target_id: AAPLx, label: AAPLx, created_at: "2026-10-04T12:00:00Z"}
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putMeFeedMutes
      tags: [social]
      x-idempotent: true
      summary: Mute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The feed target to mute.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedMuteRequest"
            example: {target_type: asset, target_id: AAPLx}
      responses:
        "204": {description: The target is muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes/{target_type}/{target_id}:
    delete:
      operationId: deleteMeFeedMutesTargetTypeTargetID
      tags: [social]
      x-idempotent: true
      summary: Unmute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: target_type
          in: path
          required: true
          description: What kind of target is muted.
          schema: {type: string, enum: [kind, cabal, asset, user, item], examples: [asset]}
        - name: target_id
          in: path
          required: true
          description: The muted target's id.
          schema: {type: string, maxLength: 64, examples: [AAPLx]}
      responses:
        "204": {description: The target is not muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/comments:
    post:
      operationId: postProposalComment
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1m, burst: 5}, ip: {rate: 30, per: 1m, burst: 30}}
      summary: Comment on a proposal.
      description: >-
        Finds the proposal's feed item and does what `POST /v1/feed/{id}/comments` does: same body,
        response and refusals. A proposal with no feed item yet is feed_item_pending, which is
        retryable: the item arrives shortly after `proposal.created`, and an unknown proposal id
        looks the same.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The proposal's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: The comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example: {body: agree}
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getProposalComments
      tags: [social]
      summary: Read the comments on a proposal.
      description: >-
        Finds the proposal's feed item and returns what `GET /v1/feed/{id}/comments` returns, plus the
        item's id as `feed_object_id`. A proposal with no feed item yet is feed_item_pending, which is
        retryable.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size, counted in top-level comments. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of comment threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalCommentPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/realtime/token:
    post:
      operationId: createRealtimeToken
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 60, per: 1h, burst: 10}}
      summary: Get a token request for live chat updates.
      description: >-
        Returns a signed Ably token request that lets the app subscribe, and only subscribe, to
        the chat channel of every cabal the caller belongs to. The token request is valid for 5
        minutes and carries no presence or publish right. A caller in no cabal gets
        no_realtime_channels, because Ably rejects an empty capability. Send a new idempotency key
        with every call, because a replay returns the first token request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The Ably token request to hand to the Ably SDK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTokenRequest"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports:
    post:
      operationId: postReport
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 20, per: 1h, burst: 20}}
      summary: Report a message, comment, user or cabal.
      description: >-
        Files a report for moderators and appends `report.created`, which carries no note text.
        The target must exist: a missing chat message, comment or cabal, and an unknown or deleted
        user, is report_target_not_found. A deleted chat message still counts as found. Reporting
        a target the caller already has an open report on answers 201 with the same id and appends
        nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: What is reported and why.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
            example: {kind: user, target_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", reason: spam}
      responses:
        "201":
          description: The open report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCreated"
              example: {id: "01920000-0000-7000-8000-000000000009"}
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/activity:
    get:
      operationId: getUserActivity
      tags: [social]
      summary: Read what a member did.
      description: >-
        Returns the member's votes, proposals, replies and month wins merged newest first, one page at a
        time. A vote never carries which way it went unless the caller is the member: `choice` appears only
        on your own activity. A blocked pair, either way, gets an empty page. Rows from a banned cabal and
        removed comments are left out. An unknown user is user_not_found and a cursor the server did not
        write is invalid_input.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wLjAxOTIwMDAwLTAwMDAtNzAwMC04MDAwLTAwMDAwMDAwMDAwNw"]}
        - name: limit
          in: query
          required: false
          description: The page size, 20 by default.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20, examples: [20]}
      responses:
        "200":
          description: One page of the member's activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/block:
    post:
      operationId: postUserBlock
      tags: [social]
      x-idempotent: true
      summary: Block a user.
      description: >-
        Blocks the user as the caller. It ends any follow between the two in both directions, appending
        `follow.removed` for each, then appends `block.created`. The blocker no longer sees the blocked
        user's chat messages or comments, and neither can follow the other. Blocking someone the caller
        already blocks changes nothing and answers the same. Blocking yourself is cannot_block_self and an
        unknown or deleted user is user_not_found. A banned or suspended user can be blocked.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": {description: The caller blocks the user.}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserBlock
      tags: [social]
      x-idempotent: true
      summary: Unblock a user.
      description: >-
        Removes the caller's block of the user and appends `block.removed`. Unblocking a user the caller
        does not block changes nothing and answers the same. No follow is restored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": {description: The caller does not block the user.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/follow:
    post:
      operationId: postUserFollow
      tags: [social]
      x-idempotent: true
      summary: Follow a user.
      description: >-
        Follows the user as the caller and appends `follow.created`. Following someone the caller
        already follows changes nothing and returns the same response. Following yourself is
        cannot_follow_self, an unknown or deleted user is user_not_found and a banned user is
        user_banned. `source` records where the follow came from and defaults to `profile`. The
        values a client may send are `profile`, `phone`, `x`, `cabal`, `feed` and `suggested`;
        any other value, `referral` included, is invalid_input.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Where the follow came from.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: The caller follows the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserFollow
      tags: [social]
      x-idempotent: true
      summary: Unfollow a user.
      description: >-
        Ends the caller's follow of the user and appends `follow.removed`. Unfollowing a user the
        caller does not follow changes nothing and returns the same response. A banned or deleted
        user can be unfollowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The caller does not follow the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/followers:
    get:
      operationId: getUserFollowers
      tags: [social]
      summary: List a user's followers.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/following:
    get:
      operationId: getUserFollowing
      tags: [social]
      summary: List the users a user follows.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followed users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/system.yaml
  /v1/admin/system/pings/{id}/flag:
    post:
      operationId: flagSystemPing
      tags: [system]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Flag a ping as an administrator.
      description: >-
        Marks the ping flagged and appends `system.ping_flagged` and `admin.action` in one transaction,
        then answers 204. The `admin.audit` consumer writes the `admin_actions` row after that. This is the
        reference admin command that every later one copies. A ping that is already flagged answers
        already_flagged, and an unknown ping answers not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the ping to flag.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
      requestBody:
        description: Why the administrator flags the ping.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: spam}
      responses:
        "204": {description: The ping is flagged.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings:
    post:
      operationId: postSystemPing
      tags: [system]
      x-idempotent: true
      summary: Record a ping for the caller.
      description: >-
        Writes a ping and appends `system.pinged`. The `system.echo` consumer then marks the ping
        echoed and sends the caller a `ping_echoed` hint on `/v1/stream`. A replay with the same
        Idempotency-Key returns the first response and records nothing new.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The note to record with the ping.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
      responses:
        "201":
          description: The ping was recorded. `echoed` is false until the consumer runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings/{id}:
    get:
      operationId: getSystemPing
      tags: [system]
      summary: Read one of the caller's pings.
      description: Returns the ping with `echoed` computed on the server. Another user's ping is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The ping id from the create response.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/trading.yaml
  /v1/swaps/{id}:
    get:
      operationId: getSwap
      tags: [trading]
      summary: Read one trade.
      description: >-
        Returns a swap with its asset, amounts, status and, for a failed swap, why it failed. Only
        members of the swap's cabal can read it, except a confirmed proposal trade, which any signed-in
        user can read because the Feed publishes it; anyone else gets `not_cabal_member`. The asset name
        and decimals come from the catalog, and raw mints are never returned. `retryable` is always false
        for a non-member; otherwise it is true only for the latest swap of a proposal when that swap
        failed and the proposal can still be retried: it is `passed`, or `execution_blocked` by
        `swap_failed`. A proposal blocked for another reason, or voided, leaves it false.
      parameters:
        - name: id
          in: path
          required: true
          description: The swap id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The swap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, source: {kind: proposal, id: 01890a5d-ac96-774b-bcce-b302099a8059}, action: buy, symbol: AAPLx, asset_name: Apple, token_decimals: 8, usdc_micros: 25000000, token_amount: null, status: failed, failure_code: jupiter_failed, failure_message: The trade did not go through., tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, created_at: "2026-10-03T15:00:00Z", confirmed_at: null, retryable: true}
        default:
          $ref: "#/components/responses/Problem"
  /v1/swaps/{id}/retry:
    post:
      operationId: postSwapRetry
      tags: [trading]
      x-idempotent: true
      summary: Retry a failed trade.
      description: >-
        Asks the trade engine to run a proposal's trade again after its swap failed. Only a member of
        the swap's cabal can ask, and only for the latest swap of a passed proposal when that swap is
        `failed`; a cash out leg is final. The server appends `trade.retry_requested` with the trade
        parameters from the failed swap and answers at once. The engine re-runs the pre-trade checks
        and creates a new swap, or blocks the proposal, later. A replay with the same Idempotency-Key
        returns the first response. When the swap failed `price_moved`, `at_current_price: true` makes the
        engine hold the new order to the cabal's slippage around a fresh server-side quote instead of
        the voted one. The client never sends a price. Sending it for any other swap is refused.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the failed swap.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Whether to retry at the current price. Omit it to retry at the voted quote.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapRetryRequest"
            example: {at_current_price: true}
      responses:
        "202":
          description: The retry was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRetryAccepted"
              example: {swap_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: retry_requested}
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/treasury.yaml
  /v1/cabals/{id}/activity:
    get:
      operationId: getCabalActivity
      tags: [treasury]
      summary: List a cabal's activity.
      description: >-
        Returns one page of the cabal's buys, sells, funds and cash outs, newest first, pending and failed
        ones included. Only members can read it; anyone else gets `not_cabal_member`. Asset and actor names
        are resolved for display, and raw mints are never returned.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
            examples: [30]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
        - name: symbol
          in: query
          required: false
          description: >-
            Reads only the buys and sells of the stock with this token symbol, paged the same way. A symbol
            the catalog does not know reads an empty page.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [NVDAx]
      responses:
        "200":
          description: One page of the cabal's activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalActivityPage"
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: buy, status: confirmed, asset: {symbol: AAPLx, name: Apple}, usdc_micros: 25000000, units: 105000000, price_micros: 23809523, actor: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, occurred_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/cashouts:
    post:
      operationId: postCashOut
      tags: [treasury]
      x-idempotent: true
      x-allow-restricted: true
      summary: Start a cash out to the caller's platform balance.
      description: Reserves the caller's cabal shares and starts the asynchronous cash-out job.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The requested cash-out amount or all-shares selection.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CashOutRequest"}
            example: {all: true}
      responses:
        "202":
          description: The cash out job was reserved for processing.
          content:
            application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/preview:
    get:
      operationId: getCashOutPreview
      tags: [treasury]
      x-allow-restricted: true
      summary: Preview the caller's available cash out.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200": {description: The current cash-out preview., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutPreview"}, example: {slice_micros: "25000000", share_units: "100", min_micros: "100000", pause: null}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/{job_id}:
    get:
      operationId: getCashOutJob
      tags: [treasury]
      x-allow-restricted: true
      summary: Read one cash out job.
      parameters:
        - {name: id, in: path, required: true, description: The cabal id., schema: {type: string, format: uuid}}
        - {name: job_id, in: path, required: true, description: The cash-out job id., schema: {type: string, format: uuid}}
      responses:
        "200": {description: The job., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/fund:
    post:
      operationId: fundCabal
      tags: [treasury]
      x-idempotent: true
      summary: Fund a cabal from the caller's platform balance.
      description: >-
        Moves an exact amount of USDC from the caller's wallet to the cabal treasury. The transfer is
        signed and its signature stored before broadcast, so the answer is 202 with the transfer id; share
        units are minted at the live price once the transfer is final. Poll GET /v1/fund-transfers/{id}
        for the outcome. Only members can fund. A paused cabal answers `cabal_paused`, a banned one answers
        `cabal_banned`, an amount over the available balance answers `insufficient_funds`, and a pot with shares but no value answers
        `pot_value_zero`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      requestBody:
        description: The amount to fund, at least 1 USDC.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundRequest"}
      responses:
        "202":
          description: The transfer is signed and submitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundAccepted"}
              example: {transfer_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/fund/preview:
    get:
      operationId: getFundPreview
      tags: [treasury]
      summary: Preview a fund before it is submitted.
      description: >-
        Returns what the Fund this cabal keypad needs before a submit: the caller's available cash, the
        minimum, the caller's current share of the pot and the share a fund of `amount_micros` would leave
        them with. `slice_bps_after` is null without an amount or below the minimum, and is computed for at
        most the available cash, so an amount over it returns `over_micros` and the share for exactly the
        cash. The share uses the pot's own rounding, so it matches `me.slice_bps` on GET
        /v1/cabals/{id}/pot after the real fund settles as long as nothing else moves the pot in between.
        A paused cabal answers 200 with `paused: true`. Only members can preview; a banned cabal answers
        `cabal_banned`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: amount_micros
          in: query
          required: false
          description: The amount to preview, in USDC micros. Absent or 0 previews the current share only.
          schema: {type: string, pattern: "^[0-9]+$", examples: ["250000000"]}
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundPreview"}
              example: {available_micros: "500000000", min_micros: "1000000", slice_bps_now: 3500, slice_bps_after: 3600, over_micros: "0", paused: false, first_funded_at: "2026-10-03T15:00:00Z"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/holdings/{symbol}/performance:
    get:
      operationId: getHoldingPerformance
      tags: [treasury]
      summary: Read what a cabal has made selling one stock.
      description: >-
        Returns the average price the cabal sold one share of the stock for and the profit it locked in by selling,
        both replayed from the cabal's confirmed buys and sells against the weighted-average cost of each token it
        holds, with every chain's listing of the stock counted together. Only members can read it; anyone else gets
        `not_cabal_member`. `avg_sell_micros` is null when nothing was sold. A symbol the cabal never traded reads
        no sells and zero profit. `series` gives the position P&L over time for each chart range, up to 48 points
        oldest first, ending at now; every range is empty for a symbol the cabal never held.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: symbol
          in: path
          required: true
          description: The stock's token symbol.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [NVDAx]
      responses:
        "200":
          description: The stock's sell performance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingPerformance"
              example: {avg_sell_micros: "250000000", realized_pnl_micros: 30000000, series: {"1W": [{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}], "1M": [{at: "2026-10-30T12:00:00Z", pnl_micros: 30000000}], "3M": [], "1Y": [], "ALL": []}}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/pot:
    get:
      operationId: getCabalPot
      tags: [treasury]
      x-allow-restricted: true
      summary: Read a cabal's pot, its holdings and the caller's slice.
      description: >-
        Returns the pot value, its all-time gain, every holding at the latest market price and the caller's
        slice, all from one price read. Any signed-in user may read it. `me` is null when the caller is not a
        member. A holding without a fresh price returns `price_unavailable`; the pot is never valued at cost
        basis. Refresh on `cabal.<id>.activity_changed` and `global.prices_updated`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cabal's pot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPot"
              example: {cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, pot_value_micros: 120000000, cash_micros: 60000000, cash_weight_bps: 5000, pnl_micros: 20000000, return_bps: 2000, prices_as_of: "2026-10-03T15:00:00Z", holdings: [{symbol: AAPLx, display_name: Apple, kind: equity, units: "2.0000", token_amount: 200000000, price_micros: 30000000, value_micros: 60000000, weight_bps: 5000, cost_basis_micros: 40000000, pnl_micros: 20000000, avg_entry_micros: "20000000", first_bought_at: "2026-10-01T15:00:00Z"}], me: {share_units: 100000000, value_micros: 120000000, slice_bps: 10000, net_contributed_micros: 100000000, pnl_micros: 20000000, first_funded_at: "2026-09-30T15:00:00Z"}}
        default:
          $ref: "#/components/responses/Problem"
  /v1/fund-transfers/{id}:
    get:
      operationId: getFundTransfer
      tags: [treasury]
      summary: Read one of the caller's fund transfers.
      description: >-
        Returns the transfer's status, amount, the share units minted once it settles, the caller's share of
        the pot in basis points once it settles, and the failure code once it fails. A transfer that belongs to another user answers `not_found`.
      parameters:
        - name: id
          in: path
          required: true
          description: The transfer id from POST /v1/cabals/{id}/fund.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The transfer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundTransfer"}
              example: {status: settled, amount_micros: "5000000", share_units: "5000000", slice_bps: 3600, fail_code: null}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/held:
    get:
      operationId: getMyHeld
      tags: [treasury]
      summary: List what the caller's cabals hold, with a total.
      description: >-
        Returns every holding of every cabal the caller is an active member of, one row per cabal and stock,
        largest value first and ties by symbol, valued like `GET /v1/cabals/{id}/pot` from one price read for
        all the cabals. `total_value_micros` sums the rows and `cabal_count` counts the cabals among them.
        With `symbol` only that stock's rows come back. A caller in no cabal gets an empty list. A holding
        without a fresh price returns `price_unavailable`. Refresh on `global.prices_updated`.
      parameters:
        - name: symbol
          in: query
          required: false
          description: Only the rows of this stock, by its token symbol.
          schema: {type: string, maxLength: 64, examples: [NVDAx]}
      responses:
        "200":
          description: What the caller's cabals hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldList"
              example: {total_value_micros: 8360000000, cabal_count: 1, prices_as_of: "2026-10-03T15:00:00Z", holdings: [{cabal: {id: 01890a5d-ac96-774b-bcce-b302099a8059, name: AC Capital, picture_url: null}, logo_url: "https://cdn.example.com/NVDAx.png", holding: {symbol: NVDAx, display_name: NVIDIA, kind: equity, units: "38.0000", token_amount: 38000000, price_micros: 220000000, value_micros: 8360000000, weight_bps: 4200, cost_basis_micros: 7333333333, pnl_micros: 1026666667, avg_entry_micros: "192982456", first_bought_at: "2026-09-01T15:00:00Z"}}]}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/txns:
    get:
      operationId: getMyTxns
      tags: [treasury]
      summary: List the caller's transaction history.
      x-allow-restricted: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512, examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]}
      responses:
        "200":
          description: One page of the caller's transactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserTxnPage"}
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: deposit, status: settled, usdc_micros: "25000000", cabal: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, created_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
  # api/spec/admin.yaml
    OlderThan:
      name: older_than
      in: query
      required: false
      description: >-
        How old an item must be to count, as a duration such as 30s or 5m. It cannot exceed 24h. Each queue has its
        own default.
      schema: {type: string, maxLength: 16, examples: [5m]}
    QueueLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and cannot exceed 200.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
  # api/spec/analytics.yaml
    DashboardBucket:
      name: bucket
      in: query
      required: true
      description: The bucket size. A week starts on Monday, UTC.
      schema: {$ref: "#/components/schemas/DashboardBucket"}
    DashboardFrom:
      name: from
      in: query
      required: true
      description: The start of the range, inclusive, as a date such as 2026-09-01 or an RFC 3339 time. Dates are UTC.
      schema: {type: string, maxLength: 40, examples: ["2026-09-01"]}
    DashboardTo:
      name: to
      in: query
      required: true
      description: The end of the range, exclusive, as a date or an RFC 3339 time. It cannot be more than 400 days after `from`.
      schema: {type: string, maxLength: 40, examples: ["2026-10-01"]}
  # api/spec/base.yaml
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A key the app generates once per user action. The server stores the first response under
        it and replays that response for any retry with the same key and body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ["6f1c1a52-3a4e-4d0e-9d7b-2f7f3f5b9d10"]
    UserId:
      name: id
      in: path
      required: true
      description: The id of the user.
      schema:
        type: string
        format: uuid
  # api/spec/funding.yaml
    OnrampSessionId:
      name: id
      in: path
      required: true
      description: The session id from the create response.
      schema:
        type: string
        format: uuid
        examples: [01890a5d-ac96-774b-bcce-b302099a8057]
    WithdrawalAuthorizationId:
      name: Withdrawal-Authorization
      in: header
      required: false
      description: >-
        The `authorization_id` from `POST /v1/me/withdrawals/authorizations` for exactly this amount, network and
        address. Required for an address the caller has not received funds at, or for 1,000 USDC or more, and
        checked whenever it is sent. It is a header, so a retry with the same Idempotency-Key can carry a fresh
        one.
      schema:
        type: string
        format: uuid
        examples: [01890a5d-ac96-774b-bcce-b302099a8059]
  # api/spec/notify.yaml
    CatchUpItemKey:
      name: key
      in: path
      required: true
      description: The item key, such as proposal:<id>, comment:<id>, chat:<id> or invite:<id>.
      schema:
        type: string
        examples: ["comment:01890a5d-ac96-774b-bcce-b302099a8061"]
  # api/spec/ranking.yaml
    LeaderboardCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` from the previous page. Absent reads the first page.
      schema: {type: string, maxLength: 64, examples: [MjA]}
    LeaderboardFilter:
      name: filter
      in: query
      required: false
      description: "`all` reads the whole board. `friends` reads the people the caller follows and the caller."
      schema: {type: string, enum: [all, friends], default: all, examples: [friends]}
    LeaderboardLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 20 and cannot exceed 50.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20, examples: [20]}
    LeaderboardMembership:
      name: membership
      in: query
      required: false
      description: >-
        Keeps the cabals by how people join. `all` keeps every cabal, `accepting_requests` keeps the cabals
        that take new members, open or by request, `open` keeps the cabals anyone can join and
        `approval` keeps the cabals that approve each request.
      schema:
        {type: string, enum: [all, accepting_requests, open, approval], default: all, examples: [open]}
    LeaderboardMinMembers:
      name: min_members
      in: query
      required: false
      description: Keeps the cabals with at least this many members. Defaults to 0.
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0, examples: [5]}
    LeaderboardRange:
      name: range
      in: query
      required: false
      description: The window the return is measured over. Defaults to `ALL`.
      schema: {type: string, enum: ["1H", "1D", "1W", "1M", ALL], default: ALL, examples: [ALL]}
    LeaderboardSort:
      name: sort
      in: query
      required: false
      description: >-
        The order of the board. `return_pct` is best return first, `pnl` is largest P&L first and
        `name` is A to Z.
      schema: {type: string, enum: [return_pct, pnl, name], default: return_pct, examples: [pnl]}
    ValueHistoryRange:
      name: range
      in: query
      required: false
      description: The window the curve covers. Defaults to `ALL`.
      schema: {type: string, enum: ["1H", "1D", "1W", "1M", "3M", "6M", ALL], default: ALL, examples: [ALL]}
  # api/spec/social.yaml
    ChatCabalId:
      name: id
      in: path
      required: true
      description: The cabal id.
      schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
    ChatMessageId:
      name: message_id
      in: path
      required: true
      description: The message id.
      schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
  securitySchemes:
  # api/spec/base.yaml
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A bearer token in the Authorization header. Operations that declare an empty security
        list, such as /healthz, take no token. The token format belongs to the identity module;
        local development and tests use HS256 dev tokens from `monacoctl dev token`.
  responses:
  # api/spec/base.yaml
    Problem:
      description: An RFC 9457 problem. Switch on `code`; show `message`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
  # api/spec/admin.yaml
    AdminAccountStatus:
      type: string
      description: Whether the account may be used.
      enum: [active, suspended, banned, deleted]
      examples: [active]
    AdminActionKind:
      type: string
      description: What the administrator did.
      enum:
        - ops_pause
        - ops_resume
        - global_pause
        - global_resume
        - proposal_void
        - user_ban
        - user_unban
        - comment_remove
        - handle_revoke
        - handle_reassign
        - cabal_ban
        - ping_flag
      examples: [ping_flag]
    AdminActionRecord:
      type: object
      description: One audited admin action.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a805a
          admin_id: 01890a5d-ac96-774b-bcce-b302099a8059
          action: ping_flag
          target_type: system_ping
          target_id: 01890a5d-ac96-774b-bcce-b302099a8057
          reason: spam
          before: {flagged_at: null}
          after: {flagged_at: "2026-10-06T12:00:00Z"}
          approved_by: null
          created_at: "2026-10-06T12:00:00Z"
      required: [id, admin_id, action, target_type, target_id, reason, before, after, approved_by, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The action id. Ids sort by time, so a later action has a greater id.
          examples: [01890a5d-ac96-774b-bcce-b302099a805a]
        admin_id:
          type: string
          format: uuid
          description: The administrator who took the action.
          examples: [01890a5d-ac96-774b-bcce-b302099a8059]
        action: {$ref: "#/components/schemas/AdminActionKind"}
        target_type: {$ref: "#/components/schemas/AdminTargetType"}
        target_id:
          type: string
          description: The id of the target. Its format depends on `target_type`.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        reason:
          type: string
          description: The reason the administrator gave.
          examples: [spam]
        before:
          type: [object, "null"]
          x-go-type: rawjson.RawMessage
          x-go-type-import: {name: rawjson, path: encoding/json}
          description: The fields the action changed, as they were before. A JSON object, or null when nothing existed.
          examples: [{flagged_at: null}]
        after:
          type: [object, "null"]
          x-go-type: rawjson.RawMessage
          x-go-type-import: {name: rawjson, path: encoding/json}
          description: The fields the action changed, as they are now. A JSON object, or null.
          examples: [{flagged_at: "2026-10-06T12:00:00Z"}]
        approved_by:
          type: [string, "null"]
          format: uuid
          description: The second administrator who approved the action. Null unless the action needs approval.
          examples: [null]
        created_at:
          type: string
          format: date-time
          description: When the audit consumer recorded the action.
          examples: ["2026-10-06T12:00:00Z"]
    AdminActions:
      type: object
      description: One page of admin actions, newest first.
      examples:
        - items: []
          next_cursor: null
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The actions on this page.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: Pass it as `cursor` to read the next page. Null on the last page.
          examples: [null]
    AdminApproval:
      type: object
      description: A request that needs a second operator before it takes effect.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a805a
          action: cabal_ban
          target_id: 01890a5d-ac96-774b-bcce-b302099a8059
          requested_by: 01890a5d-ac96-774b-bcce-b302099a805b
          reason: scam cabal
          status: pending
          decided_by: null
          decided_reason: null
          created_at: "2026-10-08T12:00:00Z"
          decided_at: null
          expires_at: "2026-10-09T12:00:00Z"
      required: [id, action, target_id, requested_by, reason, status, decided_by, decided_reason, created_at, decided_at, expires_at]
      properties:
        id: {type: string, format: uuid, description: The id of the request., examples: ["01890a5d-ac96-774b-bcce-b302099a805a"]}
        action: {type: string, description: What the request asks for., enum: [cabal_ban], examples: [cabal_ban]}
        target_id: {type: string, format: uuid, description: The id of the cabal the request targets., examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        requested_by: {type: string, format: uuid, description: The operator who asked., examples: ["01890a5d-ac96-774b-bcce-b302099a805b"]}
        reason: {type: string, description: Why the requester asked., examples: [scam cabal]}
        status: {$ref: "#/components/schemas/AdminApprovalStatus"}
        decided_by: {type: [string, "null"], format: uuid, description: "The operator who approved or rejected it. Null while pending or expired.", examples: [null]}
        decided_reason: {type: [string, "null"], description: Why that operator decided., examples: [null]}
        created_at: {type: string, format: date-time, description: When the request was made., examples: ["2026-10-08T12:00:00Z"]}
        decided_at: {type: [string, "null"], format: date-time, description: "When it was approved, rejected or expired.", examples: [null]}
        expires_at: {type: string, format: date-time, description: When an undecided request expires., examples: ["2026-10-09T12:00:00Z"]}
    AdminApprovalStatus:
      type: string
      description: Where an approval request stands.
      enum: [pending, approved, rejected, expired]
      examples: [pending]
    AdminApprovals:
      type: object
      description: One page of approval requests, newest first.
      examples:
        - items: []
          next_cursor: null
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The requests on this page.
          items: {$ref: "#/components/schemas/AdminApproval"}
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: Pass it as `cursor` to read the next page. Null on the last page.
          examples: [null]
    AdminAuthState:
      type: string
      description: Where the user stands in onboarding.
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
      examples: [ONBOARDING_COMPLETED]
    AdminAuthTransition:
      type: object
      description: One change of auth state, read from a user.auth_state_changed event.
      examples:
        - from: CREATED
          to: AWAITING_PHONE
          cause: otp_sent
          at: "2026-10-06T12:00:00Z"
      required: [from, to, cause, at]
      properties:
        from: {type: string, description: The state the user left., examples: [CREATED]}
        to: {type: string, description: The state the user entered., examples: [AWAITING_PHONE]}
        cause: {type: string, description: What moved the user., examples: [otp_sent]}
        at: {type: string, format: date-time, description: When the user moved., examples: ["2026-10-06T12:00:00Z"]}
    AdminCabal:
      type: object
      description: One cabal as an operator sees them.
      examples:
        - id: 019cc330-2222-7000-8000-000000000001
          name: Tech bros
          status: active
          created_at: "2026-10-06T12:00:00Z"
          creator_id: 019cc330-1111-7000-8000-000000000001
          rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}
          member_count: 1
          members: []
          treasury_address: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
          positions: []
          pot_micros: "25000000"
          nav_per_share_micros: "1000000"
          valued_at: "2026-10-06T12:05:00Z"
          pauses: []
          recent_txns: []
          recent_admin_actions: []
      required:
        - id
        - name
        - status
        - created_at
        - creator_id
        - rules
        - member_count
        - members
        - treasury_address
        - positions
        - pot_micros
        - nav_per_share_micros
        - valued_at
        - pauses
        - recent_txns
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        name: {type: string, description: The cabal name., examples: [Tech bros]}
        status: {$ref: "#/components/schemas/AdminCabalStatus"}
        created_at: {type: string, format: date-time, description: When the cabal was created., examples: ["2026-10-06T12:00:00Z"]}
        creator_id: {type: string, format: uuid, description: The user who created the cabal., examples: [019cc330-1111-7000-8000-000000000001]}
        rules: {$ref: "#/components/schemas/AdminCabalRules"}
        member_count: {type: integer, format: int64, description: How many members the cabal has., examples: [1]}
        members:
          type: array
          description: Every member, oldest first.
          items: {$ref: "#/components/schemas/AdminCabalMember"}
        treasury_address: {type: string, description: The Solana address of the cabal treasury., examples: [9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin]}
        positions:
          type: array
          description: The tokens the treasury holds, USDC included. A mint the catalog does not list has a null symbol.
          items: {$ref: "#/components/schemas/AdminHolding"}
        pot_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: The pot value in USDC micros from the latest valuation run. Null before the cabal is first valued., examples: ["25000000"]}
        nav_per_share_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: The value of one share in USDC micros from the latest valuation run. Null before the cabal is first valued., examples: ["1000000"]}
        valued_at: {type: [string, "null"], format: date-time, description: When the cabal was last valued. Null before the cabal is first valued., examples: ["2026-10-06T12:05:00Z"]}
        pauses:
          type: array
          description: The pauses open on the cabal, a global pause first. Empty while trading runs.
          items: {$ref: "#/components/schemas/AdminCabalPause"}
        recent_txns:
          type: array
          maxItems: 20
          description: The 20 newest ledger transactions of the cabal, newest first.
          items: {$ref: "#/components/schemas/AdminTxnHeader"}
        recent_admin_actions:
          type: array
          maxItems: 20
          description: The 20 newest admin actions on the cabal, newest first.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
    AdminCabalMember:
      type: object
      description: One member of a cabal with the shares they hold.
      examples:
        - user_id: 019cc330-1111-7000-8000-000000000001
          handle: devadmin
          role: creator
          can_vote: true
          joined_at: "2026-10-06T12:00:00Z"
          share_units: "25000000"
      required: [user_id, handle, role, can_vote, joined_at, share_units]
      properties:
        user_id: {type: string, format: uuid, description: The user id., examples: [019cc330-1111-7000-8000-000000000001]}
        handle: {type: [string, "null"], description: The handle. Null before the user picks one., examples: [devadmin]}
        role: {type: string, description: "The role: creator or member.", examples: [creator]}
        can_vote: {type: boolean, description: Whether the member votes on proposals., examples: [true]}
        joined_at: {type: string, format: date-time, description: When the member joined., examples: ["2026-10-06T12:00:00Z"]}
        share_units: {type: string, pattern: "^[0-9]+$", description: The share units as a decimal integer. Zero for a member without a stake., examples: ["25000000"]}
    AdminCabalPause:
      type: object
      description: One reason trading is paused in a cabal.
      examples:
        - {reason: external_deposit, scope: cabal, since: "2026-10-07T12:00:00Z"}
      required: [reason, scope, since]
      properties:
        reason: {type: string, enum: [external_deposit, ops], description: "Why trading is paused: an operator's pause or a direct transfer not yet sent back.", examples: [ops]}
        scope: {type: string, enum: [global, cabal], description: Whether the pause covers every cabal or only this one., examples: [cabal]}
        since: {type: string, format: date-time, description: When the oldest pause with this reason and scope began., examples: ["2026-10-07T12:00:00Z"]}
    AdminCabalRef:
      type: object
      description: A cabal named by id.
      examples:
        - id: 019cc330-2222-7000-8000-000000000001
          name: Tech bros
      required: [id, name]
      properties:
        id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        name: {type: string, description: The cabal name., examples: [Tech bros]}
    AdminCabalRules:
      type: object
      description: The rules the cabal runs on.
      examples:
        - join_mode: open
          voter_mode: all
          threshold: majority
          proposal_expiry_seconds: 86400
          slippage_bps: 100
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps]
      properties:
        join_mode: {type: string, description: "`open` (anyone joins at once) or `request` (the creator approves each request).", examples: [open]}
        voter_mode: {type: string, description: "Who votes: all or list.", examples: [all]}
        threshold: {type: string, description: "What passes a proposal: majority or unanimous.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int64, description: How long a proposal stays open., examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "The slippage the cabal accepts, in basis points.", examples: [100]}
    AdminCabalStatus:
      type: string
      description: Whether the cabal may trade.
      enum: [active, banned]
      examples: [active]
    AdminHolding:
      type: object
      description: One token the cabal treasury holds.
      examples:
        - mint: XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp
          symbol: AAPLx
          units: "300000000"
      required: [mint, symbol, units]
      properties:
        mint: {type: string, description: The token mint address., examples: [XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp]}
        symbol: {type: [string, "null"], description: The catalog symbol. Null for a mint the catalog does not list., examples: [AAPLx]}
        units: {type: string, pattern: "^[0-9]+$", description: "The base units held, as a decimal integer.", examples: ["300000000"]}
    AdminLedgerTxn:
      type: object
      description: One ledger transaction with its entries.
      examples:
        - id: 019cc330-3333-7000-8000-000000000001
          scope: cabal
          user_id: null
          cabal_id: 019cc330-2222-7000-8000-000000000001
          kind: swap
          status: settled
          swap_id: 019cc330-4444-7000-8000-000000000001
          transfer_id: null
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          entries: []
      required: [id, scope, user_id, cabal_id, kind, status, swap_id, transfer_id, tx_signature, created_at, entries]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [019cc330-3333-7000-8000-000000000001]}
        scope: {$ref: "#/components/schemas/AdminTxnScope"}
        user_id: {type: [string, "null"], format: uuid, description: The user of a user-scope transaction. Null in the cabal scope., examples: [null]}
        cabal_id: {type: [string, "null"], format: uuid, description: The cabal the transaction touches. Null for a deposit or withdrawal., examples: [019cc330-2222-7000-8000-000000000001]}
        kind: {type: string, description: "The kind: deposit, withdrawal, fund, cash_out or swap.", examples: [swap]}
        status: {type: string, description: "The status: pending, settled or failed.", examples: [settled]}
        swap_id: {type: [string, "null"], format: uuid, description: The swap a cabal-scope swap transaction records. Null otherwise., examples: [019cc330-4444-7000-8000-000000000001]}
        transfer_id: {type: [string, "null"], format: uuid, description: The fund or withdrawal transfer that links a user and a cabal transaction., examples: [null]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the transaction has one., examples: [null]}
        created_at: {type: string, format: date-time, description: When the ledger recorded it., examples: ["2026-10-06T12:00:00Z"]}
        entries:
          type: array
          description: The entries of the transaction, in order.
          items: {$ref: "#/components/schemas/AdminTxnEntry"}
    AdminMe:
      type: object
      description: An active administrator and their role.
      examples:
        - user_id: 019cc330-1111-7000-8000-000000000001
          role: operator
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: The administrator's user id.
          examples: [019cc330-1111-7000-8000-000000000001]
        role: {$ref: "#/components/schemas/AdminRole"}
    AdminQueue:
      type: object
      description: One queue and its size.
      examples:
        - {name: stuck_txns, count: 0, href: /v1/admin/queues/stuck-txns}
      required: [name, count, href]
      properties:
        name: {type: string, description: "The queue: stuck_txns, unpublished_events or dead_letters.", examples: [stuck_txns]}
        count: {type: integer, format: int64, description: How many items the queue holds., examples: [0]}
        href: {type: string, description: The route that lists the queue., examples: [/v1/admin/queues/stuck-txns]}
    AdminQueues:
      type: object
      description: The size of every queue.
      examples:
        - queues: [{name: stuck_txns, count: 0, href: /v1/admin/queues/stuck-txns}]
      required: [queues]
      properties:
        queues:
          type: array
          description: The queues, in the order the panel shows them.
          items: {$ref: "#/components/schemas/AdminQueue"}
    AdminRole:
      type: string
      description: The administrator's access level.
      enum: [viewer, moderator, operator]
      examples: [operator]
    AdminSharePosition:
      type: object
      description: The share units a user holds in one cabal.
      examples:
        - cabal_id: 019cc330-2222-7000-8000-000000000001
          share_units: "25000000"
      required: [cabal_id, share_units]
      properties:
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        share_units: {type: string, pattern: "^[0-9]+$", description: The share units as a decimal integer., examples: ["25000000"]}
    AdminSwap:
      type: object
      description: One swap with the history of its trade events.
      examples:
        - id: 019cc330-4444-7000-8000-000000000001
          status: submitted
          failure_code: null
          execute_request_id: req-1
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          status_history: []
      required: [id, status, failure_code, execute_request_id, tx_signature, created_at, status_history]
      properties:
        id: {type: string, format: uuid, description: The swap id., examples: [019cc330-4444-7000-8000-000000000001]}
        status: {type: string, description: "The status: created, submitted, confirmed or failed.", examples: [submitted]}
        failure_code: {type: [string, "null"], description: Why the swap failed. Null unless it failed., examples: [null]}
        execute_request_id: {type: [string, "null"], description: The Jupiter execute request id. Null until the swap is submitted., examples: [req-1]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the swap is submitted., examples: [null]}
        created_at: {type: string, format: date-time, description: When the swap was created., examples: ["2026-10-06T12:00:00Z"]}
        status_history:
          type: array
          description: The trade events of the swap, oldest first.
          items: {$ref: "#/components/schemas/AdminSwapEvent"}
    AdminSwapEvent:
      type: object
      description: One trade event of a swap.
      examples:
        - {type: trade.submitted, at: "2026-10-06T12:00:00Z"}
      required: [type, at]
      properties:
        type: {type: string, description: "The event type: trade.submitted, trade.confirmed or trade.failed.", examples: [trade.submitted]}
        at: {type: string, format: date-time, description: When the event was recorded., examples: ["2026-10-06T12:00:00Z"]}
    AdminTargetType:
      type: string
      description: The kind of thing the action changed.
      enum: [cabal, proposal, user, comment, handle, system_ping, global]
      examples: [system_ping]
    AdminTxn:
      type: object
      description: >-
        One transaction as an operator sees it. At least one of `ledger` and `swap` is present. `explorer_url`
        is present when a signature is known.
      examples:
        - explorer_url: "https://solscan.io/tx/5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW"
      properties:
        ledger: {$ref: "#/components/schemas/AdminLedgerTxn"}
        swap: {$ref: "#/components/schemas/AdminSwap"}
        explorer_url: {type: string, description: The Solscan page of the signature on mainnet., examples: ["https://solscan.io/tx/5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW"]}
    AdminTxnEntry:
      type: object
      description: One signed line of a ledger transaction.
      examples:
        - {seq: 0, account: wallet, asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, amount: "-10000000"}
      required: [seq, account, asset, amount]
      properties:
        seq: {type: integer, format: int32, description: The position of the entry in the transaction., examples: [0]}
        account: {type: string, description: "The account the entry moves, such as wallet or treasury.", examples: [wallet]}
        asset: {type: string, description: "The asset moved: a mint address or a shares asset.", examples: [EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]}
        amount: {type: string, pattern: "^-?[0-9]+$", description: The signed amount in base units as a decimal integer., examples: ["-10000000"]}
    AdminTxnHeader:
      type: object
      description: The header of one ledger transaction, without its entries.
      examples:
        - id: 019cc330-3333-7000-8000-000000000001
          scope: user
          kind: fund
          status: settled
          cabal_id: 019cc330-2222-7000-8000-000000000001
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
      required: [id, scope, kind, status, cabal_id, tx_signature, created_at]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [019cc330-3333-7000-8000-000000000001]}
        scope: {$ref: "#/components/schemas/AdminTxnScope"}
        kind: {type: string, description: "The kind: deposit, withdrawal, fund, cash_out or swap.", examples: [fund]}
        status: {type: string, description: "The status: pending, settled or failed.", examples: [settled]}
        cabal_id:
          type: [string, "null"]
          format: uuid
          description: The cabal the transaction touches. Null for a deposit or withdrawal.
          examples: [019cc330-2222-7000-8000-000000000001]
        tx_signature:
          type: [string, "null"]
          description: The Solana signature. Null until the transaction has one.
          examples: [null]
        created_at: {type: string, format: date-time, description: When the ledger recorded it., examples: ["2026-10-06T12:00:00Z"]}
    AdminTxnScope:
      type: string
      description: Which ledger the transaction sits in.
      enum: [user, cabal]
      examples: [user]
    AdminUser:
      type: object
      description: One user as an operator sees them. It carries no email, phone number or X handle.
      examples:
        - id: 019cc330-1111-7000-8000-000000000001
          handle: devadmin
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          phone_verified: true
          x_linked: false
          created_at: "2026-10-06T12:00:00Z"
          first_deposit_at: null
          wallet: 9xQe…VFin
          auth_state_history: []
          cabals: []
          positions: []
          recent_txns: []
          recent_admin_actions: []
      required:
        - id
        - handle
        - auth_state
        - account_status
        - phone_verified
        - x_linked
        - created_at
        - first_deposit_at
        - wallet
        - auth_state_history
        - cabals
        - positions
        - recent_txns
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The user id., examples: [019cc330-1111-7000-8000-000000000001]}
        handle: {type: [string, "null"], description: The handle. Null before the user picks one., examples: [devadmin]}
        auth_state: {$ref: "#/components/schemas/AdminAuthState"}
        account_status: {$ref: "#/components/schemas/AdminAccountStatus"}
        phone_verified: {type: boolean, description: Whether the user verified a phone number., examples: [true]}
        x_linked: {type: boolean, description: Whether the user linked an X account., examples: [false]}
        created_at: {type: string, format: date-time, description: When the user signed up., examples: ["2026-10-06T12:00:00Z"]}
        first_deposit_at:
          type: [string, "null"]
          format: date-time
          description: When the first deposit arrived. Null if none did.
          examples: [null]
        wallet:
          type: [string, "null"]
          description: The wallet address as its first four and last four characters. Null when the user has no wallet.
          examples: ["9xQe…VFin"]
        auth_state_history:
          type: array
          description: Every auth state change, oldest first.
          items: {$ref: "#/components/schemas/AdminAuthTransition"}
        cabals:
          type: array
          description: The cabals the user belongs to.
          items: {$ref: "#/components/schemas/AdminCabalRef"}
        positions:
          type: array
          description: The cabals where the user holds shares.
          items: {$ref: "#/components/schemas/AdminSharePosition"}
        recent_txns:
          type: array
          maxItems: 20
          description: The 20 newest ledger transactions of the user, newest first.
          items: {$ref: "#/components/schemas/AdminTxnHeader"}
        recent_admin_actions:
          type: array
          maxItems: 20
          description: The 20 newest admin actions on the user, newest first.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
    Admins:
      type: object
      description: The active administrator list.
      examples:
        - admins:
            - user_id: 019cc330-1111-7000-8000-000000000001
              role: operator
      required: [admins]
      properties:
        admins:
          type: array
          description: Every non-revoked administrator.
          items: {$ref: "#/components/schemas/AdminMe"}
    DeadLetter:
      type: object
      description: One dead letter, without its stored message body.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a805a
          stream_seq: 12
          consumer: analytics
          handler: analytics.posthog.follow.created
          subject: events.follow.created
          event_id: 01890a5d-ac96-774b-bcce-b302099a8057
          code: posthog_rejected
          error: "posthog.Capture: posthog_rejected"
          occurrences: 1
          status: open
          first_seen_at: "2026-10-06T12:00:00Z"
          last_seen_at: "2026-10-06T12:00:00Z"
          redriven_at: null
          resolved_at: null
          resolved_by: null
          resolve_reason: null
      required:
        - id
        - stream_seq
        - consumer
        - handler
        - subject
        - event_id
        - code
        - error
        - occurrences
        - status
        - first_seen_at
        - last_seen_at
        - redriven_at
        - resolved_at
        - resolved_by
        - resolve_reason
      properties:
        id:
          type: string
          format: uuid
          description: The dead letter id. Ids sort by time, so a later letter has a greater id.
          examples: [01890a5d-ac96-774b-bcce-b302099a805a]
        stream_seq:
          type: integer
          format: int64
          description: The sequence of the letter in the dead-letter stream, or of the latest one for a reopened row.
          examples: [12]
        consumer:
          type: string
          description: The durable consumer that gave up on the message.
          examples: [analytics]
        handler:
          type: string
          description: The handler that failed. Empty for a max-deliveries letter.
          examples: [analytics.posthog.follow.created]
        subject:
          type: string
          description: The subject of the message. Empty when the original event has left the stream.
          examples: [events.follow.created]
        event_id:
          type: [string, "null"]
          format: uuid
          description: The id of the event. Null when the original event has left the stream.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        code:
          type: string
          description: The error code of the failure, or `max_deliveries`.
          examples: [posthog_rejected]
        error:
          type: string
          description: The error text of the failure.
          examples: ["posthog.Capture: posthog_rejected"]
        occurrences:
          type: integer
          format: int32
          description: How many times the message ended in a dead letter, counting redrives that failed again.
          examples: [1]
        status: {$ref: "#/components/schemas/DeadLetterStatus"}
        first_seen_at:
          type: string
          format: date-time
          description: When the sink first recorded the letter.
          examples: ["2026-10-06T12:00:00Z"]
        last_seen_at:
          type: string
          format: date-time
          description: When the sink last recorded the letter.
          examples: ["2026-10-06T12:00:00Z"]
        redriven_at:
          type: [string, "null"]
          format: date-time
          description: When an administrator last redrove the letter. Null if none did.
          examples: [null]
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: When the letter was resolved or discarded. Null while it is open or redriven.
          examples: [null]
        resolved_by:
          type: [string, "null"]
          format: uuid
          description: The administrator who last redrove or discarded the letter. Null if none did.
          examples: [null]
        resolve_reason:
          type: [string, "null"]
          description: The reason that administrator gave. Null if none did.
          examples: [null]
    DeadLetterStatus:
      type: string
      description: Where a dead letter stands in the queue.
      enum: [open, redriven, resolved, discarded]
      examples: [open]
    DeadLetters:
      type: object
      description: One page of dead letters, newest first.
      examples:
        - items: []
          next_cursor: null
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The letters on this page.
          items: {$ref: "#/components/schemas/DeadLetter"}
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: Pass it as `cursor` to read the next page. Null on the last page.
          examples: [null]
    StuckTxn:
      type: object
      description: One swap that has not finished.
      examples:
        - id: 019cc330-4444-7000-8000-000000000001
          cabal_id: 019cc330-2222-7000-8000-000000000001
          action: buy
          symbol: AAPLx
          status: submitted
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          age_seconds: 400
      required: [id, cabal_id, action, symbol, status, tx_signature, created_at, age_seconds]
      properties:
        id: {type: string, format: uuid, description: The swap id. Pass it to the transaction lookup., examples: [019cc330-4444-7000-8000-000000000001]}
        cabal_id: {type: string, format: uuid, description: The cabal that trades., examples: [019cc330-2222-7000-8000-000000000001]}
        action: {type: string, description: "Whether the swap buys or sells.", examples: [buy]}
        symbol: {type: string, description: The symbol of the token traded., examples: [AAPLx]}
        status: {type: string, description: "The status: created or submitted.", examples: [submitted]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the swap is submitted., examples: [null]}
        created_at: {type: string, format: date-time, description: When the swap was created., examples: ["2026-10-06T12:00:00Z"]}
        age_seconds: {type: integer, format: int64, description: Seconds since the swap was created., examples: [400]}
    StuckTxns:
      type: object
      description: The stuck swaps, oldest first.
      examples:
        - items: []
      required: [items]
      properties:
        items:
          type: array
          description: The swaps.
          items: {$ref: "#/components/schemas/StuckTxn"}
    UnpublishedEvent:
      type: object
      description: One events row the relay has not published.
      examples:
        - id: 019cc330-5555-7000-8000-000000000001
          type: trade.submitted
          aggregate: {type: swap, id: 019cc330-4444-7000-8000-000000000001}
          created_at: "2026-10-06T12:00:00Z"
          age_seconds: 45
      required: [id, type, aggregate, created_at, age_seconds]
      properties:
        id: {type: string, format: uuid, description: The event id., examples: [019cc330-5555-7000-8000-000000000001]}
        type: {type: string, description: The event type., examples: [trade.submitted]}
        aggregate:
          type: object
          description: The aggregate the event belongs to.
          required: [type, id]
          properties:
            type: {type: string, description: The aggregate type., examples: [swap]}
            id: {type: string, format: uuid, description: The aggregate id., examples: [019cc330-4444-7000-8000-000000000001]}
        created_at: {type: string, format: date-time, description: When the event was recorded., examples: ["2026-10-06T12:00:00Z"]}
        age_seconds: {type: integer, format: int64, description: Seconds since the event was recorded., examples: [45]}
    UnpublishedEvents:
      type: object
      description: The unpublished events, oldest first.
      examples:
        - items: []
      required: [items]
      properties:
        items:
          type: array
          description: The events.
          items: {$ref: "#/components/schemas/UnpublishedEvent"}
  # api/spec/analytics.yaml
    DashboardBucket:
      type: string
      description: The size of one bucket.
      enum: [day, week]
      examples: [day]
    DashboardCabals:
      type: object
      description: How many cabals exist and how large they are.
      examples:
        - total: 12
          banned: 1
          members_p50: 4
          members_p90: 9
          members_max: 15
      required: [total, banned, members_p50, members_p90, members_max]
      properties:
        total: {type: integer, format: int64, description: "Cabals, banned ones included.", examples: [12]}
        banned: {type: integer, format: int64, description: Banned cabals., examples: [1]}
        members_p50: {type: integer, format: int64, description: Members of the median cabal., examples: [4]}
        members_p90: {type: integer, format: int64, description: Members of the cabal at the 90th percentile., examples: [9]}
        members_max: {type: integer, format: int64, description: Members of the largest cabal., examples: [15]}
    DashboardMicros:
      type: string
      description: A USDC amount in micros as a decimal string.
      pattern: "^(0|[1-9][0-9]*)$"
      examples: ["25000000"]
    DashboardPoint:
      type: object
      description: The number of events of one metric and group in one bucket.
      examples:
        - bucket_start: "2026-09-01T00:00:00Z"
          metric: follows_created
          group: contacts
          count: 4
      required: [bucket_start, metric, group, count]
      properties:
        bucket_start: {type: string, format: date-time, description: The start of the bucket in UTC., examples: ["2026-09-01T00:00:00Z"]}
        metric: {type: string, description: What was counted., examples: [follows_created]}
        group: {type: string, description: "The value the metric is grouped by, empty when the metric has no grouping.", examples: [contacts]}
        count: {type: integer, format: int64, description: Events in the bucket., examples: [4]}
    GovernanceBucket:
      type: object
      description: The proposal events of one bucket.
      examples:
        - bucket_start: "2026-09-01T00:00:00Z"
          created: 3
          passed: 1
          failed: 1
          expired: 0
          execution_blocked: 0
      required: [bucket_start, created, passed, failed, expired, execution_blocked]
      properties:
        bucket_start: {type: string, format: date-time, description: The start of the bucket in UTC., examples: ["2026-09-01T00:00:00Z"]}
        created: {type: integer, format: int64, description: Proposals opened., examples: [3]}
        passed: {type: integer, format: int64, description: Proposals that passed., examples: [1]}
        failed: {type: integer, format: int64, description: Proposals that failed., examples: [1]}
        expired: {type: integer, format: int64, description: Proposals that expired., examples: [0]}
        execution_blocked: {type: integer, format: int64, description: Passed proposals whose trade was blocked., examples: [0]}
    GovernanceDashboard:
      type: object
      description: Proposal activity and voter participation.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          open_proposals: 2
          passed_in_range: 4
          median_seconds_to_pass: 10800
          buckets: []
          participation: []
      required: [from, to, bucket, open_proposals, passed_in_range, median_seconds_to_pass, buckets, participation]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        open_proposals: {type: integer, format: int64, description: Proposals open now., examples: [2]}
        passed_in_range: {type: integer, format: int64, description: Proposals that passed in the range., examples: [4]}
        median_seconds_to_pass: {type: [integer, "null"], format: int64, description: The median seconds from creation to pass over the proposals that passed in the range. Null when none did., examples: [10800]}
        buckets:
          type: array
          description: The buckets with proposal events, oldest first.
          items: {$ref: "#/components/schemas/GovernanceBucket"}
        participation:
          type: array
          description: One row per cabal that opened a proposal in the range, by cabal id.
          items: {$ref: "#/components/schemas/GovernanceParticipation"}
    GovernanceParticipation:
      type: object
      description: How much of its electorate one cabal used on the proposals it opened in the range.
      examples:
        - cabal_id: 019cc330-1111-7000-8000-000000000001
          proposals: 2
          eligible_votes: 6
          votes_cast: 3
          participation_bps: 5000
      required: [cabal_id, proposals, eligible_votes, votes_cast, participation_bps]
      properties:
        cabal_id: {type: string, format: uuid, description: The cabal., examples: [019cc330-1111-7000-8000-000000000001]}
        proposals: {type: integer, format: int64, description: Proposals the cabal opened in the range., examples: [2]}
        eligible_votes: {type: integer, format: int64, description: Votes the voters could cast across those proposals., examples: [6]}
        votes_cast: {type: integer, format: int64, description: Votes cast across those proposals., examples: [3]}
        participation_bps: {type: integer, format: int64, description: "Votes cast out of the votes eligible in basis points, 0 when none were eligible.", examples: [5000]}
    MoneyBucket:
      type: object
      description: The settled money movement of one bucket.
