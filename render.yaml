# Staging: api and worker from one image, both reading the monaco-staging env group.
# Secrets live in the encrypted .env.staging and reach the group through the Render API, not this file.
envVarGroups:
  - name: monaco-staging
    envVars:
      - key: MONACO_ENV
        value: staging
      - key: APP_ENV
        value: staging
      - key: LOG_FORMAT
        value: json
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: NATS_URL
        value: tls://connect.ngs.global
      - key: NATS_CREDS
        value: /etc/secrets/nats.creds

services:
  - type: web
    name: monaco-api
    runtime: docker
    repo: https://github.com/Munyon-Canyon/monaco
    branch: staging
    region: virginia
    plan: starter
    dockerfilePath: ./apps/backend/deployments/Dockerfile
    dockerContext: .
    # Render restarts on this path, so it stays liveness. /readyz on the same port fails when the
    # business pool hands out no connection within a second; point the uptime probe there, not here.
    healthCheckPath: /healthz
    # Render runs this without a shell, so the steps live in apps/backend/deployments/predeploy.sh.
    preDeployCommand: predeploy
    buildFilter:
      paths:
        - apps/backend/**
        - render.yaml
    envVars:
      - key: PORT
        value: "8080"
      - key: MONACO_DB_MAX_CONNS
        value: "4"
      - fromGroup: monaco-staging

  - type: worker
    name: monaco-worker
    runtime: docker
    repo: https://github.com/Munyon-Canyon/monaco
    branch: staging
    region: virginia
    plan: starter
    dockerfilePath: ./apps/backend/deployments/Dockerfile
    dockerContext: .
    dockerCommand: worker
    # The worker serves /healthz (liveness) and /readyz on MONACO_WORKER_HEALTH_ADDR. /readyz fails when a money
    # poller has no successful run within three tick budgets and prints the progress signals.
    buildFilter:
      paths:
        - apps/backend/**
        - render.yaml
    envVars:
      - key: MONACO_DB_MAX_CONNS
        value: "4"
      - fromGroup: monaco-staging
