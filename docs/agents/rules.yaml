# Single source of the agent-facing rules in AGENTS.md and the monaco-milestone skill.
# `go generate ./...` in apps/backend renders each rule into the GENERATED region of every file
# named by `surface`. A rule whose enforced_by is not `prose` renders as one pointer line and its
# text is not rendered, so delete a rule's wording once a check enforces it.
#
# id          unique; the A-numbers match the rule inventory, D- rules are descriptive context
# title       the pointer line's label
# text        the rule as written for agents
# audience    all | root | owner | verifier
# surface     agents-md | monaco-milestone. Empty means the sentence stays hand-written in the
#             Learned Workspace Facts section of AGENTS.md and the rule is only recorded here
# enforced_by prose | hook:<rule_ in scripts/agent-guard.py, or a file in scripts/> |
#             lint:<repo path> | ci:<workflow file stem> | test:<repo path> |
#             gen:<repo path> | runtime:<repo path>
# covers      inventory ids this rule's text also states
# phrase      a phrase briefs must not restate; rendered into docs/agents/enforced.txt
#
# legacy_phrases are enforced rules from docs/agents/*.md that have no rule here yet.

legacy_phrases:
  - "conventional commit"
  - "inline pr body"
  - "gt submit --publish"
  - "gh pr ready"
  - "local mutation"
  - "gremlins"
  - "monacoctl mutation"
  - "git push"
  - "git rebase"
  - "1000 changed lines"
  - "ready job"
  - "poteto-agent"
  - "subagent_type"
  - "general-purpose"
  - "fable"
  - "land, then write"
  - "gt sync"
  - "gh run watch"
  - "pr checks --watch"
rules:
  - id: A01
    title: "just recipes"
    text: "Keep `just` recipes minimal: `just build`, `just test`, `just run`, `just stop`, and `just reset` per app (`backend` or `mobile`), plus root variants, `just migrate db`, `just install` (clone setup), `just encrypt`, `just decrypt`, `just show-env` (dotenvx on `.env.local`; encrypt/decrypt also touch `.env.production` and `.env.staging` when present; show-env is `.env.local` only via `with-dotenv-local.sh`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D01
    title: "relayer balance"
    text: "`just relayer balance` builds `bin/monacoctl` and runs `monacoctl relayer balance`, which prints the relayer pubkey from `RELAYER_PRIVATE_KEY` and its SOL balance from `SOLANA_RPC_URL` (`.env.local`, so mainnet)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D02
    title: "backend build and run"
    text: "`just build backend` writes `bin/api`, `bin/worker` and `bin/monacoctl`; `just run backend` starts api (`:8080`) and worker (`:8081`, health only) and also serves the card fund page (`apps/web`, Vite) on `:5173` unless that port is taken, and `just stop backend` SIGTERMs all three (the fund page only if it is this checkout's Vite); `MONACO_FUND_PAGE_PORT=off` skips the page (journey slots)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D03
    title: "compose services"
    text: "`just run backend` starts Compose `postgres` and `nats`; `just test backend` starts `postgres-test` (`monaco-postgres-test`, port 54323, tmpfs, durability off) if it is down."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D04
    title: "reset"
    text: "`just reset` = stop all + wipe every Compose volume (Postgres and NATS); `just reset db` = Postgres only, NATS data kept."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D05
    title: "migrate"
    text: "`just migrate db` applies pending migrations to the `.env.local` database, then the NATS stream config (`monacoctl bus apply`); `just run backend` does neither, and a database behind the binary stops boot with `db_schema_behind`, a stream missing a new event subject with `config differs from the declared one`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D06
    title: "killports and interrupts"
    text: "`just killports` kills the api, worker and fund page listeners (8080, 8081, 5173), not Compose Postgres (54322). Ctrl-C on `just run`, or a failed iOS build, stops the backend too."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D07
    title: "run mobile against staging"
    text: "`just run mobile --env staging` (or `just run --env staging`) runs only the app, on the simulator against the Render staging API with the staging Privy app; `--env` defaults to `local`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D08
    title: "stop mobile"
    text: "`just stop mobile` and full `just reset` uninstall `xyz.monacolabs.app` to clear Privy session (`scripts/stop-mobile.sh`): in a linked worktree only on its own sims and builds; in the primary checkout on every sim except live worktrees', deleting sims of removed worktrees."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A02
    title: "test mobile"
    text: "When the user says \"test mobile\" or runs `just test mobile`, run host `swift test` in `packages/mobile-core` (fast, deterministic; no iOS Simulator or `xcodebuild test`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D09
    title: "simulator resolution"
    text: "`just build mobile` / `just run mobile` / `scripts/ios-build` / `./scripts/ios-sim` use `scripts/resolve-ios-sim.sh`: in a linked worktree its own sim `Monaco <lane>` (created on first use; builds go to the checkout's `.build/DerivedData` under RAM-sized `xcode-lock.sh` slots), in the primary checkout SimSlim when ready, else stock sim with stderr warning; `MONACO_SIM_UDID` overrides both (`docs/how-to/local-simulator.md`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A03
    title: "no sim for unit tests"
    text: "Do not boot a sim for unit tests."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A04
    title: "no committed UDID"
    text: "Never commit a UDID."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A05
    title: "no simctl erase"
    text: "Never `simctl erase`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D10
    title: "agent tap-through"
    text: "Agent tap-through may use `.cursor/skills/ios-simslim-fast-qa/SKILL.md` or MobileBuildMCP with `--simulator-id` from `scripts/gold-sim-udid.sh` (the worktree's own sim in a lane; in primary fail-loud if `SIMSLIM_UDID` is unset; not used by human `just run`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A06
    title: "no scripted taps"
    text: "Do not drive taps with AppleScript, CGEvent, or coordinate hacks."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A07
    title: "backend tests use stubs"
    text: "For `just test backend`, use stubs/mocks only—never hit the live Jupiter API."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A08
    title: "long property tests"
    text: "Trim property tests that run longer than ~2 minutes."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A09
    title: "relative test dates"
    text: "Tests must not hardcode wall-clock dates that age out (freshness/staleness checks): stamp fixtures relative to `time.Now()`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A10
    title: "app directory names"
    text: "App directories are `apps/backend` and `apps/mobile` by intentional rename; do not refer to or recreate `apps/api` or `apps/ios`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D11
    title: "Xcode project name"
    text: "The iOS Xcode project/scheme may stay named `Monaco` under `apps/mobile`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D12
    title: "dotenvx secrets"
    text: "Use dotenvx for repo secrets (`.env.local` for dev, `.env.production` for prod). Teammates share encrypted `.env.local` plus `.env.keys` in the clone root (gitignored). Without `.env.keys`, `with-dotenv-local.sh` decrypts from an exported `DOTENV_PRIVATE_KEY_LOCAL` / `DOTENV_PRIVATE_KEY` (how cloud agents get secrets). Backend `just run` / `just test backend` re-exec under `scripts/with-dotenv-local.sh`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A11, A12, A54]
  - id: D13
    title: "mobile Privy environment"
    text: "Mobile Privy: `ensure-ios-privy-config.sh` → xcconfig; `with-ios-privy-env.sh` / `./scripts/ios-sim` → `SIMCTL_CHILD_*` at simctl launch only (relaunch from sim home icon drops creds). iOS scripts require `PRIVY_APP_CLIENT_ID` from decrypted `.env.local`—legacy `PRIVY_AUTH_ID` in plain `.env` must not substitute. Justfile `dotenv-load` only reads plain `.env`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A13]
  - id: A14
    title: "machine-agnostic onboarding"
    text: "Repo onboarding must be machine-agnostic—another dev clones, decrypts, and runs the same way; prune machine-specific docs or commands."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A15
    title: "small Graphite stacks"
    text: "Ship changes as Graphite stacks of small PRs, never one large PR. Graphite (`gt`) is a required tool installed by `just install`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A16
    title: "Graphite branching"
    text: "Create branches with `gt create`, amend with `gt modify`, push with `gt submit --stack --no-interactive --draft`, and never open a stacked PR with `gh pr create`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A17]
  - id: A18
    title: "each PR stands alone"
    text: "Each PR builds and passes `monacoctl agents check` on its own; CI runs the full suite on the top PR of a stack only, so lower PRs are proven by `agents check`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A19
    title: "no PR size cap"
    text: "There is no PR size cap; split a branch only when the split helps a reader."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A20]
  - id: D14
    title: "PR format check is advisory"
    text: "The PR format check is advisory: `pr-format.yml` warns and stays green, and `scripts/pr-body.sh` sets the body even when the check finds problems, so fix findings when convenient and never loop on them."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A21
    title: "PR title and body"
    text: "PR titles say what the PR changes, present tense, with no issue number or commit-type prefix (link the issue under Why), and bodies follow `.github/pull_request_template.md` (pr-summary style: TLDR, Why, What changed, Proof, What came up, Reviewer focus), set with `scripts/pr-body.sh <pr> \"<title>\" <file>`, which runs the PR format check and marks the draft ready."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A22, A23]
  - id: A24
    title: "trunk is staging"
    text: "Stacks build on the trunk `staging` (the default branch) and land through the Graphite merge queue."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A25
    title: "land right after submit"
    text: "Always land: right after `gt submit` and `scripts/pr-body.sh`, run `monacoctl agents land-stack <top-pr>` once without asking, unless the user says in the current conversation not to land or queue, then follow it with `monacoctl agents watch` under Monitor."
    audience: all
    surface: [agents-md, monaco-milestone, backend-agents-md]
    enforced_by: prose
    covers: [A26]
  - id: S02
    title: "arming and the queue"
    text: "If stage 1 is still running, `land-stack` arms the stack, and `agents watch` lands it once stage 1 passes, or prints `armed stack #<top> disarmed: ...` when it fails. The verifier's `verify` status is advisory: landing does not wait on it. It adds the `merge-queue` label to every PR of the stack, and the queue squashes each PR into one commit on `staging` (title, ` (#N)`, then the body), so a landed PR shows as closed, not merged (merged when it landed on stage 0), a `revert-<top>` PR from `agents watch` is landed, not fought, and `Closes #N` in its body closes the ticket."
    audience: root
    surface: [monaco-milestone]
    enforced_by: prose
  - id: A27
    title: "no direct merge"
    text: "Never `gh pr merge` (direct or `--auto`)."
    audience: all
    surface: [agents-md, monaco-milestone]
    enforced_by: hook:rule_merge_needs_verify
    phrase: "merge without verify"
  - id: A27E
    title: "no base edits"
    text: "Never `gh pr edit --base`."
    audience: all
    surface: [agents-md, monaco-milestone]
    enforced_by: hook:rule_edit_base
  - id: A29
    title: "no Lands stack line"
    text: "No `Lands stack:` line and no `<feature>-checkpoint-<N>` branches."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A28
    title: "queue labels"
    text: "Never add `merge-queue` or `fast-track` by hand (`fast-track` is human only, for PRs under 100 counted lines)."
    audience: all
    surface: [agents-md, monaco-milestone]
    enforced_by: hook:rule_queue_label
  - id: A30
    title: "dropped from the queue"
    text: "If a stack drops out of the queue, fix it with `gt modify` and `gt submit --stack`, then rerun `land-stack`."
    audience: root
    surface: [monaco-milestone]
    enforced_by: prose
  - id: A31D
    title: "dequeue first"
    text: "To change a queued stack, run `monacoctl agents dequeue <top-pr>` first."
    audience: all
    surface: [agents-md, monaco-milestone]
    enforced_by: prose
  - id: A31
    title: "queued stack guard"
    text: "The agent guard hook blocks `gt submit`, `gt modify`, `gt restack` and `git push` on a stack while any of its PRs carries `merge-queue`."
    audience: all
    surface: [agents-md, monaco-milestone]
    enforced_by: hook:rule_queued_stack
  - id: A32
    title: "force push"
    text: "Before a force push, confirm the remote branch has no commits the local stack lacks."
    audience: all
    surface: [agents-md]
    enforced_by: hook:rule_push_behind
  - id: D15
    title: "stack rules"
    text: "Rules: `docs/architecture/backend-platform.md#pull-requests-small-and-stacked`."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A33
    title: "test gates"
    text: "Never weaken a test gate to get green: no new `coverage.exclude`, `mutants.allow` or `.golangci.yml` exclusion lines, raised perf baselines, edited golden files, added `t.Skip`, or deleted test functions."
    audience: all
    surface: [agents-md]
    enforced_by: hook:agent-guard-gates.sh
  - id: A34
    title: "gate-change label"
    text: "The `gate-changes` CI job flags such a PR with a warning annotation (it stays green and does not block); only a human adds the `gate-change-approved` label that silences it, and the author explains the change under Reviewer focus (`docs/architecture/ci.md#what-runs-where`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A35
    title: "ticket bodies"
    text: "GitHub issue and milestone ticket bodies should follow the write-ticket format (Context, Problem, Proposal with Implement exactly, acceptance criteria, verification commands, Done when) with minimal agent discretion."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A36
    title: "parallel milestone work"
    text: "Parallel milestone implementation should use worktree-orchestrate with Composer 2.5 subagents unless another model is explicitly requested; run unrelated tickets in parallel in separate git worktrees (one lane per feat branch), not serialized on one checkout; split mobile vs backend tickets to separate agents; parent orchestrator owns the queue and must not spawn nested orchestrator subagents; when multiple agents overlap on one task, keep whichever is furthest along only."
    audience: root
    surface: [agents-md]
    enforced_by: prose
    covers: [A37, A38]
  - id: A39
    title: "ticket work in worktrees"
    text: "Ticket/feature work runs in git worktrees under `.worktrees/`; never dirty the user's primary checkout (often `main`)—land on named integration branches in the worktree, not by checking out the primary tree; subagents must cd and use absolute paths inside the worktree because Task inherits parent cwd."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A40]
  - id: A41
    title: "after landing"
    text: "After landing, remove the worktree and put primary on the named branch with a clean tree matching HEAD so the user can build/test from repo root via `git checkout <branch>`—do not leave work only in `.worktrees/` or let primary disk revert the branch."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A42
    title: "Privy dashboard checks"
    text: "For Privy dashboard verification or client settings during agent QA, use the attached Privy browser tab; do not ask the user to make dashboard changes."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: D16
    title: "Privy signer fixes"
    text: "Prefer Privy API/dashboard ops over ad-hoc product PATCH-in-loop for legacy wallet signer fixes."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A43
    title: "three verification stages"
    text: "Verification runs in three stages, per `docs/architecture/backend-platform.md#verification-scope`: agents run `monacoctl agents check` on every PR, CI stage 1 runs the full suite on the top PR of a stack (lower PRs' `ci / ci-ok` passes with every job skipped), except the macOS `ios` job (app build plus MonacoTests), which runs only in the hourly staging indicator (#3399), and the Graphite merge queue runs only build, vet, tidy and generated files before anything lands on `staging`. Every hour, when `staging` moved, `staging.yml` runs the full suite again as an advisory indicator that gates nothing (it ran on every push until #2950, which left PR runs waiting for the free plan's 20 concurrent jobs). The operator approved this split, so it is not skipping. Ticket Done-when, milestone manual verification, `just build mobile` and gold-sim QA still apply when the change touches what they cover."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A44
    title: "mobile PR checks"
    text: "Every PR that touches `apps/mobile/**` must pass a local `just build mobile` and the MonacoTests run (`-only-testing:MonacoTests`) before it is pushed, and Proof cites both."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A45
    title: "mobile-core PR checks"
    text: "Every PR that touches Darwin-only code in `packages/mobile-core` must pass a local macOS `swift test` before it is pushed."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A46
    title: "no skipped checks"
    text: "Never skip or shrink a check in that set unless the user explicitly says to skip in the current message."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A47
    title: "user builds themselves"
    text: "When the user says they'll build or run themselves, verify code changes only and skip sim, build, or run in that session unless they ask in the current message."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A48
    title: "product UI"
    text: "Product UI: prefer toasts over main-UI popups or banners for action confirmations; never hyphenate wallet addresses; show human-readable stock names or symbols, not raw mint addresses or \"xStock\" branding."
    audience: all
    surface: [agents-md]
    enforced_by: prose
    covers: [A49, A50]
  - id: A51
    title: "cabal wording"
    text: "User-facing copy uses \"cabal\" (not club/group), and so do new API routes, Go types, tables and event subjects (`/v1/cabals/{id}`; see `docs/architecture/backend-platform.md#decided`)."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A52
    title: "deposit and fund wording"
    text: "Use \"deposit\" for inbound USDC to platform balance; \"fund this cabal\" for sweeping platform USDC into a group treasury; partial cabal stake sales use a sell flow without leaving the group."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A53
    title: "CI flake reruns"
    text: "For a CI flake with no code change, rerun only the failed jobs with `gh run rerun <run-id> --failed`; don't rerun the whole run. A fix commit starts a new run on its own; don't also trigger a rerun."
    audience: all
    surface: [agents-md]
    enforced_by: prose
  - id: A55
    title: "Product uses Solana mainnet, never devnet"
    text: "Product uses Solana mainnet, never devnet"
    audience: all
    surface: []
    enforced_by: prose
  - id: A56
    title: "One Privy wallet per user, reuse on login, never recreate"
    text: "One Privy wallet per user, reuse on login, never recreate"
    audience: all
    surface: []
    enforced_by: prose
  - id: A57
    title: "Member wallet create must set owner plus additional_signers "
    text: "Member wallet create must set owner plus additional_signers at create time"
    audience: all
    surface: []
    enforced_by: prose
  - id: A58
    title: "Platform balance shown is on-chain USDC minus in-flight fund"
    text: "Platform balance shown is on-chain USDC minus in-flight fund intents"
    audience: all
    surface: []
    enforced_by: prose
  - id: A59
    title: "Propose-buy amount cannot exceed treasury total"
    text: "Propose-buy amount cannot exceed treasury total"
    audience: all
    surface: []
    enforced_by: prose
  - id: A60
    title: "Treasury value is total across USDC and tokens, not cash alo"
    text: "Treasury value is total across USDC and tokens, not cash alone"
    audience: all
    surface: []
    enforced_by: prose
  - id: A61
    title: "PHANTOM_APP_ID belongs in MCP config, not .env"
    text: "PHANTOM_APP_ID belongs in MCP config, not .env"
    audience: all
    surface: []
    enforced_by: prose
  - id: A62
    title: "Do not track .cursor/hooks in git"
    text: "Do not track .cursor/hooks in git"
    audience: all
    surface: []
    enforced_by: prose
  - id: A63
    title: "Do not use hosted or production Supabase for local testing"
    text: "Do not use hosted or production Supabase for local testing"
    audience: all
    surface: []
    enforced_by: prose
  - id: A64
    title: "packages/mobile-core must keep building on Linux"
    text: "packages/mobile-core must keep building on Linux; guard FoundationNetworking imports"
    audience: all
    surface: []
    enforced_by: ci:ci-mobile-core
  - id: A65
    title: "Never fetch xStocks/Jupiter/Pyth/Solana RPC from mobile"
    text: "Never fetch xStocks/Jupiter/Pyth/Solana RPC from mobile"
    audience: all
    surface: []
    enforced_by: test:packages/mobile-core/Tests/MonacoCoreTests/RepoRulesTests.swift
  - id: A66
    title: "Go and Swift integrate via HTTP contract only"
    text: "Go and Swift integrate via HTTP contract only"
    audience: all
    surface: []
    enforced_by: prose
  - id: A67
    title: "Refund leftover QA USDC via in-app withdrawal after QA runs"
    text: "Refund leftover QA USDC via in-app withdrawal after QA runs"
    audience: all
    surface: []
    enforced_by: prose
  - id: B01
    title: "Domain is pure (no context, no I/O, no other module)"
    text: "`domain` is pure: no context, no I/O, no other module."
    audience: all
    surface: [backend-agents-md]
    enforced_by: lint:apps/backend/.golangci.base.yml
  - id: B02
    title: "App holds commands and queries and defines the ports it needs"
    text: "`app` holds commands and queries and defines the ports it needs. `adapters` holds Postgres, HTTP and consumers."
    audience: all
    surface: [backend-agents-md]
    enforced_by: lint:apps/backend/.golangci.base.yml
  - id: B03
    title: "Never edit `.golangci.yml`; it is generated from `.golangci.base.yml`"
    text: "Never edit `.golangci.yml`, which is generated from `.golangci.base.yml`."
    audience: all
    surface: [backend-agents-md]
    enforced_by: hook:agent-guard.py
  - id: B04
    title: "Cross-module means an event, or the other module's query port"
    text: "A module never imports another module. It reacts to that module's events or reads through the query port that module exports."
    audience: all
    surface: [backend-agents-md]
    enforced_by: lint:apps/backend/.golangci.base.yml
  - id: B05
    title: "Amounts are `money.Micros`, `money.SignedMicros` or `money.BaseUnits`; floats are banned"
    text: "Amounts are `money.Micros`, `money.SignedMicros` or `money.BaseUnits`. Floats are banned."
    audience: all
    surface: [backend-agents-md]
    enforced_by: lint:apps/backend/.golangci.base.yml
  - id: B06
    title: "Balance changes commit with their event in `db.UnitOfWork.Do`"
    text: "Every balance change and its event commit together inside `db.UnitOfWork.Do`. Read the `money-change` skill first."
    audience: all
    surface: [backend-agents-md]
    enforced_by: prose
  - id: B07
    title: "No comments in Go: a better name, a type, a test or an issue instead"
    text: "No comments in Go. If you want one, you need a better name, a type, a test or an issue. Only `//go:` directives survive."
    audience: all
    surface: [backend-agents-md]
    enforced_by: hook:agent-guard-go-comments.sh
  - id: B08
    title: "Use the generators"
    text: "Use the generators: `just gen module`, `just gen command`, `just gen query`, `just gen consumer`, `just gen provider` and `just gen flow` write the first copy. Copy what they emit, not what you remember."
    audience: all
    surface: [backend-agents-md]
    enforced_by: prose
  - id: B09
    title: "Every flow is a file"
    text: "Every flow is a file. A behavior change updates its row in `packages/flows/backend/<id>.tsv` and the `TestFlow<id>_<Command>_<Outcome>` tests it names."
    audience: all
    surface: [backend-agents-md]
    enforced_by: ci:ci-jobs
  - id: B10
    title: "Run `monacoctl agents check` before a push"
    text: "Before a push, run `go run ./cmd/monacoctl agents check` from `apps/backend`. It builds, vets and runs the short tests of the packages affected since the base, with each package held to 120 s. If only the budget fails on a loaded machine, rerun it later. Stage 1 CI runs the full suite and `monacoctl verify` on the real binaries. Do not run them yourself."
    audience: all
    surface: [backend-agents-md]
    enforced_by: prose
