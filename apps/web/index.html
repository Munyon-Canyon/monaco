<head>

<style>
/* Tokens. Direction: a members' share certificate from a security printer. See DESIGN.md. */
:root {
  color-scheme: dark;
  --paper: #0F291C;        /* Monaco green: the page, and the only green. Everything else is cream or cream mixed into it */
  --field: transparent;    /* the field sits on the page itself */
  --ink: #E6E0CC;          /* soft cream: all text and the button, 11.7:1 on the page */
  --ink-press: #D3CCB6;    /* button hover */
  --ink-soft: #909786;     /* cream 60% into the page: disabled button, visited links */
  --ink-faint: #909786;    /* cream 60% into the page: placeholders, 5.1:1 */
  --error: #FF8A7A;        /* validation errors, 6.8:1 on the page */
  --rule: #2F4436;         /* cream 15% into the page: footer rule */
  --rule-strong: #697666;  /* cream 42% into the page: field outline, 3.2:1 */
  --screen: #E6E0CC;       /* the icon's light ink: cream dots where the stones catch the light */
  --serif: "Fraunces", Georgia, serif;
  --r: 3px;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px; --s6: 96px;
  --fast: 180ms cubic-bezier(.2, .7, .2, 1);
  --gutter: max(20px, env(safe-area-inset-left));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 1fr auto; background: var(--paper); color: var(--ink); font: 300 17px/1.5 var(--serif); font-variation-settings: "opsz" 14; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); }
a:visited { color: var(--ink-soft); }
.mono { font-family: var(--serif); font-weight: 400; font-size: 15px; line-height: 1.4; letter-spacing: 0; font-variation-settings: "opsz" 14; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Phones: one centred column. Mark, name, line, then the sign-up bar. */
main { width: 100%; margin: 0 auto; padding: calc(var(--s4) + env(safe-area-inset-top)) var(--gutter) var(--s4); display: grid; justify-items: center; align-content: center; text-align: center; }
#mark { width: min(56vw, 32dvh, 280px); aspect-ratio: 1; display: block; }
.copy { display: grid; justify-items: center; width: 100%; max-width: 420px; }
h1 { margin: clamp(var(--s2), 3dvh, 28px) 0 0; font-weight: 300; font-size: clamp(52px, 15vw, 80px); line-height: 1; letter-spacing: -.02em; font-variation-settings: "opsz" 144; }
.lede { margin: 12px 0 0; white-space: nowrap; color: var(--ink); font-size: clamp(14px, 4.4vw, 22px); line-height: 1.35; font-variation-settings: "opsz" 24; }

/* The sign-up: one control that steps through join -> email -> cabal -> handle -> done. */
form { margin-top: clamp(var(--s3), 4dvh, var(--s4)); width: 100%; max-width: 400px; }
.bar { position: relative; display: flex; align-items: center; height: 54px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--field); transition: border-color var(--fast); }
.bar:focus-within { border-color: var(--ink); }
.f { flex: 1; min-width: 0; animation: in var(--fast) both; }
input { width: 100%; height: 52px; padding: 0 14px; border: 0; border-radius: 0; background: none; color: var(--ink); font: 400 17px var(--serif); font-variation-settings: "opsz" 14; outline: none; }
input::placeholder { color: var(--ink-faint); }
@media (max-width: 360px) { input::placeholder { font-size: 15px; } } /* keeps "Twitter @handle (optional)" whole on the narrowest phones */
.bar:has(.bad), .bar:has(.bad):focus-within { border-color: var(--error); }
button { border: 0; border-radius: 2px; background: var(--ink); color: var(--paper); cursor: pointer; touch-action: manipulation; transition: background var(--fast); }
button:hover { background: var(--ink-press); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button[disabled] { cursor: progress; background: var(--ink-soft); }
.start { position: absolute; inset: -1px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; gap: .6em; font-size: 17px; }
.go { flex: none; width: 46px; height: 46px; margin: 3px; font: 400 20px var(--serif); line-height: 1; animation: in var(--fast) both; }
.start i, .go i { font-style: normal; display: inline-block; transition: transform var(--fast); }
.start:hover i, .go:hover i { transform: translateX(3px); }
.bar[data-step="0"] { border-color: transparent; background: none; }
.bar[data-step="0"] .f, .bar[data-step="0"] .go, .bar:not([data-step="0"]) .start,
.bar[data-step="1"] .h, .bar[data-step="3"] .e { display: none; }
@keyframes in { from { opacity: 0; transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .f, .go, .pick { animation: none; } }
.st { margin: 12px 0 0; color: var(--ink); }
.st:empty { display: none; }
.st.ok { color: var(--ink); }
.st.err { color: var(--error); }
.elig { max-width: 400px; margin: var(--s2) 0 0; text-wrap: balance; }
.bar[data-step="2"] ~ .elig { display: none; } /* the cabal question needs the height */
/* The cabal question: five ruled rows stand in for the bar, then a Continue button. */
.pick { display: none; }
.bar[data-step="2"] { display: none; }
.bar[data-step="2"] ~ .pick { display: block; animation: in var(--fast) both; }
.rows { border: 1px solid var(--rule-strong); border-radius: var(--r); text-align: left; }
.rows > * { margin: 0; padding: 8px 16px; }
.rows > * + * { border-top: 1px solid var(--rule); }
.rows label { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-weight: 300; line-height: 1.3; color: var(--ink-faint); font-variation-settings: "opsz" 14; }
.rows label:hover, .rows label:has(:checked) { color: var(--ink); }
.rows span { text-wrap: pretty; }
.rows b { font-weight: 400; color: var(--ink); }
.rows input { flex: none; width: 14px; height: 14px; margin: 5px 0 0; padding: 0; appearance: none; -webkit-appearance: none; border: 1px solid var(--rule-strong); border-radius: 2px; }
.rows input:checked { border-color: var(--ink); background: var(--ink); box-shadow: inset 0 0 0 2px var(--paper); }
.rows input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.next { display: flex; align-items: center; justify-content: center; gap: .6em; width: 100%; height: 54px; margin-top: 12px; border-radius: var(--r); font-size: 17px; }
.next i { font-style: normal; display: inline-block; transition: transform var(--fast); }
.next:hover i { transform: translateX(3px); }
form.done .bar { display: none; }
form.done .st { margin: 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

footer { padding-inline: var(--gutter); border-top: 1px solid var(--rule); display: flex; justify-content: center; align-items: center; gap: var(--s3); padding-bottom: env(safe-area-inset-bottom); color: var(--ink); }
footer p { margin: 0; }
footer a { display: inline-flex; align-items: center; min-height: 48px; }

/* Wide screens: mark and copy form one lockup, centred in the window, sharing a vertical centre. */
@media (min-width: 820px) {
  main { grid-template-columns: auto minmax(0, 520px); justify-content: center; align-items: center; column-gap: clamp(var(--s5), 6vw, var(--s6)); text-align: left; padding-block: var(--s5); }
  #mark { width: clamp(240px, 24vw, 320px); }
  .copy { justify-items: start; max-width: 520px; }
  h1 { margin: 0; font-size: clamp(72px, 7vw, 104px); }
  .lede { margin-top: var(--s2); font-size: clamp(22px, 2vw, 26px); }
  form { margin-top: var(--s4); }
  .st { text-align: left; }
  footer { justify-content: space-between; }
}
</style>
</head>
<body>
<main id="join">
  <canvas id="mark" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>Monaco</h1>
    <p class="lede">Trade with your friends.</p>
    <form data-waitlist novalidate>
      <div class="bar" data-step="0">
        <button class="start mono" type="button">Join the waitlist <i aria-hidden="true">→</i></button>
        <label class="f e"><span class="sr">Email</span><input name="email" type="email" inputmode="email" autocomplete="email" enterkeyhint="next" placeholder="Your email" required></label>
        <label class="f h"><span class="sr">Twitter handle (optional)</span><input name="twitter" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="16" placeholder="Twitter @handle (optional)"></label>
        <button class="go" type="submit" aria-label="Continue"><i aria-hidden="true">→</i></button>
      </div>
      <div class="pick">
        <div class="rows" role="radiogroup" aria-labelledby="pick-q">
          <p class="mono" id="pick-q">Which cabal are you?</p>
          <label><input type="radio" name="cabal" value="cavemen"><span><b>Cavemen,</b> never sell</span></label>
          <label><input type="radio" name="cabal" value="pilates"><span><b>Pilates,</b> buy what you use</span></label>
          <label><input type="radio" name="cabal" value="cadena"><span><b>La Cadena,</b> deposit on the 1st</span></label>
          <label><input type="radio" name="cabal" value="degens"><span><b>Degens in recovery,</b> one stock a month</span></label>
          <label><input type="radio" name="cabal" value="undecided"><span><b>Undecided</b></span></label>
        </div>
        <button class="next mono" type="submit">Continue <i aria-hidden="true">→</i></button>
      </div>
      <div class="hp" aria-hidden="true"><label>Company<input name="company" tabindex="-1" autocomplete="off"></label></div>
      <p class="st mono" aria-live="polite"></p>
      <!--eligibility-->
    </form>
  </div>
</main>
<footer class="mono">
  <p>© 2026 Monaco Labs</p>
  <a href="https://x.com/trymonaco" target="_blank" rel="noopener">Twitter</a>
</footer>

  function h(x, y) { x = Math.max(0, Math.min(N - 1, x)); y = Math.max(0, Math.min(N - 1, y)); var t = Math.min(D[y * N + x] / R, 1); return Math.sqrt(t * (2 - t)) * R; }
  function near(u, v) { for (var k = 0; k < 5; k++) { var px = (u + [0, .8, -.8, 0, 0][k]) * f | 0, py = (v + [0, 0, 0, .8, -.8][k]) * f | 0; if (px >= 0 && py >= 0 && px < N && py < N && a[(py * N + px) * 4 + 3]) return true; } return false; }

  // Two screens on staggered honeycomb grids at classic print angles; each dot keeps the surface normal under it.
  function screen(deg, pitch, dx) {
    var c = Math.cos(deg * Math.PI / 180), s = Math.sin(deg * Math.PI / 180), out = [], row = 0;
    for (var v = -72; v < 72; v += pitch * .866, row++) for (var u = -72 + (row % 2) * pitch / 2; u < 72; u += pitch) {
      var X = 50 + u * c - v * s, Y = 50 + u * s + v * c;
      if (!near(X, Y)) continue;
      var px = Math.round(X * f), py = Math.round(Y * f), hx = (h(px + 1, py) - h(px - 1, py)) / 2, hy = (h(px, py + 1) - h(px, py - 1)) / 2, l = Math.hypot(hx, hy, 1);
      out.push([X + dx, Y + dx, 0, -hx / l, -hy / l, 1 / l, Y / 100, (X + Y) / 200]);
    }
    out.r = pitch * .62; return out;
  }
  var G = screen(15, .9, 0), Au = [];

  // The light is the soft blobs (B, each [x, y, weight]) wandering over the mark. Their edges wobble so they read as
  // blobs, not discs, and the light comes from Lp (the first blob), so shadows slide across each stone.
  function shade(B, Lp, tm, dev) {
    var lx = (Lp[0] - 50) / 50 * .8, ly = (Lp[1] - 50) / 50 * .8, n = Math.hypot(lx, ly, .8), L0 = lx / n, L1 = ly / n, L2 = .8 / n;
    var hn = Math.hypot(L0, L1, L2 + 1);
    [G, Au].forEach(function (S, j) {
      for (var q = 0; q < S.length; q++) {
        var p = S[q], df = Math.max(0, p[3] * L0 + p[4] * L1 + p[5] * L2), sp = Math.pow(Math.max(0, (p[3] * L0 + p[4] * L1 + p[5] * (L2 + 1)) / hn), 20);
        var blob = 0, t;
        for (var b = 0; b < B.length; b++) {
          var ex = p[0] - B[b][0], ey = p[1] - B[b][1], d2 = ex * ex + ey * ey;
          if (d2 > 2025) continue; // beyond any blob's reach: skip the wobble maths
          var an = Math.atan2(ey, ex), rr = 22 * (1 + .2 * Math.sin(3 * an + tm * 1.6 + b * 2) + .12 * Math.sin(5 * an - tm * 1.2 + b));
          blob += B[b][2] * Math.exp(-2 * d2 / (rr * rr));
        }
        blob = clamp(blob);
        t = Math.max(.12, clamp(.1 + .85 * df + .45 * sp - .85 * blob)); // never below .12, so a stone keeps its shape under a blob
        if (dev < 1) t *= ease((dev * 1.6 - (1 - p[6])) * 2.6);
        p[2] = t;
      }
    });
  }
  function ink(S, color, over) {
    cx.globalCompositeOperation = over ? "multiply" : "source-over"; cx.fillStyle = color; cx.beginPath();
    for (var q = 0; q < S.length; q++) { var p = S[q], r = S.r * Math.sqrt(p[2]); if (r > .03) { cx.moveTo(p[0] + r, p[1]); cx.arc(p[0], p[1], r, 0, 6.2832); } }
    cx.fill();
  }
  // Wandering paths from a few unrelated sines: smooth, never sharp, never an obvious loop. Each blob (b) gets its own phases.
  function path(t, b) {
    return [50 + 30 * Math.sin(t * .061 + 1 + b * 2.1) * Math.cos(t * .043 + b * 1.3) + 9 * Math.sin(t * .137 + 4 + b * 3.7),
            50 + 30 * Math.sin(t * .053 + 2.3 + b * 2.9) + 9 * Math.cos(t * .113 + .5 + b * 1.9), 1];
  }
  var k = 1, tm = 0, dv = still ? 1 : 0;
  function size() { var r = Math.min(devicePixelRatio || 1, 2); cv.width = cv.height = Math.round(cv.clientWidth * r); k = cv.width / 100; }
  function draw() {
    var w = tm * 6, B = [path(w, 0), path(w, 1), path(w, 2)], Lp = B[0];
    shade(B, Lp, tm, dv);
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); cx.setTransform(k, 0, 0, k, 0, 0);
    cx.save(); cx.clip(P);
    ink(G, CREAM);
    cx.restore();
  }
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { size(); draw(); }, 120); });
  size(); draw();
  if (still) return;
  // The print develops up from the baseline over 2.4s while the blobs start to wander (about a tenth of the mark a second).
  var t0 = performance.now(), last = 0, raf = 0, seen = true;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (now - last < 33) return; last = now;
    var t = now - t0; dv = Math.min(1, t / 2400); tm = t / 1000; draw();
  }
  function run() { cancelAnimationFrame(raf); if (seen && !document.hidden) raf = requestAnimationFrame(frame); }
  document.addEventListener("visibilitychange", run);
  if (window.IntersectionObserver) new IntersectionObserver(function (e) { seen = e[0].isIntersecting; run(); }).observe(cv);
  run();
})();

// The waitlist: one control that steps join -> email -> cabal -> handle -> done. Same endpoint and messages as before, plus the cabal.
(function () {
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, TWITTER = /^[A-Za-z0-9_]{1,15}$/;
  function handle(v) { v = v.trim().replace(/^@/, ""); return v === "" ? "" : TWITTER.test(v) ? v : null; }
  var form = document.querySelector("form[data-waitlist]"), bar = form.querySelector(".bar"), start = form.querySelector(".start"), go = form.querySelector(".go");
  var email = form.email, tw = form.twitter, trap = form.company, st = form.querySelector(".st");
  var rows = form.querySelector(".rows"), picks = rows.querySelectorAll("input"), q = new URLSearchParams(location.search);
  function say(t, k) { st.textContent = t; st.className = "st mono" + (k ? " " + k : ""); }
  function flag(el, bad) { el.setAttribute("aria-invalid", bad ? "true" : "false"); el.parentNode.classList.toggle("bad", bad); }
  function step(n) {
    bar.dataset.step = n; say("");
    go.setAttribute("aria-label", n === 3 ? "Join the waitlist" : "Continue");
    if (n === 2) (rows.querySelector(":checked") || picks[0]).focus();
    else if (n) (n === 1 ? email : tw).focus();
  }
  // ?cabal= chooses a row ahead of time. The visitor still reaches the question, sees the choice and presses Continue.
  var want = (q.get("cabal") || "").trim().toLowerCase();
  picks.forEach(function (r) { r.checked = r.value === want; });
  start.addEventListener("click", function () { step(1); });
  // Escape goes back one step, in case the answer before it needs fixing.
  tw.addEventListener("keydown", function (e) { if (e.key === "Escape") step(2); });
  rows.addEventListener("keydown", function (e) { if (e.key === "Escape") step(1); });
  rows.addEventListener("change", function () { say(""); });
  email.addEventListener("input", function () { if (email.getAttribute("aria-invalid") === "true") { flag(email, false); say(""); } });
  tw.addEventListener("input", function () { if (tw.getAttribute("aria-invalid") === "true" && handle(tw.value) !== null) { flag(tw, false); say(""); } });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var n = +bar.dataset.step;
    if (n === 0) return step(1);
    if (n === 1) {
      if (!EMAIL.test(email.value.trim())) { flag(email, true); say("Enter a valid email, like you@email.com.", "err"); return email.focus(); }
      flag(email, false); return step(2);
    }
    if (n === 2) {
      if (!form.cabal.value) { say("Pick a cabal, or Undecided.", "err"); return picks[0].focus(); }
      return step(3);
    }
    if (handle(tw.value) === null) { flag(tw, true); say("Enter a valid Twitter handle, like @monaco, or leave it blank.", "err"); return tw.focus(); }
    go.disabled = true; say("Adding you…");
    var ctrl = new AbortController(), timer = setTimeout(function () { ctrl.abort(); }, 10000);
    fetch("/api/waitlist", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ email: email.value.trim(), twitter: handle(tw.value), cabal: form.cabal.value, company: trap.value, source: q.get("ref") || q.get("utm_source") || "" })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
    }).then(function (r) {
      if (r.ok) { form.classList.add("done"); return say("You're on the list. We'll email you when your invite is ready.", "ok"); }
      if (r.status === 429) say("Too many tries from this network. Try again in an hour.", "err");
      else if (r.status === 400) { step(1); say(r.body.error || "That email didn't look right. Check it and try again.", "err"); }
      else say("The waitlist is having trouble right now. Try again in a minute.", "err");
    }).catch(function () {
      say("Couldn't reach the waitlist. Check your connection and try again.", "err");
    }).finally(function () { clearTimeout(timer); go.disabled = false; });
  });
})();
</script>
