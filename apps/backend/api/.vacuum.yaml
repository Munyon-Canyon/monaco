extends: [[vacuum:oas, all]]
rules:
  camel-case-properties: "off"
  operation-4xx-response: "off"
  operation-default-problem:
    description: Every operation declares a default response, the Problem.
    message: Operation has no default Problem response.
    severity: error
    given: $.paths[*][get,put,post,delete,patch,options,head,trace].responses
    then:
      field: default
      function: truthy
  no-request-body:
    description: GET and HEAD operations carry no request body. DELETE may carry a reason.
    message: "{{property}} operation must not have a requestBody."
    severity: warn
    given: $.paths[*][get,head]
    then:
      field: requestBody
      function: falsy
