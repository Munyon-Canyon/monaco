        proposal_id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
    Ping:
      type: object
      description: A recorded ping.
      additionalProperties: false
      required: [id, note, echoed]
      properties:
        id:
          type: string
          format: uuid
          description: The ping id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        note:
          type: string
          description: The note sent with the ping.
          maxLength: 140
          examples: [hi]
        echoed:
          type: boolean
          description: True once the `system.echo` consumer has handled the ping.
          examples: [true]
    PingRequest:
      type: object
      description: A note to record with the ping.
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Free text, at most 140 characters.
          maxLength: 140
          examples: [hi]
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      additionalProperties: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
    Proposal:
      type: object
      description: One proposal as the caller sees it, with its tally and the caller's ballot.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
    ProposalDetail:
      type: object
      description: One proposal with its voters, the caller's permissions and its linked trade.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
        - voters
        - can_vote
        - can_withdraw
        - swap
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        voters:
          type: array
          description: Every member of the frozen voter set, ordered by user id.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ProposalVoter"
        can_vote: {type: boolean, description: "The caller is in the voter set and the proposal is open.", examples: [true]}
        can_withdraw:
          type: boolean
          description: The caller proposed it, it is open, and no other voter has a ballot.
          examples: [false]
        swap:
          type: [object, "null"]
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          x-go-type-name: LinkedSwap
          additionalProperties: false
          required: [swap_id, status, failure_code, failure_message, tx_signature, retryable]
          properties:
            swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
            status:
              type: string
              description: Where the trade is.
              enum: [created, submitted, confirmed, failed]
              examples: [confirmed]
            failure_code:
              type: [string, "null"]
              description: Why the trade failed. Null unless `status` is `failed`.
              examples: [null]
            failure_message:
              type: [string, "null"]
              description: The user-facing message for a failed trade. Null unless `status` is `failed`.
              examples: [null]
            tx_signature:
              type: [string, "null"]
              description: The Solana transaction signature. Null before the trade is submitted.
              examples: [null]
            retryable: {type: boolean, description: Whether a failed trade can be retried., examples: [false]}
    ProposalKind:
      type: string
      description: Whether the proposal spends USDC on the token or sells the token for USDC.
      enum: [buy, sell]
      examples: [buy]
    ProposalList:
      type: object
      description: One page of a cabal's proposals.
      additionalProperties: false
      required: [proposals, next_cursor]
      properties:
        proposals:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    ProposalVoter:
      type: object
      description: One member of the proposal's frozen voter set.
      additionalProperties: false
      required: [user_id, choice, cast_at]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        choice:
          description: The voter's ballot. Null until they vote.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote.
          examples: ["2026-10-03T16:00:00Z"]
    SetHandle:
      type: object
      description: A handle to claim for the caller.
      additionalProperties: false
      required: [handle]
      properties:
        handle:
          type: string
          examples: [kai_one]
          minLength: 1
          maxLength: 64
    SkipOnboardingStep:
      type: object
      description: An onboarding step the caller skips.
      additionalProperties: false
      required: [step]
      properties:
        step:
          type: string
          enum: [phone, socials]
          examples: [phone]
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      additionalProperties: false
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    UiMultiplier:
      type: object
      description: The whole tokens in one display unit, as an exact fraction.
      examples:
        - num: 1
          den: 1
      additionalProperties: false
      required: [num, den]
      properties:
        num:
          type: integer
          format: int64
          description: The numerator.
          examples: [1]
        den:
          type: integer
          format: int64
          description: The denominator.
          examples: [1]
    UpdateCabalRequest:
      type: object
      description: The cabal fields to change. An omitted field keeps its value.
      additionalProperties: false
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Work pot]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [request]}
        voter_mode: {type: string, description: "`all` or `list`.", examples: [list]}
        voter_ids:
          type: array
          description: Every voter, the creator included. Only with voter_mode list.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [unanimous]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [3600]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300.", examples: [50]}
    UpdateProfileRequest:
      type: object
      description: The profile fields a signed-in user may update.
      examples: [{display_name: Kai Cenat}]
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: The caller's display name, normalized before it is stored.
          examples: [Kai Cenat]
    VoteResult:
      type: object
      description: The proposal after the caller's ballot.
      additionalProperties: false
      required: [proposal_id, status, tally, my_ballot]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
        my_ballot:
          $ref: "#/components/schemas/BallotChoice"
