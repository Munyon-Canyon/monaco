  # api/spec/funding.yaml
    Balance:
      type: object
      description: The member wallet's on-chain USDC and currently spendable platform balance.
      additionalProperties: false
      required: [available_micros, on_chain_micros, in_flight_micros, deposit_address, as_of]
      properties:
        available_micros: {type: string, pattern: "^[0-9]+$", examples: ["22500000"]}
        on_chain_micros: {type: string, pattern: "^[0-9]+$", examples: ["25000000"]}
        in_flight_micros: {type: string, pattern: "^[0-9]+$", examples: ["2500000"]}
        deposit_address: {type: string, examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]}
        as_of:
          type: string
          format: date-time
          description: When on_chain_micros was read from the chain. Up to 10 minutes old when the chain is unreachable.
          examples: ["2026-10-03T15:00:00Z"]
    CreateOnrampSessionRequest:
      type: object
      description: What to prefill on the fund page.
      additionalProperties: false
      properties:
        suggested_amount_micros:
          $ref: "#/components/schemas/OnrampMicros"
        cabal_id:
          type: string
          format: uuid
          description: The cabal the user came from, when they did.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
    ExchangeOnrampTokenRequest:
      type: object
      description: The token from the fund page URL.
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The `s` query parameter of the fund page URL.
          minLength: 1
          maxLength: 128
          examples: ["q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
    OnrampExchange:
      type: object
      description: What the fund page needs to start the provider flow.
      additionalProperties: false
      required: [session_id, wallet_address, suggested_amount_micros, usdc_mint]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        wallet_address:
          type: string
          description: The member wallet the provider sends USDC to.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount to prefill in USDC micros, or null to let the user choose.
          examples: ["25000000"]
        usdc_mint:
          type: string
          description: The Solana USDC mint.
          examples: [EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]
    OnrampMicros:
      type: string
      description: A USDC amount in micros, as a decimal string.
      pattern: "^[1-9][0-9]{0,19}$"
      examples: ["25000000"]
    OnrampSession:
      type: object
      description: A card deposit session.
      additionalProperties: false
      required: [session_id, status, suggested_amount_micros, created_at, completed_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          type: string
          enum: [created, opened, confirmed, submitted, cancelled, failed, expired]
          description: Where the session is in its status machine.
          examples: [confirmed]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount the app suggested in USDC micros, or null.
          examples: ["25000000"]
        created_at:
          type: string
          format: date-time
          description: When the session was created.
          examples: ["2026-10-03T15:00:00Z"]
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the session reached a final status, or null while it is live.
          examples: ["2026-10-03T15:04:00Z"]
    OnrampSessionCreated:
      type: object
      description: A new onramp session and the page that runs it.
      additionalProperties: false
      required: [session_id, url, expires_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        url:
          type: string
          description: The fund page URL with its one-time token. Open it in the browser.
          examples: ["https://monacolabs.xyz/fund?s=q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
        expires_at:
          type: string
          format: date-time
          description: When the token stops working.
          examples: ["2026-10-03T15:10:00Z"]
    ReportOnrampStatusRequest:
      type: object
      description: How the provider flow ended.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, submitted, cancelled, failed]
          description: >-
            confirmed when the user finished the provider flow, submitted when they left before
            confirmation, cancelled or failed when it threw.
          examples: [confirmed]
        provider:
          type: string
          description: The on-ramp provider Privy chose, when the page knows it.
          minLength: 1
          maxLength: 64
          examples: [moonpay]
    WithdrawAccepted:
      type: object
      description: A signed and sent withdrawal.
      additionalProperties: false
      required: [withdrawal_id, status, tx_signature]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        tx_signature: {type: string, examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]}
    WithdrawRequest:
      type: object
      description: A withdrawal of platform balance to any Solana address.
      additionalProperties: false
      required: [amount_micros, to_address]
      properties:
        amount_micros:
          type: string
          pattern: "^[0-9]+$"
          description: USDC micros, at least 1000000.
          examples: ["2000000"]
        to_address:
          type: string
          description: The destination Solana wallet. It cannot be the caller's own member wallet.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
    Withdrawal:
      type: object
      description: One withdrawal and where it stands.
      additionalProperties: false
      required: [withdrawal_id, status, amount_micros, to_address, tx_signature, fail_code, created_at, completed_at]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["2000000"]}
        to_address: {type: string, examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]}
        tx_signature:
          type: [string, "null"]
          description: Null until the transfer is signed.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        fail_code:
          type: [string, "null"]
          description: The error code a failed withdrawal ended with. Null otherwise.
          examples: [privy_unavailable]
        created_at: {type: string, format: date-time, examples: ["2026-10-04T15:00:00Z"]}
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the withdrawal confirmed or failed. Null while it is in flight.
          examples: ["2026-10-04T15:00:10Z"]
    WithdrawalStatus:
      type: string
      description: created, then submitted, then confirmed. created or submitted can end in failed.
      enum: [created, submitted, confirmed, failed]
  # api/spec/governance.yaml
    BallotChoice:
      type: string
      description: A voter's choice on a proposal.
      enum: ["yes", "no"]
      examples: ["yes"]
    CastVoteRequest:
      type: object
      description: The ballot to cast.
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/BallotChoice"
    PendingVote:
      type: object
      description: An open proposal that still needs the caller's ballot.
      additionalProperties: false
      required: [proposal_id, cabal_id, kind, symbol, expires_at]
      properties:
        proposal_id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
    Proposal:
      type: object
      description: One proposal as the caller sees it, with its tally and the caller's ballot.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
        - can_vote
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        can_vote:
          type: boolean
          description: Whether the caller can vote on it now, which means it is open and they are one of its voters.
          examples: [true]
    ProposalDetail:
      type: object
      description: One proposal with its voters, the caller's permissions and its linked trade.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
        - voters
        - can_vote
        - can_withdraw
        - swap
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        voters:
          type: array
          description: Every member of the frozen voter set, ordered by user id.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ProposalVoter"
        can_vote: {type: boolean, description: "The caller is in the voter set and the proposal is open.", examples: [true]}
        can_withdraw:
          type: boolean
          description: The caller proposed it, it is open, and no other voter has a ballot.
          examples: [false]
        swap:
          type: [object, "null"]
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          x-go-type-name: LinkedSwap
          additionalProperties: false
          required: [swap_id, status, failure_code, failure_message, tx_signature, retryable]
          properties:
            swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
            status:
              type: string
              description: Where the trade is.
              enum: [created, submitted, confirmed, failed]
              examples: [confirmed]
            failure_code:
              type: [string, "null"]
              description: Why the trade failed. Null unless `status` is `failed`.
              examples: [null]
            failure_message:
              type: [string, "null"]
              description: The user-facing message for a failed trade. Null unless `status` is `failed`.
              examples: [null]
            tx_signature:
              type: [string, "null"]
              description: The Solana transaction signature. Null before the trade is submitted.
              examples: [null]
            retryable: {type: boolean, description: Whether a failed trade can be retried., examples: [false]}
    ProposalKind:
      type: string
      description: Whether the proposal spends USDC on the token or sells the token for USDC.
      enum: [buy, sell]
      examples: [buy]
    ProposalList:
      type: object
      description: One page of a cabal's proposals.
      additionalProperties: false
      required: [proposals, next_cursor]
      properties:
        proposals:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    ProposalVoter:
      type: object
      description: One member of the proposal's frozen voter set.
      additionalProperties: false
      required: [user_id, choice, cast_at]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        choice:
          description: The voter's ballot. Null until they vote.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote.
          examples: ["2026-10-03T16:00:00Z"]
    ProposeTradeRequest:
      type: object
      description: A trade to propose. A buy sets `usdc_micros` only, and a sell sets `token_amount` only.
      additionalProperties: false
      required: [kind, symbol]
      properties:
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, minLength: 1, maxLength: 32, description: The token symbol from the catalog., examples: [TSLAx]}
        usdc_micros:
          type: integer
          format: int64
          minimum: 1
          description: USDC a buy spends, in micros.
          examples: [5000000]
        token_amount:
          type: integer
          format: int64
          minimum: 1
          description: Token base units a sell spends.
          examples: [1000000]
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [earnings]}
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      additionalProperties: false
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    TradePreview:
      type: object
      description: What proposing the trade would quote, and the first check it fails.
      additionalProperties: false
      required: [quote_out_amount, advisory_code, advisory_message, pot_value_micros]
      properties:
        quote_out_amount:
          type: [integer, "null"]
          format: int64
          description: The quoted output, in the output asset's base units. Null when Jupiter has no route or the asset is unknown.
          examples: [21000000]
        advisory_code:
          type: [string, "null"]
          description: >-
            The error code a proposal of this trade would fail with now: asset_not_found,
            asset_untradable, no_route, pot_exceeded or insufficient_funds. Null when every check passes.
          examples: [null]
        advisory_message:
          type: [string, "null"]
          description: The user-facing message for `advisory_code`. Null when `advisory_code` is null.
          examples: [null]
        pot_value_micros:
          type: integer
          format: int64
          description: The cabal's total value, USDC plus priced holdings, in micros.
          examples: [100000000]
    VoteResult:
      type: object
      description: The proposal after the caller's ballot.
      additionalProperties: false
      required: [proposal_id, status, tally, my_ballot]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
        my_ballot:
          $ref: "#/components/schemas/BallotChoice"
  # api/spec/identity.yaml
    AccountStatus:
      type: string
      description: >-
        The user's standing. A suspended account is read-only apart from withdraw and cash out, and a
        banned account can only withdraw and cash out.
      examples: [active]
      enum: [active, suspended, banned]
    AuthState:
      type: string
      description: >-
        Where the user is in onboarding. `CREATED` means onboarding has not finished, `AWAITING_PHONE`
        and `AWAITING_SOCIALS` mean the user still owes that step, and `ONBOARDING_COMPLETED` means the
        phone and X are both linked. The app routes the first-run flow and shows nudge banners from it.
      examples: [CREATED]
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
    DevXLink:
      type: object
      description: A fake X account for a dev user.
      additionalProperties: false
      properties:
        username:
          type: string
          description: The X username to store, without the @.
          pattern: "^[A-Za-z0-9_]{1,15}$"
          examples: [qa_x]
    HandleAvailability:
      type: object
      description: Whether the caller can claim a handle, and the reason when they cannot.
      examples:
        - handle: admin
          available: false
          reason: reserved
      additionalProperties: false
      required: [handle, available]
      properties:
        handle:
          type: string
          description: The handle that was checked, in lowercase.
          examples: [admin]
        available:
          type: boolean
          description: True when the caller can claim the handle, including when it is already theirs.
          examples: [false]
        reason:
          $ref: "#/components/schemas/HandleAvailabilityReason"
          description: Why the handle is not available. Absent when `available` is true.
    HandleAvailabilityReason:
      type: string
      description: >-
        Why a handle cannot be claimed. `reserved` covers the reserved list, profanity and
        referral-code shape. `taken` covers another user, including a deleted one, and another
        user's X username.
      examples: [reserved]
      enum: [taken, reserved, invalid, too_soon]
    LoginProvider:
      type: string
      description: The method a user signed up with.
      examples: [sms]
      enum: [sms, email, apple, google]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          login_provider: sms
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          created_at: "2026-09-30T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - display_name
        - auth_state
        - account_status
        - login_provider
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        login_provider:
          $ref: "#/components/schemas/LoginProvider"
          description: How the user signed up. The app skips the phone number entry for `sms`.
          examples: [sms]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    PublicProfile:
      type: object
      description: A user's public profile with their follow counts.
      required: [id, handle, display_name, photo_url, follower_count, following_count, followed_by_me, blocked_by_me]
      properties:
        id: {type: string, format: uuid, description: "The user's id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: string, description: "The user's handle.", examples: [maya]}
        display_name: {type: string, description: "The user's display name.", examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], description: "The profile photo, or null when there is none.", examples: [null]}
        follower_count: {type: integer, minimum: 0, description: "How many users follow them.", examples: [12]}
        following_count: {type: integer, minimum: 0, description: "How many users they follow.", examples: [7]}
        followed_by_me: {type: boolean, description: "Whether the caller follows them. False for the caller's own profile.", examples: [true]}
        blocked_by_me: {type: boolean, description: "Whether the caller blocks them. False for the caller's own profile. It says nothing about whether they block the caller.", examples: [false]}
    SetHandle:
      type: object
      description: A handle to claim for the caller.
      additionalProperties: false
      required: [handle]
      properties:
        handle:
          type: string
          examples: [kai_one]
          minLength: 1
          maxLength: 64
    SkipOnboardingStep:
      type: object
      description: An onboarding step the caller skips.
      additionalProperties: false
      required: [step]
      properties:
        step:
          type: string
          enum: [phone, socials]
          examples: [phone]
    UpdateProfileRequest:
      type: object
      description: The profile fields a signed-in user may update.
      examples: [{display_name: Kai Cenat}]
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: The caller's display name, normalized before it is stored.
          examples: [Kai Cenat]
    UserSearchResult:
      type: object
      description: The people matching a search, with handle-prefix matches first.
      required: [users]
      properties:
        users:
          type: array
          examples:
            - [{user_id: 01890a5d-ac96-774b-bcce-b302099a8058, handle: maya, display_name: Maya Angelou, photo_url: https://img.example/maya.png}]
          items: {$ref: "#/components/schemas/UserSummary"}
    UserSummary:
      type: object
      description: A searchable person's public profile summary.
      required: [user_id, handle, display_name]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string}
        display_name: {type: string}
        photo_url: {type: [string, "null"]}
  # api/spec/market.yaml
    AssetChart:
      type: object
      description: The buckets for one asset and one range.
      examples:
        - range: 1D
          bucket_seconds: 300
          points:
            - t: "2026-03-04T14:55:00Z"
              open_micros: 100000000
              high_micros: 130000000
              low_micros: 90000000
              close_micros: 110000000
          empty: false
          attribution: Data provided by CoinGecko
      additionalProperties: false
      required:
        - range
        - bucket_seconds
        - points
        - empty
        - attribution
      properties:
        range:
          type: string
          description: The range that was requested.
          enum: [1D, 1W, 1M, 3M, 1Y, ALL]
          examples: [1D]
        bucket_seconds:
          type: integer
          format: int64
          minimum: 1
          description: The width of each bucket, in seconds.
          examples: [300]
        points:
          type: array
          description: The buckets in time order. Empty when the asset has no samples in the range.
          examples:
            - - t: "2026-03-04T14:55:00Z"
                open_micros: 100000000
                high_micros: 130000000
                low_micros: 90000000
                close_micros: 110000000
          items:
            $ref: "#/components/schemas/ChartPoint"
        empty:
          type: boolean
          description: True when `points` is empty.
          examples: [false]
        attribution:
          type: string
          description: The data source line the chart shows.
          examples: ["Data provided by CoinGecko"]
    AssetDetail:
      type: object
      description: One asset, the list fields plus the chain facts and the other listings.
      examples:
        - symbol: AAPLx
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: "https://cdn.example.com/AAPLx.png"
          price_micros: 110000000
          price_as_of: "2026-03-04T14:30:00Z"
          change_bps: 1000
          sparkline_micros: [100000000, 110000000]
          session:
            state: open
            continuous: false
            holiday: ""
            early_close: false
            next_state: after_hours
            next_transition: "2026-03-04T21:00:00Z"
          decimals: 8
          ui_multiplier:
            num: 1
            den: 1
          tradable: true
          other_listings: []
          attribution: Data provided by CoinGecko
      additionalProperties: false
      required:
        - symbol
        - display_name
        - issuer
        - kind
        - logo_url
        - price_micros
        - price_as_of
        - change_bps
        - sparkline_micros
        - session
        - decimals
        - ui_multiplier
        - tradable
        - other_listings
        - attribution
      properties:
        symbol:
          type: string
          description: The ticker the app shows and the path key for the asset.
          examples: [AAPLx]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close for an equity, or against the first
            sample of the UTC day for a pre-IPO token. Null when that reference does not exist.
          examples: [1000]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
          examples:
            - state: open
              continuous: false
              holiday: ""
              early_close: false
              next_state: after_hours
              next_transition: "2026-03-04T21:00:00Z"
        decimals:
          type: integer
          minimum: 0
          maximum: 255
          description: The mint's decimals.
          examples: [8]
        ui_multiplier:
          $ref: "#/components/schemas/UiMultiplier"
          description: The whole tokens in one display unit.
          examples:
            - num: 1
              den: 1
        tradable:
          type: boolean
          description: True when this asset can be bought.
          examples: [true]
        other_listings:
          type: array
          description: The other assets that share this company's key. This asset is not in the list.
          examples:
            - - symbol: AAPLy
                display_name: Apple
                issuer: xstocks
                kind: equity
                logo_url: "https://cdn.example.com/AAPLy.png"
                tradable: false
          items:
            $ref: "#/components/schemas/AssetListing"
        attribution:
          type: string
          description: The data source line the asset screen shows.
          examples: ["Data provided by CoinGecko"]
