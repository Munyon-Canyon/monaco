          format: uuid
          description: The cabal the item is about. Null for a price move.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        cabal_name: {type: [string, "null"], description: "The cabal's current name. Null for a price move.", examples: [Alpha Cabal]}
        actor_id:
          type: [string, "null"]
          format: uuid
          description: The user who acted. Null for a system item.
