    FeedItem:
      type: object
      description: One feed item with its display strings rendered.
      additionalProperties: false
      required: [id, kind, ref_type, ref_id, cabal_id, actor_id, symbol, title, detail, body, status, tone, comment_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, description: "The item's id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        kind:
          type: string
          description: "`proposal`, `trade`, `price_move`, `cabal_created` or `member_joined`."
          examples: [trade]
        ref_type:
          type: string
          description: The source the item points at, such as `swaps` for a trade.
          examples: [swaps]
        ref_id: {type: string, format: uuid, description: "The source row's id.", examples: ["01920000-0000-7000-8000-000000000008"]}
        cabal_id:
          type: [string, "null"]
          format: uuid
          description: The cabal the item is about. Null for a price move.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        actor_id:
          type: [string, "null"]
          format: uuid
          description: The user who acted. Null for a system item.
          examples: [null]
        symbol: {type: [string, "null"], description: "The stock symbol, if the item is about one.", examples: [AAPLx]}
        title: {type: string, description: "The rendered headline.", examples: ["Alpha Cabal bought $500 of AAPLx"]}
        detail: {type: [string, "null"], description: "A rendered second line, if the item has one.", examples: [Apple]}
        body: {type: [string, "null"], description: "Free text, such as a proposal's thesis.", examples: [null]}
        status: {type: [string, "null"], description: "The source's status, for proposals.", examples: [null]}
        tone:
          type: string
          description: "`neutral`, `positive` or `negative`, so the app can color the item without reading amounts."
          examples: [neutral]
        comment_count: {type: integer, format: int32, description: "The number of comments.", examples: [0]}
        created_at: {type: string, format: date-time, description: "When the item was created.", examples: ["2026-10-03T08:00:00Z"]}
        updated_at: {type: string, format: date-time, description: "When the item last changed.", examples: ["2026-10-03T08:00:00Z"]}
    FeedItemDetail:
      type: object
      description: One feed item and whether it passes the request's filters.
      additionalProperties: false
      required: [item, visible]
      properties:
        item:
          $ref: "#/components/schemas/FeedItem"
        visible:
          type: boolean
          description: True when the item passes the filters sent with the request.
          examples: [true]
    FeedPage:
      type: object
      description: One page of feed items, newest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FollowRequest:
      type: object
      description: Where a follow came from.
      additionalProperties: false
      properties:
        source:
          type: string
          description: >-
            One of `profile`, `phone`, `x`, `cabal`, `feed` or `suggested`. Defaults to `profile`.
          examples: [profile]
    FollowState:
      type: object
      description: Whether the caller follows the user after the call.
      additionalProperties: false
      required: [following]
      properties:
        following:
          type: boolean
          description: True after a follow and false after an unfollow.
          examples: [true]
    HandleAvailability:
      type: object
      description: Whether the caller can claim a handle, and the reason when they cannot.
      examples:
        - handle: admin
          available: false
          reason: reserved
      additionalProperties: false
      required: [handle, available]
      properties:
        handle:
          type: string
          description: The handle that was checked, in lowercase.
          examples: [admin]
        available:
          type: boolean
          description: True when the caller can claim the handle, including when it is already theirs.
          examples: [false]
        reason:
          $ref: "#/components/schemas/HandleAvailabilityReason"
          description: Why the handle is not available. Absent when `available` is true.
    HandleAvailabilityReason:
      type: string
      description: >-
        Why a handle cannot be claimed. `reserved` covers the reserved list, profanity and
        referral-code shape. `taken` covers another user, including a deleted one, and another
        user's X username.
      examples: [reserved]
      enum: [taken, reserved, invalid, too_soon]
    InviteMemberRequest:
      type: object
      description: Who to invite to a cabal.
      additionalProperties: false
      required: [handle]
      properties:
        handle: {type: string, description: The invitee's handle., examples: [kai]}
    MarketSession:
      type: object
      description: The session the asset is in, computed on the server.
      examples:
        - state: open
          continuous: false
          holiday: ""
          early_close: false
          next_state: after_hours
          next_transition: "2026-03-04T21:00:00Z"
      additionalProperties: false
      required: [state, continuous, holiday, early_close, next_state, next_transition]
      properties:
        state:
          $ref: "#/components/schemas/MarketState"
          description: The session state at the time of the response.
          examples: [open]
        continuous:
          type: boolean
          description: True for a pre-IPO token, which trades without a US session.
          examples: [false]
        holiday:
          type: string
          description: The US market holiday name. Empty when the day is not a holiday.
          examples: [""]
        early_close:
          type: boolean
          description: True when the regular session closes early today.
          examples: [false]
        next_state:
          description: The next session state. Null when the asset trades continuously.
          examples: [after_hours]
          type: [string, "null"]
          enum: [pre_market, open, after_hours, closed, null]
        next_transition:
          type: [string, "null"]
          format: date-time
          description: When `next_state` begins. Null when the asset trades continuously.
          examples: ["2026-03-04T21:00:00Z"]
    MarketState:
      type: string
      description: Where the underlying US session is.
      examples: [open]
      enum: [pre_market, open, after_hours, closed]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          created_at: "2026-09-30T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - display_name
        - auth_state
        - account_status
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    MyCabal:
      type: object
      description: A cabal the caller belongs to.
      additionalProperties: false
      required: [id, name, picture_url, role, can_vote, member_count, joined_at, pending_request_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        role: {type: string, examples: [creator]}
        can_vote: {type: boolean}
        member_count: {type: integer, format: int32}
        joined_at: {type: string, format: date-time}
        pending_request_count: {type: integer, format: int32}
    MyReferralCode:
      type: object
      description: The caller's invite code and the links that carry it.
      examples:
        - code: k7m4qx2p
          link: https://monacolabs.xyz/r/k7m4qx2p
          handle_link: https://monacolabs.xyz/r/kaicenat
          handle_unlocked: true
      additionalProperties: false
      required: [code, link, handle_link, handle_unlocked]
      properties:
        code:
          type: string
          description: The random 8-character code. It never changes.
          pattern: "^[23456789abcdefghjkmnpqrstuvwxyz]{8}$"
          examples: [k7m4qx2p]
        link:
          type: string
          description: The invite link for the random code.
          examples: ["https://monacolabs.xyz/r/k7m4qx2p"]
        handle_link:
          type: [string, "null"]
          description: The invite link for the caller's handle, or null until the first deposit unlocks it.
          examples: ["https://monacolabs.xyz/r/kaicenat"]
        handle_unlocked:
          type: boolean
          description: True once the caller's first deposit is credited.
          examples: [true]
