          description: The session this asset is in.
    AuthState:
      type: string
      description: >-
        Where the user is in onboarding. `CREATED` means onboarding has not finished, `AWAITING_PHONE`
        and `AWAITING_SOCIALS` mean the user still owes that step, and `ONBOARDING_COMPLETED` means the
        phone and X are both linked. The app routes the first-run flow and shows nudge banners from it.
      examples: [CREATED]
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
    Balance:
      type: object
      description: The member wallet's on-chain USDC and currently spendable platform balance.
      additionalProperties: false
      required: [available_micros, on_chain_micros, in_flight_micros, deposit_address, as_of]
      properties:
        available_micros: {type: string, pattern: "^[0-9]+$", examples: ["22500000"]}
        on_chain_micros: {type: string, pattern: "^[0-9]+$", examples: ["25000000"]}
        in_flight_micros: {type: string, pattern: "^[0-9]+$", examples: ["2500000"]}
        deposit_address: {type: string, examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]}
        as_of: {type: string, format: date-time, examples: ["2026-10-03T15:00:00Z"]}
    BallotChoice:
      type: string
      description: A voter's choice on a proposal.
      enum: ["yes", "no"]
      examples: ["yes"]
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      additionalProperties: false
      required:
        [id, name, picture_url, status, rules, creator, member_count, members, me, my_access_request, invite_code, treasury_address]
