openapi: 3.1.0
info:
  title: Monaco API
  version: 0.1.0
  description: HTTP contract between the Monaco iOS app and the Monaco backend.
  contact:
    name: Monaco
    url: https://github.com/Munyon-Canyon/monaco
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development server.
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness of the API process.
  - name: stream
    description: Live re-fetch hints over server-sent events.
  - name: system
    description: The reference flow that exercises every backend layer end to end.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Report that the API process is serving.
      description: Returns ok while the process accepts requests. It checks no dependency.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/stream:
    get:
      operationId: getStream
      tags: [stream]
      summary: Stream re-fetch hints for the caller.
      description: >-
        Opens a server-sent event stream. Each `hint` event names a key the caller may read
        (`user:<id>`, `cabal:<id>` or `global`) and what changed; the app re-fetches that screen
        through its normal GET. Hints are droppable, so a missed hint costs one re-fetch. A comment
        line arrives every 15 seconds as a heartbeat. A reconnect that sends Last-Event-ID first
        gets one `resync` event, telling the app to re-fetch everything it shows.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the app received before it reconnected.
          schema:
            type: string
            examples: ["42"]
      responses:
        "200":
          description: >-
            The stream. `event: hint` carries `data: {"key":"cabal:<id>","what":"updated"}` and an
            `id`. `event: resync` carries `data: {}`.
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "id: 1\nevent: hint\ndata: {\"key\":\"global\",\"what\":\"feed\"}\n\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings:
    post:
      operationId: postSystemPing
      tags: [system]
      x-idempotent: true
      summary: Record a ping for the caller.
      description: >-
        Writes a ping and appends `system.pinged`. The `system.echo` consumer then marks the ping
        echoed and sends the caller a `ping_echoed` hint on `/v1/stream`. A replay with the same
        Idempotency-Key returns the first response and records nothing new.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The note to record with the ping.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
      responses:
        "201":
          description: The ping was recorded. `echoed` is false until the consumer runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings/{id}:
    get:
      operationId: getSystemPing
      tags: [system]
      summary: Read one of the caller's pings.
      description: Returns the ping with `echoed` computed on the server. Another user's ping is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The ping id from the create response.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A key the app generates once per user action. The server stores the first response under
        it and replays that response for any retry with the same key and body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ["6f1c1a52-3a4e-4d0e-9d7b-2f7f3f5b9d10"]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A bearer token in the Authorization header. Operations that declare an empty security
        list, such as /healthz, take no token. The token format belongs to the identity module;
        local development and tests use HS256 dev tokens from `monacoctl dev token`.
  responses:
    Problem:
      description: An RFC 9457 problem. Switch on `code`; show `message`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PingRequest:
      type: object
      description: A note to record with the ping.
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Free text, at most 140 characters.
          maxLength: 140
          examples: [hi]
    Ping:
      type: object
      description: A recorded ping.
      additionalProperties: false
      required: [id, note, echoed]
      properties:
        id:
          type: string
          format: uuid
          description: The ping id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        note:
          type: string
          description: The note sent with the ping.
          maxLength: 140
          examples: [hi]
        echoed:
          type: boolean
          description: True once the `system.echo` consumer has handled the ping.
          examples: [true]
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      additionalProperties: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
    ErrorCode:
      type: string
      description: The closed list of error codes. Generated from the errs table by monacoctl gen errors.
      examples: [not_found]
      enum:
        # BEGIN GENERATED ErrorCode
        - account_banned
