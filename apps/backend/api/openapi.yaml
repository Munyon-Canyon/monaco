      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The amount and the destination address.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawRequest"}
            example: {amount_micros: "2000000", to_address: 9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P}
      responses:
        "202":
          description: The transfer is signed and sent. `status` is `submitted` until it confirms.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WithdrawAccepted"}
              example: {withdrawal_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals/{id}:
    get:
      operationId: getMyWithdrawal
      tags: [funding]
      x-allow-restricted: true
      summary: Read one of the caller's withdrawals.
      description: Returns the withdrawal's status. Another user's withdrawal is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The withdrawal id from the create response.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The withdrawal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Withdrawal"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/onramp/sessions:
    post:
      operationId: createOnrampSession
      tags: [funding]
      x-idempotent: true
      summary: Start a card deposit.
      description: >-
        Creates an onramp session for the caller and returns the one-time fund page URL. The URL carries
        a single-use token that expires 10 minutes after creation and never the wallet address. The
        server stores only the token's SHA-256 and appends `onramp.status_changed` with `to: created`.
        A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: An optional amount to prefill on the fund page and the cabal the user came from.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnrampSessionRequest"
      responses:
        "201":
          description: The session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSessionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/exchange:
    post:
      operationId: exchangeOnrampToken
      tags: [funding]
      security: []
      x-idempotent: false
      x-cors: web
      x-rate-limit:
        ip:
          rate: 30
          per: 1m
          burst: 30
      summary: Exchange a fund page token for the deposit address.
      description: >-
        Called by the fund page with the token from its URL. Opens the session and returns the member
        wallet address, the suggested amount and the USDC mint. The token works once:
        a used or unknown token is onramp_link_invalid, and a token past its 10 minutes is
        onramp_link_expired.
      requestBody:
        description: The token from the fund page URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeOnrampTokenRequest"
      responses:
        "200":
          description: The session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampExchange"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/{id}:
    get:
      operationId: getOnrampSession
      tags: [funding]
      summary: Read one of the caller's card deposits.
      description: >-
        Returns the session's status for the app's "Purchase processing" state. Another user's
        session is not_found.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: reportOnrampStatus
      tags: [funding]
      x-idempotent: true
      x-cors: web
      summary: Report how the provider flow ended.
      description: >-
        Called by the fund page with the Privy access token from its own login as the bearer.
        Moves an opened session to the reported status, appends `onramp.status_changed` and sends
        the owner an `onramp_changed` hint on `/v1/stream`. Another user is forbidden, and any move
        the status machine does not allow, such as confirmed to cancelled, is onramp_invalid_transition.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The status the provider flow ended in.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportOnrampStatusRequest"
      responses:
        "200":
          description: The session after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/governance.yaml
  /v1/cabals/{id}/proposals:
    get:
      operationId: getCabalProposals
      tags: [governance]
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first. Every cabal is public, so any
        signed-in user can read them. A non-member sees the same items with `my_ballot` null.
        `open` keeps proposals still taking ballots, and `closed` keeps every other status.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, closed, all]
            default: all
            examples: [open]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a trade for the cabal to vote on.
      description: >-
        Checks that the caller is a member, that the asset is in the catalog and Jupiter can route
        it, and that a buy fits the pot or a sell fits the cabal's holding. These checks are advisory:
        the trade engine repeats them at execution. The voter set is copied from the cabal and never
        changes after. The proposer casts no ballot of their own. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The trade to propose. A buy sets `usdc_micros`, and a sell sets `token_amount`.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeTradeRequest"
            example: {kind: buy, symbol: TSLAx, usdc_micros: 5000000, thesis: earnings}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/preview:
    get:
      operationId: getCabalProposalPreview
      tags: [governance]
      summary: Preview a trade before proposing it.
      description: >-
        Runs the checks a proposal runs and writes nothing. A trade the checks refuse still answers
        200, with the refusal in `advisory_code` and `advisory_message`, so the review screen can show
        it. Only members can preview.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: true
          description: Whether the trade buys or sells the token.
          schema:
            $ref: "#/components/schemas/ProposalKind"
        - name: symbol
          in: query
          required: true
          description: The token symbol from the catalog.
          schema: {type: string, minLength: 1, maxLength: 32, examples: [TSLAx]}
        - name: usdc_micros
          in: query
          required: false
          description: USDC a buy spends, in micros.
          schema: {type: integer, format: int64, minimum: 1, examples: [5000000]}
        - name: token_amount
          in: query
          required: false
          description: Token base units a sell spends.
          schema: {type: integer, format: int64, minimum: 1, examples: [1000000]}
      responses:
        "200":
          description: The quote and the first check the trade fails, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradePreview"
              example: {quote_out_amount: 21000000, advisory_code: null, advisory_message: null, pot_value_micros: 100000000}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pending-votes:
    get:
      operationId: getMyPendingVotes
      tags: [governance]
      summary: List the open proposals waiting on the caller's ballot.
      description: >-
        Returns up to 50 open proposals, across every cabal, whose frozen voter set holds the caller
        and that have no ballot from the caller yet, soonest to expire first.
      responses:
        "200":
          description: The proposals waiting on the caller.
          content:
            application/json:
              schema: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/PendingVote"}}
              example: [{proposal_id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, kind: buy, symbol: AAPLx, expires_at: "2026-10-04T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}:
    get:
      operationId: getProposal
      tags: [governance]
      summary: Read one proposal.
      description: >-
        Returns the proposal as the list shows it, plus every member of its frozen voter set with
        their ballot, whether the caller can vote on it or withdraw it, and the latest trade linked
        to it. A non-member sees the same proposal with `can_vote` and `can_withdraw` false.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: open, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, choice: null, cast_at: null}], can_vote: true, can_withdraw: true, swap: null}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposal
      tags: [governance]
      x-idempotent: true
      summary: Withdraw the caller's proposal.
      description: >-
        Moves the caller's open proposal to `withdrawn` and appends `proposal.withdrawn`. Only the
        proposer can withdraw, and only before any other member has voted; the proposer's own ballot
        does not count. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The withdrawn proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: withdrawn, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, choice: null, cast_at: null}], can_vote: false, can_withdraw: false, swap: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/votes:
    post:
      operationId: postProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Cast or change the caller's ballot on an open proposal.
      description: >-
        Stores the caller's ballot and tallies it against the proposal's frozen voter set and the
        cabal's threshold rule. A deciding ballot moves the proposal to `passed` or `failed` in the
        same transaction. Execution of a passed proposal is asynchronous, so the client sees
        `executed` or `execution_blocked` later. A replay with the same Idempotency-Key returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's choice.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVoteRequest"
      responses:
        "200":
          description: The ballot was stored. `status` is the proposal's status after the tally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/identity.yaml
  /v1/auth/session:
    post:
      operationId: postAuthSession
      tags: [identity]
      security: []
      x-idempotent: false
      x-rate-limit:
        ip:
          rate: 60
          per: 1m
          burst: 60
      summary: Open a session from a Privy access token.
      description: >-
        Verifies the Privy access token in the Authorization header, finds or creates the user by
        their Privy id, reuses the user's one member wallet and returns the account. The first call
        for a Privy user creates the account and appends `user.created`. Calling it again changes
        nothing, so it takes no Idempotency-Key. It also brings the account back in line with the
        phone and X accounts linked in Privy. Sign-in is by phone number or email through Privy; a
        Privy user with neither is login_method_not_allowed, and a deleted account is account_deleted.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: >-
            The Privy access token as `Bearer <token>`. The route is public because no account exists
            on the first call, so the server verifies this header itself and answers unauthorized when
            it is missing or invalid.
          schema:
            type: string
            examples: ["Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaWQ6cHJpdnk6cWEtMSJ9.c2lnbmF0dXJl"]
      responses:
        "200":
          description: The caller's account, with its `auth_state`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dev/me/x-link:
    post:
      operationId: postDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Link a fake X account to a dev user.
      description: >-
        Outside production only. Stores a fake X account for a caller whose Privy email is
        `dev-<suffix>@example.com`, so `POST /v1/me/onboarding/socials` and the next session link it as
        if Privy reported it. The X user id is `dev:<suffix>`, and the username defaults to
        `dev_x_<suffix>`. Calling it again replaces the stored username. Any other caller, and every
        caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fake X username. Omit it for `dev_x_<suffix>`.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevXLink"
            example:
              username: qa_x
      responses:
        "204":
          description: The fake X account is stored for the caller.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Remove a dev user's fake X account.
      description: >-
        Outside production only. Deletes the caller's fake X account, so the next session unlinks X as a
        real Privy unlink does. A caller with no fake X account also gets 204. A caller whose Privy email
        is not `dev-<suffix>@example.com`, and every caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller has no fake X account.
        default:
          $ref: "#/components/responses/Problem"
  /v1/handles/{handle}/availability:
    get:
      operationId: getHandleAvailability
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Check whether the caller can claim a handle.
      description: >-
        Compares the handle with the reserved list, the profanity list, the referral-code shape,
        other users' X usernames and the caller's own handle. `available` is false with a `reason`
        of `invalid`, `reserved`, `taken` or `too_soon`. The caller's current handle is available.
        Profanity and code shape are reported as `reserved`, and another user's X username as
        `taken`.
      parameters:
        - name: handle
          in: path
          required: true
          description: The handle to check, before it is stored. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [KaiCenat]
      responses:
        "200":
          description: Whether the handle is available to the caller, and why not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      x-allow-restricted: true
      tags: [identity]
      summary: Read the signed-in user's account.
      description: >-
        Returns the caller's own `Me`: handle, display name, `auth_state`, `account_status` and the
        member wallet address. A suspended or banned user gets it too, so the app can show the notice
        screen. A deleted account is user_not_found.
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchMe
      x-idempotent: true
      tags: [identity]
      summary: Update the signed-in user's profile.
      description: Replaces the caller's normalized display name; an unchanged name is a no-op.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The display name to normalize and save for the caller.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProfileRequest"}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteMe
      x-idempotent: true
      x-allow-restricted: true
      tags: [identity]
      summary: Delete the signed-in user's account.
      description: >-
        Deletes the caller's account once nothing is left in it. A stake in any cabal is
        account_has_positions and any platform balance is account_has_balance; cash out and withdraw
        first. Deletion scrubs the caller's personal fields and keeps the handle, so no one can claim it.
        A suspended or banned user may delete too. Every later request with the same token is
        account_deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The account is deleted.
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/handle:
    put:
      operationId: putMeHandle
      tags: [identity]
      x-idempotent: true
      summary: Set the caller's handle.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's new handle.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetHandle"
            example:
              handle: kai_one
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/phone:
    post:
      operationId: postOnboardingPhone
      tags: [identity]
      x-idempotent: true
      summary: Store the phone the caller linked in Privy.
      description: >-
        Reads the verified phone from the caller's Privy user, never from the request, stores it and
        advances `auth_state`. A caller with no handle gets handle_required, and a caller with no phone
        linked in Privy gets phone_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/skip:
    post:
      operationId: postOnboardingSkip
      tags: [identity]
      x-idempotent: true
      summary: Skip an onboarding step.
      description: >-
        Skipping `phone` moves a CREATED caller to AWAITING_PHONE. Skipping `socials` changes no state,
        and the app moves on. A skip never clears a stored phone or X account. A caller with no handle
        gets handle_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The step to skip.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipOnboardingStep"
            example:
              step: phone
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/socials:
    post:
      operationId: postOnboardingSocials
      tags: [identity]
      x-idempotent: true
      summary: Store the X account the caller linked in Privy.
      description: >-
        Reads the X user id and username from the caller's Privy user, never from the request, stores
        them and advances `auth_state`. A caller with no handle gets handle_required, and a caller with
        no X account linked in Privy gets x_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/profile-photo:
    post:
      operationId: postProfilePhoto
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      tags: [identity]
      summary: Upload a profile photo.
      description: Stores a JPEG, PNG, or WebP profile photo for the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG, or WebP image in the required photo field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary, examples: [avatar.png]}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/users:
    get:
      operationId: searchUsers
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}}
      summary: Search people by handle or display name.
      parameters:
        - name: query
          in: query
          required: true
          description: A handle prefix or display-name substring to find.
          schema: {type: string, minLength: 1, maxLength: 50}
      responses:
        "200":
          description: Matching people.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSearchResult"}
              example:
                users:
                  - user_id: 01890a5d-ac96-774b-bcce-b302099a8058
                    handle: maya
                    display_name: Maya Angelou
                    photo_url: https://img.example/maya.png
        default: {$ref: "#/components/responses/Problem"}
  /v1/users/{id}:
    get:
      operationId: getUser
      tags: [identity]
      summary: Read a user's public profile.
      description: >-
        Returns the user's handle, display name and photo with their follower and following counts, and
        whether the caller follows them. The counts are of live follows and include members who were
        banned or deleted after following. An unknown, banned or deleted user is user_not_found.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user's public profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProfile"}
              example:
                id: 01890a5d-ac96-774b-bcce-b302099a8058
                handle: maya
                display_name: Maya Angelou
                photo_url: https://img.example/maya.png
                follower_count: 12
                following_count: 7
                followed_by_me: true
        default: {$ref: "#/components/responses/Problem"}
  # api/spec/market.yaml
  /v1/assets:
    get:
      operationId: getAssets
      tags: [market]
      summary: List tradable assets.
      description: >-
        Returns the tradable catalog, one page at a time. `q` matches the start of a symbol or any
        part of a display name, ignoring case. `popular` orders by the curated rank. `pre_ipo`
        keeps only pre-IPO tokens. A price the hold rule has not accepted is null, never zero.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive symbol prefix or display-name search. Absent lists the filter.
          schema:
            type: string
            maxLength: 80
            examples: [apple]
        - name: filter
          in: query
          required: false
          description: Which tradable assets to return, and how to order them.
          schema:
            type: string
            enum: [all, popular, pre_ipo]
            default: all
            examples: [popular]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["c0FBUEx4ADAxOTIwMDAwLTAwMDAtNzAwMC04MDAwLTAwMDAwMDAwMDAwMQ"]
      responses:
        "200":
          description: One page of tradable assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}:
    get:
      operationId: getAsset
      tags: [market]
      summary: Read one asset.
      description: >-
        Returns one known asset, tradable or not, with the held price and the other listings of the
        same company. An unknown symbol is `asset_not_found`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [AAPLx]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/chart:
    get:
      operationId: getAssetChart
      tags: [market]
      summary: Read one asset's chart.
      description: >-
        Buckets the asset's stored prices for the requested range. A held spike is left out of the
        buckets. An unknown symbol is `asset_not_found`. `ALL` starts at the first stored sample.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
        - name: range
          in: query
          required: true
          description: How far back to read, and how wide each bucket is.
          schema: {type: string, enum: [1D, 1W, 1M, 3M, 1Y, ALL], examples: [1D]}
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetChart"}
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/notify.yaml
  /v1/devices:
    post:
      operationId: postDevice
      tags: [notify]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 30
          per: 1m
          burst: 30
      summary: Register the caller's APNs device token.
      description: >-
        Saves the token for the caller and marks it active. Registering a token again bumps its
        last-seen time and clears a disabled mark. A token another user registered moves to the
        caller, so one device belongs to one account. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The device token and the APNs environment it was issued for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "204":
          description: The token is registered to the caller.
        default:
          $ref: "#/components/responses/Problem"
  /v1/devices/{token}:
    delete:
      operationId: deleteDevice
      tags: [notify]
      x-idempotent: true
      summary: Remove one of the caller's device tokens.
      description: >-
        Deletes the token when it belongs to the caller. A token that is unknown or belongs to
        another user also answers 204, so the route reveals nothing about other users' devices.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: token
          in: path
          required: true
          description: The APNs device token to remove, as registered with POST /v1/devices.
          schema:
            type: string
            examples: ["0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"]
      responses:
        "204":
          description: The caller no longer has this token registered.
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/platform.yaml
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Report that the API process is serving.
      description: Returns ok while the process accepts requests. It checks no dependency.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/stream:
    get:
      operationId: getStream
      x-allow-restricted: true
      tags: [stream]
      summary: Stream re-fetch hints for the caller.
      description: >-
        Opens a server-sent event stream. Each `hint` event names a key the caller may read
        (`user:<id>`, `cabal:<id>` or `global`) and what changed; the app re-fetches that screen
        through its normal GET. Hints are droppable, so a missed hint costs one re-fetch. A comment
        line arrives every 15 seconds as a heartbeat. A reconnect that sends Last-Event-ID first
        gets one `resync` event, telling the app to re-fetch everything it shows.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the app received before it reconnected.
          schema:
            type: string
            examples: ["42"]
      responses:
        "200":
          description: >-
            The stream. `event: hint` carries `data: {"key":"cabal:<id>","what":"updated"}` and an
            `id`. `event: resync` carries `data: {}`.
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "id: 1\nevent: hint\ndata: {\"key\":\"global\",\"what\":\"feed\"}\n\n"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/referrals.yaml
  /v1/me/referral-code:
    get:
      operationId: getMyReferralCode
      tags: [referrals]
      summary: Read the caller's invite code and links.
      description: >-
        Returns the caller's random code and its link. `handle_link` is set and `handle_unlocked` is
        true once the caller's first deposit is credited. A user whose code is not minted yet gets
        referral_code_pending, a retryable 503, so the app tries again.
      responses:
        "200":
          description: The caller's invite code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReferralCode"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/social.yaml
  /v1/cabals/{id}/messages:
    post:
      operationId: postChatMessage
      tags: [social]
      x-idempotent: true
      summary: Post a message to a cabal's chat.
      description: >-
        Stores the message and appends `chat.message_posted`. Only a member can post, otherwise
        not_cabal_member. The body is trimmed and must be 1 to 2000 Unicode scalars, otherwise
        chat_body_invalid. A reply names its `parent_id`, which must be a live top-level message
        in the same cabal: an unknown, deleted or other-cabal parent is chat_parent_not_found and
        a parent that is itself a reply is chat_parent_is_reply. `also_in_channel` shows the reply
        in the channel too and needs a `parent_id`, otherwise invalid_input. A replay returns the
        first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
      requestBody:
        description: The message.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageRequest"
            example: {body: gm}
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getChatMessages
      tags: [social]
      summary: Read a cabal's chat channel.
      description: >-
        Returns the channel view: top-level messages and replies sent with `also_in_channel`.
        Without a cursor it returns the newest page, newest first. `before` returns the page older
        than that message, newest first. `after` returns the messages newer than that message,
        oldest first, for catching up after a reconnect. Sending both is invalid_input, and a
        cursor that is not a message in this cabal is chat_message_not_found. A deleted top-level
        message that has replies comes back with `deleted: true` and a null body; other deleted
        messages are left out. Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - name: before
          in: query
          required: false
          description: A message id. Returns the messages older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: after
          in: query
          required: false
          description: A message id. Returns the messages newer than it, oldest first.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannelPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}:
    delete:
      operationId: deleteChatMessage
      tags: [social]
      x-idempotent: true
      summary: Delete one of the caller's chat messages.
      description: >-
        Soft-deletes the message. Only its author can delete it, otherwise
        chat_message_not_owned. A message that is unknown or in another cabal is
        chat_message_not_found. Deleting a deleted message changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
      responses:
        "204":
          description: The message is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}/thread:
    get:
      operationId: getChatThread
      tags: [social]
      summary: Read a chat thread.
      description: >-
        Returns the top-level message and a page of its live replies, oldest first. Without
        `before` the page is the newest replies; with it, the replies older than that reply. A
        parent that is unknown, in another cabal, or deleted with no replies is
        chat_message_not_found, and a message that is itself a reply is chat_parent_is_reply.
        Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
        - name: before
          in: query
          required: false
          description: A reply id. Returns the replies older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000008"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: The parent and one page of replies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed:
    get:
      operationId: getFeed
      tags: [social]
      summary: Read the feed.
      description: >-
        Returns feed items newest first, one page at a time. Every filter narrows the page, and
        an unknown kind, scope or sort, a limit outside 1 to 50 or a cursor the server did not
        write is invalid_input. The server renders every display string.
      parameters:
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created` and `member_joined`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves).
          schema: {type: string, enum: [all, following, mine], default: all, examples: [mine]}
        - name: sort
          in: query
          required: false
          description: "`new` (the default): newest first."
          schema: {type: string, enum: [new], default: new, examples: [new]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of feed items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}:
    get:
      operationId: getFeedItem
      tags: [social]
      summary: Read one feed item.
      description: >-
        Returns the item and whether it passes the filters sent with the request, which take the
        same names as the list. An unknown id is feed_item_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created` and `member_joined`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves).
          schema: {type: string, enum: [all, following, mine], default: all, examples: [mine]}
      responses:
        "200":
          description: The feed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItemDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes:
    get:
      operationId: getMeFeedMutes
      tags: [social]
      summary: List feed mutes.
      responses:
        "200":
          description: Feed mutes newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedMute"
              example:
                - {target_type: asset, target_id: AAPLx, label: AAPLx, created_at: "2026-10-04T12:00:00Z"}
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putMeFeedMutes
      tags: [social]
      x-idempotent: true
      summary: Mute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The feed target to mute.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedMuteRequest"
            example: {target_type: asset, target_id: AAPLx}
      responses:
        "204": {description: The target is muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes/{target_type}/{target_id}:
    delete:
      operationId: deleteMeFeedMutesTargetTypeTargetID
      tags: [social]
      x-idempotent: true
      summary: Unmute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: target_type
          in: path
          required: true
          description: What kind of target is muted.
          schema: {type: string, enum: [kind, cabal, asset, user, item], examples: [asset]}
        - name: target_id
          in: path
          required: true
          description: The muted target's id.
          schema: {type: string, maxLength: 64, examples: [AAPLx]}
      responses:
        "204": {description: The target is not muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/follow:
    post:
      operationId: postUserFollow
      tags: [social]
      x-idempotent: true
      summary: Follow a user.
      description: >-
        Follows the user as the caller and appends `follow.created`. Following someone the caller
        already follows changes nothing and returns the same response. Following yourself is
        cannot_follow_self, an unknown or deleted user is user_not_found and a banned user is
        user_banned. `source` records where the follow came from and defaults to `profile`. The
        values a client may send are `profile`, `phone`, `x`, `cabal`, `feed` and `suggested`;
        any other value, `referral` included, is invalid_input.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Where the follow came from.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: The caller follows the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserFollow
      tags: [social]
      x-idempotent: true
      summary: Unfollow a user.
      description: >-
        Ends the caller's follow of the user and appends `follow.removed`. Unfollowing a user the
        caller does not follow changes nothing and returns the same response. A banned or deleted
        user can be unfollowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The caller does not follow the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/followers:
    get:
      operationId: getUserFollowers
      tags: [social]
      summary: List a user's followers.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/following:
    get:
      operationId: getUserFollowing
      tags: [social]
      summary: List the users a user follows.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followed users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/system.yaml
  /v1/system/pings:
    post:
      operationId: postSystemPing
      tags: [system]
      x-idempotent: true
      summary: Record a ping for the caller.
      description: >-
        Writes a ping and appends `system.pinged`. The `system.echo` consumer then marks the ping
        echoed and sends the caller a `ping_echoed` hint on `/v1/stream`. A replay with the same
        Idempotency-Key returns the first response and records nothing new.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The note to record with the ping.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
      responses:
        "201":
          description: The ping was recorded. `echoed` is false until the consumer runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings/{id}:
    get:
      operationId: getSystemPing
      tags: [system]
      summary: Read one of the caller's pings.
      description: Returns the ping with `echoed` computed on the server. Another user's ping is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The ping id from the create response.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/trading.yaml
  /v1/swaps/{id}:
    get:
      operationId: getSwap
      tags: [trading]
      summary: Read one trade.
      description: >-
        Returns a swap with its asset, amounts, status and, for a failed swap, why it failed. Only
        members of the swap's cabal can read it; anyone else gets `not_cabal_member`. The asset name and
        decimals come from the catalog, and raw mints are never returned. `retryable` is true only for
        the latest swap of a proposal when that swap failed.
      parameters:
        - name: id
          in: path
          required: true
          description: The swap id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The swap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, source: {kind: proposal, id: 01890a5d-ac96-774b-bcce-b302099a8059}, action: buy, symbol: AAPLx, asset_name: Apple, token_decimals: 8, usdc_micros: 25000000, token_amount: null, status: failed, failure_code: jupiter_failed, failure_message: The trade did not go through., tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, created_at: "2026-10-03T15:00:00Z", confirmed_at: null, retryable: true}
        default:
          $ref: "#/components/responses/Problem"
  /v1/swaps/{id}/retry:
    post:
      operationId: postSwapRetry
      tags: [trading]
      x-idempotent: true
      summary: Retry a failed trade.
      description: >-
        Asks the trade engine to run a proposal's trade again after its swap failed. Only a member of
        the swap's cabal can ask, and only for the latest swap of a passed proposal when that swap is
        `failed`; a cash out leg is final. The server appends `trade.retry_requested` with the trade
        parameters from the failed swap and answers at once. The engine re-runs the pre-trade checks
        and creates a new swap, or blocks the proposal, later. A replay with the same Idempotency-Key
        returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the failed swap.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The retry was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRetryAccepted"
              example: {swap_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: retry_requested}
        default:
          $ref: "#/components/responses/Problem"
  # api/spec/treasury.yaml
  /v1/cabals/{id}/activity:
    get:
      operationId: getCabalActivity
      tags: [treasury]
      summary: List a cabal's activity.
      description: >-
        Returns one page of the cabal's buys, sells, funds and cash outs, newest first, pending and failed
        ones included. Only members can read it; anyone else gets `not_cabal_member`. Asset and actor names
        are resolved for display, and raw mints are never returned.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
            examples: [30]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalActivityPage"
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: buy, status: confirmed, asset: {symbol: AAPLx, name: Apple}, usdc_micros: 25000000, units: 105000000, actor: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, occurred_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/cashouts:
    post:
      operationId: postCashOut
      tags: [treasury]
      x-idempotent: true
      x-allow-restricted: true
      summary: Start a cash out to the caller's platform balance.
      description: Reserves the caller's cabal shares and starts the asynchronous cash-out job.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The requested cash-out amount or all-shares selection.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CashOutRequest"}
            example: {all: true}
      responses:
        "202":
          description: The cash out job was reserved for processing.
          content:
            application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/preview:
    get:
      operationId: getCashOutPreview
      tags: [treasury]
      x-allow-restricted: true
      summary: Preview the caller's available cash out.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200": {description: The current cash-out preview., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutPreview"}, example: {slice_micros: "25000000", share_units: "100", min_micros: "100000", pause: null}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/{job_id}:
    get:
      operationId: getCashOutJob
      tags: [treasury]
      x-allow-restricted: true
      summary: Read one cash out job.
      parameters:
        - {name: id, in: path, required: true, description: The cabal id., schema: {type: string, format: uuid}}
        - {name: job_id, in: path, required: true, description: The cash-out job id., schema: {type: string, format: uuid}}
      responses:
        "200": {description: The job., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/fund:
    post:
      operationId: fundCabal
      tags: [treasury]
      x-idempotent: true
      summary: Fund a cabal from the caller's platform balance.
      description: >-
        Moves an exact amount of USDC from the caller's wallet to the cabal treasury. The transfer is
        signed and its signature stored before broadcast, so the answer is 202 with the transfer id; share
        units are minted at the live price once the transfer is final. Poll GET /v1/fund-transfers/{id}
        for the outcome. Only members can fund. A paused or banned cabal answers `cabal_paused`, an amount
        over the available balance answers `insufficient_funds`, and a pot with shares but no value answers
        `pot_value_zero`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      requestBody:
        description: The amount to fund, at least 1 USDC.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundRequest"}
      responses:
        "202":
          description: The transfer is signed and submitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundAccepted"}
              example: {transfer_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/pot:
    get:
      operationId: getCabalPot
      tags: [treasury]
      summary: Read a cabal's pot, its holdings and the caller's slice.
      description: >-
        Returns the pot value, its all-time gain, every holding at the latest market price and the caller's
        slice, all from one price read. Any signed-in user may read it. `me` is null when the caller is not a
        member. A holding without a fresh price returns `price_unavailable`; the pot is never valued at cost
        basis. Refresh on `cabal.<id>.activity_changed` and `global.prices_updated`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cabal's pot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPot"
              example: {cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, pot_value_micros: 120000000, cash_micros: 60000000, cash_weight_bps: 5000, pnl_micros: 20000000, return_bps: 2000, prices_as_of: "2026-10-03T15:00:00Z", holdings: [{symbol: AAPLx, display_name: Apple, kind: equity, units: "2.0000", token_amount: 200000000, price_micros: 30000000, value_micros: 60000000, weight_bps: 5000, cost_basis_micros: 40000000, pnl_micros: 20000000}], me: {share_units: 100000000, value_micros: 120000000, slice_bps: 10000, net_contributed_micros: 100000000, pnl_micros: 20000000}}
        default:
          $ref: "#/components/responses/Problem"
  /v1/fund-transfers/{id}:
    get:
      operationId: getFundTransfer
      tags: [treasury]
      summary: Read one of the caller's fund transfers.
      description: >-
        Returns the transfer's status, amount, the share units minted once it settles, and the failure code
        once it fails. A transfer that belongs to another user answers `not_found`.
      parameters:
        - name: id
          in: path
          required: true
          description: The transfer id from POST /v1/cabals/{id}/fund.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The transfer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundTransfer"}
              example: {status: settled, amount_micros: "5000000", share_units: "5000000", fail_code: null}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/txns:
    get:
      operationId: getMyTxns
      tags: [treasury]
      summary: List the caller's transaction history.
      x-allow-restricted: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512, examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]}
      responses:
        "200":
          description: One page of the caller's transactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserTxnPage"}
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: deposit, status: settled, usdc_micros: "25000000", cabal: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, created_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
  # api/spec/base.yaml
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A key the app generates once per user action. The server stores the first response under
        it and replays that response for any retry with the same key and body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ["6f1c1a52-3a4e-4d0e-9d7b-2f7f3f5b9d10"]
    UserId:
      name: id
      in: path
      required: true
      description: The id of the user.
      schema:
        type: string
        format: uuid
  # api/spec/funding.yaml
    OnrampSessionId:
      name: id
      in: path
      required: true
      description: The session id from the create response.
      schema:
        type: string
        format: uuid
        examples: [01890a5d-ac96-774b-bcce-b302099a8057]
  # api/spec/social.yaml
    ChatCabalId:
      name: id
      in: path
      required: true
      description: The cabal id.
      schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
    ChatMessageId:
      name: message_id
      in: path
      required: true
      description: The message id.
      schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
  securitySchemes:
  # api/spec/base.yaml
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A bearer token in the Authorization header. Operations that declare an empty security
        list, such as /healthz, take no token. The token format belongs to the identity module;
        local development and tests use HS256 dev tokens from `monacoctl dev token`.
  responses:
  # api/spec/base.yaml
    Problem:
      description: An RFC 9457 problem. Switch on `code`; show `message`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
  # api/spec/admin.yaml
    AdminMe:
      type: object
      description: An active administrator and their role.
      examples:
        - user_id: 019cc330-1111-7000-8000-000000000001
          role: operator
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: The administrator's user id.
          examples: [019cc330-1111-7000-8000-000000000001]
        role: {$ref: "#/components/schemas/AdminRole"}
    AdminRole:
      type: string
      description: The administrator's access level.
      enum: [viewer, moderator, operator]
      examples: [operator]
    Admins:
      type: object
      description: The active administrator list.
      examples:
        - admins:
            - user_id: 019cc330-1111-7000-8000-000000000001
              role: operator
      additionalProperties: false
      required: [admins]
      properties:
        admins:
          type: array
          description: Every non-revoked administrator.
          items: {$ref: "#/components/schemas/AdminMe"}
  # api/spec/base.yaml
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      additionalProperties: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
  # api/spec/cabal.yaml
    AccessDecisionRequest:
      type: object
      description: How to decide a pending request or invite.
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, deny], examples: [approve]}
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      additionalProperties: false
      required:
        [id, name, picture_url, status, rules, creator, member_count, members, me, my_access_request, invite_code, treasury_address]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Kai]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        status: {type: string, description: "`active` or `banned`.", examples: [active]}
        rules: {$ref: "#/components/schemas/CabalRules", examples: [{join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}]}
        creator: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        member_count: {type: integer, format: int32, examples: [1]}
        members: {type: array, items: {$ref: "#/components/schemas/CabalMember"}, examples: [[]]}
        me:
          type: [object, "null"]
          description: "Null when the caller is not a member."
          examples: [null]
          x-go-type-name: CabalMembership
          additionalProperties: false
          required: [role, can_vote]
          properties:
            role: {type: string, examples: [creator]}
            can_vote: {type: boolean, examples: [true]}
        my_access_request:
          type: [object, "null"]
          description: "The caller's pending access request, or null."
          examples: [null]
          x-go-type: CabalAccess
          additionalProperties: false
          required: [id, direction, status]
          properties:
            id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
            direction: {type: string, description: "`request` or `invite`.", examples: [request]}
            status: {type: string, examples: [pending]}
        invite_code: {type: [string, "null"], description: The invite code. Null for a non-member., examples: [null]}
        treasury_address: {type: string, description: Solana address of the app-owned treasury wallet., examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]}
    CabalAccess:
      type: object
      description: A pending request or invite.
      additionalProperties: false
      required: [id, direction, status]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        direction: {type: string, description: "`request` or `invite`.", examples: [request]}
        status: {type: string, examples: [pending]}
    CabalAccessRequest:
      type: object
      description: A pending request to join a cabal, as its creator sees it.
      additionalProperties: false
      required: [id, user, created_at]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        created_at: {type: string, format: date-time, examples: ["2026-10-02T15:00:00Z"]}
    CabalInvite:
      type: object
      description: A pending invite, as its invitee sees it.
      additionalProperties: false
      required: [request_id, cabal, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, description: The id to accept or decline., examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        cabal: {$ref: "#/components/schemas/CabalInviteCabal", examples: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CabalInviteCabal:
      type: object
      description: The cabal an invite opens.
      additionalProperties: false
      required: [id, name, picture_url, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalMember:
      type: object
      description: A cabal member, including vote standing.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, description: "`creator` or `member`.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
    CabalPerson:
      type: object
      description: A user as shown on a cabal.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    CabalPreview:
      type: object
      description: What a non-member sees of a cabal before joining it.
      additionalProperties: false
      required: [id, name, picture_url, join_mode, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [request]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalRules:
      type: object
      description: How the cabal admits members and how it votes.
      additionalProperties: false
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps]
      properties:
        join_mode: {type: string, examples: [open]}
        voter_mode: {type: string, examples: [all]}
        threshold: {type: string, examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, examples: [86400]}
        slippage_bps: {type: integer, format: int32, examples: [100]}
    CabalSearchItem:
      type: object
      description: A public cabal in a search result.
      additionalProperties: false
      required: [id, name, picture_url, member_count, join_mode, is_member, my_access_request_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        member_count: {type: integer, format: int32}
        join_mode: {type: string, examples: [open]}
        is_member: {type: boolean}
        my_access_request_status: {type: [string, "null"], examples: [pending, null]}
    CabalSearchPage:
      type: object
      description: One page of public cabals.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalSearchItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], examples: [null]}
    CabalSentInvite:
      type: object
      description: A pending invite, as a member of its cabal sees it.
      additionalProperties: false
      required: [request_id, user, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CreateCabalRequest:
      type: object
      description: The name and rules for a new cabal.
      additionalProperties: false
      required: [name, join_mode, voter_mode, threshold, proposal_expiry_seconds]
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Kai]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [open]}
        voter_mode: {type: string, description: "all, or list starting with the creator.", examples: [all]}
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300. Omitted means 100.", examples: [100]}
    InviteMemberRequest:
      type: object
      description: Who to invite to a cabal.
      additionalProperties: false
      required: [handle]
      properties:
        handle: {type: string, description: The invitee's handle., examples: [kai]}
    MyCabal:
      type: object
      description: A cabal the caller belongs to.
      additionalProperties: false
      required: [id, name, picture_url, role, can_vote, member_count, joined_at, pending_request_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        role: {type: string, examples: [creator]}
        can_vote: {type: boolean}
        member_count: {type: integer, format: int32}
        joined_at: {type: string, format: date-time}
        pending_request_count: {type: integer, format: int32}
    UpdateCabalRequest:
      type: object
      description: The cabal fields to change. An omitted field keeps its value.
      additionalProperties: false
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Work pot]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [request]}
        voter_mode: {type: string, description: "`all` or `list`.", examples: [list]}
        voter_ids:
          type: array
          description: Every voter, the creator included. Only with voter_mode list.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [unanimous]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [3600]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300.", examples: [50]}
