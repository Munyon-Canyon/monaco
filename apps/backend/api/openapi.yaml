          examples: [profile]
    FollowState:
      type: object
      description: Whether the caller follows the user after the call.
      additionalProperties: false
      required: [following]
      properties:
        following:
          type: boolean
          description: True after a follow and false after an unfollow.
          examples: [true]
    HandleAvailability:
      type: object
      description: Whether the caller can claim a handle, and the reason when they cannot.
      examples:
        - handle: admin
          available: false
          reason: reserved
      additionalProperties: false
      required: [handle, available]
      properties:
        handle:
          type: string
          description: The handle that was checked, in lowercase.
          examples: [admin]
        available:
          type: boolean
          description: True when the caller can claim the handle, including when it is already theirs.
          examples: [false]
        reason:
          $ref: "#/components/schemas/HandleAvailabilityReason"
          description: Why the handle is not available. Absent when `available` is true.
    HandleAvailabilityReason:
      type: string
      description: >-
        Why a handle cannot be claimed. `reserved` covers the reserved list, profanity and
        referral-code shape. `taken` covers another user, including a deleted one, and another
        user's X username.
      examples: [reserved]
      enum: [taken, reserved, invalid, too_soon]
    MarketSession:
      type: object
      description: The session the asset is in, computed on the server.
      examples:
        - state: open
          continuous: false
          holiday: ""
          early_close: false
          next_state: after_hours
          next_transition: "2026-03-04T21:00:00Z"
      additionalProperties: false
      required: [state, continuous, holiday, early_close, next_state, next_transition]
      properties:
        state:
          $ref: "#/components/schemas/MarketState"
          description: The session state at the time of the response.
          examples: [open]
        continuous:
          type: boolean
          description: True for a pre-IPO token, which trades without a US session.
          examples: [false]
        holiday:
          type: string
          description: The US market holiday name. Empty when the day is not a holiday.
          examples: [""]
        early_close:
          type: boolean
          description: True when the regular session closes early today.
          examples: [false]
        next_state:
          description: The next session state. Null when the asset trades continuously.
          examples: [after_hours]
          type: [string, "null"]
          enum: [pre_market, open, after_hours, closed, null]
        next_transition:
          type: [string, "null"]
          format: date-time
          description: When `next_state` begins. Null when the asset trades continuously.
          examples: ["2026-03-04T21:00:00Z"]
    MarketState:
      type: string
      description: Where the underlying US session is.
      examples: [open]
      enum: [pre_market, open, after_hours, closed]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          created_at: "2026-09-30T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - display_name
        - auth_state
        - account_status
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    MyCabal:
      type: object
      description: A cabal the caller belongs to.
      additionalProperties: false
      required: [id, name, picture_url, role, can_vote, member_count, joined_at, pending_request_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        role: {type: string, examples: [creator]}
        can_vote: {type: boolean}
        member_count: {type: integer, format: int32}
        joined_at: {type: string, format: date-time}
        pending_request_count: {type: integer, format: int32}
    MyReferralCode:
      type: object
      description: The caller's invite code and the links that carry it.
      examples:
        - code: k7m4qx2p
          link: https://monacolabs.xyz/r/k7m4qx2p
          handle_link: https://monacolabs.xyz/r/kaicenat
          handle_unlocked: true
      additionalProperties: false
      required: [code, link, handle_link, handle_unlocked]
      properties:
        code:
          type: string
          description: The random 8-character code. It never changes.
          pattern: "^[23456789abcdefghjkmnpqrstuvwxyz]{8}$"
          examples: [k7m4qx2p]
        link:
          type: string
          description: The invite link for the random code.
          examples: ["https://monacolabs.xyz/r/k7m4qx2p"]
        handle_link:
          type: [string, "null"]
          description: The invite link for the caller's handle, or null until the first deposit unlocks it.
          examples: ["https://monacolabs.xyz/r/kaicenat"]
        handle_unlocked:
          type: boolean
          description: True once the caller's first deposit is credited.
          examples: [true]
    Ping:
      type: object
      description: A recorded ping.
      additionalProperties: false
      required: [id, note, echoed]
      properties:
        id:
          type: string
          format: uuid
          description: The ping id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        note:
          type: string
          description: The note sent with the ping.
          maxLength: 140
          examples: [hi]
        echoed:
          type: boolean
          description: True once the `system.echo` consumer has handled the ping.
          examples: [true]
    PingRequest:
      type: object
      description: A note to record with the ping.
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Free text, at most 140 characters.
          maxLength: 140
          examples: [hi]
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      additionalProperties: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      additionalProperties: false
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    UiMultiplier:
      type: object
      description: The whole tokens in one display unit, as an exact fraction.
      examples:
        - num: 1
          den: 1
      additionalProperties: false
      required: [num, den]
      properties:
        num:
          type: integer
          format: int64
          description: The numerator.
          examples: [1]
        den:
          type: integer
          format: int64
          description: The denominator.
          examples: [1]
    UpdateProfileRequest:
      type: object
      description: The profile fields a signed-in user may update.
      examples: [{display_name: Kai Cenat}]
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: The caller's display name, normalized before it is stored.
          examples: [Kai Cenat]
    VoteResult:
      type: object
      description: The proposal after the caller's ballot.
      additionalProperties: false
      required: [proposal_id, status, tally, my_ballot]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
        my_ballot:
          $ref: "#/components/schemas/BallotChoice"
