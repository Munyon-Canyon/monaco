openapi: 3.1.0
info:
  title: Monaco API
  version: 0.1.0
  description: HTTP contract between the Monaco iOS app and the Monaco backend.
  contact:
    name: Monaco
    url: https://github.com/Munyon-Canyon/monaco
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development server.
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness of the API process.
  - name: identity
    description: The signed-in user and their account.
  - name: stream
    description: Live re-fetch hints over server-sent events.
  - name: system
    description: The reference flow that exercises every backend layer end to end.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Report that the API process is serving.
      description: Returns ok while the process accepts requests. It checks no dependency.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    post:
      operationId: postAuthSession
      tags: [identity]
      security: []
      x-idempotent: false
      x-rate-limit:
        ip:
          rate: 60
          per: 1m
          burst: 60
      summary: Open a session from a Privy access token.
      description: >-
        Verifies the Privy access token in the Authorization header, finds or creates the user by
        their Privy id, reuses the user's one member wallet and returns the account. The first call
        for a Privy user creates the account and appends `user.created`. Calling it again changes
        nothing, so it takes no Idempotency-Key. It also brings the account back in line with the
        phone and X accounts linked in Privy. Sign-in is by phone number or email through Privy; a
        Privy user with neither is login_method_not_allowed, and a deleted account is account_deleted.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: >-
            The Privy access token as `Bearer <token>`. The route is public because no account exists
            on the first call, so the server verifies this header itself and answers unauthorized when
            it is missing or invalid.
          schema:
            type: string
            examples: ["Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaWQ6cHJpdnk6cWEtMSJ9.c2lnbmF0dXJl"]
      responses:
        "200":
          description: The caller's account, with its `auth_state`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      x-allow-restricted: true
      tags: [identity]
      summary: Read the signed-in user's account.
      description: >-
        Returns the caller's own `Me`: handle, display name, `auth_state`, `account_status` and the
        member wallet address. A suspended or banned user gets it too, so the app can show the notice
        screen. A deleted account is user_not_found.
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/stream:
    get:
      operationId: getStream
      x-allow-restricted: true
      tags: [stream]
      summary: Stream re-fetch hints for the caller.
      description: >-
        Opens a server-sent event stream. Each `hint` event names a key the caller may read
        (`user:<id>`, `cabal:<id>` or `global`) and what changed; the app re-fetches that screen
        through its normal GET. Hints are droppable, so a missed hint costs one re-fetch. A comment
        line arrives every 15 seconds as a heartbeat. A reconnect that sends Last-Event-ID first
        gets one `resync` event, telling the app to re-fetch everything it shows.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the app received before it reconnected.
          schema:
            type: string
            examples: ["42"]
      responses:
        "200":
          description: >-
            The stream. `event: hint` carries `data: {"key":"cabal:<id>","what":"updated"}` and an
            `id`. `event: resync` carries `data: {}`.
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "id: 1\nevent: hint\ndata: {\"key\":\"global\",\"what\":\"feed\"}\n\n"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings:
    post:
      operationId: postSystemPing
      tags: [system]
      x-idempotent: true
      summary: Record a ping for the caller.
      description: >-
        Writes a ping and appends `system.pinged`. The `system.echo` consumer then marks the ping
        echoed and sends the caller a `ping_echoed` hint on `/v1/stream`. A replay with the same
        Idempotency-Key returns the first response and records nothing new.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The note to record with the ping.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
      responses:
        "201":
          description: The ping was recorded. `echoed` is false until the consumer runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
  /v1/system/pings/{id}:
    get:
      operationId: getSystemPing
      tags: [system]
      summary: Read one of the caller's pings.
      description: Returns the ping with `echoed` computed on the server. Another user's ping is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The ping id from the create response.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A key the app generates once per user action. The server stores the first response under
        it and replays that response for any retry with the same key and body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ["6f1c1a52-3a4e-4d0e-9d7b-2f7f3f5b9d10"]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A bearer token in the Authorization header. Operations that declare an empty security
        list, such as /healthz, take no token. The token format belongs to the identity module;
        local development and tests use HS256 dev tokens from `monacoctl dev token`.
  responses:
    Problem:
      description: An RFC 9457 problem. Switch on `code`; show `message`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AccountStatus:
      type: string
      description: >-
        The user's standing. A suspended account is read-only apart from withdraw and cash out, and a
        banned account can only withdraw and cash out.
      examples: [active]
      enum: [active, suspended, banned]
    AuthState:
      type: string
      description: >-
        Where the user is in onboarding. `CREATED` means onboarding has not finished, `AWAITING_PHONE`
        and `AWAITING_SOCIALS` mean the user still owes that step, and `ONBOARDING_COMPLETED` means the
        phone and X are both linked. The app routes the first-run flow and shows nudge banners from it.
      examples: [CREATED]
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          created_at: "2026-09-30T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - display_name
        - auth_state
        - account_status
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    PingRequest:
      type: object
      description: A note to record with the ping.
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Free text, at most 140 characters.
          maxLength: 140
          examples: [hi]
    Ping:
      type: object
      description: A recorded ping.
      additionalProperties: false
      required: [id, note, echoed]
      properties:
        id:
          type: string
          format: uuid
          description: The ping id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        note:
          type: string
          description: The note sent with the ping.
          maxLength: 140
          examples: [hi]
        echoed:
          type: boolean
          description: True once the `system.echo` consumer has handled the ping.
          examples: [true]
    Problem:
      type: object
      description: An RFC 9457 problem details body with a stable Monaco error code.
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          code: not_found
          message: Not found.
          trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
          retryable: false
      additionalProperties: false
      required: [type, title, status, code, message, trace_id, retryable]
      properties:
        type:
          type: string
          description: Always about:blank. The code field carries the problem type.
          const: about:blank
        title:
          type: string
          description: The HTTP status phrase.
          examples: [Not Found]
        status:
          type: integer
          description: The HTTP status code of this response.
          minimum: 400
          maximum: 599
          examples: [404]
        code:
          $ref: "#/components/schemas/ErrorCode"
          examples: [not_found]
        message:
          type: string
          description: A user-facing sentence the app shows as is.
          examples: [Not found.]
        trace_id:
          type: string
          description: The W3C trace id of the request. Logs and traces carry the same id.
          pattern: "^[0-9a-f]{32}$"
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        retryable:
          type: boolean
          description: True when the same request may succeed if sent again later.
          examples: [false]
    ErrorCode:
      type: string
      description: The closed list of error codes. Generated from the errs table by monacoctl gen errors.
      examples: [not_found]
      enum:
        # BEGIN GENERATED ErrorCode
        - access_request_not_pending
        - account_banned
        - account_deleted
        - account_has_balance
        - account_has_positions
