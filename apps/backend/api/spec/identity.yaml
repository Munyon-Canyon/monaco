paths:
  /v1/users:
    get:
      operationId: searchUsers
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}}
      summary: Search people by handle or display name.
      parameters:
        - name: query
          in: query
          required: true
          description: A handle prefix or display-name substring to find.
          schema: {type: string, minLength: 1, maxLength: 50}
      responses:
        "200":
          description: Matching people.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSearchResult"}
              example:
                users:
                  - user_id: 01890a5d-ac96-774b-bcce-b302099a8058
                    handle: maya
                    display_name: Maya Angelou
                    photo_url: https://img.example/maya.png
                    followed_by_me: false
        default: {$ref: "#/components/responses/Problem"}
  /v1/users/{id}:
    get:
      operationId: getUser
      tags: [identity]
      summary: Read a user's public profile.
      description: >-
        Returns the user's handle, display name and photo with their follower and following counts, and
        whether the caller follows and blocks them. The counts are of live follows and include members
        who were banned or deleted after following. blocked_by_me says nothing about whether they block
        the caller. An unknown, banned or deleted user is user_not_found.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user's public profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProfile"}
              example:
                id: 01890a5d-ac96-774b-bcce-b302099a8058
                handle: maya
                display_name: Maya Angelou
                photo_url: https://img.example/maya.png
                follower_count: 12
                following_count: 7
                followed_by_me: true
                blocked_by_me: false
        default: {$ref: "#/components/responses/Problem"}
  /v1/auth/session:
    post:
      operationId: postAuthSession
      tags: [identity]
      security: []
      x-idempotent: false
      x-rate-limit:
        ip:
          rate: 60
          per: 1m
          burst: 60
      summary: Open a session from a Privy access token.
      description: >-
        Verifies the Privy access token in the Authorization header, finds or creates the user by
        their Privy id, reuses the user's one member wallet and returns the account. The first call
        for a Privy user creates the account and appends `user.created`. Calling it again changes
        nothing, so it takes no Idempotency-Key. It also brings the account back in line with the
        phone and X accounts linked in Privy. Sign-in is by phone number or email through Privy; a
        Privy user with neither is login_method_not_allowed, and a deleted account is account_deleted.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: >-
            The Privy access token as `Bearer <token>`. The route is public because no account exists
            on the first call, so the server verifies this header itself and answers unauthorized when
            it is missing or invalid.
          schema:
            type: string
            examples: ["Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaWQ6cHJpdnk6cWEtMSJ9.c2lnbmF0dXJl"]
      responses:
        "200":
          description: The caller's account, with its `auth_state`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      x-allow-restricted: true
      tags: [identity]
      summary: Read the signed-in user's account.
      description: >-
        Returns the caller's own `Me`: handle, display name, `auth_state`, `account_status` and the
        member wallet address. A suspended or banned user gets it too, so the app can show the notice
        screen. A deleted account is user_not_found.
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchMe
      x-idempotent: true
      tags: [identity]
      summary: Update the signed-in user's profile.
      description: Replaces the caller's normalized display name; an unchanged name is a no-op.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The display name to normalize and save for the caller.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProfileRequest"}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteMe
      x-idempotent: true
      x-allow-restricted: true
      tags: [identity]
      summary: Delete the signed-in user's account.
      description: >-
        Deletes the caller's account once nothing is left in it. A stake in any cabal is
        account_has_positions and any platform balance is account_has_balance; cash out and withdraw
        first. Deletion scrubs the caller's personal fields and keeps the handle, so no one can claim it.
        A suspended or banned user may delete too. Every later request with the same token is
        account_deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The account is deleted.
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/profile-photo:
    post:
      operationId: postProfilePhoto
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      tags: [identity]
      summary: Upload a profile photo.
      description: Stores a JPEG, PNG, or WebP profile photo for the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG, or WebP image in the required photo field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary, examples: [avatar.png]}
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/handles/{handle}/availability:
    get:
      operationId: getHandleAvailability
      tags: [identity]
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 30}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Check whether the caller can claim a handle.
      description: >-
        Compares the handle with the reserved list, the profanity list, the referral-code shape,
        other users' X usernames and the caller's own handle. `available` is false with a `reason`
        of `invalid`, `reserved`, `taken` or `too_soon`. The caller's current handle is available.
        Profanity and code shape are reported as `reserved`, and another user's X username as
        `taken`.
      parameters:
        - name: handle
          in: path
          required: true
          description: The handle to check, before it is stored. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [KaiCenat]
      responses:
        "200":
          description: Whether the handle is available to the caller, and why not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/handle:
    put:
      operationId: putMeHandle
      tags: [identity]
      x-idempotent: true
      summary: Set the caller's handle.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's new handle.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetHandle"
            example:
              handle: kai_one
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/phone:
    post:
      operationId: postOnboardingPhone
      tags: [identity]
      x-idempotent: true
      summary: Store the phone the caller linked in Privy.
      description: >-
        Reads the verified phone from the caller's Privy user, never from the request, stores it and
        advances `auth_state`. A caller with no handle gets handle_required, and a caller with no phone
        linked in Privy gets phone_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/socials:
    post:
      operationId: postOnboardingSocials
      tags: [identity]
      x-idempotent: true
      summary: Store the X account the caller linked in Privy.
      description: >-
        Reads the X user id and username from the caller's Privy user, never from the request, stores
        them and advances `auth_state`. A caller with no handle gets handle_required, and a caller with
        no X account linked in Privy gets x_not_linked. Calling it again after it applied changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/skip:
    post:
      operationId: postOnboardingSkip
      tags: [identity]
      x-idempotent: true
      summary: Skip an onboarding step.
      description: >-
        Skipping `phone` moves a CREATED caller to AWAITING_PHONE. Skipping `socials` changes no state,
        and the app moves on. A skip never clears a stored phone or X account. A caller with no handle
        gets handle_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The step to skip.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipOnboardingStep"
            example:
              step: phone
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dev/me/x-link:
    post:
      operationId: postDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Link a fake X account to a dev user.
      description: >-
        Outside production only. Stores a fake X account for a caller whose Privy email is
        `dev-<suffix>@example.com`, so `POST /v1/me/onboarding/socials` and the next session link it as
        if Privy reported it. The X user id is `dev:<suffix>`, and the username defaults to
        `dev_x_<suffix>`. Calling it again replaces the stored username. Any other caller, and every
        caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fake X username. Omit it for `dev_x_<suffix>`.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevXLink"
            example:
              username: qa_x
      responses:
        "204":
          description: The fake X account is stored for the caller.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevXLink
      tags: [identity]
      x-idempotent: true
      x-dev-only: true
      summary: Remove a dev user's fake X account.
      description: >-
        Outside production only. Deletes the caller's fake X account, so the next session unlinks X as a
        real Privy unlink does. A caller with no fake X account also gets 204. A caller whose Privy email
        is not `dev-<suffix>@example.com`, and every caller in production, gets not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller has no fake X account.
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users/{id}/ban:
    post:
      operationId: banUser
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Ban a user.
      description: >-
        Moves an `active` or `suspended` account to `banned` and appends `user.account_status_changed` and `admin.action` in one transaction. A banned user can still withdraw and cash out. A user already banned answers already_banned, a deleted one answers user_deleted, an unknown one answers user_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: fraud}
      responses:
        "204": {description: The user is banned.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}/unban:
    post:
      operationId: unbanUser
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Lift a ban.
      description: >-
        Moves a `banned` account back to `active` and appends `user.account_status_changed` and `admin.action` in one transaction. A user who is not banned answers not_banned, a deleted one answers user_deleted, and an unknown one answers user_not_found. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: appeal upheld}
      responses:
        "204": {description: The ban is lifted.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}/handle/revoke:
    post:
      operationId: revokeHandle
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Revoke a handle.
      description: >-
        Sets the user's handle to null and appends `user.profile_updated` and `admin.action` in one transaction. The freed handle can be claimed again, and the app sends the user to the handle screen on next launch. A user with no handle is left as is. A deleted user answers user_deleted, an unknown one answers user_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: impersonation}
      responses:
        "204": {description: The handle is revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/handles/{handle}/reassign:
    post:
      operationId: reassignHandle
      tags: [identity]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Reassign a handle.
      description: >-
        Moves the handle to a verified owner in one transaction, bypassing the 30-day change limit. The current holder, if any, loses the handle and picks a new one. The target's previous handle is freed. Appends `user.profile_updated` for each user changed and one `admin.action`. A target who already holds the handle is left as is. A deleted or unknown target answers user_deleted or user_not_found, a malformed handle answers handle_invalid, and a reason shorter than 3 characters answers reason_required. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: handle
          in: path
          required: true
          description: The handle to move.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [kai_one]}
      requestBody:
        description: Why the moderator takes this action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignHandleBody"
            example: {to_user_id: 01890a5d-ac96-774b-bcce-b302099a8058, reason: verified owner}
      responses:
        "204": {description: The handle is reassigned.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/deposit-addresses:
    get:
      operationId: getMyDepositAddresses
      tags: [identity]
      x-allow-restricted: true
      summary: List the addresses the caller can deposit USDC to, one per network.
      description: >-
        Returns the caller's Solana member wallet and one EVM address that serves Base, Arbitrum and
        Ethereum. USDC sent to the EVM address is forwarded to the Solana member wallet and shows as
        `arriving_micros` on the balance until it lands. The bridge keeps a fee from each EVM deposit, which
        the member pays: the deposit is credited net of it. Each EVM item carries `estimated_fee_micros`,
        the fee the last completed deposit on that network paid, when one exists.
      responses:
        "200":
          description: The caller's deposit addresses.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DepositAddresses"}
              example: {addresses: [{network: solana, address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, asset: USDC}, {network: base, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC, estimated_fee_micros: "163867"}, {network: arbitrum, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC}, {network: ethereum, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", asset: USDC}]}
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    UserSearchResult:
      type: object
      description: The people matching a search, with handle-prefix matches first.
      required: [users]
      properties:
        users:
          type: array
          examples:
            - [{user_id: 01890a5d-ac96-774b-bcce-b302099a8058, handle: maya, display_name: Maya Angelou, photo_url: https://img.example/maya.png, followed_by_me: false}]
          items: {$ref: "#/components/schemas/UserSummary"}
    UserSummary:
      type: object
      description: A searchable person's public profile summary.
      required: [user_id, handle, display_name, followed_by_me]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string}
        display_name: {type: string}
        photo_url: {type: [string, "null"]}
        followed_by_me: {type: boolean, description: "Whether the caller follows them. The caller never appears in their own results.", examples: [false]}
    PublicProfile:
      type: object
      description: A user's public profile with their follow counts.
      required: [id, handle, display_name, photo_url, follower_count, following_count, followed_by_me, blocked_by_me]
      properties:
        id: {type: string, format: uuid, description: "The user's id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: string, description: "The user's handle.", examples: [maya]}
        display_name: {type: string, description: "The user's display name.", examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], description: "The profile photo, or null when there is none.", examples: [null]}
        follower_count: {type: integer, minimum: 0, description: "How many users follow them.", examples: [12]}
        following_count: {type: integer, minimum: 0, description: "How many users they follow.", examples: [7]}
        followed_by_me: {type: boolean, description: "Whether the caller follows them. False for the caller's own profile.", examples: [true]}
        blocked_by_me: {type: boolean, description: "Whether the caller blocks them. False for the caller's own profile. It says nothing about whether they block the caller.", examples: [false]}
    AccountStatus:
      type: string
      description: >-
        The user's standing. A suspended account is read-only apart from withdraw and cash out, and a
        banned account can only withdraw and cash out.
      examples: [active]
      enum: [active, suspended, banned]
    AuthState:
      type: string
      description: >-
        Where the user is in onboarding. `CREATED` means onboarding has not finished, `AWAITING_PHONE`
        and `AWAITING_SOCIALS` mean the user still owes that step, and `ONBOARDING_COMPLETED` means the
        phone and X are both linked. The app routes the first-run flow and shows nudge banners from it.
      examples: [CREATED]
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
    LoginProvider:
      type: string
      description: The method a user signed up with.
      examples: [sms]
      enum: [sms, email, apple, google]
    Me:
      type: object
      description: >-
        The signed-in user's own account, as the app needs it to route and to draw the profile. It
        carries no email and no phone number.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8058
          handle: kaicenat
          display_name: Kai Cenat
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          login_provider: sms
          member_wallet_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf
          phone_linked: true
          x_username: kaicenat
          handle_changeable_at: "2026-10-30T12:00:00Z"
          created_at: "2026-09-30T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - display_name
        - auth_state
        - account_status
        - login_provider
        - member_wallet_address
        - phone_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The user id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        handle:
          type: string
          description: The user's unique handle, lowercase. Absent until onboarding sets one.
          pattern: "^[a-z0-9_]{3,20}$"
          examples: [kaicenat]
        display_name:
          type: string
          description: The name shown on the profile. It falls back to the handle, and is empty when the user has neither.
          examples: [Kai Cenat]
        photo_url:
          type: string
          format: uri
          description: The profile photo. Absent when the user has none.
          examples: ["https://cdn.example.com/photos/kai.jpg"]
        auth_state:
          $ref: "#/components/schemas/AuthState"
          description: Where the user is in onboarding.
          examples: [CREATED]
        account_status:
          $ref: "#/components/schemas/AccountStatus"
          description: The user's standing.
          examples: [active]
        login_provider:
          $ref: "#/components/schemas/LoginProvider"
          description: How the user signed up. The app skips the phone number entry for `sms`.
          examples: [sms]
        member_wallet_address:
          type: string
          description: The Solana address of the user's member wallet. Deposits go here.
          examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]
        phone_linked:
          type: boolean
          description: True once the user's phone is verified and stored.
          examples: [true]
        x_username:
          type: string
          description: The linked X username. Absent when no X account is linked.
          examples: [kaicenat]
        handle_changeable_at:
          type: string
          format: date-time
          description: The time the user may change the handle again. Absent until the handle has been set.
          examples: ["2026-10-30T12:00:00Z"]
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          examples: ["2026-09-30T12:00:00Z"]
    UpdateProfileRequest:
      type: object
      description: The profile fields a signed-in user may update.
      examples: [{display_name: Kai Cenat}]
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: The caller's display name, normalized before it is stored.
          examples: [Kai Cenat]
    HandleAvailability:
      type: object
      description: Whether the caller can claim a handle, and the reason when they cannot.
      examples:
        - handle: admin
          available: false
          reason: reserved
      additionalProperties: false
      required: [handle, available]
      properties:
        handle:
          type: string
          description: The handle that was checked, in lowercase.
          examples: [admin]
        available:
          type: boolean
          description: True when the caller can claim the handle, including when it is already theirs.
          examples: [false]
        reason:
          $ref: "#/components/schemas/HandleAvailabilityReason"
          description: Why the handle is not available. Absent when `available` is true.
    HandleAvailabilityReason:
      type: string
      description: >-
        Why a handle cannot be claimed. `reserved` covers the reserved list, profanity and
        referral-code shape. `taken` covers another user, including a deleted one, and another
        user's X username.
      examples: [reserved]
      enum: [taken, reserved, invalid, too_soon]
    DevXLink:
      type: object
      description: A fake X account for a dev user.
      additionalProperties: false
      properties:
        username:
          type: string
          description: The X username to store, without the @.
          pattern: "^[A-Za-z0-9_]{1,15}$"
          examples: [qa_x]
    SkipOnboardingStep:
      type: object
      description: An onboarding step the caller skips.
      additionalProperties: false
      required: [step]
      properties:
        step:
          type: string
          enum: [phone, socials]
          examples: [phone]
    SetHandle:
      type: object
      description: A handle to claim for the caller.
      additionalProperties: false
      required: [handle]
      properties:
        handle:
          type: string
          examples: [kai_one]
          minLength: 1
          maxLength: 64
    ReassignHandleBody:
      type: object
      description: The user who receives a handle, and why.
      additionalProperties: false
      required: [to_user_id, reason]
      properties:
        to_user_id:
          type: string
          format: uuid
          description: The user who receives the handle.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
        reason:
          type: string
          description: >-
            Free text. The server trims it and requires 3 to 500 characters, otherwise it answers
            reason_required.
          examples: [verified owner]
    DepositAddresses:
      type: object
      description: Every address the caller can deposit USDC to.
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          description: One entry per network, Solana first.
          items: {$ref: "#/components/schemas/DepositAddress"}
          examples: [[{network: solana, address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, asset: USDC}]]
    DepositAddress:
      type: object
      description: Where to send USDC on one network.
      additionalProperties: false
      required: [network, address, asset]
      properties:
        network: {$ref: "#/components/schemas/Network"}
        address:
          type: string
          description: A base58 Solana address, or a lowercase 0x EVM address.
          examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]
        asset: {type: string, enum: [USDC], description: The token to send., examples: [USDC]}
        estimated_fee_micros:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            An estimate, in USDC micros, of the fee the bridge keeps from a deposit on this network: what the
            most recent completed deposit on this network paid. The member pays it: the deposit is credited
            net of it. Absent for Solana, for a network with no completed deposit yet, and when the estimate
            can't be read.
          examples: ["163867"]
