paths:
  /v1/devices:
    post:
      operationId: postDevice
      tags: [notify]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 30
          per: 1m
          burst: 30
      summary: Register the caller's APNs device token.
      description: >-
        Saves the token for the caller and marks it active. Registering a token again bumps its
        last-seen time and clears a disabled mark. A token another user registered moves to the
        caller, so one device belongs to one account. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The device token and the APNs environment it was issued for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "204":
          description: The token is registered to the caller.
        default:
          $ref: "#/components/responses/Problem"
  /v1/devices/{token}:
    delete:
      operationId: deleteDevice
      tags: [notify]
      x-idempotent: true
      summary: Remove one of the caller's device tokens.
      description: >-
        Deletes the token when it belongs to the caller. A token that is unknown or belongs to
        another user also answers 204, so the route reveals nothing about other users' devices.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: token
          in: path
          required: true
          description: The APNs device token to remove, as registered with POST /v1/devices.
          schema:
            type: string
            examples: ["0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"]
      responses:
        "204":
          description: The caller no longer has this token registered.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [notify]
      summary: Read the caller's notification preferences.
      description: >-
        Returns whether each push category is on. A category the caller never set is on. Kinds
        outside both categories (deposits, follows, nudges, access requests) are always on. A
        deleted account is unauthorized.
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putNotificationPreferences
      tags: [notify]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 30
          per: 1m
          burst: 30
      summary: Replace the caller's notification preferences.
      description: >-
        Stores both categories at once and returns what was stored. A body missing either field or
        carrying another field is invalid input. A deleted account is unauthorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Whether each push category is on.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    DeviceEnvironment:
      type: string
      description: The APNs environment that issued the token.
      enum: [sandbox, production]
      examples: [production]
    DeviceRegistration:
      type: object
      description: A device token to register for the caller.
      additionalProperties: false
      required: [token, environment]
      examples:
        - token: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
          environment: production
      properties:
        token:
          type: string
          description: The APNs device token, 64 to 200 lowercase hex characters.
          examples: ["0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"]
        environment:
          $ref: "#/components/schemas/DeviceEnvironment"
    NotificationPreferences:
      type: object
      description: Whether each push category is on for the caller.
      additionalProperties: false
      required: [decision_requests, replies_and_mentions]
      examples:
        - decision_requests: false
          replies_and_mentions: true
      properties:
        decision_requests:
          type: boolean
          description: Proposals, trades and pauses in the caller's cabals.
        replies_and_mentions:
          type: boolean
          description: Replies to the caller's comments, chat mentions and chat thread replies.
