paths:
  /v1/cabals:
    get:
      operationId: getCabals
      tags: [cabal]
      summary: Search public cabals.
      description: Returns non-banned cabals with members, optionally filtered by a case-insensitive name substring.
      parameters:
        - name: query
          in: query
          required: false
          description: An empty, whitespace-only, or case-insensitive cabal-name substring.
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          description: An opaque cursor returned by the previous page.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: The number of cabals to return, from 1 through 50. Defaults to 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: The matching cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalSearchPage"
              example: {items: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3, join_mode: open, is_member: false, my_access_request_status: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabal
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 10
          per: 1h
          burst: 10
      summary: Create a cabal and its treasury wallet.
      description: >-
        Opens an app-owned treasury wallet, then writes the cabal, its creator and that wallet.
        The creator can vote. An omitted slippage_bps is 100. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The name and rules of the new cabal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCabalRequest"
            example: {name: Kai, join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400}
      responses:
        "201":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}:
    get:
      operationId: getCabal
      tags: [cabal]
      summary: Read one cabal.
      description: Any signed-in user can read any cabal. me is null for a non-member.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The cabal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: null, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchCabal
      tags: [cabal]
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      x-idempotent: true
      summary: Rename a cabal or change its slippage.
      description: >-
        Creator only. Every field is optional, and an omitted field keeps its value. Only name and slippage_bps
        change here. join_mode, voter_mode, voter_ids, threshold or proposal_expiry_seconds in the body returns 409
        RulesChangeByProposal, because those rules change by a passed rule proposal. A body that changes nothing
        returns the cabal unchanged. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCabalRequest"
            example: {name: Work pot, slippage_bps: 50}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Work pot, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 50, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/cabals/{id}/picture:
    delete:
      operationId: removeAdminCabalPicture
      tags: [cabal]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Remove a cabal's picture as a moderator.
      description: >-
        Clears the cabal's picture and appends `cabal.updated` and `admin.action` in one transaction. A cabal
        with no picture returns 204 and changes nothing. An unknown cabal is cabal_not_found, and a reason
        shorter than 3 characters is reason_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The cabal's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      requestBody:
        description: Why the moderator removes the picture.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: abusive image}
      responses:
        "204":
          description: The picture is removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/picture:
    put:
      operationId: putCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Set a cabal's picture.
      description: >-
        Creator only. Stores one JPEG, PNG or WebP picture of at most 2 MB, checked by its bytes, and replaces the
        cabal's picture. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG or WebP image in the required picture field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [picture]
              properties:
                picture: {type: string, format: binary, examples: [cabal.png]}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: "https://example.supabase.co/storage/v1/object/public/avatars/cabals/01890a5d-ac96-774b-bcce-b302099a8058/01890a5d-ac96-774b-bcce-b302099a8059.png", status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Remove a cabal's picture.
      description: Creator only. Clears the cabal's picture. A cabal with no picture is returned unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 1, members: [], me: {role: creator, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members:
    get:
      operationId: getCabalMembers
      tags: [cabal]
      summary: Page through a cabal's members.
      description: >-
        Returns one page of the cabal's members, each with the user card, vote standing, share, this month's record in
        this cabal and the crown. The default `role_share` order lists creator and admins, then voters, then non-voting
        members, each by `ownership_bps` descending, then join time, then user id; `joined` lists the oldest joiner first.
        Page with the `next_cursor` of the previous page until it is null. The cursor is keyed on the sort key of the
        last row, so a member who joins or leaves between pages never repeats or skips another row, and a share that
        changes between pages moves a member at most once. `totals` describe the whole cabal on every page.
        `GET /v1/cabals/{id}` keeps `members` only for builds that predate this route.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          required: false
          description: The number of members to return, from 1 through 200. Defaults to 50.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: order
          in: query
          required: false
          description: "`role_share` (the default) or `joined`. Send the same order with every cursor."
          schema: {type: string, enum: [role_share, joined], default: role_share}
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalMemberPage"
              example: {items: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null, role: creator, can_vote: true, joined_at: "2026-09-30T12:00:00Z", ownership_bps: 10000, month: {right: 0, resolved: 0, voted: 0, eligible: 0}, crown: false}], next_cursor: null, totals: {admins: 1, voters: 0, members: 0}}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalMember
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Join an open cabal.
      description: >-
        Adds the caller as a member of an open cabal at once. The caller can vote when the cabal's voter_mode is all.
        A cabal whose join_mode is request refuses with join_needs_request, so the app files an access request instead.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its new member sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 2, created_at: "2026-09-30T12:00:00Z", open_proposal_count: 0, voter_count: 2, members: [], me: {role: member, can_vote: true, can_propose: true}, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members/me:
    delete:
      operationId: deleteCabalMemberMe
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Leave a cabal.
      description: >-
        Removes the caller from the cabal, banned or not. A caller holding shares is refused with
        leave_holds_shares, so the app routes them to cash out first. The last member is refused with
        leave_last_member_pot_not_empty while the pot holds money, and the creator with
        leave_creator_with_members while other members remain. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller is no longer a member.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests:
    get:
      operationId: getCabalAccessRequests
      tags: [cabal]
      summary: List the pending requests to join a cabal.
      description: Admins only. Returns pending requests, newest first, each with the member whose link it came through when known. Invites are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending requests.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalAccessRequest"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, via: {user_id: "01890a5d-ac96-774b-bcce-b302099a8057", handle: jordan, display_name: Jordan, photo_url: null}, created_at: "2026-10-02T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Ask to join a request cabal.
      description: >-
        Files a pending request that the creator approves or denies. An open cabal refuses with
        request_not_needed, so the app joins it instead. An optional via_code names the link the invitee
        came through; a code that names no current member is ignored. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: Optional. The code from the invite link the invitee opened.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabalAccessRequestBody"
            example: {via_code: jordan}
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}:
    delete:
      operationId: deleteCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Withdraw a pending request or invite.
      description: >-
        The requester withdraws their own request. A current admin withdraws an invite.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The request or invite, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: revoked}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}/decision:
    post:
      operationId: postCabalAccessDecision
      tags: [cabal]
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      x-idempotent: true
      summary: Approve or deny a pending request or invite.
      description: >-
        The creator decides a request. The invitee accepts or declines an invite. Approving adds the
        member in the same transaction; the member can vote when the cabal's voter_mode is all. An invite
        whose inviter has left, lost the admin role or is blocked by or has blocked the invitee can be declined
        but not accepted: accepting refuses with access_request_not_pending. Approving the request of someone
        who already joined closes it as approved without a second join. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The decision.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionRequest"
            example: {decision: approve}
      responses:
        "200":
          description: The request or invite after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: approved}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/invites:
    get:
      operationId: getCabalInvites
      tags: [cabal]
      summary: List the pending invites of a cabal.
      description: >-
        Members only. Returns invites that are pending and not yet past their expiry, oldest first.
        Requests to join are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalSentInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalInvite
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Invite a user to a cabal by handle.
      description: >-
        Only an admin of the cabal invites, whatever its join mode. The invite
        stays pending for 7 days, and the invitee accepts or declines it through the decision route.
        A user with a pending request or invite is refused with request_pending. A user who blocked the
        caller, or whom the caller blocked, is refused with user_not_found. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Who to invite.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
            example: {handle: kai}
      responses:
        "201":
          description: The pending invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: invite, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/invite-codes/{code}:
    get:
      operationId: getCabalByCode
      tags: [cabal]
      summary: Look up a cabal by its invite code.
      description: "Retired. Always refuses with not_found: invite codes no longer exist."
      parameters:
        - name: code
          in: path
          required: true
          description: The cabal's invite code.
          schema: {type: string}
      responses:
        "200":
          description: The cabal the code opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPreview"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, join_mode: request, member_count: 3}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabal-invites:
    get:
      operationId: getMyCabalInvites
      tags: [cabal]
      summary: List the invites waiting on the caller.
      description: >-
        Returns the caller's pending invites that are not yet past their expiry, oldest first.
        Invites into a banned cabal are left out.
      responses:
        "200":
          description: The caller's pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", cabal: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabals:
    get:
      operationId: getMyCabals
      tags: [cabal]
      x-allow-restricted: true
      summary: List the caller's cabals.
      description: >-
        Returns every cabal the caller belongs to, in the caller's own order (see putMyCabalOrder). A cabal
        joined after the last reorder comes last, in join order. Each row carries the server-computed `unread_count` of the cabal's chat, capped at 100.
      responses:
        "200":
          description: The caller's cabals.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MyCabal"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, role: creator, can_vote: true, member_count: 3, joined_at: "2026-10-02T15:00:00Z", pending_request_count: 1, unread_count: 3}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabals/order:
    put:
      operationId: putMyCabalOrder
      tags: [cabal]
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      x-idempotent: true
      summary: Save the order of the caller's cabals.
      description: >-
        Lists the caller's cabals first, in the given order. Ids that are not the caller's cabals are ignored,
        because a cabal may have been left on another device. Every cabal left out keeps its prior relative order
        after the listed ones. The result is one complete order that getMyCabals and getMyPortfolio follow. At most
        100 ids, with no duplicates, or the call is refused with invalid_input. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The cabal ids in the order the caller wants them.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMyCabalOrderRequest"
            example: {cabal_ids: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "204":
          description: The order is saved.
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CreateCabalRequest:
      type: object
      description: The name and rules for a new cabal.
      additionalProperties: false
      required: [name, voter_mode, threshold, proposal_expiry_seconds]
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Kai]}
        join_mode: {type: string, description: "`open` (anyone joins at once, the default when omitted) or `request` (the creator approves each request).", default: open, examples: [open]}
        voter_mode: {type: string, description: "all, or list starting with the creator.", examples: [all]}
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300. Omitted means 100.", examples: [100]}
        max_trade_bps: {type: [integer, "null"], format: int32, description: "Cap on one trade as basis points of the treasury's cash, from 100 to 10000 in steps of 100. Omitted or null means no cap.", examples: [2000]}
    PutMyCabalOrderRequest:
      type: object
      description: The caller's cabals in their own order.
      additionalProperties: false
      required: [cabal_ids]
      properties:
        cabal_ids:
          type: array
          maxItems: 100
          description: Cabal ids, first to last. At most 100, no duplicates.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
    UpdateCabalRequest:
      type: object
      description: The cabal fields to change. An omitted field keeps its value.
      additionalProperties: false
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Work pot]}
        join_mode: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [request]}
        voter_mode: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [list]}
        voter_ids:
          type: array
          description: Refused with 409 RulesChangeByProposal. Rules change by proposal.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
        threshold: {type: string, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [unanimous]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "Refused with 409 RulesChangeByProposal. Rules change by proposal.", examples: [3600]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300.", examples: [50]}
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      additionalProperties: false
      required:
        [id, name, picture_url, status, rules, creator, member_count, created_at, open_proposal_count, voter_count, members, me, my_access_request, invite_code, treasury_address]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Kai]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        status: {type: string, description: "`active` or `banned`.", examples: [active]}
        rules: {$ref: "#/components/schemas/CabalRules", examples: [{join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100, show_sides: false, show_sides_since: null, max_trade_bps: null, who_can_propose: voters}]}
        creator: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        member_count: {type: integer, format: int32, examples: [1]}
        created_at: {type: string, format: date-time, description: When the cabal was created., examples: ["2026-09-30T12:00:00Z"]}
        open_proposal_count: {type: integer, format: int32, description: Proposals open for a vote right now., examples: [1]}
        voter_count: {type: integer, format: int32, description: Members who can vote., examples: [1]}
        admins: {type: array, items: {$ref: "#/components/schemas/CabalPerson"}, description: "The cabal's admins, the creator first. Always present.", examples: [[{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]]}
        members:
          type: array
          description: "Deprecated, but kept for builds that predate the paged route. Every member, which costs the whole membership on each read. Page `GET /v1/cabals/{id}/members` instead."
          items: {$ref: "#/components/schemas/CabalMember"}
          examples: [[]]
        me:
          type: [object, "null"]
          description: "Null when the caller is not a member."
          examples: [null]
          x-go-type-name: CabalMembership
          additionalProperties: false
          required: [role, can_vote, can_propose]
          properties:
            role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
            can_vote: {type: boolean, examples: [true]}
            can_propose: {type: boolean, description: "Whether the caller may propose a trade under `rules.who_can_propose`.", examples: [true]}
        my_access_request:
          type: [object, "null"]
          description: "The caller's pending access request or invite, else their latest access request when the creator denied it, else null. Always null for a member."
          examples: [null]
          x-go-type: CabalAccess
          additionalProperties: false
          required: [id, direction, status]
          properties:
            id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
            direction: {type: string, description: "`request` or `invite`.", examples: [request]}
            status: {type: string, examples: [pending]}
        invite_code: {type: [string, "null"], description: "Retired. Always null: cabals have no invite codes.", examples: [null]}
        treasury_address: {type: string, description: Solana address of the app-owned treasury wallet., examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]}
    AccessDecisionRequest:
      type: object
      description: How to decide a pending request or invite.
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, deny], examples: [approve]}
    CabalAccessRequest:
      type: object
      description: A pending request to join a cabal, as an admin sees it.
      additionalProperties: false
      required: [id, user, via, created_at]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        via:
          description: The member whose link the request came through. Null when it came through no link or a code that names no member.
          type: [object, "null"]
          x-go-type: CabalPerson
          additionalProperties: false
          required: [user_id, handle, display_name, photo_url]
          properties:
            user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
            handle: {type: [string, "null"], examples: [jordan]}
            display_name: {type: string, examples: [Jordan]}
            photo_url: {type: [string, "null"], examples: [null]}
          examples: [null]
        created_at: {type: string, format: date-time, examples: ["2026-10-02T15:00:00Z"]}
    CabalAccessRequestBody:
      type: object
      description: Optional context for a request to join.
      additionalProperties: false
      properties:
        via_code: {type: string, description: "The referral code or handle from the link the invitee opened.", examples: [jordan]}
    InviteMemberRequest:
      type: object
      description: Who to invite to a cabal.
      additionalProperties: false
      required: [handle]
      properties:
        handle: {type: string, description: The invitee's handle., examples: [kai]}
    CabalInvite:
      type: object
      description: A pending invite, as its invitee sees it.
      additionalProperties: false
      required: [request_id, cabal, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, description: The id to accept or decline., examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        cabal: {$ref: "#/components/schemas/CabalInviteCabal", examples: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CabalInviteCabal:
      type: object
      description: The cabal an invite opens.
      additionalProperties: false
      required: [id, name, picture_url, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalSentInvite:
      type: object
      description: A pending invite, as a member of its cabal sees it.
      additionalProperties: false
      required: [request_id, user, invited_by, expires_at]
      properties:
        request_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        user: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        invited_by: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        expires_at: {type: string, format: date-time, examples: ["2026-10-09T15:00:00Z"]}
    CabalPreview:
      type: object
      description: What a non-member sees of a cabal before joining it.
      additionalProperties: false
      required: [id, name, picture_url, join_mode, member_count]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Friends]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        join_mode: {type: string, description: "`open` (anyone joins at once) or `request` (the creator approves each request).", examples: [request]}
        member_count: {type: integer, format: int32, examples: [3]}
    CabalMemberPage:
      type: object
      description: One page of a cabal's members.
      additionalProperties: false
      required: [items, next_cursor, totals]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalMemberRow"}
          examples: [[]]
        next_cursor: {type: [string, "null"], description: Null on the last page., examples: [null]}
        totals: {$ref: "#/components/schemas/CabalMemberTotals", examples: [{admins: 2, voters: 6, members: 0}]}
    CabalMemberTotals:
      type: object
      description: The whole cabal's people by group, the same on every page. Admins count creator and admin, voters the other members who can vote, members the rest.
      additionalProperties: false
      required: [admins, voters, members]
      properties:
        admins: {type: integer, format: int32, examples: [2]}
        voters: {type: integer, format: int32, examples: [6]}
        members: {type: integer, format: int32, examples: [0]}
    MemberMonth:
      type: object
      description: A member's calls in this cabal over the calendar month in UTC.
      additionalProperties: false
      required: [right, resolved, voted, eligible]
      properties:
        right: {type: integer, format: int32, description: Votes that matched how the trade did., examples: [7]}
        resolved: {type: integer, format: int32, description: Votes whose trade has resolved., examples: [9]}
        voted: {type: integer, format: int32, description: Ballots the member cast., examples: [11]}
        eligible: {type: integer, format: int32, description: Votes that were open to the member., examples: [11]}
    CabalMemberRow:
      type: object
      description: A cabal member on the paged read, with share, month record and crown.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at, ownership_bps, month, crown]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, enum: [creator, admin, member], description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
        ownership_bps: {type: integer, format: int32, minimum: 0, maximum: 10000, description: "The member's share units over the cabal's total, rounded down.", examples: [3500]}
        month: {$ref: "#/components/schemas/MemberMonth", examples: [{right: 7, resolved: 9, voted: 11, eligible: 11}]}
        crown: {type: boolean, description: True for the one member ranked first in this cabal this month with at least five resolved calls., examples: [false]}
    CabalSearchPage:
      type: object
      description: One page of public cabals.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalSearchItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], examples: [null]}
    CabalSearchItem:
      type: object
      description: A public cabal in a search result.
      additionalProperties: false
      required: [id, name, picture_url, member_count, join_mode, is_member, my_access_request_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        member_count: {type: integer, format: int32}
        join_mode: {type: string, examples: [open]}
        is_member: {type: boolean}
        my_access_request_status: {type: [string, "null"], examples: [pending, null]}
    MyCabal:
      type: object
      description: A cabal the caller belongs to.
      additionalProperties: false
      required: [id, name, picture_url, role, can_vote, member_count, joined_at, pending_request_count, unread_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean}
        member_count: {type: integer, format: int32}
        joined_at: {type: string, format: date-time}
        pending_request_count: {type: integer, format: int32}
        unread_count: {type: integer, description: "Chat messages in the channel the caller has not seen, at most 100.", examples: [3]}
    CabalRules:
      type: object
      description: How the cabal admits members and how it votes.
      additionalProperties: false
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps, show_sides, show_sides_since, max_trade_bps, who_can_propose]
      properties:
        join_mode: {type: string, examples: [open]}
        voter_mode: {type: string, examples: [all]}
        threshold: {type: string, examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, examples: [86400]}
        slippage_bps: {type: integer, format: int32, examples: [100]}
        show_sides: {type: boolean, description: "Whether who voted which way shows after a vote closes. Off unless the cabal turned it on.", examples: [false]}
        show_sides_since: {type: [string, "null"], format: date-time, description: "When show_sides last changed. Null while it has never changed.", examples: [null]}
        max_trade_bps: {type: [integer, "null"], format: int32, description: "Cap on one trade as basis points of the treasury's cash. Null means no cap.", examples: [2000]}
        who_can_propose: {type: string, enum: [voters], description: Who may propose a trade., examples: [voters]}
    CabalPerson:
      type: object
      description: A user as shown on a cabal.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    CabalMember:
      type: object
      description: A cabal member, including vote standing.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, description: "`creator`, `admin` or `member`. Clients treat `creator` as an admin.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
    CabalAccess:
      type: object
      description: A pending request or invite.
      additionalProperties: false
      required: [id, direction, status]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        direction: {type: string, description: "`request` or `invite`.", examples: [request]}
        status: {type: string, examples: [pending]}
