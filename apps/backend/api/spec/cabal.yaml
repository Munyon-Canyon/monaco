paths:
  /v1/cabals:
    get:
      operationId: getCabals
      tags: [cabal]
      summary: Search public cabals.
      description: Returns non-banned cabals with members, optionally filtered by a case-insensitive name substring.
      parameters:
        - name: query
          in: query
          required: false
          description: An empty, whitespace-only, or case-insensitive cabal-name substring.
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          description: An opaque cursor returned by the previous page.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: The number of cabals to return, from 1 through 50. Defaults to 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: The matching cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalSearchPage"
              example: {items: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3, join_mode: open, is_member: false, my_access_request_status: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabal
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 10
          per: 1h
          burst: 10
      summary: Create a cabal and its treasury wallet.
      description: >-
        Opens an app-owned treasury wallet, then writes the cabal, its creator and that wallet.
        The creator can vote. An omitted slippage_bps is 100. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The name and rules of the new cabal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCabalRequest"
            example: {name: Kai, join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400}
      responses:
        "201":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: {role: creator, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}:
    get:
      operationId: getCabal
      tags: [cabal]
      summary: Read one cabal.
      description: Any signed-in user can read any cabal. invite_code and me are null for a non-member.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The cabal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: null, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/votes:
    post:
      operationId: postProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Cast or change the caller's ballot on an open proposal.
      description: >-
        Stores the caller's ballot and tallies it against the proposal's frozen voter set and the
        cabal's threshold rule. A deciding ballot moves the proposal to `passed` or `failed` in the
        same transaction. Execution of a passed proposal is asynchronous, so the client sees
        `executed` or `execution_blocked` later. A replay with the same Idempotency-Key returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's choice.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVoteRequest"
      responses:
        "200":
          description: The ballot was stored. `status` is the proposal's status after the tally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CreateCabalRequest:
      type: object
      description: The name and rules for a new cabal.
      additionalProperties: false
      required: [name, join_mode, voter_mode, threshold, proposal_expiry_seconds]
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Kai]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [open]}
        voter_mode: {type: string, description: "all, or list starting with the creator.", examples: [all]}
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300. Omitted means 100.", examples: [100]}
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      additionalProperties: false
      required:
        [id, name, picture_url, status, rules, creator, member_count, members, me, my_access_request, invite_code, treasury_address]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Kai]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        status: {type: string, description: "`active` or `banned`.", examples: [active]}
        rules: {$ref: "#/components/schemas/CabalRules", examples: [{join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}]}
        creator: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        member_count: {type: integer, format: int32, examples: [1]}
        members: {type: array, items: {$ref: "#/components/schemas/CabalMember"}, examples: [[]]}
        me: {description: "Null when the caller is not a member.", examples: [null], anyOf: [{$ref: "#/components/schemas/CabalMembership"}, {type: "null"}]}
        my_access_request:
          description: "The caller's pending access request, or null."
          examples: [null]
          anyOf:
            - $ref: "#/components/schemas/CabalAccess"
            - type: "null"
        invite_code: {type: [string, "null"], description: The invite code. Null for a non-member., examples: [null]}
        treasury_address: {type: string, description: Solana address of the app-owned treasury wallet., examples: [Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf]}
    CabalSearchPage:
      type: object
      description: One page of public cabals.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CabalSearchItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], examples: [null]}
    CabalSearchItem:
      type: object
      description: A public cabal in a search result.
      additionalProperties: false
      required: [id, name, picture_url, member_count, join_mode, is_member, my_access_request_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        picture_url: {type: [string, "null"]}
        member_count: {type: integer, format: int32}
        join_mode: {type: string, examples: [open]}
        is_member: {type: boolean}
        my_access_request_status: {type: [string, "null"], examples: [pending, null]}
    CabalRules:
      type: object
      description: How the cabal admits members and how it votes.
      additionalProperties: false
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps]
      properties:
        join_mode: {type: string, examples: [open]}
        voter_mode: {type: string, examples: [all]}
        threshold: {type: string, examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, examples: [86400]}
        slippage_bps: {type: integer, format: int32, examples: [100]}
    CabalPerson:
      type: object
      description: A user as shown on a cabal.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    CabalMember:
      type: object
      description: A cabal member, including vote standing.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, role, can_vote, joined_at]
      properties:
        user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: "The member handle. Null until onboarding sets one.", examples: [kai]}
        display_name: {type: string, description: "The member name. Empty when the user has none.", examples: [Kai]}
        photo_url: {type: [string, "null"], description: "The member photo. Null when the user has none.", examples: [null]}
        role: {type: string, description: "`creator` or `member`.", examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
        joined_at: {type: string, format: date-time, examples: ["2026-09-30T12:00:00Z"]}
    CabalMembership:
      type: object
      description: The caller's standing in the cabal.
      additionalProperties: false
      required: [role, can_vote]
      properties:
        role: {type: string, examples: [creator]}
        can_vote: {type: boolean, examples: [true]}
    CabalAccess:
      type: object
      description: A pending request or invite.
      additionalProperties: false
      required: [id, direction, status]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        direction: {type: string, description: "`request` or `invite`.", examples: [request]}
        status: {type: string, examples: [pending]}
    BallotChoice:
      type: string
      description: A voter's choice on a proposal.
      enum: ["yes", "no"]
      examples: ["yes"]
    CastVoteRequest:
      type: object
      description: The ballot to cast.
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/BallotChoice"
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      additionalProperties: false
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    VoteResult:
      type: object
      description: The proposal after the caller's ballot.
      additionalProperties: false
      required: [proposal_id, status, tally, my_ballot]
      properties:
        proposal_id:
          type: string
          format: uuid
          description: The proposal id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          $ref: "#/components/schemas/ProposalStatus"
        tally:
          $ref: "#/components/schemas/Tally"
        my_ballot:
          $ref: "#/components/schemas/BallotChoice"
