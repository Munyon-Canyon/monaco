paths:
  /v1/cabals:
    get:
      operationId: getCabals
      tags: [cabal]
      summary: Search public cabals.
      description: Returns non-banned cabals with members, optionally filtered by a case-insensitive name substring.
      parameters:
        - name: query
          in: query
          required: false
          description: An empty, whitespace-only, or case-insensitive cabal-name substring.
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          description: An opaque cursor returned by the previous page.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: The number of cabals to return, from 1 through 50. Defaults to 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: The matching cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalSearchPage"
              example: {items: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3, join_mode: open, is_member: false, my_access_request_status: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabal
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 10
          per: 1h
          burst: 10
      summary: Create a cabal and its treasury wallet.
      description: >-
        Opens an app-owned treasury wallet, then writes the cabal, its creator and that wallet.
        The creator can vote. An omitted slippage_bps is 100. A replay returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The name and rules of the new cabal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCabalRequest"
            example: {name: Kai, join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400}
      responses:
        "201":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: {role: creator, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}:
    get:
      operationId: getCabal
      tags: [cabal]
      summary: Read one cabal.
      description: Any signed-in user can read any cabal. invite_code and me are null for a non-member.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The cabal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: null, my_access_request: null, invite_code: null, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchCabal
      tags: [cabal]
      x-idempotent: true
      summary: Rename a cabal or change its rules.
      description: >-
        Creator only. Every field is optional, and an omitted field keeps its value. voter_ids names every voter,
        is allowed only when the resulting voter_mode is list, must include the creator and may name only members.
        Switching voter_mode to all lets every member vote. A rules change applies to proposals created afterwards.
        A body that changes nothing returns the cabal unchanged. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCabalRequest"
            example: {name: Work pot, slippage_bps: 50}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Work pot, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 50}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: {role: creator, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/picture:
    put:
      operationId: putCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-max-body-bytes: 2097152
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Set a cabal's picture.
      description: >-
        Creator only. Stores one JPEG, PNG or WebP picture of at most 2 MB, checked by its bytes, and replaces the
        cabal's picture. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: One JPEG, PNG or WebP image in the required picture field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [picture]
              properties:
                picture: {type: string, format: binary, examples: [cabal.png]}
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: "https://example.supabase.co/storage/v1/object/public/avatars/cabals/01890a5d-ac96-774b-bcce-b302099a8058/01890a5d-ac96-774b-bcce-b302099a8059.png", status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: {role: creator, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCabalPicture
      tags: [cabal]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 1, per: 20s, burst: 3}}
      summary: Remove a cabal's picture.
      description: Creator only. Clears the cabal's picture. A cabal with no picture is returned unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its creator sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 1, members: [], me: {role: creator, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members:
    post:
      operationId: postCabalMember
      tags: [cabal]
      x-idempotent: true
      summary: Join an open cabal.
      description: >-
        Adds the caller as a member of an open cabal. The caller can vote when the cabal's voter_mode is all.
        A request cabal refuses with join_needs_request, so the app files an access request instead.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cabal, as its new member sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cabal"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Kai, picture_url: null, status: active, rules: {join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}, creator: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, member_count: 2, members: [], me: {role: member, can_vote: true}, my_access_request: null, invite_code: ABCD2345, treasury_address: Dht9c9YfstFWkNYXgqr8HZbhqVn563bCpNU6zL32Ftqf}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/members/me:
    delete:
      operationId: deleteCabalMemberMe
      tags: [cabal]
      x-idempotent: true
      summary: Leave a cabal.
      description: >-
        Removes the caller from the cabal, banned or not. A caller holding shares is refused with
        leave_holds_shares, so the app routes them to cash out first. The last member is refused with
        leave_last_member_pot_not_empty while the pot holds money, and the creator with
        leave_creator_with_members while other members remain. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The caller is no longer a member.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests:
    get:
      operationId: getCabalAccessRequests
      tags: [cabal]
      summary: List the pending requests to join a cabal.
      description: Creator only. Returns pending requests, oldest first. Invites are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending requests.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalAccessRequest"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, created_at: "2026-10-02T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      summary: Ask to join a request cabal.
      description: >-
        Files a pending request that the creator approves or denies. An open cabal refuses with
        request_not_needed, so the app joins it instead. A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}:
    delete:
      operationId: deleteCabalAccessRequest
      tags: [cabal]
      x-idempotent: true
      summary: Withdraw a pending request or invite.
      description: >-
        The requester withdraws their own request. The inviter or the creator withdraws an invite.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The request or invite, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: revoked}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/access-requests/{request_id}/decision:
    post:
      operationId: postCabalAccessDecision
      tags: [cabal]
      x-idempotent: true
      summary: Approve or deny a pending request or invite.
      description: >-
        The creator decides a request. The invitee accepts or declines an invite. Approving adds the
        member in the same transaction; the member can vote when the cabal's voter_mode is all.
        A replay returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: request_id
          in: path
          required: true
          description: The request or invite id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The decision.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionRequest"
            example: {decision: approve}
      responses:
        "200":
          description: The request or invite after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: request, status: approved}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/invites:
    get:
      operationId: getCabalInvites
      tags: [cabal]
      summary: List the pending invites of a cabal.
      description: >-
        Members only. Returns invites that are pending and not yet past their expiry, oldest first.
        Requests to join are not listed here.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Only `pending` is supported, which is also the default.
          schema: {type: string, enum: [pending], default: pending}
      responses:
        "200":
          description: The pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalSentInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", user: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalInvite
      tags: [cabal]
      x-idempotent: true
      x-rate-limit:
        actor:
          rate: 20
          per: 1h
          burst: 20
      summary: Invite a user to a cabal by handle.
      description: >-
        Any member invites in an open cabal; only the creator invites in a request cabal. The invite
        stays pending for 7 days, and the invitee accepts or declines it through the decision route.
        A user with a pending request or invite is refused with request_pending. A replay returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Who to invite.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
            example: {handle: kai}
      responses:
        "201":
          description: The pending invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalAccess"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8059", direction: invite, status: pending}
        default:
          $ref: "#/components/responses/Problem"
  /v1/invite-codes/{code}:
    get:
      operationId: getCabalByCode
      tags: [cabal]
      summary: Look up a cabal by its invite code.
      description: Resolves a pasted invite code to the cabal it opens, so the app can join or request access.
      parameters:
        - name: code
          in: path
          required: true
          description: The cabal's invite code.
          schema: {type: string}
      responses:
        "200":
          description: The cabal the code opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPreview"
              example: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, join_mode: request, member_count: 3}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabal-invites:
    get:
      operationId: getMyCabalInvites
      tags: [cabal]
      summary: List the invites waiting on the caller.
      description: >-
        Returns the caller's pending invites that are not yet past their expiry, oldest first.
        Invites into a banned cabal are left out.
      responses:
        "200":
          description: The caller's pending invites.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CabalInvite"}}
              example: [{request_id: "01890a5d-ac96-774b-bcce-b302099a8059", cabal: {id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, member_count: 3}, invited_by: {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}, expires_at: "2026-10-09T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/cabals:
    get:
      operationId: getMyCabals
      tags: [cabal]
      summary: List the caller's cabals.
      description: >-
        Returns every cabal the caller belongs to, most recently joined first. Each row carries the
        server-computed `unread_count` of the cabal's chat, capped at 100.
      responses:
        "200":
          description: The caller's cabals.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MyCabal"}}
              example: [{id: "01890a5d-ac96-774b-bcce-b302099a8058", name: Friends, picture_url: null, role: creator, can_vote: true, member_count: 3, joined_at: "2026-10-02T15:00:00Z", pending_request_count: 1, unread_count: 3}]
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CreateCabalRequest:
      type: object
      description: The name and rules for a new cabal.
      additionalProperties: false
      required: [name, join_mode, voter_mode, threshold, proposal_expiry_seconds]
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Kai]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [open]}
        voter_mode: {type: string, description: "all, or list starting with the creator.", examples: [all]}
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300. Omitted means 100.", examples: [100]}
    UpdateCabalRequest:
      type: object
      description: The cabal fields to change. An omitted field keeps its value.
      additionalProperties: false
      properties:
        name: {type: string, description: "Cabal name, 3 to 40 characters.", examples: [Work pot]}
        join_mode: {type: string, description: "`open` or `request`.", examples: [request]}
        voter_mode: {type: string, description: "`all` or `list`.", examples: [list]}
        voter_ids:
          type: array
          description: Every voter, the creator included. Only with voter_mode list.
          items: {type: string, format: uuid}
          examples: [["01890a5d-ac96-774b-bcce-b302099a8058"]]
        threshold: {type: string, description: "`majority` or `unanimous`.", examples: [unanimous]}
        proposal_expiry_seconds: {type: integer, format: int32, description: "One of 3600, 86400 or 604800.", examples: [3600]}
        slippage_bps: {type: integer, format: int32, description: "Basis points from 1 to 300.", examples: [50]}
    Cabal:
      type: object
      description: One cabal, as a signed-in user is allowed to see it.
      additionalProperties: false
      required:
        [id, name, picture_url, status, rules, creator, member_count, members, me, my_access_request, invite_code, treasury_address]
      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, examples: [Kai]}
        picture_url: {type: [string, "null"], description: Null when the cabal has no picture., examples: [null]}
        status: {type: string, description: "`active` or `banned`.", examples: [active]}
        rules: {$ref: "#/components/schemas/CabalRules", examples: [{join_mode: open, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}]}
        creator: {$ref: "#/components/schemas/CabalPerson", examples: [{user_id: "01890a5d-ac96-774b-bcce-b302099a8058", handle: kai, display_name: Kai, photo_url: null}]}
        member_count: {type: integer, format: int32, examples: [1]}
        members: {type: array, items: {$ref: "#/components/schemas/CabalMember"}, examples: [[]]}
        me:
          type: [object, "null"]
          description: "Null when the caller is not a member."
          examples: [null]
          x-go-type-name: CabalMembership
          additionalProperties: false
          required: [role, can_vote]
          properties:
            role: {type: string, examples: [creator]}
            can_vote: {type: boolean, examples: [true]}
        my_access_request:
          type: [object, "null"]
          description: "The caller's pending access request, or null."
          examples: [null]
          x-go-type: CabalAccess
          additionalProperties: false
          required: [id, direction, status]
          properties:
