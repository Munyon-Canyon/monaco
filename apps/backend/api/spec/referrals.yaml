paths:
  /v1/me/referral-code:
    get:
      operationId: getMyReferralCode
      tags: [referrals]
      summary: Read the caller's invite code and links.
      description: >-
        Returns the caller's random code and its link. `handle_link` is set and `handle_unlocked` is
        true once the caller's first deposit is credited. A user whose code is not minted yet gets
        referral_code_pending, a retryable 503, so the app tries again.
      responses:
        "200":
          description: The caller's invite code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReferralCode"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/referral:
    post:
      operationId: postMeReferral
      tags: [referrals]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1h, burst: 5}}
      summary: Attribute the caller to an invite code.
      description: >-
        Resolves the code, refuses a self invite, an invite already used, or a caller outside the
        new-account window, then stores the attribution. A replay of the same idempotency key
        returns the first 201. A banned, suspended, deleted or locked referrer is an unknown code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The invite code and where the caller found it.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachReferralRequest"
            example: {code: k7m4qx2p, source: manual}
      responses:
        "201":
          description: The referrer the caller is now attributed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedReferral"
              example:
                referrer:
                  {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: null, handle: kaicenat}
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/clicks:
    post:
      operationId: recordReferralClick
      tags: [referrals]
      security: []
      x-idempotent: true
      x-cors: web
      x-rate-limit: {ip: {rate: 20, per: 1m, burst: 10}}
      summary: Count one tap on the invite page's Get Monaco button.
      description: >-
        Public, called by the landing page for each tap on "Get Monaco". Adds one to the count for the
        code on the current UTC day. Send a new random UUID as the Idempotency-Key for each tap,
        because two taps that share a key and a code count once, whoever sent them. A code that does
        not resolve is not counted and still answers 204. The stored count holds only the code, the
        UTC day and a number.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The invite code from the page URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralClickRequest"
            example: {code: k7m4qx2p}
      responses:
        "204":
          description: The tap was counted, or the code does not resolve.
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/{code}:
    get:
      operationId: getReferral
      tags: [referrals]
      security: []
      x-rate-limit: {ip: {rate: 60, per: 1m, burst: 60}}
      summary: Look up the referrer behind an invite code.
      description: >-
        Public, for the invite landing page. Returns the referrer's id, display name, photo and handle
        for a random code or an unlocked handle. A code that does not resolve gets the same 200 with
        `referrer` null, whether it is unknown, a locked handle, or owned by a banned, suspended or
        deleted user, so the answer never says which. Both answers carry
        `Cache-Control: public, max-age=300`.
      parameters:
        - name: code
          in: path
          required: true
          description: A random invite code or an unlocked handle. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 40
            examples: [k7m4qx2p]
      responses:
        "200":
          description: The referrer, or null when the code does not resolve.
          headers:
            Cache-Control:
              description: Always `public, max-age=300`.
              required: true
              schema:
                type: string
                examples: ["public, max-age=300"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralLookup"
              example:
                referrer:
                  {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: "https://img.example/kai.png", handle: kaicenat}
        default:
          $ref: "#/components/responses/Problem"
  /v1/referrals/{code}/cabals/{cabal_id}:
    get:
      operationId: getReferralCabal
      tags: [referrals]
      security: []
      x-rate-limit: {ip: {rate: 60, per: 1m, burst: 60}}
      summary: Preview the cabal an invite link points to.
      description: >-
        Public, for the cabal invite landing before sign-in. The link is `https://monacolabs.xyz/r/<code>?c=<cabal_id>`.
        It answers only when the code resolves to a user who is a current member of that cabal. Every
        other case (an unknown code, a locked handle, a banned or deleted owner, a non-member, an unknown
        or banned cabal) gets the same 200 with `cabal` null, so the answer never says which. The inviter
        card carries a display name and photo only; no answer carries a user id, a handle, a share or a
        vote side. The month facts (`return_1m_bps`, `turnout_month_bps`, `open_proposal`) are null until
        they are filled. The tally is live: the answer is never cached and carries `Cache-Control: no-cache`.
      parameters:
        - name: code
          in: path
          required: true
          description: The inviter's random invite code or unlocked handle. It is compared in lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 40
            examples: [k7m4qx2p]
        - name: cabal_id
          in: path
          required: true
          description: The cabal the link points to.
          schema:
            type: string
            format: uuid
            examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
      responses:
        "200":
          description: The cabal and its inviter, or `cabal` null when the link does not resolve.
          headers:
            Cache-Control:
              description: Always `no-cache`.
              required: true
              schema:
                type: string
                examples: [no-cache]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCabal"
              example:
                inviter: {display_name: Andres, photo_url: "https://img.example/andres.png"}
                cabal:
                  id: "01890a5d-ac96-774b-bcce-b302099a8058"
                  name: AC Capital
                  picture_url: null
                  member_count: 8
                  since: "2026-08-14"
                  join_mode: request
                  first_members:
                    - {display_name: Christelle, photo_url: "https://img.example/christelle.png"}
                    - {display_name: Logan, photo_url: null}
                    - {display_name: Mia, photo_url: "https://img.example/mia.png"}
                  pot_value_micros: "20000000000"
                return_1m_bps: null
                turnout_month_bps: null
                open_proposal: null
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    MyReferralCode:
      type: object
      description: The caller's invite code and the links that carry it.
      examples:
        - code: k7m4qx2p
          link: https://monacolabs.xyz/r/k7m4qx2p
          handle_link: https://monacolabs.xyz/r/kaicenat
          handle_unlocked: true
      additionalProperties: false
      required: [code, link, handle_link, handle_unlocked]
      properties:
        code:
          type: string
          description: The random 8-character code. It never changes.
          pattern: "^[23456789abcdefghjkmnpqrstuvwxyz]{8}$"
          examples: [k7m4qx2p]
        link:
          type: string
          description: The invite link for the random code.
          examples: ["https://monacolabs.xyz/r/k7m4qx2p"]
        handle_link:
          type: [string, "null"]
          description: The invite link for the caller's handle, or null until the first deposit unlocks it.
          examples: ["https://monacolabs.xyz/r/kaicenat"]
        handle_unlocked:
          type: boolean
          description: True once the caller's first deposit is credited.
          examples: [true]
    ReferralSource:
      type: string
      description: Where the caller found the invite code.
      enum: [universal_link, clipboard, manual]
      examples: [manual]
    AttachReferralRequest:
      type: object
      description: An invite code to attach to the caller.
      additionalProperties: false
      required: [code, source]
      examples:
        - code: k7m4qx2p
          source: manual
      properties:
        code:
          type: string
          description: A random invite code or an unlocked handle.
          examples: [k7m4qx2p]
        source:
          $ref: "#/components/schemas/ReferralSource"
    ReferralClickRequest:
      type: object
      description: The invite code a visitor tapped Get Monaco for.
      additionalProperties: false
      required: [code]
      examples:
        - code: k7m4qx2p
      properties:
        code:
          type: string
          description: A random invite code or an unlocked handle, as it appears in the page URL.
          minLength: 1
          maxLength: 40
          examples: [k7m4qx2p]
    ReferralReferrer:
      type: object
      description: The person behind an invite code.
      additionalProperties: false
      required: [user_id, display_name, photo_url, handle]
      examples:
        - user_id: "01890a5d-ac96-774b-bcce-b302099a8058"
          display_name: Kai
          photo_url: "https://img.example/kai.png"
          handle: kaicenat
      properties:
        user_id:
          type: string
          format: uuid
          description: The referrer's user id.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        display_name:
          type: string
          description: The referrer's display name.
          examples: [Kai]
        photo_url:
          type: [string, "null"]
          description: The referrer's photo, or null when they have none.
          examples: ["https://img.example/kai.png"]
        handle:
          type: string
          description: The referrer's handle.
          examples: [kaicenat]
    AttachedReferral:
      type: object
      description: The attribution that was stored.
      additionalProperties: false
      required: [referrer]
      examples:
        - referrer:
            {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: null, handle: kaicenat}
      properties:
        referrer:
          $ref: "#/components/schemas/ReferralReferrer"
    ReferralLookup:
      type: object
      description: The referrer behind an invite code, or null when the code does not resolve.
      additionalProperties: false
      required: [referrer]
      examples:
        - referrer:
            {user_id: "01890a5d-ac96-774b-bcce-b302099a8058", display_name: Kai, photo_url: "https://img.example/kai.png", handle: kaicenat}
        - referrer: null
      properties:
        referrer:
          type: [object, "null"]
          description: The referrer, or null when the code does not resolve.
          examples: [null]
          x-go-type: ReferralReferrer
          additionalProperties: false
          required: [user_id, display_name, photo_url, handle]
          properties:
            user_id:
              type: string
              format: uuid
              description: The referrer's user id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
            display_name:
              type: string
              description: The referrer's display name.
              examples: [Kai]
            photo_url:
              type: [string, "null"]
              description: The referrer's photo, or null when they have none.
              examples: ["https://img.example/kai.png"]
            handle:
              type: string
              description: The referrer's handle.
              examples: [kaicenat]
    ReferralCabalPerson:
      type: object
      description: A person on the public cabal preview. It has no id and no handle.
      additionalProperties: false
      required: [display_name, photo_url]
      examples:
        - display_name: Mia
          photo_url: "https://img.example/mia.png"
      properties:
        display_name:
          type: string
          description: The person's display name.
          examples: [Mia]
        photo_url:
          type: [string, "null"]
          description: The person's photo, or null when they have none.
          examples: ["https://img.example/mia.png"]
    ReferralCabal:
      type: object
      description: >-
        The cabal an invite link points to, as the invite landing draws it before sign-in, or `cabal` null
        when the link does not resolve.
      additionalProperties: false
      required: [inviter, cabal, return_1m_bps, turnout_month_bps, open_proposal]
      examples:
        - inviter: {display_name: Andres, photo_url: "https://img.example/andres.png"}
          cabal:
            id: "01890a5d-ac96-774b-bcce-b302099a8058"
            name: AC Capital
            picture_url: null
            member_count: 8
            since: "2026-08-14"
            join_mode: request
            first_members:
              - {display_name: Christelle, photo_url: null}
            pot_value_micros: "20000000000"
          return_1m_bps: -410
          turnout_month_bps: 9400
          open_proposal:
            id: "01890a5d-ac96-774b-bcce-b302099a8057"
            kind: buy
            symbol: NVDAx
            asset_name: NVIDIA
            asset_logo_url: null
            usdc_micros: "400000000"
            proposer_name: Mia
            title: small add before earnings
            "yes": 4
            "no": 1
            voted: 5
            eligible: 8
            replies: 6
            expires_at: "2026-10-28T16:00:00Z"
        - inviter: null
          cabal: null
          return_1m_bps: null
          turnout_month_bps: null
          open_proposal: null
      properties:
        inviter:
          type: [object, "null"]
          description: >-
            The member whose link it is, or null when the code does not resolve. It stays set when the
            code resolves but the cabal does not, so the page can still name who invited the visitor.
          examples: [null]
          x-go-type-name: ReferralCabalInviter
          additionalProperties: false
          required: [display_name, photo_url]
          properties:
            display_name:
              type: string
              description: The inviter's display name.
              examples: [Andres]
            photo_url:
              type: [string, "null"]
              description: The inviter's photo, or null when they have none.
              examples: ["https://img.example/andres.png"]
        cabal:
          type: [object, "null"]
          description: The cabal's public facts, or null when the link does not resolve.
          examples: [null]
          x-go-type-name: ReferralCabalFacts
          additionalProperties: false
          required: [id, name, picture_url, member_count, since, join_mode, first_members, pot_value_micros]
          properties:
            id:
              type: string
              format: uuid
              description: The cabal id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
            name:
              type: string
              description: The cabal's name.
              examples: [AC Capital]
            picture_url:
              type: [string, "null"]
              description: The cabal's picture, or null when it has none. Clients draw the initials crest then.
              examples: [null]
            member_count:
              type: integer
              format: int32
              description: Current members, the inviter included.
              examples: [8]
            since:
              type: string
              format: date
              description: The day the cabal was created, in UTC.
              examples: ["2026-08-14"]
            join_mode:
              type: string
              description: "`open` joins at once; `request` makes a request the creator decides."
              enum: [open, request]
              examples: [request]
            first_members:
              type: array
              description: >-
                Up to four current members other than the inviter, earliest joiner first, then by user id
                for a tie.
              maxItems: 4
              items:
                $ref: "#/components/schemas/ReferralCabalPerson"
              examples: [[]]
            pot_value_micros:
              type: string
              pattern: "^[0-9]+$"
              description: The pot's value in USDC micros, the figure `getCabalPot` returns.
              examples: ["20000000000"]
        return_1m_bps:
          type: [integer, "null"]
          format: int32
          description: The cabal's one-month return in basis points. Null until it is filled.
          examples: [-410]
        turnout_month_bps:
          type: [integer, "null"]
          format: int32
          description: The share of eligible votes cast this month, in basis points. Null until it is filled.
          examples: [9400]
        open_proposal:
          type: [object, "null"]
          description: The open proposal, read-only. Null when there is none or until it is filled.
          examples: [null]
          x-go-type-name: ReferralCabalProposal
          additionalProperties: false
          required:
            [id, kind, symbol, asset_name, asset_logo_url, usdc_micros, proposer_name, title, "yes", "no", voted, eligible, replies, expires_at]
          properties:
            id:
              type: string
              format: uuid
              description: The proposal id.
              examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
            kind:
              type: string
              description: "`buy` or `sell`."
              examples: [buy]
            symbol:
              type: string
              description: The asset's symbol.
              examples: [NVDAx]
            asset_name:
              type: string
              description: The asset's display name.
              examples: [NVIDIA]
            asset_logo_url:
              type: [string, "null"]
              description: The asset's logo, or null when it has none.
              examples: [null]
            usdc_micros:
              type: [string, "null"]
              pattern: "^[0-9]+$"
              description: USDC a buy spends, in micros. Null on a sell, which is sized in shares.
              examples: ["400000000"]
            proposer_name:
              type: string
              description: The proposer's display name.
              examples: [Mia]
            title:
              type: string
              description: The proposal's thesis line.
              examples: [small add before earnings]
            "yes":
              type: integer
              format: int32
              description: Yes ballots so far.
              examples: [4]
            "no":
              type: integer
              format: int32
              description: No ballots so far.
              examples: [1]
            voted:
              type: integer
              format: int32
              description: Members who have voted.
              examples: [5]
            eligible:
              type: integer
              format: int32
              description: Members who can vote.
              examples: [8]
            replies:
              type: [integer, "null"]
              format: int32
              description: Replies on the proposal. Null when they are not counted.
              examples: [6]
            expires_at:
              type: string
              format: date-time
              description: When voting ends.
              examples: ["2026-10-28T16:00:00Z"]
