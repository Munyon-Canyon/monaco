paths:
  /v1/cabals/{id}/cashouts:
    post:
      operationId: postCashOut
      tags: [treasury]
      x-idempotent: true
      x-allow-restricted: true
      summary: Start a cash out to the caller's platform balance.
      description: Reserves the caller's cabal shares and starts the asynchronous cash-out job.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The requested cash-out amount or all-shares selection.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CashOutRequest"}
            example: {all: true}
      responses:
        "202":
          description: The cash out job was reserved for processing.
          content:
            application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/preview:
    get:
      operationId: getCashOutPreview
      tags: [treasury]
      x-allow-restricted: true
      summary: Preview the caller's available cash out.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      responses:
        "200": {description: The current cash-out preview., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutPreview"}, example: {slice_micros: "25000000", share_units: "100", min_micros: "100000", pause: null}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/cashouts/{job_id}:
    get:
      operationId: getCashOutJob
      tags: [treasury]
      x-allow-restricted: true
      summary: Read one cash out job.
      parameters:
        - {name: id, in: path, required: true, description: The cabal id., schema: {type: string, format: uuid}}
        - {name: job_id, in: path, required: true, description: The cash-out job id., schema: {type: string, format: uuid}}
      responses:
        "200": {description: The job., content: {application/json: {schema: {$ref: "#/components/schemas/CashOutJob"}, example: {id: 01890a5d-ac96-774b-bcce-b302099a8060, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, user_id: 01890a5d-ac96-774b-bcce-b302099a8058, share_units: "100", payout_micros: "25000000", sell_usdc_micros: "0", status: started, result_code: null, created_at: "2026-10-03T15:00:00Z", updated_at: "2026-10-03T15:00:00Z"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/txns:
    get:
      operationId: getMyTxns
      tags: [treasury]
      summary: List the caller's transaction history.
      x-allow-restricted: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512, examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]}
      responses:
        "200":
          description: One page of the caller's transactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserTxnPage"}
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: deposit, status: settled, usdc_micros: "25000000", cabal: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, created_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/activity:
    get:
      operationId: getCabalActivity
      tags: [treasury]
      summary: List a cabal's activity.
      description: >-
        Returns one page of the cabal's buys, sells, funds and cash outs, newest first, pending and failed
        ones included. Only members can read it; anyone else gets `not_cabal_member`. Asset and actor names
        are resolved for display, and raw mints are never returned.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
            examples: [30]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMDowMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalActivityPage"
              example: {items: [{id: 01890a5d-ac96-774b-bcce-b302099a8060, kind: buy, status: confirmed, asset: {symbol: AAPLx, name: Apple}, usdc_micros: 25000000, units: 105000000, actor: null, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW, occurred_at: "2026-10-03T15:00:00Z"}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/fund:
    post:
      operationId: fundCabal
      tags: [treasury]
      x-idempotent: true
      summary: Fund a cabal from the caller's platform balance.
      description: >-
        Moves an exact amount of USDC from the caller's wallet to the cabal treasury. The transfer is
        signed and its signature stored before broadcast, so the answer is 202 with the transfer id; share
        units are minted at the live price once the transfer is final. Poll GET /v1/fund-transfers/{id}
        for the outcome. Only members can fund. A paused or banned cabal answers `cabal_paused`, an amount
        over the available balance answers `insufficient_funds`, and a pot with shares but no value answers
        `pot_value_zero`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema: {type: string, format: uuid}
      requestBody:
        description: The amount to fund, at least 1 USDC.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundRequest"}
      responses:
        "202":
          description: The transfer is signed and submitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundAccepted"}
              example: {transfer_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted}
        default: {$ref: "#/components/responses/Problem"}
  /v1/fund-transfers/{id}:
    get:
      operationId: getFundTransfer
      tags: [treasury]
      summary: Read one of the caller's fund transfers.
      description: >-
        Returns the transfer's status, amount, the share units minted once it settles, and the failure code
        once it fails. A transfer that belongs to another user answers `not_found`.
      parameters:
        - name: id
          in: path
          required: true
          description: The transfer id from POST /v1/cabals/{id}/fund.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The transfer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundTransfer"}
              example: {status: settled, amount_micros: "5000000", share_units: "5000000", fail_code: null}
        default: {$ref: "#/components/responses/Problem"}
  /v1/cabals/{id}/pot:
    get:
      operationId: getCabalPot
      tags: [treasury]
      summary: Read a cabal's pot, its holdings and the caller's slice.
      description: >-
        Returns the pot value, its all-time gain, every holding at the latest market price and the caller's
        slice, all from one price read. Any signed-in user may read it. `me` is null when the caller is not a
        member. A holding without a fresh price returns `price_unavailable`; the pot is never valued at cost
        basis. Refresh on `cabal.<id>.activity_changed` and `global.prices_updated`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cabal's pot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalPot"
              example: {cabal_id: 01890a5d-ac96-774b-bcce-b302099a8059, pot_value_micros: 120000000, cash_micros: 60000000, cash_weight_bps: 5000, pnl_micros: 20000000, return_bps: 2000, prices_as_of: "2026-10-03T15:00:00Z", holdings: [{symbol: AAPLx, display_name: Apple, units: "2.0000", price_micros: 30000000, value_micros: 60000000, weight_bps: 5000, cost_basis_micros: 40000000, pnl_micros: 20000000}], me: {share_units: 100000000, value_micros: 120000000, slice_bps: 10000, net_contributed_micros: 100000000, pnl_micros: 20000000}}
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CashOutRequest:
      type: object
      description: A choice between cashing out all shares or a USDC amount.
      additionalProperties: false
      properties:
        usdc_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        all: {type: boolean, examples: [true]}
    CashOutPreview:
      type: object
      description: The caller's cash-out value and whether it is paused.
      additionalProperties: false
      required: [slice_micros, share_units, min_micros, pause]
      properties:
        slice_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        share_units: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100"]}
        min_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100000"]}
        pause: {type: [object, "null"], additionalProperties: false, required: [reasons, since], examples: [null], properties: {reasons: {type: array, items: {type: string}}, since: {type: string, format: date-time}}}
    CashOutJob:
      type: object
      description: An asynchronous cash-out job.
      additionalProperties: false
      required: [id, cabal_id, user_id, share_units, payout_micros, sell_usdc_micros, status, result_code, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        cabal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        user_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        share_units: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["100"]}
        payout_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["25000000"]}
        sell_usdc_micros: {type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["0"]}
        status: {type: string, enum: [started, selling, paying, completed, partial, failed], examples: [started]}
        result_code: {type: [string, "null"], examples: [null]}
        created_at: {type: string, format: date-time, examples: ["2026-10-03T15:00:00Z"]}
        updated_at: {type: string, format: date-time, examples: ["2026-10-03T15:00:00Z"]}
    FundRequest:
      type: object
      description: How much platform balance to move into the cabal.
      additionalProperties: false
      required: [amount_micros]
      properties:
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["5000000"]}
    FundAccepted:
      type: object
      description: A fund transfer that is signed and submitted.
      required: [transfer_id, status]
      properties:
        transfer_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/FundTransferStatus"}
    FundTransferStatus:
      type: string
      description: Where the transfer is. `landed` means final on chain with shares not yet minted.
      enum: [created, submitted, landed, settled, failed]
      examples: [submitted]
    FundTransfer:
      type: object
      description: One fund transfer as its owner sees it.
      required: [status, amount_micros, share_units, fail_code]
      properties:
        status: {$ref: "#/components/schemas/FundTransferStatus"}
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["5000000"]}
        share_units: {type: [string, "null"], pattern: "^[0-9]+$", examples: ["5000000"]}
        fail_code: {type: [string, "null"], examples: [fund_not_sent]}
    CabalPot:
      type: object
      description: A cabal's pot valued from one price read, with the caller's slice.
      additionalProperties: false
      required: [cabal_id, pot_value_micros, cash_micros, cash_weight_bps, pnl_micros, return_bps, prices_as_of, holdings, me]
      properties:
        cabal_id: {type: string, format: uuid, description: "The cabal id.", examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        pot_value_micros: {type: integer, format: int64, description: "Cash plus every holding's value, in USDC micros.", examples: [120000000]}
        cash_micros: {type: integer, format: int64, description: "The cabal's USDC not reserved for a cash out, in micros.", examples: [60000000]}
        cash_weight_bps: {type: integer, format: int32, description: "Cash's share of the pot in basis points. With every holding's weight it sums to 10000, or all are 0 when the pot is empty.", examples: [5000]}
        pnl_micros: {type: integer, format: int64, description: "Signed all-time gain, the pot value minus what members put in net of what they took out.", examples: [20000000]}
        return_bps:
          type: [integer, "null"]
          format: int32
          description: The all-time gain over net contributed, in basis points, truncated toward zero. Null when net contributed is zero or less.
          examples: [2000]
        prices_as_of: {type: string, format: date-time, description: "The oldest price used. The read time when the pot holds only USDC.", examples: ["2026-10-03T15:00:00Z"]}
        holdings:
          type: array
          description: Every stock the cabal holds, largest value first, ties by symbol.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CabalHolding"
        me:
          type: [object, "null"]
          description: The caller's slice. Null when the caller is not a member; every field is 0 for a member with no shares.
          examples: [null]
          x-go-type-name: CabalPotSlice
          additionalProperties: false
          required: [share_units, value_micros, slice_bps, net_contributed_micros, pnl_micros]
          properties:
            share_units: {type: integer, format: int64, description: "The caller's share units.", examples: [100000000]}
            value_micros: {type: integer, format: int64, description: "What the caller's shares are worth now, in USDC micros.", examples: [120000000]}
            slice_bps: {type: integer, format: int32, description: "The caller's share of the pot in basis points. Every member's slice sums to 10000.", examples: [10000]}
            net_contributed_micros: {type: integer, format: int64, description: "Signed USDC the caller put in minus what they took out, in micros.", examples: [100000000]}
            pnl_micros: {type: integer, format: int64, description: "Signed gain, value minus net contributed, in micros.", examples: [20000000]}
    CabalHolding:
      type: object
      description: One stock the cabal holds, valued at the latest market price.
      additionalProperties: false
      required: [symbol, display_name, units, price_micros, value_micros, weight_bps, cost_basis_micros, pnl_micros]
      properties:
        symbol: {type: string, description: "The token symbol.", examples: [AAPLx]}
        display_name: {type: string, description: "The display name.", examples: [Apple]}
        units: {type: string, pattern: "^(0|[1-9][0-9]*)\\.[0-9]{4}$", description: "Shares as the user sees them, rounded down to 4 decimal places.", examples: ["0.7300"]}
        price_micros: {type: integer, format: int64, description: "The latest price of one share, in USDC micros.", examples: [30000000]}
        value_micros: {type: integer, format: int64, description: "The holding's value, in USDC micros.", examples: [60000000]}
        weight_bps: {type: integer, format: int32, description: "The holding's share of the pot in basis points.", examples: [5000]}
        cost_basis_micros: {type: integer, format: int64, description: "What the cabal paid for the holding, in USDC micros.", examples: [40000000]}
        pnl_micros: {type: integer, format: int64, description: "Signed gain, value minus cost basis, in micros.", examples: [20000000]}
    UserTxnPage:
      type: object
      description: One page of the caller's transaction history.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page, newest first.
          examples: [[]]
          items: {$ref: "#/components/schemas/UserTxn"}
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    UserTxn:
      type: object
      description: One inbound, outbound or cabal transfer affecting the caller.
      additionalProperties: false
      required: [id, kind, status, usdc_micros, cabal, tx_signature, created_at]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        kind: {type: string, enum: [deposit, withdrawal, fund, cash_out], description: What happened., examples: [deposit]}
        status: {type: string, enum: [pending, settled, failed], description: Where the transaction is., examples: [settled]}
        usdc_micros: {type: string, pattern: "^-?(0|[1-9][0-9]*)$", description: Signed USDC amount in micros from the caller's wallet perspective., examples: ["25000000"]}
        cabal:
          type: [object, "null"]
          description: The cabal involved, when it remains available. Null for deposits, withdrawals, and deleted cabals.
          examples: [null]
          x-go-type-name: UserTxnCabal
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
            name: {type: string, description: The cabal name., examples: [Moneymakers]}
        tx_signature: {type: [string, "null"], description: The Solana transaction signature. Null until sent., examples: [null]}
        created_at: {type: string, format: date-time, description: When the transaction was created., examples: ["2026-10-03T15:00:00Z"]}
    CabalActivityPage:
      type: object
      description: One page of a cabal's activity.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CabalActivity"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    CabalActivity:
      type: object
      description: One buy, sell, fund or cash out in a cabal.
      additionalProperties: false
      required: [id, kind, status, asset, usdc_micros, units, actor, tx_signature, occurred_at]
      properties:
        id: {type: string, format: uuid, description: The source id. For a buy or sell it is the swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        kind:
          type: string
          description: What happened.
          enum: [buy, sell, fund, cash_out]
          examples: [buy]
        status:
          type: string
          description: Where it is. A confirmed or failed row never goes back to pending.
          enum: [pending, confirmed, failed]
          examples: [confirmed]
        asset:
          type: [object, "null"]
          description: The stock bought or sold. Null when there is none or the catalog does not know it.
          examples: [{symbol: AAPLx, name: Apple}]
          x-go-type-name: ActivityAsset
          additionalProperties: false
          required: [symbol, name]
          properties:
            symbol: {type: string, description: The token symbol., examples: [AAPLx]}
            name: {type: string, description: The display name., examples: [Apple]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC spent or received, in micros. Null until known.
          examples: [25000000]
        units:
          type: [integer, "null"]
          format: int64
          description: Token base units bought or sold. Null until known.
          examples: [105000000]
        actor:
          type: [object, "null"]
          description: The member who acted. Null for a trade the cabal voted for.
          examples: [null]
          x-go-type-name: ActivityActor
          additionalProperties: false
          required: [user_id, handle, display_name]
          properties:
            user_id: {type: string, format: uuid, description: The member., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
            handle: {type: string, description: The member's handle., examples: [ana]}
            display_name: {type: string, description: The member's display name., examples: [Ana]}
        tx_signature:
          type: [string, "null"]
          description: The Solana transaction signature. Null until the transaction is sent.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        occurred_at: {type: string, format: date-time, description: When it started., examples: ["2026-10-03T15:00:00Z"]}
