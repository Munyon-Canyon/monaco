paths:
  /v1/leaderboards/cabals:
    get:
      operationId: getCabalsLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the cabals leaderboard.
      description: >-
        Returns one page of cabals ranked by return, best first, from the latest finished run. Before
        the first run `run_id` is null and `rows` is empty. A range with no rows yet also returns an
        empty page. An unknown range, a limit outside 1 to 50 or a cursor the server did not write is
        invalid_input. `me` is always null on this board.
      parameters:
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/leaderboards/people:
    get:
      operationId: getPeopleLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the people leaderboard.
      description: >-
        Returns one page of people ranked by return, best first, from the latest finished run, and
        the caller's own row in `me` whatever page is read. `me` is null when the caller has no
        ranked row. Before the first run `run_id` is null and `rows` is empty. An unknown range, a
        limit outside 1 to 50, a cursor the server did not write or a filter other than `all` and
        `friends` is invalid_input. With `filter=friends` the board holds the people the caller
        follows and the caller, ranked densely from 1 in board order, and `rank`, the cursor and
        `me` all use that friends rank. A caller who follows nobody gets their own row only, or an
        empty page when they are not ranked.
      parameters:
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
        - $ref: "#/components/parameters/LeaderboardFilter"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/leaderboard:
    get:
      operationId: getCabalLeaderboard
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read a cabal's members leaderboard.
      description: >-
        Returns one page of the cabal's members ranked by return, best first, from the latest
        finished run, and the caller's own row in `me` when the caller is on the board. Members with
        no stake rank after the ranked ones with a null `return_bps`. Any signed-in user may read it.
        An unknown cabal is cabal_not_found. An unknown range, a limit outside 1 to 50 or a cursor the
        server did not write is invalid_input.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - $ref: "#/components/parameters/LeaderboardRange"
        - $ref: "#/components/parameters/LeaderboardCursor"
        - $ref: "#/components/parameters/LeaderboardLimit"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/value-history:
    get:
      operationId: getCabalValueHistory
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read a cabal's value history.
      description: >-
        Returns the cabal's pot value, NAV per share and P&L over the range, one point per bucket,
        oldest first. P&L is the pot value minus the net contributed at the same snapshot, so a fund
        or a cash out is not a gain or a loss. A bucket with no snapshot at or before it is left out.
        Before the first run `prices_as_of` is null and `points` is empty. Any signed-in user may
        read it. An unknown cabal is cabal_not_found and an unknown range is invalid_input.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - $ref: "#/components/parameters/ValueHistoryRange"
      responses:
        "200":
          description: The cabal's value history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabalValueHistory"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pnl-history:
    get:
      operationId: getMyPnlHistory
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's P&L history.
      description: >-
        Returns the caller's equity and P&L across every cabal they have held a stake in, one point
        per bucket, oldest first. At each bucket a cabal's stake is read at the time of its latest
        snapshot, so a fund or a cash out between two snapshots is not a gain or a loss. P&L is equity
        minus the net contributed, so it keeps the gain a member realised after a cash out. A bucket
        where a held cabal has no snapshot yet is left out. Before the first run, or with no stake,
        `points` is empty. An unknown range is invalid_input.
      parameters:
        - $ref: "#/components/parameters/ValueHistoryRange"
      responses:
        "200":
          description: The caller's P&L history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPnlHistory"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/portfolio:
    get:
      operationId: getMyPortfolio
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the caller's portfolio.
      description: >-
        Returns the caller's stake in each cabal they hold, as the latest run valued it, with the
        total, the P&L, the return and each cabal's share of the total in basis points. The slices
        sum to 10000, with the remainder on the largest cabal, and are all 0 when the total is 0.
        Cash on the platform is not included. A cabal with no snapshot yet is left out of the rows
        and the total. Before the first run `cabals` is empty, the total is 0 and the times are null.
      responses:
        "200":
          description: The caller's portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPortfolio"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/shared-cabals:
    get:
      operationId: getSharedCabals
      tags: [ranking]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}, ip: {rate: 600, per: 1m, burst: 100}}
      summary: Read the cabals the caller and another user share.
      description: >-
        Returns the cabals both the caller and the user are members of, largest pot first, with the
        pot's value, its P&L and its return as the latest run valued it. These are the cabal's own
        figures, never the other user's stake. A shared cabal with no snapshot yet is left out. An
        unknown user is user_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The other user's id.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
      responses:
        "200":
          description: The shared cabals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedCabals"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    LeaderboardRange:
      name: range
      in: query
      required: false
      description: The window the return is measured over. Defaults to `ALL`.
      schema: {type: string, enum: ["1H", "1D", "1W", "1M", ALL], default: ALL, examples: [ALL]}
    LeaderboardCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` from the previous page. Absent reads the first page.
      schema: {type: string, maxLength: 64, examples: [MjA]}
    LeaderboardFilter:
      name: filter
      in: query
      required: false
      description: "`all` reads the whole board. `friends` reads the people the caller follows and the caller."
      schema: {type: string, enum: [all, friends], default: all, examples: [friends]}
    LeaderboardLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 20 and cannot exceed 50.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20, examples: [20]}
    ValueHistoryRange:
      name: range
      in: query
      required: false
      description: The window the curve covers. Defaults to `ALL`.
      schema: {type: string, enum: ["1H", "1D", "1W", "1M", ALL], default: ALL, examples: [ALL]}
  schemas:
    CabalValueHistory:
      type: object
      description: A cabal's value curve.
      additionalProperties: false
      required: [cabal_id, range, points, prices_as_of]
      properties:
        cabal_id: {type: string, format: uuid, description: The cabal., examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        range:
          type: string
          enum: ["1H", "1D", "1W", "1M", ALL]
          description: The window the curve covers.
          examples: [ALL]
        points:
          type: array
          description: One point per bucket, oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CabalValuePoint"
        prices_as_of:
          type: [string, "null"]
          format: date-time
          description: The price time of the run the curve ends at. Null before the first run.
          examples: ["2026-10-04T11:59:00Z"]
    MyPnlHistory:
      type: object
      description: The caller's equity and P&L curve.
      additionalProperties: false
      required: [range, points]
      properties:
        range:
          type: string
          enum: ["1H", "1D", "1W", "1M", ALL]
          description: The window the curve covers.
          examples: [ALL]
        points:
          type: array
          description: One point per bucket, oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/PnlPoint"
    PnlPoint:
      type: object
      description: The caller's equity and P&L at the end of one bucket.
      additionalProperties: false
      required: [at, equity_micros, pnl_micros]
      properties:
        at: {type: string, format: date-time, description: The end of the bucket., examples: ["2026-10-04T12:00:00Z"]}
        equity_micros: {type: integer, format: int64, description: The caller's share of every pot in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "Equity minus the net contributed, negative for a loss.", examples: [-5]}
    MyPortfolio:
      type: object
      description: The caller's stakes, valued by the latest run.
      additionalProperties: false
      required: [total_value_micros, pnl_micros, return_bps, computed_at, prices_as_of, cabals]
      properties:
        total_value_micros: {type: integer, format: int64, description: The sum of the cabals' values in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "Total value minus the net contributed, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The return in basis points. Null when nothing is contributed., examples: [250]}
        computed_at: {type: [string, "null"], format: date-time, description: When the run finished. Null before the first run., examples: ["2026-10-04T12:00:00Z"]}
        prices_as_of: {type: [string, "null"], format: date-time, description: The price time of the run. Null before the first run., examples: ["2026-10-04T11:59:00Z"]}
        cabals:
          type: array
          description: The cabals the caller holds, largest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/PortfolioCabal"
    PortfolioCabal:
      type: object
      description: The caller's stake in one cabal.
      additionalProperties: false
      required: [cabal, value_micros, share_units, net_contributed_micros, pnl_micros, return_bps, slice_bps]
      properties:
        cabal:
          $ref: "#/components/schemas/CabalRef"
        value_micros: {type: integer, format: int64, description: The stake's value in USDC micros., examples: [1000000]}
        share_units: {type: integer, format: int64, description: The caller's share units., examples: [100]}
        net_contributed_micros: {type: integer, format: int64, description: Contributed minus withdrawn in USDC micros., examples: [900000]}
        pnl_micros: {type: integer, format: int64, description: "Value minus the net contributed, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The return in basis points. Null when nothing is contributed., examples: [250]}
        slice_bps: {type: integer, format: int64, description: The cabal's share of the total value in basis points., examples: [5000]}
    SharedCabals:
      type: object
      description: The cabals two users share.
      additionalProperties: false
      required: [cabals]
      properties:
        cabals:
          type: array
          description: The shared cabals, largest pot first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/SharedCabal"
    SharedCabal:
      type: object
      description: One shared cabal and its pot figures.
      additionalProperties: false
      required: [cabal, value_micros, pnl_micros, return_bps]
      properties:
        cabal:
          $ref: "#/components/schemas/CabalRef"
        value_micros: {type: integer, format: int64, description: The pot value in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "The pot value minus the net contributed, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The pot's return in basis points. Null when nothing is contributed., examples: [250]}
    CabalRef:
      type: object
      description: A cabal's name and picture.
      additionalProperties: false
      required: [id, name, picture_url]
      properties:
        id: {type: string, format: uuid, description: The cabal., examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        name: {type: string, description: The cabal's name., examples: [Alpha]}
        picture_url: {type: [string, "null"], description: The picture. Null when there is none., examples: [null]}
    CabalValuePoint:
      type: object
      description: The cabal's value at the end of one bucket.
      additionalProperties: false
      required: [at, value_micros, nav_per_share_micros, pnl_micros]
      properties:
        at: {type: string, format: date-time, description: The end of the bucket., examples: ["2026-10-04T12:00:00Z"]}
        value_micros: {type: integer, format: int64, description: The pot value in USDC micros., examples: [1000000]}
        nav_per_share_micros: {type: integer, format: int64, description: The pot value per share in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "The pot value minus the net contributed, negative for a loss.", examples: [-5]}
    LeaderboardPage:
      type: object
      description: One page of a leaderboard from one run.
      additionalProperties: false
      required: [run_id, board, range, computed_at, prices_as_of, rows, me, next_cursor]
      properties:
        run_id:
          type: [string, "null"]
          format: uuid
          description: The run the page was read from. Null before the first run.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8060"]
        board:
          type: string
          description: "`cabals`, `people` or `cabal_members:<cabal id>`."
          examples: [cabals]
        range:
          type: string
          enum: ["1H", "1D", "1W", "1M", ALL]
          description: The window the return is measured over.
          examples: [ALL]
        computed_at: {type: string, format: date-time, description: When the rows were computed., examples: ["2026-10-04T12:00:00Z"]}
        prices_as_of: {type: string, format: date-time, description: The price time the rows were valued at., examples: ["2026-10-04T11:59:00Z"]}
        rows:
          type: array
          description: The page, best rank first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/LeaderboardRow"
        me:
          type: [object, "null"]
          description: The caller's own row on this board. Null when the caller has none.
          examples: [null]
          x-go-type: LeaderboardRow
          additionalProperties: false
          required: [rank, subject, value_micros, pnl_micros, return_bps, flags]
          properties:
            rank: {type: integer, format: int32, description: The dense rank on the board., examples: [1]}
            subject:
              $ref: "#/components/schemas/LeaderboardSubject"
            value_micros: {type: integer, format: int64, description: Current value in USDC micros., examples: [1000000]}
            pnl_micros: {type: integer, format: int64, description: "Profit and loss in USDC micros, negative for a loss.", examples: [-5]}
            return_bps: {type: [integer, "null"], format: int64, description: The return in basis points. Null when unranked., examples: [250]}
            flags:
              type: array
              description: Why the row may be less exact.
              examples: [[]]
              items: {type: string, enum: [stale_prices, unpriced_assets]}
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    LeaderboardRow:
      type: object
      description: One ranked subject.
      additionalProperties: false
      required: [rank, subject, value_micros, pnl_micros, return_bps, flags]
      properties:
        rank: {type: integer, format: int32, description: The dense rank on the board., examples: [1]}
        subject:
          $ref: "#/components/schemas/LeaderboardSubject"
        value_micros: {type: integer, format: int64, description: Current value in USDC micros., examples: [1000000]}
        pnl_micros: {type: integer, format: int64, description: "Profit and loss in USDC micros, negative for a loss.", examples: [-5]}
        return_bps: {type: [integer, "null"], format: int64, description: The return in basis points. Null when unranked., examples: [250]}
        flags:
          type: array
          description: Why the row may be less exact.
          examples: [[]]
          items: {type: string, enum: [stale_prices, unpriced_assets]}
    LeaderboardSubject:
      type: object
      description: The cabal or person a row ranks.
      additionalProperties: false
      required: [id, kind, name, handle, picture_url]
      properties:
        id: {type: string, format: uuid, description: The cabal or user id., examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        kind: {type: string, enum: [cabal, user], description: What the subject is., examples: [cabal]}
        name: {type: string, description: The cabal or display name., examples: [Alpha]}
        handle: {type: [string, "null"], description: The user's handle. Null for a cabal., examples: [null]}
        picture_url: {type: [string, "null"], description: The picture. Null when there is none., examples: [null]}
