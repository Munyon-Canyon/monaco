paths:
  /v1/admin/dashboards/money:
    get:
      operationId: getMoneyDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the money dashboard.
      description: >-
        Returns USDC moving through the platform per day or week, read from the ledger on the primary database
        in a read-only transaction with a 5 second statement timeout. A bucket holds the settled deposits, funds
        into cabals, cash-outs and withdrawals as a count and USDC micros, and the settled swap volume bought and
        sold. Buckets with no activity are omitted. `total_value_held_micros` is the latest value of every cabal pot
        plus the platform balance of every member wallet, and `as_of` is when the latest valuation run priced the pots,
        null before the first run. `to` is exclusive and the range cannot exceed 400 days. A longer range, a `to`
        not after `from` or an unknown bucket is invalid_input. A read over the timeout is dashboard_timeout.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The money dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/MoneyDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dashboards/governance:
    get:
      operationId: getGovernanceDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the governance dashboard.
      description: >-
        Returns proposal activity per day or week, read in a read-only transaction with a 5 second statement timeout.
        A bucket counts the proposal events recorded in it: created, passed, failed, expired and execution blocked.
        Buckets with no events are omitted. `median_seconds_to_pass` is the median time from creation to pass over the
        proposals that passed in the range, null when none did. `participation` has one row per cabal that opened a
        proposal in the range, with the votes cast out of the votes eligible. `open_proposals` counts the proposals
        open now. `to` is exclusive and the range cannot exceed 400 days.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The governance dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/GovernanceDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dashboards/social:
    get:
      operationId: getSocialDashboard
      tags: [analytics]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 20}}
      summary: Read the social dashboard.
      description: >-
        Returns the size and activity of the social graph, read in a read-only transaction with a 5 second statement
        timeout. `series` is long-format and time-bucketed, one row per bucket, metric and group with events in it:
        `users_created`, `follows_created` grouped by source, `follows_removed`, `comments_created` and
        `replies_created`. Buckets with no events are omitted. `cabals` is the cabal count and how many members the
        median, the 90th percentile and the largest cabal have. `user_states` counts users by auth state and account
        status, and `users_total` sums them, deleted accounts included. `to` is exclusive and the range cannot
        exceed 400 days.
      parameters:
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - $ref: "#/components/parameters/DashboardBucket"
      responses:
        "200":
          description: The social dashboard.
          content: {application/json: {schema: {$ref: "#/components/schemas/SocialDashboard"}}}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    DashboardFrom:
      name: from
      in: query
      required: true
      description: The start of the range, inclusive, as a date such as 2026-09-01 or an RFC 3339 time. Dates are UTC.
      schema: {type: string, maxLength: 40, examples: ["2026-09-01"]}
    DashboardTo:
      name: to
      in: query
      required: true
      description: The end of the range, exclusive, as a date or an RFC 3339 time. It cannot be more than 400 days after `from`.
      schema: {type: string, maxLength: 40, examples: ["2026-10-01"]}
    DashboardBucket:
      name: bucket
      in: query
      required: true
      description: The bucket size. A week starts on Monday, UTC.
      schema: {$ref: "#/components/schemas/DashboardBucket"}
  schemas:
    DashboardBucket:
      type: string
      description: The size of one bucket.
      enum: [day, week]
      examples: [day]
    DashboardMicros:
      type: string
      description: A USDC amount in micros as a decimal string.
      pattern: "^(0|[1-9][0-9]*)$"
      examples: ["25000000"]
    MoneyBucket:
      type: object
      description: The settled money movement of one bucket.
      examples:
        - bucket_start: "2026-09-01T00:00:00Z"
          deposit_count: 2
          deposit_micros: "50000000"
          fund_count: 1
          fund_micros: "25000000"
          swap_buy_micros: "10000000"
          swap_sell_micros: "0"
          cash_out_count: 0
          cash_out_micros: "0"
          withdrawal_count: 0
          withdrawal_micros: "0"
      additionalProperties: false
      required:
        - bucket_start
        - deposit_count
        - deposit_micros
        - fund_count
        - fund_micros
        - swap_buy_micros
        - swap_sell_micros
        - cash_out_count
        - cash_out_micros
        - withdrawal_count
        - withdrawal_micros
      properties:
        bucket_start: {type: string, format: date-time, description: The start of the bucket in UTC., examples: ["2026-09-01T00:00:00Z"]}
        deposit_count: {type: integer, format: int64, description: Deposits credited to member wallets., examples: [2]}
        deposit_micros: {$ref: "#/components/schemas/DashboardMicros"}
        fund_count: {type: integer, format: int64, description: Transfers from a member wallet into a cabal., examples: [1]}
        fund_micros: {$ref: "#/components/schemas/DashboardMicros"}
        swap_buy_micros: {$ref: "#/components/schemas/DashboardMicros"}
        swap_sell_micros: {$ref: "#/components/schemas/DashboardMicros"}
        cash_out_count: {type: integer, format: int64, description: Cash-outs paid to members., examples: [0]}
        cash_out_micros: {$ref: "#/components/schemas/DashboardMicros"}
        withdrawal_count: {type: integer, format: int64, description: Withdrawals to external wallets., examples: [0]}
        withdrawal_micros: {$ref: "#/components/schemas/DashboardMicros"}
    MoneyDashboard:
      type: object
      description: Money moving through the platform and the total value it holds.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          as_of: "2026-09-30T23:55:00Z"
          pot_micros: "80000000"
          platform_balance_micros: "20000000"
          total_value_held_micros: "100000000"
          buckets: []
      additionalProperties: false
      required: [from, to, bucket, as_of, pot_micros, platform_balance_micros, total_value_held_micros, buckets]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        as_of: {type: [string, "null"], format: date-time, description: When the latest valuation run priced the pots. Null before the first run., examples: ["2026-09-30T23:55:00Z"]}
        pot_micros: {$ref: "#/components/schemas/DashboardMicros"}
        platform_balance_micros: {$ref: "#/components/schemas/DashboardMicros"}
        total_value_held_micros: {$ref: "#/components/schemas/DashboardMicros"}
        buckets:
          type: array
          description: The buckets with activity, oldest first.
          items: {$ref: "#/components/schemas/MoneyBucket"}
    GovernanceBucket:
      type: object
      description: The proposal events of one bucket.
      examples:
        - bucket_start: "2026-09-01T00:00:00Z"
          created: 3
          passed: 1
          failed: 1
          expired: 0
          execution_blocked: 0
      additionalProperties: false
      required: [bucket_start, created, passed, failed, expired, execution_blocked]
      properties:
        bucket_start: {type: string, format: date-time, description: The start of the bucket in UTC., examples: ["2026-09-01T00:00:00Z"]}
        created: {type: integer, format: int64, description: Proposals opened., examples: [3]}
        passed: {type: integer, format: int64, description: Proposals that passed., examples: [1]}
        failed: {type: integer, format: int64, description: Proposals that failed., examples: [1]}
        expired: {type: integer, format: int64, description: Proposals that expired., examples: [0]}
        execution_blocked: {type: integer, format: int64, description: Passed proposals whose trade was blocked., examples: [0]}
    GovernanceParticipation:
      type: object
      description: How much of its electorate one cabal used on the proposals it opened in the range.
      examples:
        - cabal_id: 019cc330-1111-7000-8000-000000000001
          proposals: 2
          eligible_votes: 6
          votes_cast: 3
          participation_bps: 5000
      additionalProperties: false
      required: [cabal_id, proposals, eligible_votes, votes_cast, participation_bps]
      properties:
        cabal_id: {type: string, format: uuid, description: The cabal., examples: [019cc330-1111-7000-8000-000000000001]}
        proposals: {type: integer, format: int64, description: Proposals the cabal opened in the range., examples: [2]}
        eligible_votes: {type: integer, format: int64, description: Votes the voters could cast across those proposals., examples: [6]}
        votes_cast: {type: integer, format: int64, description: Votes cast across those proposals., examples: [3]}
        participation_bps: {type: integer, format: int64, description: "Votes cast out of the votes eligible in basis points, 0 when none were eligible.", examples: [5000]}
    GovernanceDashboard:
      type: object
      description: Proposal activity and voter participation.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          open_proposals: 2
          passed_in_range: 4
          median_seconds_to_pass: 10800
          buckets: []
          participation: []
      additionalProperties: false
      required: [from, to, bucket, open_proposals, passed_in_range, median_seconds_to_pass, buckets, participation]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        open_proposals: {type: integer, format: int64, description: Proposals open now., examples: [2]}
        passed_in_range: {type: integer, format: int64, description: Proposals that passed in the range., examples: [4]}
        median_seconds_to_pass: {type: [integer, "null"], format: int64, description: The median seconds from creation to pass over the proposals that passed in the range. Null when none did., examples: [10800]}
        buckets:
          type: array
          description: The buckets with proposal events, oldest first.
          items: {$ref: "#/components/schemas/GovernanceBucket"}
        participation:
          type: array
          description: One row per cabal that opened a proposal in the range, by cabal id.
          items: {$ref: "#/components/schemas/GovernanceParticipation"}
    DashboardPoint:
      type: object
      description: The number of events of one metric and group in one bucket.
      examples:
        - bucket_start: "2026-09-01T00:00:00Z"
          metric: follows_created
          group: contacts
          count: 4
      additionalProperties: false
      required: [bucket_start, metric, group, count]
      properties:
        bucket_start: {type: string, format: date-time, description: The start of the bucket in UTC., examples: ["2026-09-01T00:00:00Z"]}
        metric: {type: string, description: What was counted., examples: [follows_created]}
        group: {type: string, description: "The value the metric is grouped by, empty when the metric has no grouping.", examples: [contacts]}
        count: {type: integer, format: int64, description: Events in the bucket., examples: [4]}
    DashboardCabals:
      type: object
      description: How many cabals exist and how large they are.
      examples:
        - total: 12
          banned: 1
          members_p50: 4
          members_p90: 9
          members_max: 15
      additionalProperties: false
      required: [total, banned, members_p50, members_p90, members_max]
      properties:
        total: {type: integer, format: int64, description: "Cabals, banned ones included.", examples: [12]}
        banned: {type: integer, format: int64, description: Banned cabals., examples: [1]}
        members_p50: {type: integer, format: int64, description: Members of the median cabal., examples: [4]}
        members_p90: {type: integer, format: int64, description: Members of the cabal at the 90th percentile., examples: [9]}
        members_max: {type: integer, format: int64, description: Members of the largest cabal., examples: [15]}
    UserStateCount:
      type: object
      description: The users in one auth state and account status.
      examples:
        - auth_state: ONBOARDING_COMPLETED
          account_status: active
          users: 120
      additionalProperties: false
      required: [auth_state, account_status, users]
      properties:
        auth_state: {type: string, description: The auth state., examples: [ONBOARDING_COMPLETED]}
        account_status: {type: string, description: The account status., examples: [active]}
        users: {type: integer, format: int64, description: Users in this state., examples: [120]}
    SocialDashboard:
      type: object
      description: The size and activity of the social graph.
      examples:
        - from: "2026-09-01T00:00:00Z"
          to: "2026-10-01T00:00:00Z"
          bucket: day
          users_total: 130
          cabals: {total: 12, banned: 1, members_p50: 4, members_p90: 9, members_max: 15}
          user_states: []
          series: []
      additionalProperties: false
      required: [from, to, bucket, users_total, cabals, user_states, series]
      properties:
        from: {type: string, format: date-time, description: The start of the range., examples: ["2026-09-01T00:00:00Z"]}
        to: {type: string, format: date-time, description: "The end of the range, exclusive.", examples: ["2026-10-01T00:00:00Z"]}
        bucket: {$ref: "#/components/schemas/DashboardBucket"}
        users_total: {type: integer, format: int64, description: "Users in every state, deleted accounts included.", examples: [130]}
        cabals: {$ref: "#/components/schemas/DashboardCabals"}
        user_states:
          type: array
          description: Users by auth state and account status.
          items: {$ref: "#/components/schemas/UserStateCount"}
        series:
          type: array
          description: Events per bucket, metric and group, oldest first.
          items: {$ref: "#/components/schemas/DashboardPoint"}
