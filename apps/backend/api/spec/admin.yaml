paths:
  /v1/admin/actions:
    get:
      operationId: getAdminActions
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List admin actions.
      description: >-
        Returns the audit trail of admin actions, newest first. Every filter is optional and the filters
        combine with AND. `next_cursor` is the id of the last action on the page when the page holds `limit`
        actions, and null otherwise. Send it back as `cursor` to read the next page.
      parameters:
        - name: admin_id
          in: query
          required: false
          description: Only actions taken by this administrator.
          schema: {type: string, format: uuid, examples: ["019cc330-1111-7000-8000-000000000001"]}
        - name: target_type
          in: query
          required: false
          description: Only actions on this kind of target.
          schema: {$ref: "#/components/schemas/AdminTargetType"}
        - name: target_id
          in: query
          required: false
          description: Only actions on the target with this id. Pair it with `target_type`.
          schema: {type: string, maxLength: 64, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
        - name: action
          in: query
          required: false
          description: Only actions of this kind.
          schema: {$ref: "#/components/schemas/AdminActionKind"}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a805a"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 200.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of admin actions, newest first.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminActions"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Read the active administrator role.
      description: Returns the authenticated administrator and their active role.
      responses:
        "200":
          description: The active administrator.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminMe"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/admins:
    get:
      operationId: getAdmins
      tags: [admin]
      x-admin-role: operator
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List current administrators.
      description: Returns every non-revoked administrator. Operator access is required.
      responses:
        "200":
          description: Current administrators.
          content: {application/json: {schema: {$ref: "#/components/schemas/Admins"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dead-letters:
    get:
      operationId: getDeadLetters
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List dead letters.
      description: >-
        Returns the dead-letter queue, newest first. `status` defaults to `open`. `next_cursor` is the id of
        the last letter on the page when the page holds `limit` letters, and null otherwise. Send it back as
        `cursor` to read the next page. The stored message body is never returned.
      parameters:
        - name: status
          in: query
          required: false
          description: Only letters in this state. Defaults to `open`.
          schema: {$ref: "#/components/schemas/DeadLetterStatus"}
        - name: consumer
          in: query
          required: false
          description: Only letters of this consumer.
          schema: {type: string, maxLength: 64, examples: [analytics]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a805a"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 200.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of dead letters, newest first.
          content: {application/json: {schema: {$ref: "#/components/schemas/DeadLetters"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dead-letters/{id}/redrive:
    post:
      operationId: redriveDeadLetter
      tags: [admin]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Redrive a dead letter.
      description: >-
        Republishes the message that ended in the dead letter and marks the row `redriven`, then answers 204.
        The row turns `resolved` when the redriven message is acked, and `open` again when it fails again.
        A letter that is already resolved or discarded answers dead_letter_not_open, an unknown letter answers
        not_found, and so does a max-deliveries letter whose original event has left the stream.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the dead letter.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a805a"]}
      requestBody:
        description: Why the administrator redrives the letter.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: posthog fixed}
      responses:
        "204": {description: The message was republished.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/dead-letters/{id}/discard:
    post:
      operationId: discardDeadLetter
      tags: [admin]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Discard a dead letter.
      description: >-
        Marks the row `discarded` without republishing anything, then answers 204. A letter that is already
        resolved or discarded answers dead_letter_not_open, and an unknown letter answers not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the dead letter.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a805a"]}
      requestBody:
        description: Why the administrator discards the letter.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: duplicate of a fixed bug}
      responses:
        "204": {description: The dead letter is discarded.}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up a user by id.
      description: >-
        Returns what an operator needs to investigate one user: account and auth state, the auth state history,
        cabals, share positions, the 20 newest ledger transactions and the 20 newest admin actions on the user.
        It returns no email, phone number or X handle, and the wallet address is shortened to its first and last
        four characters. An unknown user answers user_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the user.
          schema: {type: string, format: uuid, examples: ["019cc330-1111-7000-8000-000000000001"]}
      responses:
        "200":
          description: The user.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users:
    get:
      operationId: findAdminUser
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up a user by handle.
      description: Returns the same document as the lookup by id. An unknown handle answers user_not_found.
      parameters:
        - name: handle
          in: query
          required: true
          description: The handle of the user, without the at sign.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [devadmin]}
      responses:
        "200":
          description: The user.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/cabals/{id}:
    get:
      operationId: getAdminCabal
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up a cabal by id.
      description: >-
        Returns what an operator needs to investigate one cabal: status, rules, members with their share units,
        the treasury address and holdings, the 20 newest ledger transactions and the 20 newest admin actions on
        the cabal. An unknown cabal answers cabal_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["019cc330-2222-7000-8000-000000000001"]}
      responses:
        "200":
          description: The cabal.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminCabal"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/txns/{id}:
    get:
      operationId: getAdminTxn
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up a transaction by id.
      description: >-
        Reads the ledger transaction with this id, with its entries and the swap it settles. When no ledger
        transaction has the id, it reads the swap with this id instead, so a stuck swap from the queue resolves.
        An unknown id answers txn_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of a ledger transaction or of a swap.
          schema: {type: string, format: uuid, examples: ["019cc330-3333-7000-8000-000000000001"]}
      responses:
        "200":
          description: The transaction.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminTxn"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/txns:
    get:
      operationId: findAdminTxn
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up a transaction by signature.
      description: >-
        Returns the same document as the lookup by id. A signature that several ledger transactions share
        resolves to the cabal side first. When no ledger transaction has the signature, it reads the swap with
        it. An unknown signature answers txn_not_found.
      parameters:
        - name: signature
          in: query
          required: true
          description: The Solana transaction signature.
          schema: {type: string, minLength: 1, maxLength: 128, examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]}
      responses:
        "200":
          description: The transaction.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminTxn"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/queues:
    get:
      operationId: getAdminQueues
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Count the items in each queue.
      description: >-
        Returns the size of every queue for the panel's home tiles, each with the route that lists it. Stuck
        transactions use the default age of five minutes, unpublished events thirty seconds, and dead letters
        count the open ones.
      responses:
        "200":
          description: The queue sizes.
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminQueues"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/queues/stuck-txns:
    get:
      operationId: getStuckTxns
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List stuck swaps.
      description: >-
        Lists swaps that are still created or submitted after `older_than`, oldest first. A created swap counts
        from its creation and a submitted swap from its submission.
      parameters:
        - $ref: "#/components/parameters/OlderThan"
        - $ref: "#/components/parameters/QueueLimit"
      responses:
        "200":
          description: The stuck swaps.
          content: {application/json: {schema: {$ref: "#/components/schemas/StuckTxns"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/queues/unpublished-events:
    get:
      operationId: getUnpublishedEvents
      tags: [admin]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List events the relay has not published.
      description: Lists events rows with no `published_at` that are older than `older_than`, oldest first.
      parameters:
        - $ref: "#/components/parameters/OlderThan"
        - $ref: "#/components/parameters/QueueLimit"
      responses:
        "200":
          description: The unpublished events.
          content: {application/json: {schema: {$ref: "#/components/schemas/UnpublishedEvents"}}}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    OlderThan:
      name: older_than
      in: query
      required: false
      description: >-
        How old an item must be to count, as a duration such as 30s or 5m. It cannot exceed 24h. Each queue has its
        own default.
      schema: {type: string, maxLength: 16, examples: [5m]}
    QueueLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and cannot exceed 200.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
  schemas:
    AdminMe:
      type: object
      description: An active administrator and their role.
      examples:
        - user_id: 019cc330-1111-7000-8000-000000000001
          role: operator
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: The administrator's user id.
          examples: [019cc330-1111-7000-8000-000000000001]
        role: {$ref: "#/components/schemas/AdminRole"}
    Admins:
      type: object
      description: The active administrator list.
      examples:
        - admins:
            - user_id: 019cc330-1111-7000-8000-000000000001
              role: operator
      additionalProperties: false
      required: [admins]
      properties:
        admins:
          type: array
          description: Every non-revoked administrator.
          items: {$ref: "#/components/schemas/AdminMe"}
    AdminRole:
      type: string
      description: The administrator's access level.
      enum: [viewer, moderator, operator]
      examples: [operator]
    AdminActionKind:
      type: string
      description: What the administrator did.
      enum:
        - ops_pause
        - ops_resume
        - global_pause
        - global_resume
        - proposal_void
        - user_ban
        - user_unban
        - comment_remove
        - handle_revoke
        - handle_reassign
        - cabal_ban
        - ping_flag
      examples: [ping_flag]
    AdminTargetType:
      type: string
      description: The kind of thing the action changed.
      enum: [cabal, proposal, user, comment, handle, system_ping, global]
      examples: [system_ping]
    AdminActionRecord:
      type: object
      description: One audited admin action.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a805a
          admin_id: 01890a5d-ac96-774b-bcce-b302099a8059
          action: ping_flag
          target_type: system_ping
          target_id: 01890a5d-ac96-774b-bcce-b302099a8057
          reason: spam
          before: {flagged_at: null}
          after: {flagged_at: "2026-10-06T12:00:00Z"}
          approved_by: null
          created_at: "2026-10-06T12:00:00Z"
      additionalProperties: false
      required: [id, admin_id, action, target_type, target_id, reason, before, after, approved_by, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The action id. Ids sort by time, so a later action has a greater id.
          examples: [01890a5d-ac96-774b-bcce-b302099a805a]
        admin_id:
          type: string
          format: uuid
          description: The administrator who took the action.
          examples: [01890a5d-ac96-774b-bcce-b302099a8059]
        action: {$ref: "#/components/schemas/AdminActionKind"}
        target_type: {$ref: "#/components/schemas/AdminTargetType"}
        target_id:
          type: string
          description: The id of the target. Its format depends on `target_type`.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        reason:
          type: string
          description: The reason the administrator gave.
          examples: [spam]
        before:
          type: [object, "null"]
          x-go-type: rawjson.RawMessage
          x-go-type-import: {name: rawjson, path: encoding/json}
          description: The fields the action changed, as they were before. A JSON object, or null when nothing existed.
          examples: [{flagged_at: null}]
        after:
          type: [object, "null"]
          x-go-type: rawjson.RawMessage
          x-go-type-import: {name: rawjson, path: encoding/json}
          description: The fields the action changed, as they are now. A JSON object, or null.
          examples: [{flagged_at: "2026-10-06T12:00:00Z"}]
        approved_by:
          type: [string, "null"]
          format: uuid
          description: The second administrator who approved the action. Null unless the action needs approval.
          examples: [null]
        created_at:
          type: string
          format: date-time
          description: When the audit consumer recorded the action.
          examples: ["2026-10-06T12:00:00Z"]
    AdminActions:
      type: object
      description: One page of admin actions, newest first.
      examples:
        - items: []
          next_cursor: null
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The actions on this page.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: Pass it as `cursor` to read the next page. Null on the last page.
          examples: [null]
    DeadLetterStatus:
      type: string
      description: Where a dead letter stands in the queue.
      enum: [open, redriven, resolved, discarded]
      examples: [open]
    DeadLetter:
      type: object
      description: One dead letter, without its stored message body.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a805a
          stream_seq: 12
          consumer: analytics
          handler: analytics.posthog.follow.created
          subject: events.follow.created
          event_id: 01890a5d-ac96-774b-bcce-b302099a8057
          code: posthog_rejected
          error: "posthog.Capture: posthog_rejected"
          occurrences: 1
          status: open
          first_seen_at: "2026-10-06T12:00:00Z"
          last_seen_at: "2026-10-06T12:00:00Z"
          redriven_at: null
          resolved_at: null
          resolved_by: null
          resolve_reason: null
      additionalProperties: false
      required:
        - id
        - stream_seq
        - consumer
        - handler
        - subject
        - event_id
        - code
        - error
        - occurrences
        - status
        - first_seen_at
        - last_seen_at
        - redriven_at
        - resolved_at
        - resolved_by
        - resolve_reason
      properties:
        id:
          type: string
          format: uuid
          description: The dead letter id. Ids sort by time, so a later letter has a greater id.
          examples: [01890a5d-ac96-774b-bcce-b302099a805a]
        stream_seq:
          type: integer
          format: int64
          description: The sequence of the letter in the dead-letter stream, or of the latest one for a reopened row.
          examples: [12]
        consumer:
          type: string
          description: The durable consumer that gave up on the message.
          examples: [analytics]
        handler:
          type: string
          description: The handler that failed. Empty for a max-deliveries letter.
          examples: [analytics.posthog.follow.created]
        subject:
          type: string
          description: The subject of the message. Empty when the original event has left the stream.
          examples: [events.follow.created]
        event_id:
          type: [string, "null"]
          format: uuid
          description: The id of the event. Null when the original event has left the stream.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        code:
          type: string
          description: The error code of the failure, or `max_deliveries`.
          examples: [posthog_rejected]
        error:
          type: string
          description: The error text of the failure.
          examples: ["posthog.Capture: posthog_rejected"]
        occurrences:
          type: integer
          format: int32
          description: How many times the message ended in a dead letter, counting redrives that failed again.
          examples: [1]
        status: {$ref: "#/components/schemas/DeadLetterStatus"}
        first_seen_at:
          type: string
          format: date-time
          description: When the sink first recorded the letter.
          examples: ["2026-10-06T12:00:00Z"]
        last_seen_at:
          type: string
          format: date-time
          description: When the sink last recorded the letter.
          examples: ["2026-10-06T12:00:00Z"]
        redriven_at:
          type: [string, "null"]
          format: date-time
          description: When an administrator last redrove the letter. Null if none did.
          examples: [null]
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: When the letter was resolved or discarded. Null while it is open or redriven.
          examples: [null]
        resolved_by:
          type: [string, "null"]
          format: uuid
          description: The administrator who last redrove or discarded the letter. Null if none did.
          examples: [null]
        resolve_reason:
          type: [string, "null"]
          description: The reason that administrator gave. Null if none did.
          examples: [null]
    DeadLetters:
      type: object
      description: One page of dead letters, newest first.
      examples:
        - items: []
          next_cursor: null
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The letters on this page.
          items: {$ref: "#/components/schemas/DeadLetter"}
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: Pass it as `cursor` to read the next page. Null on the last page.
          examples: [null]
    AdminAuthState:
      type: string
      description: Where the user stands in onboarding.
      enum: [CREATED, AWAITING_PHONE, AWAITING_SOCIALS, ONBOARDING_COMPLETED]
      examples: [ONBOARDING_COMPLETED]
    AdminAccountStatus:
      type: string
      description: Whether the account may be used.
      enum: [active, suspended, banned, deleted]
      examples: [active]
    AdminAuthTransition:
      type: object
      description: One change of auth state, read from a user.auth_state_changed event.
      examples:
        - from: CREATED
          to: AWAITING_PHONE
          cause: otp_sent
          at: "2026-10-06T12:00:00Z"
      additionalProperties: false
      required: [from, to, cause, at]
      properties:
        from: {type: string, description: The state the user left., examples: [CREATED]}
        to: {type: string, description: The state the user entered., examples: [AWAITING_PHONE]}
        cause: {type: string, description: What moved the user., examples: [otp_sent]}
        at: {type: string, format: date-time, description: When the user moved., examples: ["2026-10-06T12:00:00Z"]}
    AdminCabalRef:
      type: object
      description: A cabal named by id.
      examples:
        - id: 019cc330-2222-7000-8000-000000000001
          name: Tech bros
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        name: {type: string, description: The cabal name., examples: [Tech bros]}
    AdminSharePosition:
      type: object
      description: The share units a user holds in one cabal.
      examples:
        - cabal_id: 019cc330-2222-7000-8000-000000000001
          share_units: "25000000"
      additionalProperties: false
      required: [cabal_id, share_units]
      properties:
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        share_units: {type: string, pattern: "^[0-9]+$", description: The share units as a decimal integer., examples: ["25000000"]}
    AdminTxnScope:
      type: string
      description: Which ledger the transaction sits in.
      enum: [user, cabal]
      examples: [user]
    AdminTxnHeader:
      type: object
      description: The header of one ledger transaction, without its entries.
      examples:
        - id: 019cc330-3333-7000-8000-000000000001
          scope: user
          kind: fund
          status: settled
          cabal_id: 019cc330-2222-7000-8000-000000000001
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
      additionalProperties: false
      required: [id, scope, kind, status, cabal_id, tx_signature, created_at]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [019cc330-3333-7000-8000-000000000001]}
        scope: {$ref: "#/components/schemas/AdminTxnScope"}
        kind: {type: string, description: "The kind: deposit, withdrawal, fund, cash_out or swap.", examples: [fund]}
        status: {type: string, description: "The status: pending, settled or failed.", examples: [settled]}
        cabal_id:
          type: [string, "null"]
          format: uuid
          description: The cabal the transaction touches. Null for a deposit or withdrawal.
          examples: [019cc330-2222-7000-8000-000000000001]
        tx_signature:
          type: [string, "null"]
          description: The Solana signature. Null until the transaction has one.
          examples: [null]
        created_at: {type: string, format: date-time, description: When the ledger recorded it., examples: ["2026-10-06T12:00:00Z"]}
    AdminUser:
      type: object
      description: One user as an operator sees them. It carries no email, phone number or X handle.
      examples:
        - id: 019cc330-1111-7000-8000-000000000001
          handle: devadmin
          auth_state: ONBOARDING_COMPLETED
          account_status: active
          phone_verified: true
          x_linked: false
          created_at: "2026-10-06T12:00:00Z"
          first_deposit_at: null
          wallet: 9xQe…VFin
          auth_state_history: []
          cabals: []
          positions: []
          recent_txns: []
          recent_admin_actions: []
      additionalProperties: false
      required:
        - id
        - handle
        - auth_state
        - account_status
        - phone_verified
        - x_linked
        - created_at
        - first_deposit_at
        - wallet
        - auth_state_history
        - cabals
        - positions
        - recent_txns
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The user id., examples: [019cc330-1111-7000-8000-000000000001]}
        handle: {type: [string, "null"], description: The handle. Null before the user picks one., examples: [devadmin]}
        auth_state: {$ref: "#/components/schemas/AdminAuthState"}
        account_status: {$ref: "#/components/schemas/AdminAccountStatus"}
        phone_verified: {type: boolean, description: Whether the user verified a phone number., examples: [true]}
        x_linked: {type: boolean, description: Whether the user linked an X account., examples: [false]}
        created_at: {type: string, format: date-time, description: When the user signed up., examples: ["2026-10-06T12:00:00Z"]}
        first_deposit_at:
          type: [string, "null"]
          format: date-time
          description: When the first deposit arrived. Null if none did.
          examples: [null]
        wallet:
          type: [string, "null"]
          description: The wallet address as its first four and last four characters. Null when the user has no wallet.
          examples: ["9xQe…VFin"]
        auth_state_history:
          type: array
          description: Every auth state change, oldest first.
          items: {$ref: "#/components/schemas/AdminAuthTransition"}
        cabals:
          type: array
          description: The cabals the user belongs to.
          items: {$ref: "#/components/schemas/AdminCabalRef"}
        positions:
          type: array
          description: The cabals where the user holds shares.
          items: {$ref: "#/components/schemas/AdminSharePosition"}
        recent_txns:
          type: array
          maxItems: 20
          description: The 20 newest ledger transactions of the user, newest first.
          items: {$ref: "#/components/schemas/AdminTxnHeader"}
        recent_admin_actions:
          type: array
          maxItems: 20
          description: The 20 newest admin actions on the user, newest first.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
    AdminCabalStatus:
      type: string
      description: Whether the cabal may trade.
      enum: [active, banned]
      examples: [active]
    AdminCabalRules:
      type: object
      description: The rules the cabal runs on.
      examples:
        - join_mode: request
          voter_mode: all
          threshold: majority
          proposal_expiry_seconds: 86400
          slippage_bps: 100
      additionalProperties: false
      required: [join_mode, voter_mode, threshold, proposal_expiry_seconds, slippage_bps]
      properties:
        join_mode: {type: string, description: "Always `request`.", examples: [request]}
        voter_mode: {type: string, description: "Who votes: all or list.", examples: [all]}
        threshold: {type: string, description: "What passes a proposal: majority or unanimous.", examples: [majority]}
        proposal_expiry_seconds: {type: integer, format: int64, description: How long a proposal stays open., examples: [86400]}
        slippage_bps: {type: integer, format: int32, description: "The slippage the cabal accepts, in basis points.", examples: [100]}
    AdminCabalMember:
      type: object
      description: One member of a cabal with the shares they hold.
      examples:
        - user_id: 019cc330-1111-7000-8000-000000000001
          handle: devadmin
          role: creator
          can_vote: true
          joined_at: "2026-10-06T12:00:00Z"
          share_units: "25000000"
      additionalProperties: false
      required: [user_id, handle, role, can_vote, joined_at, share_units]
      properties:
        user_id: {type: string, format: uuid, description: The user id., examples: [019cc330-1111-7000-8000-000000000001]}
        handle: {type: [string, "null"], description: The handle. Null before the user picks one., examples: [devadmin]}
        role: {type: string, description: "The role: creator or member.", examples: [creator]}
        can_vote: {type: boolean, description: Whether the member votes on proposals., examples: [true]}
        joined_at: {type: string, format: date-time, description: When the member joined., examples: ["2026-10-06T12:00:00Z"]}
        share_units: {type: string, pattern: "^[0-9]+$", description: The share units as a decimal integer. Zero for a member without a stake., examples: ["25000000"]}
    AdminHolding:
      type: object
      description: One token the cabal treasury holds.
      examples:
        - mint: XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp
          symbol: AAPLx
          units: "300000000"
      additionalProperties: false
      required: [mint, symbol, units]
      properties:
        mint: {type: string, description: The token mint address., examples: [XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp]}
        symbol: {type: [string, "null"], description: The catalog symbol. Null for a mint the catalog does not list., examples: [AAPLx]}
        units: {type: string, pattern: "^[0-9]+$", description: "The base units held, as a decimal integer.", examples: ["300000000"]}
    AdminCabal:
      type: object
      description: One cabal as an operator sees them.
      examples:
        - id: 019cc330-2222-7000-8000-000000000001
          name: Tech bros
          status: active
          created_at: "2026-10-06T12:00:00Z"
          creator_id: 019cc330-1111-7000-8000-000000000001
          rules: {join_mode: request, voter_mode: all, threshold: majority, proposal_expiry_seconds: 86400, slippage_bps: 100}
          member_count: 1
          members: []
          treasury_address: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
          positions: []
          pot_micros: "25000000"
          nav_per_share_micros: "1000000"
          valued_at: "2026-10-06T12:05:00Z"
          recent_txns: []
          recent_admin_actions: []
      additionalProperties: false
      required:
        - id
        - name
        - status
        - created_at
        - creator_id
        - rules
        - member_count
        - members
        - treasury_address
        - positions
        - pot_micros
        - nav_per_share_micros
        - valued_at
        - recent_txns
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The cabal id., examples: [019cc330-2222-7000-8000-000000000001]}
        name: {type: string, description: The cabal name., examples: [Tech bros]}
        status: {$ref: "#/components/schemas/AdminCabalStatus"}
        created_at: {type: string, format: date-time, description: When the cabal was created., examples: ["2026-10-06T12:00:00Z"]}
        creator_id: {type: string, format: uuid, description: The user who created the cabal., examples: [019cc330-1111-7000-8000-000000000001]}
        rules: {$ref: "#/components/schemas/AdminCabalRules"}
        member_count: {type: integer, format: int64, description: How many members the cabal has., examples: [1]}
        members:
          type: array
          description: Every member, oldest first.
          items: {$ref: "#/components/schemas/AdminCabalMember"}
        treasury_address: {type: string, description: The Solana address of the cabal treasury., examples: [9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin]}
        positions:
          type: array
          description: The tokens the treasury holds, USDC included. A mint the catalog does not list has a null symbol.
          items: {$ref: "#/components/schemas/AdminHolding"}
        pot_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: The pot value in USDC micros from the latest valuation run. Null before the cabal is first valued., examples: ["25000000"]}
        nav_per_share_micros: {type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$", description: The value of one share in USDC micros from the latest valuation run. Null before the cabal is first valued., examples: ["1000000"]}
        valued_at: {type: [string, "null"], format: date-time, description: When the cabal was last valued. Null before the cabal is first valued., examples: ["2026-10-06T12:05:00Z"]}
        recent_txns:
          type: array
          maxItems: 20
          description: The 20 newest ledger transactions of the cabal, newest first.
          items: {$ref: "#/components/schemas/AdminTxnHeader"}
        recent_admin_actions:
          type: array
          maxItems: 20
          description: The 20 newest admin actions on the cabal, newest first.
          items: {$ref: "#/components/schemas/AdminActionRecord"}
    AdminTxnEntry:
      type: object
      description: One signed line of a ledger transaction.
      examples:
        - {seq: 0, account: wallet, asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, amount: "-10000000"}
      additionalProperties: false
      required: [seq, account, asset, amount]
      properties:
        seq: {type: integer, format: int32, description: The position of the entry in the transaction., examples: [0]}
        account: {type: string, description: "The account the entry moves, such as wallet or treasury.", examples: [wallet]}
        asset: {type: string, description: "The asset moved: a mint address or a shares asset.", examples: [EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]}
        amount: {type: string, pattern: "^-?[0-9]+$", description: The signed amount in base units as a decimal integer., examples: ["-10000000"]}
    AdminLedgerTxn:
      type: object
      description: One ledger transaction with its entries.
      examples:
        - id: 019cc330-3333-7000-8000-000000000001
          scope: cabal
          user_id: null
          cabal_id: 019cc330-2222-7000-8000-000000000001
          kind: swap
          status: settled
          swap_id: 019cc330-4444-7000-8000-000000000001
          transfer_id: null
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          entries: []
      additionalProperties: false
      required: [id, scope, user_id, cabal_id, kind, status, swap_id, transfer_id, tx_signature, created_at, entries]
      properties:
        id: {type: string, format: uuid, description: The transaction id., examples: [019cc330-3333-7000-8000-000000000001]}
        scope: {$ref: "#/components/schemas/AdminTxnScope"}
        user_id: {type: [string, "null"], format: uuid, description: The user of a user-scope transaction. Null in the cabal scope., examples: [null]}
        cabal_id: {type: [string, "null"], format: uuid, description: The cabal the transaction touches. Null for a deposit or withdrawal., examples: [019cc330-2222-7000-8000-000000000001]}
        kind: {type: string, description: "The kind: deposit, withdrawal, fund, cash_out or swap.", examples: [swap]}
        status: {type: string, description: "The status: pending, settled or failed.", examples: [settled]}
        swap_id: {type: [string, "null"], format: uuid, description: The swap a cabal-scope swap transaction records. Null otherwise., examples: [019cc330-4444-7000-8000-000000000001]}
        transfer_id: {type: [string, "null"], format: uuid, description: The fund or withdrawal transfer that links a user and a cabal transaction., examples: [null]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the transaction has one., examples: [null]}
        created_at: {type: string, format: date-time, description: When the ledger recorded it., examples: ["2026-10-06T12:00:00Z"]}
        entries:
          type: array
          description: The entries of the transaction, in order.
          items: {$ref: "#/components/schemas/AdminTxnEntry"}
    AdminSwapEvent:
      type: object
      description: One trade event of a swap.
      examples:
        - {type: trade.submitted, at: "2026-10-06T12:00:00Z"}
      additionalProperties: false
      required: [type, at]
      properties:
        type: {type: string, description: "The event type: trade.submitted, trade.confirmed or trade.failed.", examples: [trade.submitted]}
        at: {type: string, format: date-time, description: When the event was recorded., examples: ["2026-10-06T12:00:00Z"]}
    AdminSwap:
      type: object
      description: One swap with the history of its trade events.
      examples:
        - id: 019cc330-4444-7000-8000-000000000001
          status: submitted
          failure_code: null
          execute_request_id: req-1
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          status_history: []
      additionalProperties: false
      required: [id, status, failure_code, execute_request_id, tx_signature, created_at, status_history]
      properties:
        id: {type: string, format: uuid, description: The swap id., examples: [019cc330-4444-7000-8000-000000000001]}
        status: {type: string, description: "The status: created, submitted, confirmed or failed.", examples: [submitted]}
        failure_code: {type: [string, "null"], description: Why the swap failed. Null unless it failed., examples: [null]}
        execute_request_id: {type: [string, "null"], description: The Jupiter execute request id. Null until the swap is submitted., examples: [req-1]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the swap is submitted., examples: [null]}
        created_at: {type: string, format: date-time, description: When the swap was created., examples: ["2026-10-06T12:00:00Z"]}
        status_history:
          type: array
          description: The trade events of the swap, oldest first.
          items: {$ref: "#/components/schemas/AdminSwapEvent"}
    AdminTxn:
      type: object
      description: >-
        One transaction as an operator sees it. At least one of `ledger` and `swap` is present. `explorer_url`
        is present when a signature is known.
      examples:
        - explorer_url: "https://solscan.io/tx/5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW"
      additionalProperties: false
      properties:
        ledger: {$ref: "#/components/schemas/AdminLedgerTxn"}
        swap: {$ref: "#/components/schemas/AdminSwap"}
        explorer_url: {type: string, description: The Solscan page of the signature on mainnet., examples: ["https://solscan.io/tx/5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW"]}
    AdminQueue:
      type: object
      description: One queue and its size.
      examples:
        - {name: stuck_txns, count: 0, href: /v1/admin/queues/stuck-txns}
      additionalProperties: false
      required: [name, count, href]
      properties:
        name: {type: string, description: "The queue: stuck_txns, unpublished_events or dead_letters.", examples: [stuck_txns]}
        count: {type: integer, format: int64, description: How many items the queue holds., examples: [0]}
        href: {type: string, description: The route that lists the queue., examples: [/v1/admin/queues/stuck-txns]}
    AdminQueues:
      type: object
      description: The size of every queue.
      examples:
        - queues: [{name: stuck_txns, count: 0, href: /v1/admin/queues/stuck-txns}]
      additionalProperties: false
      required: [queues]
      properties:
        queues:
          type: array
          description: The queues, in the order the panel shows them.
          items: {$ref: "#/components/schemas/AdminQueue"}
    StuckTxn:
      type: object
      description: One swap that has not finished.
      examples:
        - id: 019cc330-4444-7000-8000-000000000001
          cabal_id: 019cc330-2222-7000-8000-000000000001
          action: buy
          symbol: AAPLx
          status: submitted
          tx_signature: null
          created_at: "2026-10-06T12:00:00Z"
          age_seconds: 400
      additionalProperties: false
      required: [id, cabal_id, action, symbol, status, tx_signature, created_at, age_seconds]
      properties:
        id: {type: string, format: uuid, description: The swap id. Pass it to the transaction lookup., examples: [019cc330-4444-7000-8000-000000000001]}
        cabal_id: {type: string, format: uuid, description: The cabal that trades., examples: [019cc330-2222-7000-8000-000000000001]}
        action: {type: string, description: "Whether the swap buys or sells.", examples: [buy]}
        symbol: {type: string, description: The symbol of the token traded., examples: [AAPLx]}
        status: {type: string, description: "The status: created or submitted.", examples: [submitted]}
        tx_signature: {type: [string, "null"], description: The Solana signature. Null until the swap is submitted., examples: [null]}
        created_at: {type: string, format: date-time, description: When the swap was created., examples: ["2026-10-06T12:00:00Z"]}
        age_seconds: {type: integer, format: int64, description: Seconds since the swap was created., examples: [400]}
    StuckTxns:
      type: object
      description: The stuck swaps, oldest first.
      examples:
        - items: []
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The swaps.
          items: {$ref: "#/components/schemas/StuckTxn"}
    UnpublishedEvent:
      type: object
      description: One events row the relay has not published.
      examples:
        - id: 019cc330-5555-7000-8000-000000000001
          type: trade.submitted
          aggregate: {type: swap, id: 019cc330-4444-7000-8000-000000000001}
          created_at: "2026-10-06T12:00:00Z"
          age_seconds: 45
      additionalProperties: false
      required: [id, type, aggregate, created_at, age_seconds]
      properties:
        id: {type: string, format: uuid, description: The event id., examples: [019cc330-5555-7000-8000-000000000001]}
        type: {type: string, description: The event type., examples: [trade.submitted]}
        aggregate:
          type: object
          description: The aggregate the event belongs to.
          additionalProperties: false
          required: [type, id]
          properties:
            type: {type: string, description: The aggregate type., examples: [swap]}
            id: {type: string, format: uuid, description: The aggregate id., examples: [019cc330-4444-7000-8000-000000000001]}
        created_at: {type: string, format: date-time, description: When the event was recorded., examples: ["2026-10-06T12:00:00Z"]}
        age_seconds: {type: integer, format: int64, description: Seconds since the event was recorded., examples: [45]}
    UnpublishedEvents:
      type: object
      description: The unpublished events, oldest first.
      examples:
        - items: []
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The events.
          items: {$ref: "#/components/schemas/UnpublishedEvent"}
