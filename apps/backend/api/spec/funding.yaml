paths:
  /v1/me/balance:
    get:
      operationId: getMyBalance
      tags: [funding]
      summary: Read the caller's available platform balance.
      x-allow-restricted: true
      responses:
        "200":
          description: The current balance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
              example: {available_micros: "22500000", on_chain_micros: "25000000", in_flight_micros: "2500000", deposit_address: 5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP, as_of: "2026-10-03T15:00:00Z"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/onramp/sessions:
    post:
      operationId: createOnrampSession
      tags: [funding]
      x-idempotent: true
      summary: Start a card deposit.
      description: >-
        Creates an onramp session for the caller and returns the one-time fund page URL. The URL carries
        a single-use token that expires 10 minutes after creation and never the wallet address. The
        server stores only the token's SHA-256 and appends `onramp.status_changed` with `to: created`.
        A replay with the same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: An optional amount to prefill on the fund page and the cabal the user came from.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnrampSessionRequest"
      responses:
        "201":
          description: The session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSessionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/exchange:
    post:
      operationId: exchangeOnrampToken
      tags: [funding]
      security: []
      x-idempotent: false
      x-cors: web
      x-rate-limit:
        ip:
          rate: 30
          per: 1m
          burst: 30
      summary: Exchange a fund page token for the deposit address.
      description: >-
        Called by the fund page with the token from its URL. Opens the session and returns the member
        wallet address, the suggested amount and the USDC mint. The token works once:
        a used or unknown token is onramp_link_invalid, and a token past its 10 minutes is
        onramp_link_expired.
      requestBody:
        description: The token from the fund page URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeOnrampTokenRequest"
      responses:
        "200":
          description: The session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampExchange"
        default:
          $ref: "#/components/responses/Problem"
  /v1/onramp/sessions/{id}:
    get:
      operationId: getOnrampSession
      tags: [funding]
      summary: Read one of the caller's card deposits.
      description: >-
        Returns the session's status for the app's "Purchase processing" state. Another user's
        session is not_found.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: reportOnrampStatus
      tags: [funding]
      x-idempotent: true
      x-cors: web
      summary: Report how the provider flow ended.
      description: >-
        Called by the fund page with the Privy access token from its own login as the bearer.
        Moves an opened session to the reported status, appends `onramp.status_changed` and sends
        the owner an `onramp_changed` hint on `/v1/stream`. Another user is forbidden, and any move
        the status machine does not allow, such as confirmed to cancelled, is onramp_invalid_transition.
      parameters:
        - $ref: "#/components/parameters/OnrampSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The status the provider flow ended in.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportOnrampStatusRequest"
      responses:
        "200":
          description: The session after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/withdrawals:
    post:
      operationId: withdraw
      tags: [funding]
      x-idempotent: true
      x-allow-restricted: true
      summary: Send platform balance to a Solana address.
      description: >-
        Signs a USDC transfer from the caller's member wallet to `to_address`, stores its signature,
        then broadcasts it. The withdrawal confirms later. A replay with the same Idempotency-Key returns
        the first response and sends nothing new. A banned or suspended user can still withdraw.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The amount and the destination address.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawRequest"}
            example: {amount_micros: "2000000", to_address: 9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P}
      responses:
        "202":
          description: The transfer is signed and sent. `status` is `submitted` until it confirms.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WithdrawAccepted"}
              example: {withdrawal_id: 01890a5d-ac96-774b-bcce-b302099a8057, status: submitted, tx_signature: 5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW}
        default: {$ref: "#/components/responses/Problem"}
  /v1/me/withdrawals/{id}:
    get:
      operationId: getMyWithdrawal
      tags: [funding]
      x-allow-restricted: true
      summary: Read one of the caller's withdrawals.
      description: Returns the withdrawal's status. Another user's withdrawal is not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The withdrawal id from the create response.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The withdrawal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Withdrawal"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/cabals/{id}/pause:
    post:
      operationId: pauseAdminCabal
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Pause trading in one cabal.
      description: >-
        Writes an `ops` pause for the cabal and appends `cabal.paused` and `admin.action` in one transaction,
        then answers the cabal's pause state. A paused cabal gets no executions, no funding and no cash outs.
        A cabal that already has an open `ops` pause answers already_paused, and an unknown cabal answers
        cabal_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["019cc330-2222-7000-8000-000000000001"]}
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: investigating}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/cabals/{id}/resume:
    post:
      operationId: resumeAdminCabal
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Resume trading in one cabal.
      description: >-
        Resolves the cabal's open `ops` pause and appends `cabal.resumed` and `admin.action` in one transaction,
        then answers the cabal's pause state. It never clears an external-deposit pause: when one is still open
        the `ops` pause is resolved and audited, and the answer is cabal_still_paused. A cabal with no open
        `ops` pause answers no_ops_pause.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["019cc330-2222-7000-8000-000000000001"]}
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: resolved}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/pause:
    post:
      operationId: pauseAdminAll
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Pause trading in every cabal.
      description: >-
        Writes a global `ops` pause and appends `cabal.paused` and `admin.action` in one transaction, then
        answers the global pause state. An open global `ops` pause answers already_paused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: incident 7}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/resume:
    post:
      operationId: resumeAdminAll
      tags: [funding]
      x-admin-role: operator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Resume trading in every cabal.
      description: >-
        Resolves the global `ops` pause and appends `cabal.resumed` and `admin.action` in one transaction, then
        answers the global pause state. It never clears a cabal's own pause. With no open global `ops` pause it
        answers no_ops_pause.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Why the administrator takes the action.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: resolved}
      responses:
        "200":
          description: The pause state of the scope after the action.
          content: {application/json: {schema: {$ref: "#/components/schemas/PauseState"}}}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/queues/bounces:
    get:
      operationId: getBounceQueue
      tags: [funding]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List cabals waiting for a bounce.
      description: >-
        Lists the open pauses with reason `external_deposit`, oldest first: a direct transfer into a cabal
        treasury that has not been sent back yet. Each row names the paused cabal, which the cabal lookup
        resolves. A resume never clears one of these pauses.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 200.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50, examples: [50]}
      responses:
        "200":
          description: The pending bounces, oldest first.
          content: {application/json: {schema: {$ref: "#/components/schemas/BounceQueue"}}}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    OnrampSessionId:
      name: id
      in: path
      required: true
      description: The session id from the create response.
      schema:
        type: string
        format: uuid
        examples: [01890a5d-ac96-774b-bcce-b302099a8057]
  schemas:
    PendingBounce:
      type: object
      description: One cabal paused for a direct transfer that has not been sent back.
      examples:
        - {cabal_id: 019cc330-2222-7000-8000-000000000001, since: "2026-10-07T12:00:00Z"}
      additionalProperties: false
      required: [cabal_id, since]
      properties:
        cabal_id: {type: string, format: uuid, description: The paused cabal., examples: [019cc330-2222-7000-8000-000000000001]}
        since: {type: string, format: date-time, description: When the pause began., examples: ["2026-10-07T12:00:00Z"]}
    BounceQueue:
      type: object
      description: The pending bounces, oldest first.
      examples:
        - items: []
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The paused cabals.
          items: {$ref: "#/components/schemas/PendingBounce"}
    PauseReason:
      type: string
      description: Why trading is paused. `ops` is an operator's pause, `external_deposit` is an unreturned direct transfer.
      enum: [external_deposit, ops]
      examples: [ops]
    PauseState:
      type: object
      description: Whether trading is paused in a scope and why.
      examples:
        - {paused: true, reasons: [ops], since: "2026-10-07T12:00:00Z"}
      additionalProperties: false
      required: [paused, reasons, since]
      properties:
        paused: {type: boolean, description: True while any pause is open., examples: [true]}
        reasons:
          type: array
          description: The reasons that are open, a global pause first.
          items: {$ref: "#/components/schemas/PauseReason"}
        since:
          type: [string, "null"]
          format: date-time
          description: When the oldest open pause began. Null while nothing is paused.
          examples: ["2026-10-07T12:00:00Z"]
    Balance:
      type: object
      description: The member wallet's on-chain USDC and currently spendable platform balance.
      additionalProperties: false
      required: [available_micros, on_chain_micros, in_flight_micros, deposit_address, as_of]
      properties:
        available_micros: {type: string, pattern: "^[0-9]+$", examples: ["22500000"]}
        on_chain_micros: {type: string, pattern: "^[0-9]+$", examples: ["25000000"]}
        in_flight_micros: {type: string, pattern: "^[0-9]+$", examples: ["2500000"]}
        deposit_address: {type: string, examples: [5kwEmpcR8Txq1b4bDazRm9j4cx8Qo2aiE53rYA1dCDDP]}
        as_of:
          type: string
          format: date-time
          description: When on_chain_micros was read from the chain. Up to 10 minutes old when the chain is unreachable.
          examples: ["2026-10-03T15:00:00Z"]
    OnrampMicros:
      type: string
      description: A USDC amount in micros, as a decimal string.
      pattern: "^[1-9][0-9]{0,19}$"
      examples: ["25000000"]
    CreateOnrampSessionRequest:
      type: object
      description: What to prefill on the fund page.
      additionalProperties: false
      properties:
        suggested_amount_micros:
          $ref: "#/components/schemas/OnrampMicros"
        cabal_id:
          type: string
          format: uuid
          description: The cabal the user came from, when they did.
          examples: [01890a5d-ac96-774b-bcce-b302099a8058]
    OnrampSessionCreated:
      type: object
      description: A new onramp session and the page that runs it.
      additionalProperties: false
      required: [session_id, url, expires_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        url:
          type: string
          description: The fund page URL with its one-time token. Open it in the browser.
          examples: ["https://monacolabs.xyz/fund?s=q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
        expires_at:
          type: string
          format: date-time
          description: When the token stops working.
          examples: ["2026-10-03T15:10:00Z"]
    ExchangeOnrampTokenRequest:
      type: object
      description: The token from the fund page URL.
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The `s` query parameter of the fund page URL.
          minLength: 1
          maxLength: 128
          examples: ["q2J9cZQxv0mYb5r8yS3dTt1uVw7xY9zA0bC2dE4fG6h"]
    OnrampExchange:
      type: object
      description: What the fund page needs to start the provider flow.
      additionalProperties: false
      required: [session_id, wallet_address, suggested_amount_micros, usdc_mint]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        wallet_address:
          type: string
          description: The member wallet the provider sends USDC to.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount to prefill in USDC micros, or null to let the user choose.
          examples: ["25000000"]
        usdc_mint:
          type: string
          description: The Solana USDC mint.
          examples: [EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]
    ReportOnrampStatusRequest:
      type: object
      description: How the provider flow ended.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, submitted, cancelled, failed]
          description: >-
            confirmed when the user finished the provider flow, submitted when they left before
            confirmation, cancelled or failed when it threw.
          examples: [confirmed]
        provider:
          type: string
          description: The on-ramp provider Privy chose, when the page knows it.
          minLength: 1
          maxLength: 64
          examples: [moonpay]
    OnrampSession:
      type: object
      description: A card deposit session.
      additionalProperties: false
      required: [session_id, status, suggested_amount_micros, created_at, completed_at]
      properties:
        session_id:
          type: string
          format: uuid
          description: The session id.
          examples: [01890a5d-ac96-774b-bcce-b302099a8057]
        status:
          type: string
          enum: [created, opened, confirmed, submitted, cancelled, failed, expired]
          description: Where the session is in its status machine.
          examples: [confirmed]
        suggested_amount_micros:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{0,19}$"
          description: The amount the app suggested in USDC micros, or null.
          examples: ["25000000"]
        created_at:
          type: string
          format: date-time
          description: When the session was created.
          examples: ["2026-10-03T15:00:00Z"]
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the session reached a final status, or null while it is live.
          examples: ["2026-10-03T15:04:00Z"]
    WithdrawalStatus:
      type: string
      description: created, then submitted, then confirmed. created or submitted can end in failed.
      enum: [created, submitted, confirmed, failed]
    WithdrawRequest:
      type: object
      description: A withdrawal of platform balance to any Solana address.
      additionalProperties: false
      required: [amount_micros, to_address]
      properties:
        amount_micros:
          type: string
          pattern: "^[0-9]+$"
          description: USDC micros, at least 1000000.
          examples: ["2000000"]
        to_address:
          type: string
          description: The destination Solana wallet. It cannot be the caller's own member wallet.
          examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]
    WithdrawAccepted:
      type: object
      description: A signed and sent withdrawal.
      additionalProperties: false
      required: [withdrawal_id, status, tx_signature]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        tx_signature: {type: string, examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]}
    Withdrawal:
      type: object
      description: One withdrawal and where it stands.
      additionalProperties: false
      required: [withdrawal_id, status, amount_micros, to_address, tx_signature, fail_code, created_at, completed_at]
      properties:
        withdrawal_id: {type: string, format: uuid, examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {$ref: "#/components/schemas/WithdrawalStatus", examples: [submitted]}
        amount_micros: {type: string, pattern: "^[0-9]+$", examples: ["2000000"]}
        to_address: {type: string, examples: [9xQeWvG816bUx9EPjHmaT23yvVMvM9fQj4a8PHF4H6P]}
        tx_signature:
          type: [string, "null"]
          description: Null until the transfer is signed.
          examples: [5VERv8NMvzbJMEkV8xnrLkEaWRtSz9CosKDYjCJjBRnbJLgp8uirBgmQpjKhoR4tjF3ZpRzrFmBV6UjKdiSZkQUW]
        fail_code:
          type: [string, "null"]
          description: The error code a failed withdrawal ended with. Null otherwise.
          examples: [privy_unavailable]
        created_at: {type: string, format: date-time, examples: ["2026-10-04T15:00:00Z"]}
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the withdrawal confirmed or failed. Null while it is in flight.
          examples: ["2026-10-04T15:00:10Z"]
