paths:
  /v1/cabals/{id}/proposals:
    get:
      operationId: getCabalProposals
      tags: [governance]
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first. Every cabal is public, so any
        signed-in user can read them. A non-member sees the same items with `my_ballot` null.
        `open` keeps proposals still taking ballots, and `closed` keeps every other status.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, closed, all]
            default: all
            examples: [open]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a trade for the cabal to vote on.
      description: >-
        Checks that the caller is a member, that the asset is in the catalog and Jupiter can route
        it, and that a buy fits the pot or a sell fits the cabal's holding. These checks are advisory:
        the trade engine repeats them at execution. The voter set is copied from the cabal and never
        changes after. The proposer casts no ballot of their own. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The trade to propose. A buy sets `usdc_micros`, and a sell sets `token_amount`.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeTradeRequest"
            example: {kind: buy, symbol: TSLAx, usdc_micros: 5000000, thesis: earnings}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/preview:
    get:
      operationId: getCabalProposalPreview
      tags: [governance]
      summary: Preview a trade before proposing it.
      description: >-
        Runs the checks a proposal runs and writes nothing. A trade the checks refuse still answers
        200, with the refusal in `advisory_code` and `advisory_message`, so the review screen can show
        it. Only members can preview.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: true
          description: Whether the trade buys or sells the token.
          schema:
            $ref: "#/components/schemas/ProposalKind"
        - name: symbol
          in: query
          required: true
          description: The token symbol from the catalog.
          schema: {type: string, minLength: 1, maxLength: 32, examples: [TSLAx]}
        - name: usdc_micros
          in: query
          required: false
          description: USDC a buy spends, in micros.
          schema: {type: integer, format: int64, minimum: 1, examples: [5000000]}
        - name: token_amount
          in: query
          required: false
          description: Token base units a sell spends.
          schema: {type: integer, format: int64, minimum: 1, examples: [1000000]}
      responses:
        "200":
          description: The quote and the first check the trade fails, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradePreview"
              example: {quote_out_amount: 21000000, advisory_code: null, advisory_message: null, pot_value_micros: 100000000}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}:
    get:
      operationId: getProposal
      tags: [governance]
      summary: Read one proposal.
      description: >-
        Returns the proposal as the list shows it, plus every member of its frozen voter set with
        their ballot, whether the caller can vote on it or withdraw it, and the latest trade linked
        to it. A non-member sees the same proposal with `can_vote` and `can_withdraw` false.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: open, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, choice: null, cast_at: null}], can_vote: true, can_withdraw: true, swap: null}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposal
      tags: [governance]
      x-idempotent: true
      summary: Withdraw the caller's proposal.
      description: >-
        Moves the caller's open proposal to `withdrawn` and appends `proposal.withdrawn`. Only the
        proposer can withdraw, and only before any other member has voted; the proposer's own ballot
        does not count. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The withdrawn proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: withdrawn, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, choice: null, cast_at: null}], can_vote: false, can_withdraw: false, swap: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pending-votes:
    get:
      operationId: getMyPendingVotes
      tags: [governance]
      summary: List the open proposals waiting on the caller's ballot.
      description: >-
        Returns up to 50 open proposals, across every cabal, whose frozen voter set holds the caller
        and that have no ballot from the caller yet, soonest to expire first.
      responses:
        "200":
          description: The proposals waiting on the caller.
          content:
            application/json:
              schema: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/PendingVote"}}
              example: [{proposal_id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, kind: buy, symbol: AAPLx, expires_at: "2026-10-04T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    ProposalKind:
      type: string
      description: Whether the proposal spends USDC on the token or sells the token for USDC.
      enum: [buy, sell]
      examples: [buy]
    ProposeTradeRequest:
      type: object
      description: A trade to propose. A buy sets `usdc_micros` only, and a sell sets `token_amount` only.
      additionalProperties: false
      required: [kind, symbol]
      properties:
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, minLength: 1, maxLength: 32, description: The token symbol from the catalog., examples: [TSLAx]}
        usdc_micros:
          type: integer
          format: int64
          minimum: 1
          description: USDC a buy spends, in micros.
          examples: [5000000]
        token_amount:
          type: integer
          format: int64
          minimum: 1
          description: Token base units a sell spends.
          examples: [1000000]
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [earnings]}
    TradePreview:
      type: object
      description: What proposing the trade would quote, and the first check it fails.
      additionalProperties: false
      required: [quote_out_amount, advisory_code, advisory_message, pot_value_micros]
      properties:
        quote_out_amount:
          type: [integer, "null"]
          format: int64
          description: The quoted output, in the output asset's base units. Null when Jupiter has no route or the asset is unknown.
          examples: [21000000]
        advisory_code:
          type: [string, "null"]
          description: >-
            The error code a proposal of this trade would fail with now: asset_not_found,
            asset_untradable, no_route, pot_exceeded or insufficient_funds. Null when every check passes.
          examples: [null]
        advisory_message:
          type: [string, "null"]
          description: The user-facing message for `advisory_code`. Null when `advisory_code` is null.
          examples: [null]
        pot_value_micros:
          type: integer
          format: int64
          description: The cabal's total value, USDC plus priced holdings, in micros.
          examples: [100000000]
    Proposal:
      type: object
      description: One proposal as the caller sees it, with its tally and the caller's ballot.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          anyOf: [{$ref: "#/components/schemas/BallotChoice"}, {type: "null"}]
    ProposalList:
      type: object
      description: One page of a cabal's proposals.
      additionalProperties: false
      required: [proposals, next_cursor]
      properties:
        proposals:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalVoter:
      type: object
      description: One member of the proposal's frozen voter set.
      additionalProperties: false
      required: [user_id, choice, cast_at]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        choice:
          description: The voter's ballot. Null until they vote.
          examples: ["yes"]
          anyOf: [{$ref: "#/components/schemas/BallotChoice"}, {type: "null"}]
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote.
          examples: ["2026-10-03T16:00:00Z"]
    LinkedSwap:
      type: object
      description: The latest trade that executes the proposal.
      additionalProperties: false
      required: [swap_id, status, failure_code, failure_message, tx_signature, retryable]
      properties:
        swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
        status:
          type: string
          description: Where the trade is.
          enum: [created, submitted, confirmed, failed]
          examples: [confirmed]
        failure_code:
          type: [string, "null"]
          description: Why the trade failed. Null unless `status` is `failed`.
          examples: [null]
        failure_message:
          type: [string, "null"]
          description: The user-facing message for a failed trade. Null unless `status` is `failed`.
          examples: [null]
        tx_signature:
          type: [string, "null"]
          description: The Solana transaction signature. Null before the trade is submitted.
          examples: [null]
        retryable: {type: boolean, description: Whether a failed trade can be retried., examples: [false]}
    ProposalDetail:
      type: object
      description: One proposal with its voters, the caller's permissions and its linked trade.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer_id
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
        - voters
        - can_vote
        - can_withdraw
        - swap
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          anyOf: [{$ref: "#/components/schemas/BallotChoice"}, {type: "null"}]
        voters:
          type: array
          description: Every member of the frozen voter set, ordered by user id.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ProposalVoter"
        can_vote: {type: boolean, description: "The caller is in the voter set and the proposal is open.", examples: [true]}
        can_withdraw:
          type: boolean
          description: The caller proposed it, it is open, and no other voter has a ballot.
          examples: [false]
        swap:
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          anyOf: [{$ref: "#/components/schemas/LinkedSwap"}, {type: "null"}]
    PendingVote:
      type: object
      description: An open proposal that still needs the caller's ballot.
      additionalProperties: false
      required: [proposal_id, cabal_id, kind, symbol, expires_at]
      properties:
        proposal_id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
