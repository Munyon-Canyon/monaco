      type: string
      description: A voter's choice on a proposal.
      enum: ["yes", "no"]
      examples: ["yes"]
    CastVoteRequest:
      type: object
      description: The ballot to cast.
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/BallotChoice"
    ProposalStatus:
      type: string
      description: Where a proposal is in its lifecycle.
      enum: [open, passed, failed, expired, withdrawn, voided, executed, execution_blocked]
      examples: [open]
    Tally:
      type: object
      description: The ballots counted against the proposal's frozen voter set.
      additionalProperties: false
      required: [yes, no, voters, needed]
      properties:
        "yes":
          type: integer
          minimum: 0
          description: Ballots for the proposal.
          examples: [2]
        "no":
          type: integer
          minimum: 0
          description: Ballots against the proposal.
          examples: [1]
        voters:
          type: integer
          minimum: 1
          description: Members in the voter set frozen when the proposal opened.
          examples: [3]
        needed:
          type: integer
          minimum: 1
          description: Yes ballots the cabal's threshold rule needs to pass the proposal.
          examples: [2]
    ProposalStats:
      type: object
      description: >-
        Facts about a proposal. `treasury_share_bps`, `closes_at` and `closed_at` are recorded when the proposal opens
        or closes. `price_micros` and `since_bps` are live, read at request time from the price book, and
        `shares_atomics` is an estimate until the trade fills.
      additionalProperties: false
      required: [treasury_share_bps, closes_at, closed_at]
      properties:
        treasury_share_bps:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            The trade's share of the cabal's pot when the proposal opened, in basis points, rounded down: `usdc_micros`
            for a buy, `quote_out_amount` for a sell. Null when the pot was not recorded (a proposal opened before the
            figure was stored) or was zero.
          examples: [200]
        closes_at:
          type: string
          format: date-time
          description: When voting closes. The same instant as `expires_at`.
          examples: ["2026-10-04T15:00:00Z"]
        closed_at:
          type: [string, "null"]
          format: date-time
          description: When the proposal left `open`. Null while open, and for proposals closed before close times were recorded.
          examples: [null]
        price_micros:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >-
            The asset's live price in USDC micros per whole token, from the price book at request time. On a proposal
            that was just opened it is the quote's price. Null when the asset has no accepted price, never zero.
          examples: [220000000]
        shares_atomics:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >-
            The trade's shares in base units of `token_decimals`. A sell is its `token_amount`, exact. A buy is the
            filled amount once the swap confirms, exact, and before that `usdc_micros` ÷ `price_micros` rounded down, an
            estimate. Null for an unfilled buy with no `price_micros`.
          examples: [182000000]
        shares_exact:
          type: boolean
          description: True when `shares_atomics` is the trade's own amount, false when it is the estimate.
          examples: [false]
        token_decimals:
          type: integer
          minimum: 0
          maximum: 255
          description: Decimals of `shares_atomics`.
          examples: [8]
        since_bps:
          type: [integer, "null"]
          format: int64
          description: >-
            The change from the fill price (`swap.price_micros`) to `price_micros`, in basis points of the fill price,
            rounded toward zero. Negative when the price fell. Null until the swap confirms, and when either price is
            missing.
          examples: [30]
