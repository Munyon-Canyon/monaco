paths:
  /v1/cabals/{id}/proposals:
    get:
      operationId: getCabalProposals
      tags: [governance]
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first. Every cabal is public, so any
        signed-in user can read them. A non-member sees the same items with `my_ballot` null.
        `open` keeps proposals still taking ballots, `passed` and `executed` keep those statuses,
        `failed` keeps `failed`, `expired` and `execution_blocked`, and `closed` keeps every status but `open`.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, passed, executed, failed, closed, all]
            default: all
            examples: [open]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postCabalProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a trade for the cabal to vote on.
      description: >-
        Checks that the caller is a member and is in the cabal's voter set (a non-voter gets
        `not_a_voter`), that the asset is in the catalog and Jupiter can route
        it, and that a buy fits the pot or a sell fits the cabal's holding. These checks are advisory:
        the trade engine repeats them at execution. The voter set is copied from the cabal and never
        changes after. The proposer casts no ballot of their own. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The trade to propose. A buy sets `usdc_micros`, and a sell sets `token_amount`.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeTradeRequest"
            example: {kind: buy, symbol: TSLAx, usdc_micros: 5000000, thesis: earnings}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/rule-proposals:
    post:
      operationId: postCabalRuleProposal
      tags: [governance]
      x-idempotent: true
      summary: Propose a change to a cabal rule for the cabal to vote on.
      description: >-
        Checks that the caller is a member and is in the cabal's voter set (a non-voter gets
        `not_a_voter`). `from` is read from the cabal now and the voter set and threshold are copied from it,
        so a rule proposal is voted on and settled like a trade. A value the rule already has gets
        `rule_unchanged`. Removing the last admin, making a non-voter an admin and targeting the proposer
        get `invalid_input`. A second open proposal for the same rule, or for the same member's `voter` or
        `admin` rule, gets `rule_change_open`. A replay with the same Idempotency-Key returns the first
        response.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The rule change to propose.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleChangeRequest"
            example: {change: {rule: show_sides, to: true}, thesis: Let everyone see who voted what.}
      responses:
        "201":
          description: The new proposal, as its detail shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/preview:
    get:
      operationId: getCabalProposalPreview
      tags: [governance]
      summary: Preview a trade before proposing it.
      description: >-
        Runs the checks a proposal runs and writes nothing. A trade the checks refuse still answers
        200, with the refusal in `advisory_code` and `advisory_message`, so the review screen can show
        it. Only members can preview.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: true
          description: Whether the trade buys or sells the token.
          schema:
            $ref: "#/components/schemas/ProposalKind"
        - name: symbol
          in: query
          required: true
          description: The token symbol from the catalog.
          schema: {type: string, minLength: 1, maxLength: 32, examples: [TSLAx]}
        - name: usdc_micros
          in: query
          required: false
          description: >-
            USDC a buy spends, in micros. A buy that leaves it out returns only the pot and the spendable
            cash.
          schema: {type: integer, format: int64, minimum: 1, examples: [5000000]}
        - name: token_amount
          in: query
          required: false
          description: >-
            Token base units a sell spends. For a sell pinned to an EVM chain these are that listing's
            token base units, as `token_amount` on the holding's listing reports them.
          schema: {type: integer, format: int64, minimum: 1, examples: [1000000]}
        - name: network
          in: query
          required: false
          description: >-
            The chain a trade is pinned to. A buy's quote is that chain's best listing, and a chain with no
            listing quoted sets `advisory_code` to invalid_network. A sell's quote is the sale of the
            cabal's holding on that chain, and a chain the cabal holds none on sets `advisory_code` to
            invalid_network. Absent means the best price on any chain for a buy, and the holding for a sell.
          schema:
            $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: The quote and the first check the trade fails, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradePreview"
              example: {quote_out_amount: 21000000, advisory_code: null, advisory_message: null, pot_value_micros: 100000000}
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/proposals/{proposal_id}/price-comparison:
    get:
      operationId: getCabalProposalPriceComparison
      tags: [governance]
      x-allow-restricted: true
      summary: Compare venues for an open buy proposal now.
      description: >-
        Quotes the proposal's buy again across every venue and returns the result as of now, so a member
        voting later sees the current best route. One result per proposal is reused for 15 seconds. The
        comparison stored with the proposal does not change. When the venues cannot be compared,
        `price_comparison` is absent and `quote_out_amount` is the Solana quote. Only members can read it,
        and only for an open buy; a sell or a closed proposal answers not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The cabal id.
          schema:
            type: string
            format: uuid
        - name: proposal_id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The comparison as of `quoted_at`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPriceComparison"
              example: {quote_out_amount: 40000000, quoted_at: "2026-10-10T12:00:00Z", price_comparison: {winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}:
    get:
      operationId: getProposal
      tags: [governance]
      summary: Read one proposal.
      description: >-
        Returns the proposal as the list shows it, plus every member of its frozen voter set with
        their name, photo and whether they voted, whether the caller can vote on it or withdraw it,
        and the latest trade linked to it. Vote counts are always live, but which way each member
        voted is private: every voter's `choice` and `cast_at` are null except the caller's own,
        until the proposal closes in a cabal whose "Show who voted what" rule was on when it opened
        (`sides_visible`). A non-member sees the same proposal with `can_vote` and `can_withdraw` false.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, proposer: {id: 01890a5d-ac96-774b-bcce-b302099a8059, display_name: Mia, photo_url: null}, proposer_return_1m_bps: 820, proposer_return_private: false, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: open, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, choice: "yes", cast_at: "2026-10-03T16:00:00Z", display_name: Mia, photo_url: null}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: false, choice: null, cast_at: null, display_name: Kai, photo_url: null}], sides_visible: false, can_vote: true, can_withdraw: true, swap: null, stats: {treasury_share_bps: 250, closes_at: "2026-10-04T15:00:00Z", closed_at: null, price_micros: 220000000, shares_atomics: 11363636, shares_exact: false, token_decimals: 8, since_bps: null}, passed_price_micros: null, my_vote: {order: 1, of: 2, yes_order: 1, no_order: 0, decided: false}, reply_count: 6, reminder_set: false}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposal
      tags: [governance]
      x-idempotent: true
      summary: Withdraw the caller's proposal.
      description: >-
        Moves the caller's open proposal to `withdrawn` and appends `proposal.withdrawn`. Only the
        proposer can withdraw, and only before any other member has voted; the proposer's own ballot
        does not count. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The withdrawn proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, proposer: {id: 01890a5d-ac96-774b-bcce-b302099a8059, display_name: Mia, photo_url: null}, proposer_return_1m_bps: 820, proposer_return_private: false, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: withdrawn, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 1, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", voters: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, choice: "yes", cast_at: "2026-10-03T16:00:00Z", display_name: Mia, photo_url: null}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: false, choice: null, cast_at: null, display_name: Kai, photo_url: null}], sides_visible: false, can_vote: false, can_withdraw: false, swap: null, stats: {treasury_share_bps: 250, closes_at: "2026-10-04T15:00:00Z", closed_at: "2026-10-03T16:30:00Z", price_micros: 220000000, shares_atomics: 11363636, shares_exact: false, token_decimals: 8, since_bps: null}, passed_price_micros: null, my_vote: {order: 1, of: 2, yes_order: 1, no_order: 0, decided: false}, reply_count: 0, reminder_set: false}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/market-facts:
    get:
      operationId: getMyMarketFacts
      tags: [governance]
      summary: Say what Monaco knows about each of the caller's watched stocks.
      description: >-
        Returns one entry per requested symbol, in request order. The fact is the first that matches: `vote_open`
        when an open proposal for the symbol sits in one of the caller's current cabals and the caller is in its
        frozen voter set, then `held` when the caller's cabals hold the stock, then `called` when a proposal for
        it passed (or was then executed) in the last 7 days in one of the caller's current cabals. A stock with
        none of these, or an unknown symbol, has a null fact.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols, 1 to 50, each at most 64 characters. More than 50 is `invalid_input`.
          schema: {type: string, minLength: 1, examples: ["NVDAx,AAPLx,METAx,MSFTx"]}
      responses:
        "200":
          description: One fact per requested symbol.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MarketFacts"}
              example: {facts: [{symbol: NVDAx, fact: {kind: vote_open, cabal_name: AC Capital, count: 1}}, {symbol: AAPLx, fact: {kind: held, units: "24.0000", cabal_count: 1}}, {symbol: METAx, fact: {kind: called, proposer_name: Christelle}}, {symbol: MSFTx, fact: null}]}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/pending-votes:
    get:
      operationId: getMyPendingVotes
      tags: [governance]
      summary: List the open proposals waiting on the caller's ballot.
      description: >-
        Returns up to 50 open proposals, across every cabal, whose frozen voter set holds the caller
        and that have no ballot from the caller yet, soonest to expire first. Each row carries what its card
        draws: the amount, the asset's name and logo, the proposer, the tally, the ballots cast and the replies.
      responses:
        "200":
          description: The proposals waiting on the caller.
          content:
            application/json:
              schema: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/PendingVote"}}
              example: [{proposal_id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, kind: buy, rule_change: null, symbol: NVDAx, usdc_micros: 400000000, token_amount: null, asset_name: NVIDIA, asset_logo_url: null, proposer: {user_id: 01890a5d-ac96-774b-bcce-b302099a8059, handle: mia, display_name: Mia, photo_url: null}, tally: {"yes": 4, "no": 1, voters: 8, needed: 5}, voted_count: 5, reply_count: 6, created_at: "2026-10-04T09:00:00Z", expires_at: "2026-10-04T15:00:00Z"}]
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/proposals:
    get:
      operationId: getMyProposals
      tags: [governance]
      summary: List the caller's proposals across every cabal.
      description: >-
        Returns one page of the proposals whose frozen voter set holds the caller, across every cabal,
        newest first. `closed` keeps every status but `open` and is the default, `open` keeps proposals
        still taking ballots, and `all` keeps both.
      parameters:
        - name: filter
          in: query
          required: false
          description: Which proposals to return.
          schema:
            type: string
            enum: [open, closed, all]
            default: closed
            examples: [closed]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]
      responses:
        "200":
          description: One page of the caller's proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
              example: {proposals: [{id: 01890a5d-ac96-774b-bcce-b302099a8057, cabal_id: 01890a5d-ac96-774b-bcce-b302099a8058, cabal_name: Friday Night Lights, proposer_id: 01890a5d-ac96-774b-bcce-b302099a8059, kind: buy, rule_change: null, symbol: AAPLx, usdc_micros: 25000000, token_amount: null, quote_out_amount: 105000000, thesis: Earnings next week., status: executed, status_reason: null, status_message: null, expires_at: "2026-10-04T15:00:00Z", created_at: "2026-10-03T15:00:00Z", tally: {"yes": 2, "no": 0, voters: 2, needed: 2}, my_ballot: "yes", can_vote: false, reply_count: 0}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/votes:
    get:
      operationId: getProposalVotes
      tags: [governance]
      summary: Page through a proposal's voters and their ballots.
      description: >-
        Returns one page of the proposal's frozen voter set, ordered by user id, each with the user card and
        whether they voted. A voter's side is private: `choice` and `cast_at` are set only on the caller's own row. Page with the `next_cursor` of the
        previous page until it is null. A non-member reads the same page as a member.
        `GET /v1/proposals/{id}` keeps `voters` only for builds that predate this route.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          required: false
          description: The number of voters to return, from 1 through 200. Defaults to 50.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: One page of voters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalVotePage"
              example: {items: [{user_id: 01890a5d-ac96-774b-bcce-b302099a8059, voted: true, handle: mia, display_name: Mia, photo_url: null, choice: "yes", cast_at: "2026-10-03T16:00:00Z"}, {user_id: 01890a5d-ac96-774b-bcce-b302099a8061, voted: true, handle: kai, display_name: Kai, photo_url: null, choice: null, cast_at: null}], next_cursor: null}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Cast or change the caller's ballot on an open proposal.
      description: >-
        Stores the caller's ballot and tallies it against the proposal's frozen voter set and the
        cabal's threshold rule. A deciding ballot moves the proposal to `passed` or `failed` in the
        same transaction. Execution of a passed proposal is asynchronous, so the client sees
        `executed` or `execution_blocked` later. A replay with the same Idempotency-Key returns the
        first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The caller's choice.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVoteRequest"
      responses:
        "200":
          description: The ballot was stored. `status` is the proposal's status after the tally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposalVote
      tags: [governance]
      x-idempotent: true
      summary: Undo the caller's ballot on an open proposal.
      description: >-
        Removes the caller's own ballot and returns the tally without it. A ballot can be undone for 15
        seconds after it was first cast (`undo_until` on the vote result), and only while it has never changed
        side. The ballot that settled the proposal cannot be undone: the proposal has left `open`, so the call
        answers proposal_closed. A caller outside the proposal's frozen voter set answers not_a_voter, a caller
        with no ballot answers vote_not_found, and a ballot past the window or changed since the first cast
        answers undo_expired. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The ballot was removed. `tally` no longer counts it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetractVoteResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/reminder:
    put:
      operationId: putProposalReminder
      tags: [governance]
      x-idempotent: true
      summary: Ask to be reminded shortly before an open proposal closes.
      description: >-
        Stores the caller's request for a one-shot nudge and returns when it falls due: one hour before
        `expires_at`, or now when less than an hour is left. A second call moves nothing but resets a sent
        reminder. A caller who has already voted gets `reminder_set: false` and no row stored. A proposal that is
        no longer open answers proposal_closed, and a caller outside the proposal's frozen voter set answers
        not_a_voter. Voting deletes the reminder. A replay with the same Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The reminder is stored, or the caller had already voted and nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalReminder"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProposalReminder
      tags: [governance]
      x-idempotent: true
      summary: Drop the caller's reminder for a proposal.
      description: >-
        Deletes the caller's own reminder. It is a self-cleanup that never refuses for the proposal's state or the
        caller's membership: a closed proposal, a non-voter and a missing reminder all answer 200 with
        `reminder_set: false`. Only an unknown proposal answers proposal_not_found. A replay with the same
        Idempotency-Key returns the first response.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The caller has no reminder for the proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalReminder"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/proposals/{id}/void:
    post:
      operationId: voidAdminProposal
      tags: [governance]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Void a proposal.
      description: >-
        Moves an `open` proposal, or a `passed` one with no live transaction, to `voided` and appends
        `proposal.voided` and `admin.action` in one transaction. A proposal whose swap is `submitted`
        answers live_swap_exists, a proposal already closed answers proposal_closed, an unknown one answers
        proposal_not_found, and a reason shorter than 3 characters answers reason_required. A replay with the
        same Idempotency-Key returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The id of the proposal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
      requestBody:
        description: Why the moderator voids the proposal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: spam proposal}
      responses:
        "200":
          description: The voided proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoidedProposal"}
              example: {id: 01890a5d-ac96-774b-bcce-b302099a8057, status: voided, void_reason: spam proposal}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/proposals/{id}:
    get:
      operationId: getAdminProposal
      tags: [governance]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Look up one proposal.
      description: >-
        Returns the proposal with every member of its frozen voter set, their ballots and cast times, the
        statuses it went through from its `proposal.*` events, its latest linked trade, and the 20 newest
        admin actions on it. The proposer shows as an id and a handle only. An unknown proposal answers
        proposal_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the proposal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]}
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminProposal"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/cabals/{id}/proposals:
    get:
      operationId: getAdminCabalProposals
      tags: [governance]
      x-admin-role: viewer
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List a cabal's proposals.
      description: >-
        Returns one page of the cabal's proposals, newest first, with the same items and filters as the
        member list. `status` keeps proposals still taking ballots (`open`), those with a given status
        (`passed`, `executed`, `failed`), or every status but `open` (`closed`). No ballot or permission
        belongs to the caller, so `my_ballot` is null and `can_vote` is false. An unknown cabal answers
        cabal_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: status
          in: query
          required: false
          description: Which proposals to return.
          schema: {type: string, enum: [open, passed, executed, failed, closed, all], default: all, examples: [open]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20, examples: [20]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 512, examples: ["MTc3MjM2NjQwMDAwMDAwMAAwMTg5MGE1ZC1hYzk2LTc3NGItYmNjZS1iMzAyMDk5YTgwNTc"]}
      responses:
        "200":
          description: One page of the cabal's proposals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProposalList"}
        default: {$ref: "#/components/responses/Problem"}
components:
  schemas:
    AdminProposer:
      type: object
      description: The member who proposed it. Nothing else about them is shown.
      additionalProperties: false
      required: [id, handle]
      properties:
        id: {type: string, format: uuid, description: The member., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        handle: {type: string, description: Their handle., examples: [alice]}
    AdminStatusChange:
      type: object
      description: One status the proposal entered, read from its `proposal.*` events.
      additionalProperties: false
      required: [status, at, actor_type]
      properties:
        status: {$ref: "#/components/schemas/ProposalStatus"}
        at: {type: string, format: date-time, description: When the event was recorded., examples: ["2026-10-03T15:00:00Z"]}
        actor_type:
          type: string
          description: Who caused it, as the event records it.
          enum: [user, agent, admin, system, service]
          examples: [user]
    AdminProposalAction:
      type: object
      description: One admin action taken on the proposal.
      additionalProperties: false
      required: [id, admin_id, action, reason, created_at]
      properties:
        id: {type: string, format: uuid, description: The action id., examples: [01890a5d-ac96-774b-bcce-b302099a805a]}
        admin_id: {type: string, format: uuid, description: The administrator who took it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        action: {type: string, description: The kind of action., examples: [proposal_void]}
        reason: {type: string, description: The reason the administrator gave., examples: [spam proposal]}
        created_at: {type: string, format: date-time, description: When it was audited., examples: ["2026-10-03T16:00:00Z"]}
    AdminProposal:
      type: object
      description: One proposal as the admin panel shows it.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - proposer
        - kind
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - expires_at
        - created_at
        - tally
        - voters
        - swap
        - status_history
        - recent_admin_actions
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        proposer: {$ref: "#/components/schemas/AdminProposer"}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, description: The token symbol., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy.
          examples: [null]
        quote_out_amount:
          type: integer
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        voters:
          type: array
          description: Every member of the frozen voter set, ordered by user id.
          examples: [[]]
          items: {$ref: "#/components/schemas/ProposalVoter"}
        swap:
          type: [object, "null"]
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          x-go-type-name: AdminProposalSwap
          additionalProperties: false
          required: [swap_id, status, failure_code, tx_signature]
          properties:
            swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
            status:
              type: string
              description: Where the trade is.
              enum: [created, submitted, confirmed, failed]
              examples: [confirmed]
            failure_code:
              type: [string, "null"]
              description: Why the trade failed. Null unless `status` is `failed`.
              examples: [null]
            tx_signature:
              type: [string, "null"]
              description: The Solana transaction signature. Null before the trade is submitted.
              examples: [null]
        status_history:
          type: array
          description: The statuses the proposal entered, oldest first. The list holds at most 50 events, the oldest 50, so a proposal with more would lose its newest statuses.
          examples: [[]]
          items: {$ref: "#/components/schemas/AdminStatusChange"}
        recent_admin_actions:
          type: array
          maxItems: 20
          description: The 20 newest admin actions on the proposal, newest first.
          examples: [[]]
          items: {$ref: "#/components/schemas/AdminProposalAction"}
    VoidedProposal:
      type: object
      description: A proposal after a moderator voided it.
      additionalProperties: false
      required: [id, status, void_reason]
      properties:
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        status: {type: string, description: Always `voided`., enum: [voided], examples: [voided]}
        void_reason: {type: string, description: The reason the moderator gave., examples: [spam proposal]}
    ProposalKind:
      type: string
      description: Whether the proposal spends USDC on the token, sells the token for USDC, or changes one of the cabal's rules.
      enum: [buy, sell, rule]
      examples: [buy]
    ProposalVoteItem:
      type: object
      description: One member of the proposal's frozen voter set with their card and ballot.
      additionalProperties: false
      required: [user_id, voted, handle, display_name, photo_url, choice, cast_at]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        voted: {type: boolean, description: "Whether the voter has cast a ballot. Always set, even while their side is private.", examples: [true]}
        handle: {type: [string, "null"], description: The voter handle. Null until onboarding sets one., examples: [mia]}
        display_name: {type: string, description: The voter name. Empty when the user has none., examples: [Mia]}
        photo_url: {type: [string, "null"], description: The voter photo. Null when the user has none., examples: [null]}
        choice:
          description: The voter's ballot. Null until they vote, and null for every voter but the caller, because the side of a ballot is private.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote, and null for every voter but the caller.
          examples: ["2026-10-03T16:00:00Z"]
    ProposalVotePage:
      type: object
      description: One page of a proposal's voters.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ProposalVoteItem"}
          examples: [[]]
        next_cursor: {type: [string, "null"], description: Null on the last page., examples: [null]}
    ProposeTradeRequest:
      type: object
      description: A trade to propose. A buy sets `usdc_micros` only, and a sell sets `token_amount` only.
      additionalProperties: false
      required: [kind, symbol]
      properties:
        kind: {$ref: "#/components/schemas/ProposalKind"}
        symbol: {type: string, minLength: 1, maxLength: 32, description: The token symbol from the catalog., examples: [TSLAx]}
        usdc_micros:
          type: integer
          format: int64
          minimum: 1
          description: USDC a buy spends, in micros.
          examples: [5000000]
        token_amount:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Token base units a sell spends. For a sell on an EVM chain these are that listing's token base
            units.
          examples: [1000000]
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [earnings]}
        network:
          description: >-
            The chain the trade executes on. A buy must have a listing in the comparison quoted now. A sell
            sells the cabal's holding on that chain and is refused when the cabal holds none there or the
            sale has no route. Absent means the best price on any chain for a buy; a sell with no network
            sells the Solana holding, or the only EVM holding when there is no Solana one.
          $ref: "#/components/schemas/Network"
          examples: [base]
    RuleChangeRequest:
      type: object
      description: A change to one cabal rule to propose.
      additionalProperties: false
      required: [change]
      examples: [{change: {rule: show_sides, to: true}, thesis: Let everyone see who voted what.}]
      properties:
        change:
          type: object
          description: >-
            The rule and the value it should take. `to` is a boolean for `show_sides`, `voter` and `admin`,
            an integer or null for `max_trade_bps`, an integer for `proposal_expiry_seconds` and a string for
            `threshold` and `join_mode`. `user_id` names the member a `voter` or `admin` change targets.
          examples: [{rule: show_sides, to: true}]
          x-go-type-name: RuleChangeRequestChange
          additionalProperties: false
          required: [rule, to]
          properties:
            rule:
              type: string
              description: Which rule to change.
              enum: [show_sides, max_trade_bps, threshold, proposal_expiry_seconds, join_mode, voter, admin]
              examples: [show_sides]
            to: {description: The value the rule should take., examples: [true]}
            user_id: {type: string, format: uuid, description: The member a `voter` or `admin` change targets., examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        thesis: {type: string, maxLength: 280, description: "The proposer's reason, up to 280 characters.", examples: [Let everyone see who voted what.]}
    ProposalPriceComparison:
      type: object
      description: An open buy proposal's trade quoted again now.
      additionalProperties: false
      required: [quote_out_amount, quoted_at]
      properties:
        price_comparison:
          description: Every venue quoted now, best first. Absent when the venues could not be compared.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        quote_out_amount:
          type: integer
          format: int64
          description: >-
            The quoted output, in the output asset's base units, from the winning venue or, without a
            comparison, from Jupiter. 0 when the proposal is pinned to a chain with no live quote, and
            `price_comparison` then lists that chain as unavailable.
          examples: [40000000]
        quoted_at:
          type: string
          format: date-time
          description: When the quotes were taken.
          examples: ["2026-10-10T12:00:00Z"]
    TradePreview:
      type: object
      description: What proposing the trade would quote, and the first check it fails.
      additionalProperties: false
      required: [quote_out_amount, advisory_code, advisory_message, pot_value_micros]
      properties:
        price_comparison:
          description: >-
            Every venue checked for the trade, best first. Absent until the multichain routing work lands.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        quote_out_amount:
          type: [integer, "null"]
          format: int64
          description: The quoted output, in the output asset's base units. Null when Jupiter has no route or the asset is unknown.
          examples: [21000000]
        advisory_code:
          type: [string, "null"]
          description: >-
            The error code a proposal of this trade would fail with now: asset_not_found,
            asset_untradable, asset_paused, no_route, pot_exceeded, insufficient_funds or invalid_network.
            Null when every check passes.
          examples: [null]
        advisory_message:
          type: [string, "null"]
          description: The user-facing message for `advisory_code`. Null when `advisory_code` is null.
          examples: [null]
        pot_value_micros:
          type: integer
          format: int64
          description: The cabal's total value, USDC plus priced holdings, in micros.
          examples: [100000000]
        spendable_cash_micros:
          type: integer
          format: int64
          description: >-
            The USDC on the cabal's Solana treasury wallet, the cash a buy draws on, in micros. Absent
            for a sell.
          examples: [990000]
        max_buy_micros:
          type: integer
          format: int64
          description: >-
            The largest buy this token's transfer fee leaves the cash able to cover, in micros. Absent
            for a sell.
          examples: [985000]
    Proposal:
      type: object
      description: One proposal as the caller sees it, with its tally and the caller's ballot.
      additionalProperties: false
      required:
        - id
        - cabal_id
        - cabal_name
        - proposer_id
        - kind
        - rule_change
        - symbol
        - usdc_micros
        - token_amount
        - quote_out_amount
        - thesis
        - status
        - status_reason
        - status_message
        - expires_at
        - created_at
        - tally
        - my_ballot
        - can_vote
        - reply_count
      properties:
        price_comparison:
          description: >-
            Every venue checked for the trade, best first. Absent until the multichain routing work lands.
          $ref: "#/components/schemas/PriceComparison"
          examples: [{winner_listing_id: 01928a6e-0000-7000-8000-000000000001, quotes: [{listing_id: 01928a6e-0000-7000-8000-000000000001, issuer: xstocks, network: solana, venue: jupiter, net_share_nanos: "40000000", net_micros: "10000000", costs: [], quoted_at: "2026-10-10T12:00:00Z", expires_at: "2026-10-10T12:00:30Z"}], unavailable: []}]
        id: {type: string, format: uuid, description: The proposal id., examples: [01890a5d-ac96-774b-bcce-b302099a8057]}
        cabal_id: {type: string, format: uuid, description: The cabal id., examples: [01890a5d-ac96-774b-bcce-b302099a8058]}
        cabal_name: {type: string, description: "The cabal's current name.", examples: [Friday Night Lights]}
        proposer_id: {type: string, format: uuid, description: The member who proposed it., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        kind: {$ref: "#/components/schemas/ProposalKind"}
        rule_change:
          type: [object, "null"]
          description: >-
            The change a rule proposal asks for. Null for a buy or a sell. `from` is the value when the proposal
            opened and `to` the value it asks for. Both are a boolean for `show_sides`, `voter` and `admin`, an
            integer or null for `max_trade_bps`, an integer for `proposal_expiry_seconds` and a string for
            `threshold` and `join_mode`.
          examples: [{rule: show_sides, from: false, to: true, user: null}]
          x-go-type-name: ProposalRuleChange
          additionalProperties: false
          required: [rule, from, to, user]
          properties:
            rule:
              type: string
              description: Which rule the proposal changes.
              enum: [show_sides, max_trade_bps, threshold, proposal_expiry_seconds, join_mode, voter, admin]
              examples: [show_sides]
            from: {description: The rule's value when the proposal opened., examples: [false]}
            to: {description: The value the proposal asks for., examples: [true]}
            user:
              type: [object, "null"]
              description: The member a `voter` or `admin` change targets. Null for a cabal-wide rule.
              examples: [null]
              x-go-type-name: ProposalRuleChangeUser
              additionalProperties: false
              required: [user_id, handle, display_name, photo_url]
              properties:
                user_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
                handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
                display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
                photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
        symbol: {type: [string, "null"], description: The token symbol. Null for a rule proposal., examples: [AAPLx]}
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: USDC a buy spends, in micros. Null for a sell and for a rule proposal.
          examples: [25000000]
        token_amount:
          type: [integer, "null"]
          format: int64
          description: Token base units a sell spends. Null for a buy and for a rule proposal.
          examples: [null]
        quote_out_amount:
          type: [integer, "null"]
          format: int64
          description: The quoted output, in the output asset's base units, when the proposal opened. Null for a rule proposal.
          examples: [105000000]
        thesis: {type: [string, "null"], description: "The proposer's reason, up to 280 characters.", examples: [Earnings next week.]}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        status_reason:
          type: [string, "null"]
          description: The error code that blocked execution. Null unless `status` is `execution_blocked`.
          examples: [null]
        status_message:
          type: [string, "null"]
          description: The user-facing message for `status_reason`. Null when `status_reason` is null.
          examples: [null]
        expires_at: {type: string, format: date-time, description: When voting closes., examples: ["2026-10-04T15:00:00Z"]}
        created_at: {type: string, format: date-time, description: When the proposal opened., examples: ["2026-10-03T15:00:00Z"]}
        tally: {$ref: "#/components/schemas/Tally"}
        my_ballot:
          description: The caller's ballot. Null when the caller has not voted or is not a voter.
          examples: [null]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        can_vote:
          type: boolean
          description: Whether the caller can vote on it now, which means it is open and they are one of its voters.
          examples: [true]
        reply_count: {type: integer, minimum: 0, description: How many replies the proposal's thread has., examples: [6]}
        network:
          description: The chain the trade is pinned to. Absent when a buy takes the best price on any chain or a sell uses the Solana holding.
          $ref: "#/components/schemas/Network"
          examples: [base]
    ProposalList:
      type: object
      description: One page of proposals.
      additionalProperties: false
      required: [proposals, next_cursor]
      properties:
        proposals:
          type: array
          description: The page, newest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalVoter:
      type: object
      description: One member of the proposal's frozen voter set.
      additionalProperties: false
      required: [user_id, voted, choice, cast_at, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, description: The voter., examples: [01890a5d-ac96-774b-bcce-b302099a8059]}
        voted: {type: boolean, description: "Whether the voter has cast a ballot. Always set, even while their side is private.", examples: [true]}
        choice:
          description: The voter's ballot. Null until they vote, and null for every voter but the caller while the cabal keeps sides private.
          examples: ["yes"]
          type: [string, "null"]
          enum: ["yes", "no", null]
          x-go-type: BallotChoice
        cast_at:
          type: [string, "null"]
          format: date-time
          description: When the ballot was last cast. Null until they vote, and null for every voter but the caller while the cabal keeps sides private.
          examples: ["2026-10-03T16:00:00Z"]
        display_name: {type: string, description: "The voter's name. Empty when the account is gone.", examples: [Mia]}
