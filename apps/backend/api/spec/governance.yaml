        swap:
          type: [object, "null"]
          description: The latest trade linked to the proposal. Null when none exists.
          examples: [null]
          x-go-type-name: LinkedSwap
          additionalProperties: false
          required: [swap_id, status, failure_code, failure_message, tx_signature, retryable, usdc_micros, token_amount, token_decimals, price_micros]
          properties:
            swap_id: {type: string, format: uuid, description: The swap id., examples: [01890a5d-ac96-774b-bcce-b302099a8060]}
            status:
              type: string
              description: Where the trade is.
              enum: [created, submitted, confirmed, failed]
              examples: [confirmed]
            failure_code:
              type: [string, "null"]
              description: Why the trade failed. Null unless `status` is `failed`.
              examples: [null]
            failure_message:
              type: [string, "null"]
              description: The user-facing message for a failed trade. Null unless `status` is `failed`.
              examples: [null]
            tx_signature:
              type: [string, "null"]
              description: The Solana transaction signature. Null before the trade is submitted.
              examples: [null]
            retryable: {type: boolean, description: Whether a failed trade can be retried., examples: [false]}
            usdc_micros:
              type: [integer, "null"]
              format: int64
              description: USDC spent or received, in micros. Null until a sell confirms.
              examples: [25000000]
            token_amount:
              type: [integer, "null"]
              format: int64
              description: Token base units bought or sold. Null until a buy confirms.
              examples: [12500000]
            token_decimals: {type: integer, minimum: 0, maximum: 255, description: Decimals of `token_amount`., examples: [8]}
            price_micros:
              type: [integer, "null"]
              format: int64
              description: >-
                USDC micros per whole token, the floor of `usdc_micros` ÷ the whole units in `token_amount`.
