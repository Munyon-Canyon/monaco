      properties:
        id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        display_name: {type: string, description: Empty when the user has none or deleted the account., examples: [Mia]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    PendingVoteProposer:
      type: object
      description: The member who proposed it.
