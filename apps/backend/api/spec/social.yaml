paths:
  /v1/me/contacts/match:
    post:
      operationId: postMeContactsMatch
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1h, burst: 10}, ip: {rate: 30, per: 1h, burst: 30}}
      summary: Match address-book hashes to people on Monaco.
      description: >-
        The body is 1 to 2000 lowercase SHA-256 hex hashes of E.164 numbers. Duplicates collapse.
        An empty list or a hash that is not 64 lowercase hex characters is contact_hashes_invalid.
        More than 2000 hashes is too_many_contact_hashes. A match is stored only for a verified
        phone of an active user who is not the caller. Unmatched hashes are not stored or logged.
        Matching again does not clear a dismissed row. The response lists the caller's live matches,
        the same body as GET /v1/me/contacts/matches.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The address-book hashes to match.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMatchRequest"
            example:
              hashes: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
      responses:
        "200":
          description: The caller's live contact matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMatchPage"
              example:
                items:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: "https://img.example/maya.png", followed_by_me: false}
                next_cursor: null
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/contacts/matches:
    get:
      operationId: getMeContactsMatches
      tags: [social]
      summary: List people from the caller's contacts who are on Monaco.
      description: >-
        Live matches, newest first. Banned and deleted users are omitted. followed_by_me is true
        when the caller has a live follow. limit defaults to 30 and cannot exceed 50. A cursor the
        server did not write is invalid_input.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The next_cursor from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
      responses:
        "200":
          description: One page of contact matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMatchPage"
              example:
                items:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: "https://img.example/maya.png", followed_by_me: false}
                next_cursor: null
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes:
    get:
      operationId: getMeFeedMutes
      tags: [social]
      summary: List feed mutes.
      responses:
        "200":
          description: Feed mutes newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedMute"
              example:
                - {target_type: asset, target_id: AAPLx, label: AAPLx, created_at: "2026-10-04T12:00:00Z"}
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putMeFeedMutes
      tags: [social]
      x-idempotent: true
      summary: Mute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The feed target to mute.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedMuteRequest"
            example: {target_type: asset, target_id: AAPLx}
      responses:
        "204": {description: The target is muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/feed-mutes/{target_type}/{target_id}:
    delete:
      operationId: deleteMeFeedMutesTargetTypeTargetID
      tags: [social]
      x-idempotent: true
      summary: Unmute a feed target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: target_type
          in: path
          required: true
          description: What kind of target is muted.
          schema: {type: string, enum: [kind, cabal, asset, user, item], examples: [asset]}
        - name: target_id
          in: path
          required: true
          description: The muted target's id.
          schema: {type: string, maxLength: 64, examples: [AAPLx]}
      responses:
        "204": {description: The target is not muted.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed:
    get:
      operationId: getFeed
      tags: [social]
      summary: Read the feed.
      description: >-
        Returns feed items, newest first unless `sort` says otherwise, one page at a time. Every filter narrows the page, and
        an unknown kind, scope or sort, a limit outside 1 to 50 or a cursor the server did not
        write is invalid_input. The server renders every display string.
      parameters:
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created`, `member_joined`, `reply` and `threshold`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: actor_id
          in: query
          required: false
          description: Include only items whose actor is this user.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves). `network` is the caller's cabals plus the
            people the caller follows; `others` is every cabal the caller is not in.
          schema: {type: string, enum: [all, following, mine, network, others], default: all, examples: [network]}
        - name: status
          in: query
          required: false
          description: >-
            `open` keeps only items whose `status` is `open`, such as open proposals; use it with
            `kind=proposal`.
          schema: {type: string, enum: [open], examples: [open]}
        - name: sort
          in: query
          required: false
          description: >-
            `new` (the default): newest first. `top`: the items from the last 24 hours, most comments
            first, then newest first. A cursor is valid only for the sort that wrote it.
          schema: {type: string, enum: [new, top], default: new, examples: [top]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 30 and cannot exceed 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of feed items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}:
    get:
      operationId: getFeedItem
      tags: [social]
      summary: Read one feed item.
      description: >-
        Returns the item and whether it passes the filters sent with the request, which take the
        same names as the list. An unknown id is feed_item_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: kind
          in: query
          required: false
          description: >-
            A comma-separated list of kinds to include: `proposal`, `trade`, `price_move`,
            `cabal_created`, `member_joined`, `reply` and `threshold`. Absent includes every kind.
          schema: {type: string, maxLength: 128, examples: ["proposal,trade"]}
        - name: cabal_id
          in: query
          required: false
          description: Include only items about this cabal.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        - name: actor_id
          in: query
          required: false
          description: Include only items whose actor is this user.
          schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]}
        - name: symbol
          in: query
          required: false
          description: Include only items about this stock symbol, ignoring case.
          schema: {type: string, maxLength: 32, examples: [AAPLx]}
        - name: q
          in: query
          required: false
          description: >-
            Full-text search over each item's symbol, cabal name, title and body. It filters the
            items and leaves the order newest first.
          schema: {type: string, maxLength: 200, examples: [earnings]}
        - name: scope
          in: query
          required: false
          description: >-
            `all` (the default), `following` (the items whose actor the caller follows) or `mine` (the items
            of the cabals the caller is in, without price moves). `network` is the caller's cabals plus the
            people the caller follows; `others` is every cabal the caller is not in.
          schema: {type: string, enum: [all, following, mine, network, others], default: all, examples: [network]}
      responses:
        "200":
          description: The feed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItemDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}/comments:
    post:
      operationId: postFeedComment
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1m, burst: 5}, ip: {rate: 30, per: 1m, burst: 30}}
      summary: Comment on a feed item.
      description: >-
        Stores the comment, adds one to the item's `comment_count` and appends `comment.created`. The
        body is trimmed and must be 1 to 1000 Unicode scalars, otherwise invalid_input. An unknown
        item is feed_item_not_found. Only a member of the cabal can comment on a proposal, otherwise
        comment_members_only. A reply names its `parent_comment_id`, which must be a comment on the same
        item, otherwise comment_parent_mismatch. A reply to a reply is stored under the top-level comment
        and names the person it answers in `reply_to_handle`, so a thread stays one level deep. A replay
        returns the first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: The comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example: {body: nice}
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getFeedComments
      tags: [social]
      summary: Read the comments on a feed item.
      description: >-
        Returns the top-level comments oldest first, one page at a time, each with all its replies
        oldest first. A deleted comment keeps its place with a null `body` and the `body_display`
        `Comment deleted`, or `Removed by Monaco` once a moderator removes it. An unknown item is feed_item_not_found.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size, counted in top-level comments. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of comment threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/proposals/{id}/comments:
    post:
      operationId: postProposalComment
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 10, per: 1m, burst: 5}, ip: {rate: 30, per: 1m, burst: 30}}
      summary: Comment on a proposal.
      description: >-
        Finds the proposal's feed item and does what `POST /v1/feed/{id}/comments` does: same body,
        response and refusals. A proposal with no feed item yet is feed_item_pending, which is
        retryable: the item arrives shortly after `proposal.created`, and an unknown proposal id
        looks the same.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The proposal's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: The comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example: {body: agree}
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getProposalComments
      tags: [social]
      summary: Read the comments on a proposal.
      description: >-
        Finds the proposal's feed item and returns what `GET /v1/feed/{id}/comments` returns, plus the
        item's id as `feed_object_id`. A proposal with no feed item yet is feed_item_pending, which is
        retryable.
      parameters:
        - name: id
          in: path
          required: true
          description: The proposal's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: Page size, counted in top-level comments. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of comment threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalCommentPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/likes/{id}:
    put:
      operationId: putFeedLike
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Like a feed item.
      description: >-
        Adds the caller's like, which raises the item's `like_count` by one and sets its `liked_by_me`.
        Liking an item the caller already likes changes nothing and returns 204. An item the caller cannot
        see, or an unknown one, is feed_item_not_found. The path puts `likes` before the id so it cannot
        overlap `DELETE /v1/feed/comments/{comment_id}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The item is liked.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFeedLike
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Unlike a feed item.
      description: >-
        Removes the caller's like. Unliking an item the caller does not like changes nothing and returns
        204. An item the caller cannot see, or an unknown one, is feed_item_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The item is not liked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/{id}/reactions/{emoji}:
    put:
      operationId: putFeedReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: React to a feed item with an emoji.
      description: >-
        Adds the caller's reaction with one emoji and returns the item's reactions. Reacting with an emoji the caller
        already used changes nothing and returns the same reactions. A caller holds at most 10 distinct emoji on an
        item, and an 11th is invalid_input with `reason=reaction_limit`. An emoji that is not exactly one emoji is
        invalid_input with `field=emoji`. An item the caller cannot see, or an unknown one, is feed_item_not_found.
        An item the caller may not react to is reaction_not_allowed. The emoji sits in the path, after the id, so the
        route cannot overlap `PUT /v1/feed/likes/{id}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to add, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The item's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFeedReaction
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 30, per: 1m, burst: 10}, ip: {rate: 60, per: 1m, burst: 60}}
      summary: Remove your emoji reaction from a feed item.
      description: >-
        Removes the caller's reaction with that emoji, and only theirs, then returns the item's reactions. Removing a
        reaction the caller does not have changes nothing. An emoji that is not exactly one emoji is invalid_input with
        `field=emoji`. An item the caller cannot see, or an unknown one, is feed_item_not_found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The feed item's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: emoji
          in: path
          required: true
          description: The emoji to remove, percent-encoded.
          schema: {type: string, minLength: 1, maxLength: 32, examples: ["🎉"]}
      responses:
        "200":
          description: The item's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
              example: {reactions: [{emoji: "🎉", count: 5, mine: true}], total: 5}
        default:
          $ref: "#/components/responses/Problem"
  /v1/feed/comments/{comment_id}:
    delete:
      operationId: deleteFeedComment
      tags: [social]
      x-idempotent: true
      summary: Delete your comment.
      description: >-
        Author only, otherwise comment_not_author. An unknown comment is comment_not_found. The comment
        keeps its place in its thread with a null body, and the item's `comment_count` drops by one. A
        second delete returns 204 and changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: comment_id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "204":
          description: The comment is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/follow:
    post:
      operationId: postUserFollow
      tags: [social]
      x-idempotent: true
      summary: Follow a user.
      description: >-
        Follows the user as the caller and appends `follow.created`. Following someone the caller
        already follows changes nothing and returns the same response. Following yourself is
        cannot_follow_self, an unknown or deleted user is user_not_found and a banned user is
        user_banned. `source` records where the follow came from and defaults to `profile`. The
        values a client may send are `profile`, `phone`, `x`, `cabal`, `feed` and `suggested`;
        any other value, `referral` included, is invalid_input.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Where the follow came from.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: The caller follows the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserFollow
      tags: [social]
      x-idempotent: true
      summary: Unfollow a user.
      description: >-
        Ends the caller's follow of the user and appends `follow.removed`. Unfollowing a user the
        caller does not follow changes nothing and returns the same response. A banned or deleted
        user can be unfollowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The caller does not follow the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/followers:
    get:
      operationId: getUserFollowers
      tags: [social]
      summary: List a user's followers.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/following:
    get:
      operationId: getUserFollowing
      tags: [social]
      summary: List the users a user follows.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128, examples: ["MTc1OTQ3OTMzMDEyMzQ1Ni4wMTkyMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDc"]}
        - name: limit
          in: query
          required: false
          description: The page size, 30 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30, examples: [30]}
      responses:
        "200":
          description: One page of followed users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages:
    post:
      operationId: postChatMessage
      tags: [social]
      x-idempotent: true
      summary: Post a message to a cabal's chat.
      description: >-
        Stores the message and appends `chat.message_posted`. Only a member can post, otherwise
        not_cabal_member. The body is trimmed and must be 1 to 2000 Unicode scalars, otherwise
        chat_body_invalid. A reply names its `parent_id`, which must be a live top-level message
        in the same cabal: an unknown, deleted or other-cabal parent is chat_parent_not_found and
        a parent that is itself a reply is chat_parent_is_reply. `also_in_channel` shows the reply
        in the channel too and needs a `parent_id`, otherwise invalid_input. A replay returns the
        first response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
      requestBody:
        description: The message.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageRequest"
            example: {body: gm}
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getChatMessages
      tags: [social]
      summary: Read a cabal's chat channel.
      description: >-
        Returns the channel view: top-level messages and replies sent with `also_in_channel`.
        Without a cursor it returns the newest page, newest first. `before` returns the page older
        than that message, newest first. `after` returns the messages newer than that message,
        oldest first, for catching up after a reconnect. Sending both is invalid_input, and a
        cursor that is not a message in this cabal is chat_message_not_found. A deleted top-level
        message that has replies comes back with `deleted: true` and a null body; other deleted
        messages are left out. Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - name: before
          in: query
          required: false
          description: A message id. Returns the messages older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: after
          in: query
          required: false
          description: A message id. Returns the messages newer than it, oldest first.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: One page of the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannelPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}:
    delete:
      operationId: deleteChatMessage
      tags: [social]
      x-idempotent: true
      summary: Delete one of the caller's chat messages.
      description: >-
        Soft-deletes the message. Only its author can delete it, otherwise
        chat_message_not_owned. A message that is unknown or in another cabal is
        chat_message_not_found. Deleting a deleted message changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
      responses:
        "204":
          description: The message is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/messages/{message_id}/thread:
    get:
      operationId: getChatThread
      tags: [social]
      summary: Read a chat thread.
      description: >-
        Returns the top-level message and a page of its live replies, oldest first. Without
        `before` the page is the newest replies; with it, the replies older than that reply. A
        parent that is unknown, in another cabal, or deleted with no replies is
        chat_message_not_found, and a message that is itself a reply is chat_parent_is_reply.
        Only a member can read, otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - $ref: "#/components/parameters/ChatMessageId"
        - name: before
          in: query
          required: false
          description: A reply id. Returns the replies older than it.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000008"]}
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50, examples: [50]}
      responses:
        "200":
          description: The parent and one page of replies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cabals/{id}/chat/seen:
    post:
      operationId: markChatSeen
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 60, per: 1m, burst: 10}}
      summary: Mark the cabal's chat as seen.
      description: >-
        Moves the caller's seen watermark to the server's clock and never moves it backwards, so
        a replay or a slow client cannot undo a later call. Only a member can mark, otherwise
        not_cabal_member. Nothing is appended to the event log. Open screens get the new "seen
        by" count from a `seen.updated` event on the cabal channel, sent at most once per member
        every 5 seconds.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ChatCabalId"
      responses:
        "200":
          description: The watermark after the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSeenMark"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getChatSeenBy
      tags: [social]
      summary: List who has seen a chat message.
      description: >-
        Returns the other members whose seen watermark is at or after the message, newest first,
        and their count. The message's author is left out, and so is a member who left the cabal.
        A message that is not in this cabal is chat_message_not_found. Only a member can read,
        otherwise not_cabal_member.
      parameters:
        - $ref: "#/components/parameters/ChatCabalId"
        - name: message_id
          in: query
          required: true
          description: The message to read the seen list of.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      responses:
        "200":
          description: Who has seen the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSeenBy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/realtime/token:
    post:
      operationId: createRealtimeToken
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 60, per: 1h, burst: 10}}
      summary: Get a token request for live chat updates.
      description: >-
        Returns a signed Ably token request that lets the app subscribe, and only subscribe, to
        the chat channel of every cabal the caller belongs to. The token request is valid for 5
        minutes and carries no presence or publish right. A caller in no cabal gets
        no_realtime_channels, because Ably rejects an empty capability. Send a new idempotency key
        with every call, because a replay returns the first token request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The Ably token request to hand to the Ably SDK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTokenRequest"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/block:
    post:
      operationId: postUserBlock
      tags: [social]
      x-idempotent: true
      summary: Block a user.
      description: >-
        Blocks the user as the caller. It ends any follow between the two in both directions, appending
        `follow.removed` for each, then appends `block.created`. The blocker no longer sees the blocked
        user's chat messages or comments, and neither can follow the other. Blocking someone the caller
        already blocks changes nothing and answers the same. Blocking yourself is cannot_block_self and an
        unknown or deleted user is user_not_found. A banned or suspended user can be blocked.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": {description: The caller blocks the user.}
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserBlock
      tags: [social]
      x-idempotent: true
      summary: Unblock a user.
      description: >-
        Removes the caller's block of the user and appends `block.removed`. Unblocking a user the caller
        does not block changes nothing and answers the same. No follow is restored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": {description: The caller does not block the user.}
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/blocks:
    get:
      operationId: getMeBlocks
      tags: [social]
      summary: List the users the caller blocks.
      description: >-
        Newest block first, at most 500. Banned and deleted users stay in the list so they can be
        unblocked. A deleted user carries an empty handle, display name and photo.
      responses:
        "200":
          description: The blocked users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUsers"
              example:
                users:
                  - {user_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", handle: maya, display_name: Maya Angelou, photo_url: null}
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports:
    post:
      operationId: postReport
      tags: [social]
      x-idempotent: true
      x-rate-limit: {actor: {rate: 20, per: 1h, burst: 20}}
      summary: Report a message, comment, user or cabal.
      description: >-
        Files a report for moderators and appends `report.created`, which carries no note text.
        The target must exist: a missing chat message, comment or cabal, and an unknown or deleted
        user, is report_target_not_found. A deleted chat message still counts as found. Reporting
        a target the caller already has an open report on answers 201 with the same id and appends
        nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: What is reported and why.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
            example: {kind: user, target_id: "7f0c2f6e-4c1b-4a8e-9a53-2d6f0b1c9e11", reason: spam}
      responses:
        "201":
          description: The open report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCreated"
              example: {id: "01920000-0000-7000-8000-000000000009"}
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/comments/{id}:
    delete:
      operationId: removeComment
      tags: [social]
      x-admin-role: moderator
      x-idempotent: true
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Remove a comment.
      description: >-
        Soft-deletes the comment as a moderator. It keeps its place in its thread, reads as `Removed by
        Monaco`, and the item's `comment_count` drops by one. Appends `comment.deleted` and
        `admin.action` in one transaction, and never copies the body into the audit. A comment that is
        already deleted returns 204 and changes nothing. An unknown comment is comment_not_found, and a
        reason shorter than 3 characters is reason_required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: The comment's id.
          schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
      requestBody:
        description: Why the moderator removes the comment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
            example: {reason: abuse}
      responses:
        "204":
          description: The comment is removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reports:
    get:
      operationId: getAdminReports
      tags: [social]
      x-admin-role: moderator
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: List reports for moderators.
      description: >-
        Reports with the given status, oldest first. The default status is open. A cursor the server
        did not write is invalid_input.
      parameters:
        - name: status
          in: query
          required: false
          description: Which reports to list. Defaults to open.
          schema: {type: string, enum: [open, resolved], default: open}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          description: The page size, 50 by default.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReports"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ChatCabalId:
      name: id
      in: path
      required: true
      description: The cabal id.
      schema: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
    ChatMessageId:
      name: message_id
      in: path
      required: true
      description: The message id.
      schema: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-000000000007"]}
  schemas:
    ReportRequest:
      type: object
      description: What is reported and why.
      additionalProperties: false
      required: [kind, target_id, reason]
      properties:
        kind: {type: string, enum: [message, comment, user, cabal], examples: [user]}
        target_id: {type: string, format: uuid, examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        reason: {type: string, enum: [spam, abuse, other], examples: [spam]}
        note:
          type: string
          description: Optional context, at most 500 characters.
          maxLength: 500
          examples: [Sends the same link to everyone.]
    ReportCreated:
      type: object
      description: The open report.
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, format: uuid, examples: ["01920000-0000-7000-8000-0000000000a1"]}
    AdminReporter:
      type: object
      description: Who filed the report. The handle is empty for a deleted account.
      additionalProperties: false
      required: [user_id, handle]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
    AdminReport:
      type: object
      description: One report in the moderation queue.
      additionalProperties: false
      required: [id, reporter, kind, target_id, reason, note, status, created_at]
      properties:
        id: {type: string, format: uuid}
        reporter:
          $ref: "#/components/schemas/AdminReporter"
        kind: {type: string, enum: [message, comment, user, cabal], examples: [user]}
        target_id: {type: string, format: uuid}
        reason: {type: string, enum: [spam, abuse, other], examples: [spam]}
        note: {type: [string, "null"], examples: [null]}
        status: {type: string, enum: [open, resolved], examples: [open]}
        created_at: {type: string, format: date-time}
    AdminReports:
      type: object
      description: One page of reports, oldest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/AdminReport"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    BlockedUser:
      type: object
      description: A user the caller blocks.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
        display_name: {type: string, examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], examples: ["https://img.example/maya.png"]}
    BlockedUsers:
      type: object
      description: The users the caller blocks, newest block first.
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/BlockedUser"
    ContactMatchRequest:
      type: object
      description: Lowercase SHA-256 hex hashes of E.164 phone numbers.
      additionalProperties: false
      required: [hashes]
      properties:
        hashes:
          type: array
          description: One to 2000 hashes. Each is 64 lowercase hex characters.
          items: {type: string}
          examples: [["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]]
    ContactMatch:
      type: object
      description: A person from the caller's contacts who has a Monaco account.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, followed_by_me]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string, examples: [maya]}
        display_name: {type: string, examples: [Maya Angelou]}
        photo_url: {type: [string, "null"], examples: ["https://img.example/maya.png"]}
        followed_by_me: {type: boolean, examples: [false]}
    ContactMatchPage:
      type: object
      description: One page of contact matches, newest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          examples: [[]]
          items:
            $ref: "#/components/schemas/ContactMatch"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FeedMuteRequest:
      type: object
      description: The feed target to mute.
      additionalProperties: false
      required: [target_type, target_id]
      properties:
        target_type: {type: string, enum: [kind, cabal, asset, user, item], examples: [asset]}
        target_id: {type: string, maxLength: 64, examples: [AAPLx]}
    FeedMute:
      type: object
      description: One muted feed target.
      additionalProperties: false
      required: [target_type, target_id, created_at]
      properties:
        target_type: {type: string}
        target_id: {type: string, examples: [AAPLx]}
        label: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    FeedPage:
      type: object
      description: One page of feed items, newest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FeedItem:
      type: object
      description: One feed item with its display strings rendered.
      additionalProperties: false
      required: [id, kind, ref_type, ref_id, cabal_id, cabal_name, cabal_picture_url, actor_id, actor_name, actor_photo_url, asset_id, asset_logo_url, symbol, title, detail, body, status, tone, action, usdc_micros, asset_name, token_amount, token_decimals, price_micros, share_of_pot_bps, change_bps, mark_micros, prev_close_micros, proposal_id, tally, expires_at, outcome, shape, caller, asset_kind, comment_count, like_count, liked_by_me, reactions, reaction_count, return_1m_bps, return_private, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, description: "The item's id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        kind:
          type: string
          description: >-
            `proposal`, `trade`, `price_move`, `cabal_created`, `member_joined`, `reply`, `result` or `threshold`.
            A `reply` is a comment on a proposal's feed item, with the comment text as `body` and the
            commenter as the actor. A `result` is one post per closed proposal, with its `outcome`, `shape`,
            `caller` and final `tally`. A `threshold` is a proposal that passed and awaits execution; only older
            items are `threshold`, no new one is written. A `proposal` carries `tally` and `expires_at`; every other
            kind has `expires_at` null, and only a `result` besides it has a `tally`.
          examples: [trade]
        ref_type:
          type: string
          description: >-
            The source the item points at, such as `swaps` for a trade, `feed_comments` for a reply
            (`ref_id` is the comment's id) or `proposals` for a proposal, a result or a threshold item.
          examples: [swaps]
        ref_id: {type: string, format: uuid, description: "The source row's id.", examples: ["01920000-0000-7000-8000-000000000008"]}
        cabal_id:
          type: [string, "null"]
          format: uuid
          description: The cabal the item is about. Null for a price move.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]
        cabal_name: {type: [string, "null"], description: "The cabal's current name. Null for a price move.", examples: [Alpha Cabal]}
        cabal_picture_url: {type: [string, "null"], description: "The cabal's current picture URL. Null for a price move or a cabal with no picture.", examples: [null]}
        actor_id:
          type: [string, "null"]
          format: uuid
          description: The user who acted. Null for a system item.
          examples: [null]
        actor_name: {type: [string, "null"], description: "The acting user's display name, as of the item's last rename, so it follows a rename. Null for a system item.", examples: [null]}
        actor_photo_url: {type: [string, "null"], description: "The acting user's current profile photo URL. Null for a system item or a member with no photo.", examples: [null]}
        asset_id:
          type: [string, "null"]
          format: uuid
          description: The stock's id, the target of an asset mute. Null when the item is not about a stock.
          examples: ["01890a5d-ac96-774b-bcce-b302099a8059"]
        asset_logo_url: {type: [string, "null"], description: "The stock's logo URL. Null when the item is not about a stock or the stock has no logo.", examples: [null]}
        symbol: {type: [string, "null"], description: "The stock symbol, if the item is about one.", examples: [AAPLx]}
        title: {type: string, description: "The rendered headline.", examples: ["Alpha Cabal bought $500 of AAPLx"]}
        detail: {type: [string, "null"], description: "A rendered second line, if the item has one.", examples: [Apple]}
        body: {type: [string, "null"], description: "Free text, such as a proposal's thesis.", examples: [null]}
        status:
          type: [string, "null"]
          description: >-
            The source's status, for proposals: `open`, `passed`, `execution_failed`, `failed`, `expired`,
            `withdrawn`, `voided`, `executed` or `execution_blocked`.
          examples: [null]
        tone:
          type: string
          description: "`neutral`, `positive` or `negative`, so the app can color the item without reading amounts."
          examples: [neutral]
        action:
          type: [string, "null"]
          description: "`buy` or `sell` for a proposal or trade. Null for any other kind."
          examples: [buy]
        usdc_micros:
          type: [integer, "null"]
          format: int64
          description: "A proposal's buy amount, or the USDC a trade spent or received, in micros. Null when the item has none."
          examples: [500000000]
        asset_name: {type: [string, "null"], description: "The stock's display name. Null when the item is not about a stock.", examples: [Apple]}
        token_amount:
          type: [integer, "null"]
          format: int64
          description: "Token base units: a sell proposal's amount or a trade's fill. Null when the item has none."
          examples: [250000000]
        token_decimals:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Decimals of `token_amount`. Null when `token_amount` is null.
          examples: [8]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: "USDC micros per whole token a trade filled at. Null unless the item is a trade."
          examples: [200000000]
        share_of_pot_bps:
          type: [integer, "null"]
          format: int64
          description: "A proposal's amount as basis points of the cabal pot when it was made, on a proposal, reply or threshold item. Null on other kinds and on proposals made before this field shipped."
          examples: [1000]
        change_bps:
          type: [integer, "null"]
          format: int64
          description: "A price move's change since the previous close, in signed basis points; 0 for a flat move. Null on every other kind."
          examples: [1000]
        mark_micros:
          type: [integer, "null"]
          format: int64
          description: "A price move's latest price in USDC micros. Null on every other kind."
          examples: [212400000]
        prev_close_micros:
          type: [integer, "null"]
          format: int64
          description: "A price move's previous close in USDC micros. Null on every other kind and when the move has no previous close."
          examples: [193100000]
        proposal_id:
          type: [string, "null"]
          format: uuid
          description: "The proposal a proposal, trade, reply, result or threshold item is about. Null on other kinds."
          examples: ["01920000-0000-7000-8000-000000000009"]
        comment_count: {type: integer, format: int32, description: "The number of comments.", examples: [0]}
        like_count: {type: integer, format: int32, description: "Deprecated, read `reactions` instead. The number of users who reacted with ❤️.", examples: [3]}
        liked_by_me: {type: boolean, description: "Deprecated, read `reactions` instead. True when the caller reacted with ❤️.", examples: [true]}
        reactions:
          type: array
          maxItems: 20
          description: >-
            The item's reactions, one per emoji, most used first, then the emoji first used earliest. At most the top 20;
            `reaction_count` still counts every reaction.
          items: {$ref: "#/components/schemas/Reaction"}
        reaction_count: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the item, over every emoji.", examples: [7]}
        tally:
          type: [object, "null"]
          description: "A proposal's live vote count, read from governance on each request, or a `result`'s stored final tally, `needed` included. Null on every other kind."
          examples: [null]
          x-go-type-name: FeedTally
          additionalProperties: false
          required: [yes, no, voters, needed]
          properties:
            yes: {type: integer, minimum: 0, description: "Ballots cast yes.", examples: [4]}
            no: {type: integer, minimum: 0, description: "Ballots cast no.", examples: [1]}
            voters: {type: integer, minimum: 0, description: "Members who can vote.", examples: [8]}
            needed: {type: integer, minimum: 0, description: "Yes ballots the proposal's threshold needs.", examples: [5]}
        expires_at: {type: [string, "null"], format: date-time, description: "When voting closes. Null except on a `proposal`.", examples: [null]}
        outcome:
          type: [string, "null"]
          enum: [passed, failed, null]
          description: "How a `result` closed: `passed`, or `failed` when the vote failed or expired. Null on every other kind."
          examples: [passed]
        shape:
          type: [string, "null"]
          enum: [cabal, member, null]
          description: "Who heads a `result` post: the `cabal`, or the `member` who proposed it. Null on every other kind."
          examples: [cabal]
        caller:
          type: [object, "null"]
          description: "Who called a passed `result` (the proposer). Null on a failed result and on every other kind."
          examples: [null]
          x-go-type-name: FeedCaller
          additionalProperties: false
          required: [id, name, photo_url]
          properties:
            id: {type: string, format: uuid, description: "The caller's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8060"]}
            name: {type: string, description: "The caller's display name when the proposal closed.", examples: [Christelle]}
            photo_url: {type: [string, "null"], description: "The caller's current profile photo URL. Null for a member with no photo.", examples: [null]}
        asset_kind:
          type: [string, "null"]
          enum: [equity, pre_ipo, null]
          description: "Whether the stock is listed (`equity`) or `pre_ipo`. Set on a `proposal` and a `result`, null on every other kind."
          examples: [equity]
        return_1m_bps: {type: [integer, "null"], format: int64, description: "The author's one-month return in basis points, from the people board's `1M` range as of the last valuation run, not a live figure. Null when the author hides it, has no ranked row, or the item is a system item.", examples: [820]}
        return_private: {type: boolean, description: "True only when the author chose to hide their return. False for a system item or an author with no ranked row.", examples: [false]}
        created_at: {type: string, format: date-time, description: "When the item was created.", examples: ["2026-10-03T08:00:00Z"]}
        updated_at: {type: string, format: date-time, description: "When the item last changed.", examples: ["2026-10-03T08:00:00Z"]}
    Reaction:
      type: object
      description: One emoji on a feed item, how many users reacted with it and whether the caller did.
      additionalProperties: false
      required: [emoji, count, mine]
      properties:
        emoji: {type: string, minLength: 1, maxLength: 32, description: "One emoji, such as 🎉 or 👍🏽.", examples: ["🎉"]}
        count: {type: integer, format: int32, minimum: 1, description: "The number of users who reacted with this emoji.", examples: [5]}
        mine: {type: boolean, description: "True when the caller reacted with this emoji.", examples: [true]}
    ReactionSummary:
      type: object
      description: A feed item's reactions after a change.
      additionalProperties: false
      required: [reactions, total]
      properties:
        reactions:
          type: array
          maxItems: 20
          description: >-
            One entry per emoji, most used first, then the emoji first used earliest. At most the top 20; `total`
            still counts every reaction.
          items: {$ref: "#/components/schemas/Reaction"}
          examples: [[{emoji: "🎉", count: 5, mine: true}]]
        total: {type: integer, format: int32, minimum: 0, description: "The number of reactions on the item, over every emoji.", examples: [7]}
    FeedItemDetail:
      type: object
      description: One feed item, whether it passes the request's filters and whether the caller can comment on it.
      additionalProperties: false
      required: [item, visible, can_comment]
      properties:
        item:
          $ref: "#/components/schemas/FeedItem"
        visible:
          type: boolean
          description: True when the item passes the filters sent with the request.
          examples: [true]
        can_comment:
          type: boolean
          description: >-
            False on a proposal of a cabal the caller is not in, which only members can comment on, and on a reply or
            threshold item, which open the proposal instead. True otherwise.
          examples: [true]
    CreateCommentRequest:
      type: object
      description: A comment to post.
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          description: The text, trimmed by the server to 1 to 1000 Unicode scalars.
          examples: [nice]
        parent_comment_id:
          type: string
          format: uuid
          description: The comment this replies to, on the same item. Absent for a top-level comment.
          examples: ["01920000-0000-7000-8000-000000000007"]
    CommentAuthor:
      type: object
      description: The author of a comment. A deleted account has a null handle and an empty name.
      additionalProperties: false
      required: [id, handle, display_name, photo_url, return_1m_bps, return_private]
      properties:
        id: {type: string, format: uuid, description: "The author's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
        return_1m_bps: {type: [integer, "null"], format: int64, description: "The author's one-month return in basis points, from the people board's `1M` range as of the last valuation run, not a live figure. Null when the author hides it or has no ranked row.", examples: [820]}
        return_private: {type: boolean, description: "True only when the author chose to hide their return. False for an author with no ranked row.", examples: [false]}
    Comment:
      type: object
      description: One comment on a feed item.
      additionalProperties: false
      required: [id, parent_comment_id, author, reply_to_handle, body, body_display, is_mine, created_at]
      properties:
        id: {type: string, format: uuid, description: "The comment id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        parent_comment_id:
          type: [string, "null"]
          format: uuid
          description: The top-level comment this sits under. Null on a top-level comment.
          examples: [null]
        author:
          $ref: "#/components/schemas/CommentAuthor"
        reply_to_handle:
          type: [string, "null"]
          description: The handle of the person a reply answers, when it answers a reply. Otherwise null.
          examples: [null]
        body: {type: [string, "null"], description: Null on a deleted comment., examples: [nice]}
        body_display: {type: string, description: "The body, `Comment deleted` once the author deletes it, or `Removed by Monaco` once a moderator removes it.", examples: [nice]}
        is_mine: {type: boolean, description: True when the caller wrote it., examples: [true]}
        created_at: {type: string, format: date-time, description: When the server stored it., examples: ["2026-10-03T12:00:00Z"]}
    CommentThread:
      type: object
      description: A top-level comment and all its replies.
      additionalProperties: false
      required: [comment, replies]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
        replies:
          type: array
          description: The replies, oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/Comment"
    CommentPage:
      type: object
      description: One page of comment threads, oldest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CommentThread"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    ProposalCommentPage:
      type: object
      description: One page of comment threads on a proposal, oldest first.
      additionalProperties: false
      required: [feed_object_id, items, next_cursor]
      properties:
        feed_object_id:
          type: string
          format: uuid
          description: The id of the proposal's feed item.
          examples: ["01920000-0000-7000-8000-000000000007"]
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/CommentThread"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FollowRequest:
      type: object
      description: Where a follow came from.
      additionalProperties: false
      properties:
        source:
          type: string
          description: >-
            One of `profile`, `phone`, `x`, `cabal`, `feed` or `suggested`. Defaults to `profile`.
          examples: [profile]
    FollowState:
      type: object
      description: Whether the caller follows the user after the call.
      additionalProperties: false
      required: [following]
      properties:
        following:
          type: boolean
          description: True after a follow and false after an unfollow.
          examples: [true]
    FollowsPage:
      type: object
      description: One page of a user's followers or following, newest first.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page.
          examples: [[]]
          items:
            $ref: "#/components/schemas/FollowUser"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    FollowUser:
      type: object
      description: A listed user, with whether the caller follows them.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url, followed_by_me]
      properties:
        user_id: {type: string, format: uuid}
        handle: {type: string}
        display_name: {type: string}
        photo_url: {type: [string, "null"]}
        followed_by_me: {type: boolean}
    PostChatMessageRequest:
      type: object
      description: A chat message to post.
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          description: The text, trimmed by the server to 1 to 2000 Unicode scalars.
          examples: [gm]
        parent_id:
          type: string
          format: uuid
          description: The top-level message this replies to. Absent for a top-level message.
          examples: ["01920000-0000-7000-8000-000000000007"]
        also_in_channel:
          type: boolean
          description: Show the reply in the channel too. Needs a parent_id. Defaults to false.
          examples: [false]
    RealtimeTokenRequest:
      type: object
      description: >-
        An Ably token request, signed with the app key. The app passes it to Ably unchanged.
      additionalProperties: false
      required: [keyName, clientId, capability, timestamp, ttl, nonce, mac]
      properties:
        keyName: {type: string, description: "The Ably key name, not its secret.", examples: ["appid.keyid"]}
        clientId: {type: string, description: "The caller's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        capability:
          type: string
          description: A JSON object that maps each cabal channel to `["subscribe"]`.
          examples: ['{"cabal:01920000-0000-7000-8000-000000000001":["subscribe"]}']
        timestamp: {type: integer, format: int64, description: "When it was signed, in milliseconds since the epoch.", examples: [1791300000000]}
        ttl: {type: integer, format: int64, description: "How long the token lives, in milliseconds.", examples: [900000]}
        nonce: {type: string, description: A one-time value that stops a replay., examples: [d3b07384d113edec]}
        mac: {type: string, description: The signature over the other fields., examples: [c2lnbmF0dXJl]}
    ChatAuthor:
      type: object
      description: The author of a chat message. A deleted account has a null handle and an empty name.
      additionalProperties: false
      required: [id, handle, display_name, photo_url]
      properties:
        id: {type: string, format: uuid, description: "The author's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    ChatMessage:
      type: object
      description: One chat message.
      additionalProperties: false
      required: [id, author, body, created_at, parent_id, also_in_channel, reply_count, last_reply_at, proposal_id, deleted, seen_count]
      properties:
        id: {type: string, format: uuid, description: "The message id.", examples: ["01920000-0000-7000-8000-000000000007"]}
        author:
          $ref: "#/components/schemas/ChatAuthor"
        body: {type: [string, "null"], description: Null on a deleted message., examples: [gm]}
        created_at: {type: string, format: date-time, description: When the server stored it., examples: ["2026-10-03T12:00:00Z"]}
        parent_id:
          type: [string, "null"]
          format: uuid
          description: The top-level message this replies to. Null on a top-level message.
          examples: [null]
        also_in_channel: {type: boolean, description: True on a reply that also shows in the channel., examples: [false]}
        reply_count: {type: integer, description: The replies to a top-level message. 0 on a reply., examples: [0]}
        last_reply_at:
          type: [string, "null"]
          format: date-time
          description: When the newest reply was posted. Null with no replies.
          examples: [null]
        proposal_id:
          type: [string, "null"]
          format: uuid
          description: The proposal a proposal card message is about. Null otherwise.
          examples: [null]
        deleted: {type: boolean, description: True on a deleted top-level message kept for its thread., examples: [false]}
        seen_count:
          type: [integer, "null"]
          description: >-
            How many other members have seen the message. Set only on the newest channel message
            of a channel read without `before`, and null everywhere else.
          examples: [null]
    ChatSeenMark:
      type: object
      description: The caller's seen watermark.
      additionalProperties: false
      required: [last_seen_at]
      properties:
        last_seen_at: {type: string, format: date-time, description: The watermark after the call., examples: ["2026-10-03T12:00:00Z"]}
    ChatSeenBy:
      type: object
      description: The members who have seen a message.
      additionalProperties: false
      required: [count, members]
      properties:
        count: {type: integer, description: How many other members have seen it., examples: [1]}
        members:
          type: array
          description: Newest watermark first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatSeenMember"
    ChatSeenMember:
      type: object
      description: A member who has seen a message. A deleted account has a null handle and an empty name.
      additionalProperties: false
      required: [user_id, handle, display_name, photo_url]
      properties:
        user_id: {type: string, format: uuid, description: "The member's user id.", examples: ["01890a5d-ac96-774b-bcce-b302099a8058"]}
        handle: {type: [string, "null"], description: Null until onboarding sets one., examples: [kai]}
        display_name: {type: string, description: Empty when the user has none., examples: [Kai]}
        photo_url: {type: [string, "null"], description: Null when the user has none., examples: [null]}
    ChatChannelPage:
      type: object
      description: One page of a cabal's chat channel.
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          description: Newest first, or oldest first for an `after` request.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatThread:
      type: object
      description: A top-level message and one page of its replies.
      additionalProperties: false
      required: [parent, replies]
      properties:
        parent:
          $ref: "#/components/schemas/ChatMessage"
        replies:
          type: array
          description: Oldest first.
          examples: [[]]
          items:
            $ref: "#/components/schemas/ChatMessage"
