paths:
  /v1/assets:
    get:
      operationId: getAssets
      tags: [market]
      summary: List tradable assets.
      description: >-
        Returns the tradable catalog, one page at a time. `q` matches the start of a symbol or any
        part of a display name, ignoring case. `popular` orders by the curated rank. `pre_ipo`
        keeps only pre-IPO tokens. A price the hold rule has not accepted is null, never zero.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive symbol prefix or display-name search. Absent lists the filter.
          schema:
            type: string
            maxLength: 80
            examples: [apple]
        - name: filter
          in: query
          required: false
          description: Which tradable assets to return, and how to order them.
          schema:
            type: string
            enum: [all, popular, pre_ipo]
            default: all
            examples: [popular]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["c0FBUEx4ADAxOTIwMDAwLTAwMDAtNzAwMC04MDAwLTAwMDAwMDAwMDAwMQ"]
      responses:
        "200":
          description: One page of tradable assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}:
    get:
      operationId: getAsset
      tags: [market]
      summary: Read one asset.
      description: >-
        Returns one known asset, tradable or not, with the held price and the other listings of the
        same company. An unknown symbol is `asset_not_found`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [AAPLx]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/chart:
    get:
      operationId: getAssetChart
      tags: [market]
      summary: Read one asset's chart.
      description: >-
        Buckets the asset's stored prices for the requested range. A held spike is left out of the
        buckets. An unknown symbol is `asset_not_found`. `ALL` starts at the first stored sample.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
        - name: range
          in: query
          required: true
          description: How far back to read, and how wide each bucket is.
          schema: {type: string, enum: [1D, 1W, 1M, 3M, 1Y, ALL], examples: [1D]}
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetChart"}
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    AssetIssuer:
      type: string
      description: The firm that issues the tokenized stock.
      examples: [xstocks]
      enum: [xstocks, tessera, prestocks]
    AssetKind:
      type: string
      description: Whether the token tracks a listed equity or a pre-IPO company.
      examples: [equity]
      enum: [equity, pre_ipo]
    MarketState:
      type: string
      description: Where the underlying US session is.
      examples: [open]
      enum: [pre_market, open, after_hours, closed]
    MarketSession:
      type: object
      description: The session the asset is in, computed on the server.
      examples:
        - state: open
          continuous: false
          holiday: ""
          early_close: false
          next_state: after_hours
          next_transition: "2026-03-04T21:00:00Z"
      additionalProperties: false
      required: [state, continuous, holiday, early_close, next_state, next_transition]
      properties:
        state:
          $ref: "#/components/schemas/MarketState"
          description: The session state at the time of the response.
          examples: [open]
        continuous:
          type: boolean
          description: True for a pre-IPO token, which trades without a US session.
          examples: [false]
        holiday:
          type: string
          description: The US market holiday name. Empty when the day is not a holiday.
          examples: [""]
        early_close:
          type: boolean
          description: True when the regular session closes early today.
          examples: [false]
        next_state:
          description: The next session state. Null when the asset trades continuously.
          examples: [after_hours]
          type: [string, "null"]
          enum: [pre_market, open, after_hours, closed, null]
        next_transition:
          type: [string, "null"]
          format: date-time
          description: When `next_state` begins. Null when the asset trades continuously.
          examples: ["2026-03-04T21:00:00Z"]
    AssetSummary:
      type: object
      description: One tradable asset as the list draws it, with the price already chosen.
      examples:
        - symbol: AAPLx
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: "https://cdn.example.com/AAPLx.png"
          price_micros: 110000000
          price_as_of: "2026-03-04T14:30:00Z"
          change_bps: 1000
          sparkline_micros: [100000000, 110000000]
          session:
            state: open
            continuous: false
            holiday: ""
            early_close: false
            next_state: after_hours
            next_transition: "2026-03-04T21:00:00Z"
          tradable: true
      additionalProperties: false
      required:
        - symbol
        - display_name
        - issuer
        - kind
        - logo_url
        - price_micros
        - price_as_of
        - change_bps
        - sparkline_micros
        - session
      properties:
        symbol:
          type: string
          description: The ticker the app shows and the path key for the asset.
          examples: [AAPLx]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close for an equity, or against the first
            sample of the UTC day for a pre-IPO token. Null when that reference does not exist.
          examples: [1000]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
        tradable:
          type: boolean
          description: True when this asset can be bought.
          examples: [true]
    AssetListing:
      type: object
      description: Another listing of the same company, without a price.
      examples:
        - symbol: AAPLy
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: null
          tradable: false
      additionalProperties: false
      required: [symbol, display_name, issuer, kind, logo_url, tradable]
      properties:
        symbol:
          type: string
          description: The other listing's ticker.
          examples: [AAPLy]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLy.png"]
        tradable:
          type: boolean
          description: True when this listing can be bought.
          examples: [false]
    UiMultiplier:
      type: object
      description: The whole tokens in one display unit, as an exact fraction.
      examples:
        - num: 1
          den: 1
      additionalProperties: false
      required: [num, den]
      properties:
        num:
          type: integer
          format: int64
          description: The numerator.
          examples: [1]
        den:
          type: integer
          format: int64
          description: The denominator.
          examples: [1]
    AssetDetail:
      type: object
      description: One asset, the list fields plus the chain facts and the other listings.
      examples:
        - symbol: AAPLx
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: "https://cdn.example.com/AAPLx.png"
          price_micros: 110000000
          price_as_of: "2026-03-04T14:30:00Z"
          change_bps: 1000
          sparkline_micros: [100000000, 110000000]
          session:
            state: open
            continuous: false
            holiday: ""
            early_close: false
            next_state: after_hours
            next_transition: "2026-03-04T21:00:00Z"
          decimals: 8
          ui_multiplier:
            num: 1
            den: 1
          tradable: true
          other_listings: []
          attribution: Data provided by CoinGecko
      additionalProperties: false
      required:
        - symbol
        - display_name
        - issuer
        - kind
        - logo_url
        - price_micros
        - price_as_of
        - change_bps
        - sparkline_micros
        - session
        - decimals
        - ui_multiplier
        - tradable
        - other_listings
        - attribution
      properties:
        symbol:
          type: string
          description: The ticker the app shows and the path key for the asset.
          examples: [AAPLx]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close for an equity, or against the first
            sample of the UTC day for a pre-IPO token. Null when that reference does not exist.
          examples: [1000]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
          examples:
            - state: open
              continuous: false
              holiday: ""
              early_close: false
              next_state: after_hours
              next_transition: "2026-03-04T21:00:00Z"
        decimals:
          type: integer
          minimum: 0
          maximum: 255
          description: The mint's decimals.
          examples: [8]
        ui_multiplier:
          $ref: "#/components/schemas/UiMultiplier"
          description: The whole tokens in one display unit.
          examples:
            - num: 1
              den: 1
        tradable:
          type: boolean
          description: True when this asset can be bought.
          examples: [true]
        other_listings:
          type: array
          description: The other assets that share this company's key. This asset is not in the list.
          examples:
            - - symbol: AAPLy
                display_name: Apple
                issuer: xstocks
                kind: equity
                logo_url: "https://cdn.example.com/AAPLy.png"
                tradable: false
          items:
            $ref: "#/components/schemas/AssetListing"
        attribution:
          type: string
          description: The data source line the asset screen shows.
          examples: ["Data provided by CoinGecko"]
    ChartPoint:
      type: object
      description: One bucket of open, high, low and close, in USD micros.
      examples:
        - t: "2026-03-04T14:55:00Z"
          open_micros: 100000000
          high_micros: 130000000
          low_micros: 90000000
          close_micros: 110000000
      additionalProperties: false
      required:
        - t
        - open_micros
        - high_micros
        - low_micros
        - close_micros
      properties:
        t:
          type: string
          format: date-time
          description: The start of the bucket.
          examples: ["2026-03-04T14:55:00Z"]
        open_micros:
          type: integer
          format: int64
          description: The first sample in the bucket, in USD micros.
          examples: [100000000]
        high_micros:
          type: integer
          format: int64
          description: The highest sample in the bucket, in USD micros.
          examples: [130000000]
        low_micros:
          type: integer
          format: int64
          description: The lowest sample in the bucket, in USD micros.
          examples: [90000000]
        close_micros:
          type: integer
          format: int64
          description: The last sample in the bucket, in USD micros.
          examples: [110000000]
    AssetChart:
      type: object
      description: The buckets for one asset and one range.
      examples:
        - range: 1D
          bucket_seconds: 300
          points:
            - t: "2026-03-04T14:55:00Z"
              open_micros: 100000000
              high_micros: 130000000
              low_micros: 90000000
              close_micros: 110000000
          empty: false
          attribution: Data provided by CoinGecko
      additionalProperties: false
      required:
        - range
        - bucket_seconds
        - points
        - empty
        - attribution
      properties:
        range:
          type: string
          description: The range that was requested.
          enum: [1D, 1W, 1M, 3M, 1Y, ALL]
          examples: [1D]
        bucket_seconds:
          type: integer
          format: int64
          minimum: 1
          description: The width of each bucket, in seconds.
          examples: [300]
        points:
          type: array
          description: The buckets in time order. Empty when the asset has no samples in the range.
          examples:
            - - t: "2026-03-04T14:55:00Z"
                open_micros: 100000000
                high_micros: 130000000
                low_micros: 90000000
                close_micros: 110000000
          items:
            $ref: "#/components/schemas/ChartPoint"
        empty:
          type: boolean
          description: True when `points` is empty.
          examples: [false]
        attribution:
          type: string
          description: The data source line the chart shows.
          examples: ["Data provided by CoinGecko"]
    AssetList:
      type: object
      description: One page of the tradable catalog.
      examples:
        - assets:
            - symbol: AAPLx
              display_name: Apple
              issuer: xstocks
              kind: equity
              logo_url: "https://cdn.example.com/AAPLx.png"
              price_micros: 110000000
              price_as_of: "2026-03-04T14:30:00Z"
              change_bps: 1000
              sparkline_micros: [100000000, 110000000]
              session:
                state: open
                continuous: false
                holiday: ""
                early_close: false
                next_state: after_hours
                next_transition: "2026-03-04T21:00:00Z"
          next_cursor: null
      additionalProperties: false
      required: [assets, next_cursor]
      properties:
        assets:
          type: array
          description: The page, in the filter's order.
          examples: [[]]
          items:
            $ref: "#/components/schemas/AssetSummary"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
