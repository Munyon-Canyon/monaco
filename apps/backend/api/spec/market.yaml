paths:
  /v1/assets:
    get:
      operationId: getAssets
      tags: [market]
      summary: List tradable assets.
      description: >-
        Returns the tradable catalog, one page at a time. `q` matches the start of a symbol or any
        part of a display name, ignoring case. `popular` orders by the curated rank. `pre_ipo`
        keeps only pre-IPO tokens. `movers` orders priced, tradable stocks by the size of today's
        move, largest first; it never lists Pre-IPO. `in_cabals` orders tradable assets, Pre-IPO
        included, by how many active cabals hold them, most first, and carries `cabal_count`; an
        asset held by fewer than three active cabals has no count, and when fewer than `limit`
        assets qualify the list is completed from `popular` without a count. It defaults to 5
        rows, has no pages and takes no `cursor`. A price the hold rule has not accepted is null, never zero.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive symbol prefix or display-name search. Absent lists the filter.
          schema:
            type: string
            maxLength: 80
            examples: [apple]
        - name: filter
          in: query
          required: false
          description: Which tradable assets to return, and how to order them.
          schema:
            type: string
            enum: [all, popular, pre_ipo, movers, in_cabals]
            default: all
            examples: [popular]
        - name: sort
          in: query
          required: false
          description: "Order of `filter=all`: `symbol` (default), `name` A to Z by display name, `price` highest first. Other filters have their own order."
          schema:
            type: string
            enum: [symbol, name, price]
            examples: [name]
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            examples: [20]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Absent reads the first page.
          schema:
            type: string
            maxLength: 512
            examples: ["c0FBUEx4ADAxOTIwMDAwLTAwMDAtNzAwMC04MDAwLTAwMDAwMDAwMDAwMQ"]
      responses:
        "200":
          description: One page of tradable assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/quotes:
    get:
      operationId: getAssetQuotes
      tags: [market]
      summary: Read the quotes of up to 50 assets at once.
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      description: >-
        Returns the quote of each known asset in `symbols`, tradable or not, in the shape of the
        list and from the same price store as `getAsset`. A symbol the catalog does not know is left out of
        the answer, where `getAsset` says `asset_not_found`. Repeated symbols count once. More than 50 symbols,
        or none, is `invalid_input`.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated tickers, at most 50.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
            examples: ["AAPLx,TSLAx"]
      responses:
        "200":
          description: The quotes of the known assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetQuotes"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}:
    get:
      operationId: getAsset
      tags: [market]
      summary: Read one asset.
      description: >-
        Returns one known asset, tradable or not, with the held price and the other listings of the
        same company. An unknown symbol is `asset_not_found`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [AAPLx]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/chart:
    get:
      operationId: getAssetChart
      tags: [market]
      x-rate-limit: {actor: {rate: 120, per: 1m, burst: 30}}
      summary: Read one asset's chart.
      description: >-
        Buckets the asset's stored prices for the requested range. A held spike is left out of the
        buckets. An unknown symbol is `asset_not_found`. `ALL` starts at the first stored sample.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
        - name: range
          in: query
          required: true
          description: "The preset: the default interval and the first window."
          schema: {type: string, enum: [1H, 1D, 1W, 1M, 3M, 6M, 1Y, ALL], examples: [1D]}
        - name: interval
          in: query
          required: false
          description: >-
            The bar width. Absent means the range default, `1H` 1m, `1D` 5m, `1W`/`1M`/`3M` 1h, `6M`/`1Y`/`ALL` 1d.
            Allowed per range, `1H` 1m 5m; `1D` and `1W` 5m 15m 30m 1h 4h 1d; `1M` 15m 30m 1h 4h 1d;
            `3M` 30m 1h 4h 1d 1w; `6M` 1h 4h 1d 1w; `1Y` and `ALL` 4h 1d 1w. Weekly bars start on Monday 00:00 UTC.
            Any other pair is `invalid_input`.
          schema: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w], examples: [15m]}
        - name: before
          in: query
          required: false
          description: >-
            Bars that start before this instant, aligned down to the interval. The read then reaches back
            to the asset's first sample, not just the range.
          schema: {type: string, format: date-time, examples: ["2026-03-04T14:55:00Z"]}
        - name: limit
          in: query
          required: false
          description: >-
            The most bars one response returns, the newest ones, in time order. Without `before` and
            without `limit` the response holds the whole preset window, uncapped. With `before` and
            without `limit` it holds at most 500 bars. An explicit `limit` always applies.
          schema: {type: integer, minimum: 1, maximum: 1000, examples: [500]}
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetChart"}
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{symbol}/best-chain:
    get:
      operationId: getAssetBestChain
      tags: [market]
      summary: Read the best chain to buy one asset on.
      description: >-
        Quotes a $1 buy of the asset on every enabled listing and returns the winner with every chain's
        figures. The answer is shared by every member and kept per symbol: a figure under 20 seconds old
        is served as is, one under 60 seconds old is served while a refresh runs, and an older one is
        refreshed before the answer, for at most about a second: when the refresh is slower or fails, the
        last good answer under an hour old is returned with `stale` true. The figure is for display and
        for choosing the chain to pin a preview to; a trade quotes again when it runs. An unknown symbol is `asset_not_found`, one that
        cannot be bought is `asset_untradable`, and no chain to quote is `no_route` or
        `quote_unavailable`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: The ticker the app shows.
          schema: {type: string, minLength: 1, maxLength: 64, examples: [AAPLx]}
      responses:
        "200":
          description: The best chain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetBestChain"}
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    AssetIssuer:
      type: string
      description: The firm that issues the tokenized stock.
      examples: [xstocks]
      enum: [xstocks, tessera, prestocks]
    AssetKind:
      type: string
      description: Whether the token tracks a listed equity or a pre-IPO company.
      examples: [equity]
      enum: [equity, pre_ipo]
    MarketState:
      type: string
      description: Where the underlying US session is.
      examples: [open]
      enum: [pre_market, open, after_hours, closed]
    MarketSession:
      type: object
      description: The session the asset is in, computed on the server.
      examples:
        - state: open
          continuous: false
          holiday: ""
          early_close: false
          next_state: after_hours
          next_transition: "2026-03-04T21:00:00Z"
      additionalProperties: false
      required: [state, continuous, holiday, early_close, next_state, next_transition]
      properties:
        state:
          $ref: "#/components/schemas/MarketState"
          description: The session state at the time of the response.
          examples: [open]
        continuous:
          type: boolean
          description: True for a pre-IPO token, which trades without a US session.
          examples: [false]
        holiday:
          type: string
          description: The US market holiday name. Empty when the day is not a holiday.
          examples: [""]
        early_close:
          type: boolean
          description: True when the regular session closes early today.
          examples: [false]
        next_state:
          description: The next session state. Null when the asset trades continuously.
          examples: [after_hours]
          type: [string, "null"]
          enum: [pre_market, open, after_hours, closed, null]
        next_transition:
          type: [string, "null"]
          format: date-time
          description: When `next_state` begins. Null when the asset trades continuously.
          examples: ["2026-03-04T21:00:00Z"]
    AssetSummary:
      type: object
      description: One tradable asset as the list draws it, with the price already chosen.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8070
          symbol: AAPLx
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: "https://cdn.example.com/AAPLx.png"
          price_micros: 110000000
          price_as_of: "2026-03-04T14:30:00Z"
          change_bps: 1000
          sparkline_micros: [100000000, 110000000]
          volume_24h_micros: 2500000000000
          volume_24h_as_of: "2026-03-04T05:00:00Z"
          quotable: true
          session:
            state: open
            continuous: false
            holiday: ""
            early_close: false
            next_state: after_hours
            next_transition: "2026-03-04T21:00:00Z"
          tradable: true
      additionalProperties: false
      required:
        - id
        - symbol
        - display_name
        - issuer
        - kind
        - logo_url
        - price_micros
        - price_as_of
        - change_bps
        - sparkline_micros
        - volume_24h_micros
        - volume_24h_as_of
        - session
        - quotable
      properties:
        id:
          type: string
          format: uuid
          description: The asset's id, as `StockAttachmentInput.asset_id` takes it.
          examples: [01890a5d-ac96-774b-bcce-b302099a8070]
        symbol:
          type: string
          description: The ticker the app shows and the path key for the asset.
          examples: [AAPLx]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        stale:
          type: boolean
          description: >-
            True when `price_micros` is older than the freshness limit: 15 minutes in an open,
            pre-market, after-hours or continuous session, and more than a day before the last close
            in a closed one. The app marks the price Delayed instead of showing it as live. Absent
            when the asset is unpriced.
          examples: [false]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close while the market is open, and against
            the close before the last session from that session's close until the next open, so the
            headline keeps describing the session's change after 16:00. For a pre-IPO token it is
            against the first sample of the UTC day. Null when that reference does not exist.
          examples: [1000]
        after_hours_change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last session's close, present for an equity when the
            market is not open and the close is known. Absent or null otherwise.
          examples: [20]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        volume_24h_micros:
          type: [integer, "null"]
          format: int64
          description: >-
            The token's trading volume over the last 24 hours in USD micros, as CoinGecko reports it
            across the venues it tracks. Null when there is no reading from the last 36 hours.
          examples: [2500000000000]
        volume_24h_as_of:
          type: [string, "null"]
          format: date-time
          description: When that reading was taken. Null when `volume_24h_micros` is null.
          examples: ["2026-03-04T05:00:00Z"]
        quotable:
          type: boolean
          description: >-
            False when Jupiter has not priced this asset in the last 15 minutes, so a buy would find
            no route. The app marks it Paused and disables Buy.
          examples: [true]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
        tradable:
          type: boolean
          description: >-
            True when this asset can be bought. For a `pre_ipo` asset, `true` is "Eligible" (a cabal can vote
            to buy it) and `false` is "Research only".
          examples: [true]
        cabal_count:
          type: integer
          minimum: 3
          description: >-
            How many active cabals hold this asset. Set only on rows of the `in_cabals` filter that
            ranked by it, never below three, and absent everywhere else.
          examples: [41]
        estimate:
          type: [object, "null"]
          description: >-
            The secondary estimate of a `pre_ipo` company, per share. Null for equities and for a Pre-IPO asset
            without a profile; the field is then absent. A Pre-IPO screen shows it instead of `price_micros`.
          examples: [{price_micros: 185000000, as_of: "2026-10-20"}]
          x-go-type: PreIpoEstimate
          additionalProperties: false
          required: [price_micros, as_of]
          properties:
            price_micros: {type: integer, format: int64, description: The estimate per share in USD micros., examples: [185000000]}
            as_of: {type: string, format: date, description: The day the estimate was set., examples: ["2026-10-20"]}
    AssetListing:
      type: object
      description: Another listing of the same company, without a price.
      examples:
        - symbol: AAPLy
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: null
          tradable: false
      additionalProperties: false
      required: [symbol, display_name, issuer, kind, logo_url, tradable]
      properties:
        symbol:
          type: string
          description: The other listing's ticker.
          examples: [AAPLy]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLy.png"]
        tradable:
          type: boolean
          description: True when this listing can be bought.
          examples: [false]
    UiMultiplier:
      type: object
      description: The whole tokens in one display unit, as an exact fraction.
      examples:
        - num: 1
          den: 1
      additionalProperties: false
      required: [num, den]
      properties:
        num:
          type: integer
          format: int64
          description: The numerator.
          examples: [1]
        den:
          type: integer
          format: int64
          description: The denominator.
          examples: [1]
    AssetDetail:
      type: object
      description: One asset, the list fields plus the chain facts and the other listings.
      examples:
        - id: 01890a5d-ac96-774b-bcce-b302099a8070
          symbol: AAPLx
          display_name: Apple
          issuer: xstocks
          kind: equity
          logo_url: "https://cdn.example.com/AAPLx.png"
          price_micros: 110000000
          price_as_of: "2026-03-04T14:30:00Z"
          change_bps: 1000
          sparkline_micros: [100000000, 110000000]
          volume_24h_micros: 2500000000000
          volume_24h_as_of: "2026-03-04T05:00:00Z"
          quotable: true
          session:
            state: open
            continuous: false
            holiday: ""
            early_close: false
            next_state: after_hours
            next_transition: "2026-03-04T21:00:00Z"
          decimals: 8
          ui_multiplier:
            num: 1
            den: 1
          tradable: true
          other_listings: []
          attribution: Data provided by CoinGecko
          price_source: jupiter
          price_poll_interval_seconds: 120
          stats:
            market_cap_micros: "2970000000000000000"
            open_micros: 108000000
            year_low_micros: 86620000
            year_high_micros: 224900000
            held_by_cabals: 3
      additionalProperties: false
      required:
        - id
        - symbol
        - display_name
        - issuer
        - kind
        - logo_url
        - price_micros
        - price_as_of
        - change_bps
        - sparkline_micros
        - volume_24h_micros
        - volume_24h_as_of
        - session
        - quotable
        - decimals
        - ui_multiplier
        - tradable
        - other_listings
        - attribution
        - price_source
        - price_poll_interval_seconds
        - stats
      properties:
        id:
          type: string
          format: uuid
          description: The asset's id, as `StockAttachmentInput.asset_id` takes it.
          examples: [01890a5d-ac96-774b-bcce-b302099a8070]
        symbol:
          type: string
          description: The ticker the app shows and the path key for the asset.
          examples: [AAPLx]
        display_name:
          type: string
          description: The company name the app shows.
          examples: [Apple]
        issuer:
          $ref: "#/components/schemas/AssetIssuer"
          description: The firm that issues the token.
          examples: [xstocks]
        kind:
          $ref: "#/components/schemas/AssetKind"
          description: Equity or pre-IPO.
          examples: [equity]
        logo_url:
          type: [string, "null"]
          description: The logo URL. Null when the catalog has none.
          examples: ["https://cdn.example.com/AAPLx.png"]
        price_micros:
          type: [integer, "null"]
          format: int64
          description: The held USD price in micros. Null when the asset is unpriced.
          examples: [110000000]
        price_as_of:
          type: [string, "null"]
          format: date-time
          description: When `price_micros` was sampled. Null when the asset is unpriced.
          examples: ["2026-03-04T14:30:00Z"]
        stale:
          type: boolean
          description: >-
            True when `price_micros` is older than the freshness limit: 15 minutes in an open,
            pre-market, after-hours or continuous session, and more than a day before the last close
            in a closed one. The app marks the price Delayed instead of showing it as live. Absent
            when the asset is unpriced.
          examples: [false]
        change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last US close while the market is open, and against
            the close before the last session from that session's close until the next open, so the
            headline keeps describing the session's change after 16:00. For a pre-IPO token it is
            against the first sample of the UTC day. Null when that reference does not exist.
          examples: [1000]
        after_hours_change_bps:
          type: [integer, "null"]
          format: int32
          description: >-
            The move in basis points against the last session's close, present for an equity when the
            market is not open and the close is known. Absent or null otherwise.
          examples: [20]
        sparkline_micros:
          type: [array, "null"]
          description: The last day of closes in 30-minute buckets, at most 48. Null when unpriced.
          maxItems: 48
          items:
            type: integer
            format: int64
            examples: [110000000]
          examples: [[100000000, 110000000]]
        volume_24h_micros:
          type: [integer, "null"]
          format: int64
          description: >-
            The token's trading volume over the last 24 hours in USD micros, as CoinGecko reports it
            across the venues it tracks. Null when there is no reading from the last 36 hours.
          examples: [2500000000000]
        volume_24h_as_of:
          type: [string, "null"]
          format: date-time
          description: When that reading was taken. Null when `volume_24h_micros` is null.
          examples: ["2026-03-04T05:00:00Z"]
        quotable:
          type: boolean
          description: >-
            False when Jupiter has not priced this asset in the last 15 minutes, so a buy would find
            no route. The app marks it Paused and disables Buy.
          examples: [true]
        session:
          $ref: "#/components/schemas/MarketSession"
          description: The session this asset is in.
          examples:
            - state: open
              continuous: false
              holiday: ""
              early_close: false
              next_state: after_hours
              next_transition: "2026-03-04T21:00:00Z"
        decimals:
          type: integer
          minimum: 0
          maximum: 255
          description: The mint's decimals.
          examples: [8]
        ui_multiplier:
          $ref: "#/components/schemas/UiMultiplier"
          description: The whole tokens in one display unit.
          examples:
            - num: 1
              den: 1
        tradable:
          type: boolean
          description: >-
            True when this asset can be bought. For a `pre_ipo` asset, `true` is "Eligible" (a cabal can vote
            to buy it) and `false` is "Research only".
          examples: [true]
        other_listings:
          type: array
          description: The other assets that share this company's key. This asset is not in the list.
          examples:
            - - symbol: AAPLy
                display_name: Apple
                issuer: xstocks
                kind: equity
                logo_url: "https://cdn.example.com/AAPLy.png"
                tradable: false
          items:
            $ref: "#/components/schemas/AssetListing"
        attribution:
          type: string
          description: The data source line the asset screen shows.
          examples: ["Data provided by CoinGecko"]
        price_source:
          type: [string, "null"]
          enum: [jupiter, coingecko, null]
          description: The provider of the sample behind `price_micros` and `price_as_of`. Null when unpriced.
          examples: [jupiter]
        price_poll_interval_seconds:
          type: integer
          minimum: 1
          description: >-
            How often Monaco asks its provider for a new price, in seconds. A cadence, not a promise:
            `price_as_of` says how old the shown price is.
          examples: [120]
        stats:
          type: [object, "null"]
          description: >-
            The market stats of an equity. Six cells, always drawn: a null value is shown as a dash, never
            hidden. The cells are market cap, volume (`volume_24h_micros`), open, 52-week low, 52-week high and
            held by. Null for a `pre_ipo` asset, which shows its round stats instead.
          examples: [null]
          x-go-type-name: AssetStats
          additionalProperties: false
          required: [market_cap_micros, open_micros, year_low_micros, year_high_micros, held_by_cabals]
          properties:
            market_cap_micros:
              type: [string, "null"]
              pattern: "^[0-9]+$"
              description: >-
                The company's shares outstanding times `price_micros`, in USD micros as a decimal string. Null
                when the company has no filing on record or the asset is unpriced.
              examples: ["5380000000000000000"]
            open_micros:
              type: [integer, "null"]
              format: int64
              description: >-
                The first accepted price of the current US session, or of the last session when the market is
                closed or has not opened yet, in USD micros. Null when that session has no price.
              examples: [211170000]
            year_low_micros:
              type: [integer, "null"]
              format: int64
              description: >-
                The lowest accepted price over the last 52 weeks in USD micros, intraday included from 2026-10-28
                on and daily points before. Null when the history does not cover 52 weeks.
              examples: [86620000]
            year_high_micros:
              type: [integer, "null"]
              format: int64
              description: >-
                The highest accepted price over the last 52 weeks in USD micros, intraday included from 2026-10-28
                on and daily points before. Null when the history does not cover 52 weeks.
              examples: [224900000]
            held_by_cabals:
              type: integer
              minimum: 0
              description: >-
                How many active cabals hold the asset with units above zero. The count never names the cabals.
              examples: [1]
        pre_ipo:
          type: [object, "null"]
          description: >-
            The curated profile of a `pre_ipo` company: its secondary estimate, rounds and round stats. Null for
            equities and for a Pre-IPO asset without a profile; the field is then absent.
          examples: [null]
          x-go-type-name: PreIpoProfile
          additionalProperties: false
          required: [estimate, valuation_micros, last_round, rounds, min_order_micros, sell_window, next_tender_on, image_url]
          properties:
            estimate: {$ref: "#/components/schemas/PreIpoEstimate"}
            valuation_micros: {type: string, pattern: "^[0-9]+$", description: "The company valuation in USD micros, as a decimal string.", examples: ["350000000000000000"]}
            last_round: {type: [object, "null"], x-go-type: PreIpoRound, description: "The newest round, or null when the company has none on record.", examples: [null], additionalProperties: false, required: [on, price_micros], properties: {on: {type: string, format: date, examples: ["2026-06-01"]}, price_micros: {type: integer, format: int64, examples: [165000000]}}}
            rounds: {type: array, maxItems: 24, description: "The funding rounds, oldest first.", examples: [[]], items: {$ref: "#/components/schemas/PreIpoRound"}}
            min_order_micros: {type: integer, format: int64, description: The smallest order in USD micros., examples: [10000000]}
            sell_window: {$ref: "#/components/schemas/PreIpoSellWindow"}
            next_tender_on: {type: [string, "null"], format: date, description: "The next tender day. Null when the company has none scheduled or sells any time.", examples: [null]}
            image_url: {type: [string, "null"], description: "A licensed company image, or null.", examples: [null]}
    PreIpoEstimate:
      type: object
      description: The secondary estimate of a Pre-IPO company, per share.
      examples:
        - price_micros: 185000000
          as_of: "2026-10-20"
      additionalProperties: false
      required: [price_micros, as_of]
      properties:
        price_micros: {type: integer, format: int64, description: The estimate per share in USD micros., examples: [185000000]}
        as_of: {type: string, format: date, description: The day the estimate was set., examples: ["2026-10-20"]}
    PreIpoRound:
      type: object
      description: One funding round of a Pre-IPO company.
      examples:
        - on: "2026-06-01"
          price_micros: 165000000
      additionalProperties: false
      required: [on, price_micros]
      properties:
        on: {type: string, format: date, description: The day the round priced., examples: ["2026-06-01"]}
        price_micros: {type: integer, format: int64, description: The round price per share in USD micros., examples: [165000000]}
    PreIpoSellWindow:
      type: string
      description: "`any_time` sells at any time; `tender_quarterly` sells in a quarterly tender."
      enum: [any_time, tender_quarterly]
      examples: [any_time]
    ChartPoint:
      type: object
      description: One bucket of open, high, low and close, in USD micros.
      examples:
        - t: "2026-03-04T14:55:00Z"
          open_micros: 100000000
          high_micros: 130000000
          low_micros: 90000000
          close_micros: 110000000
      additionalProperties: false
      required:
        - t
        - open_micros
        - high_micros
        - low_micros
        - close_micros
      properties:
        t:
          type: string
          format: date-time
          description: The start of the bucket.
          examples: ["2026-03-04T14:55:00Z"]
        open_micros:
          type: integer
          format: int64
          description: The first sample in the bucket, in USD micros.
          examples: [100000000]
        high_micros:
          type: integer
          format: int64
          description: The highest sample in the bucket, in USD micros.
          examples: [130000000]
        low_micros:
          type: integer
          format: int64
          description: The lowest sample in the bucket, in USD micros.
          examples: [90000000]
        close_micros:
          type: integer
          format: int64
          description: The last sample in the bucket, in USD micros.
          examples: [110000000]
    AssetChart:
      type: object
      description: The buckets for one asset and one range.
      examples:
        - range: 1D
          interval: 5m
          bucket_seconds: 300
          points:
            - t: "2026-03-04T14:55:00Z"
              open_micros: 100000000
              high_micros: 130000000
              low_micros: 90000000
              close_micros: 110000000
          empty: false
          attribution: Data provided by CoinGecko
          next_before: "2026-03-04T14:55:00Z"
      additionalProperties: false
      required:
        - range
        - interval
        - bucket_seconds
        - points
        - empty
        - attribution
        - next_before
      properties:
        range:
          type: string
          description: The range that was requested.
          enum: [1H, 1D, 1W, 1M, 3M, 6M, 1Y, ALL]
          examples: [1D]
        interval:
          type: string
          description: The effective bar width.
          enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w]
          examples: [5m]
        bucket_seconds:
          type: integer
          format: int64
          minimum: 1
          description: The width of each bucket, in seconds. Equals `interval` in seconds.
          examples: [300]
        points:
          type: array
          description: The buckets in time order. Empty when the asset has no samples in the range.
          examples:
            - - t: "2026-03-04T14:55:00Z"
                open_micros: 100000000
                high_micros: 130000000
                low_micros: 90000000
                close_micros: 110000000
          items:
            $ref: "#/components/schemas/ChartPoint"
        empty:
          type: boolean
          description: True when `points` is empty.
          examples: [false]
        attribution:
          type: string
          description: The data source line the chart shows.
          examples: ["Data provided by CoinGecko"]
        next_before:
          type: [string, "null"]
          format: date-time
          description: The `before` to send for older bars. Null when none exist.
          examples: ["2026-03-04T14:55:00Z"]
        previous_close_micros:
          type: integer
          format: int64
          description: >-
            The day-change base in USD micros, the price the header's day change is measured from.
            Set only when `range` is `1D`, no `before` was sent, and the base sample exists.
          examples: [100000000]
    AssetQuotes:
      type: object
      description: The quotes of the assets that were asked for and are known.
      examples:
        - assets:
            - id: 01890a5d-ac96-774b-bcce-b302099a8070
              symbol: AAPLx
              display_name: Apple
              issuer: xstocks
              kind: equity
              logo_url: "https://cdn.example.com/AAPLx.png"
              price_micros: 110000000
              price_as_of: "2026-03-04T14:30:00Z"
              change_bps: 1000
              sparkline_micros: [100000000, 110000000]
              volume_24h_micros: 2500000000000
              volume_24h_as_of: "2026-03-04T05:00:00Z"
              quotable: true
              session:
                state: open
                continuous: false
                holiday: ""
                early_close: false
                next_state: after_hours
                next_transition: "2026-03-04T21:00:00Z"
              tradable: true
      required: [assets]
      properties:
        assets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AssetSummary"
      additionalProperties: false
    AssetList:
      type: object
      description: One page of the tradable catalog.
      examples:
        - assets:
            - id: 01890a5d-ac96-774b-bcce-b302099a8070
              symbol: AAPLx
              display_name: Apple
              issuer: xstocks
              kind: equity
              logo_url: "https://cdn.example.com/AAPLx.png"
              price_micros: 110000000
              price_as_of: "2026-03-04T14:30:00Z"
              change_bps: 1000
              sparkline_micros: [100000000, 110000000]
              volume_24h_micros: 2500000000000
              volume_24h_as_of: "2026-03-04T05:00:00Z"
              quotable: true
              session:
                state: open
                continuous: false
                holiday: ""
                early_close: false
                next_state: after_hours
                next_transition: "2026-03-04T21:00:00Z"
          next_cursor: null
      additionalProperties: false
      required: [assets, next_cursor]
      properties:
        assets:
          type: array
          description: The page, in the filter's order.
          examples: [[]]
          items:
            $ref: "#/components/schemas/AssetSummary"
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page. Null on the last page.
          examples: [null]
    AssetBestChain:
      type: object
      description: >-
        The chain a $1 buy of the asset gets the most underlying shares on, after every cost, with every
        chain's figures.
      additionalProperties: false
      required: [symbol, amount_micros, network, venue, listing_id, net_share_nanos, quoted_at, price_comparison]
      properties:
        symbol: {type: string, description: The ticker asked for., examples: [AAPLx]}
        amount_micros: {type: string, pattern: "^[0-9]+$", description: "The USDC buy quoted, in micros. Always $1.", examples: ["1000000"]}
        network: {$ref: "#/components/schemas/Network"}
        venue: {type: string, enum: [jupiter, uniswap], description: Where the winning swap would run., examples: [jupiter]}
        listing_id: {type: string, format: uuid, description: The winning listing., examples: [01928a6e-0000-7000-8000-000000000001]}
        net_share_nanos: {type: string, pattern: "^[0-9]+$", description: "Underlying shares $1 buys on the winning chain after every cost, in billionths of a share.", examples: ["4000000"]}
        quoted_at: {type: string, format: date-time, description: When the chains were quoted., examples: ["2026-10-11T12:00:00Z"]}
        price_comparison: {$ref: "#/components/schemas/PriceComparison"}
        stale: {type: boolean, description: "True when the figures are the last good answer, served because a fresh quote did not arrive in about a second.", examples: [false]}
