services:
  postgres:
    image: postgres:16-alpine
    container_name: monaco-postgres
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monaco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monaco}
      POSTGRES_DB: ${POSTGRES_DB:-monaco}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - monaco_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monaco} -d ${POSTGRES_DB:-monaco}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  nats:
    image: nats:2-alpine
    container_name: monaco-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - monaco_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  postgres-test:
    image: postgres:16-alpine
    container_name: monaco-postgres-test
    profiles: [test]
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monaco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monaco}
      POSTGRES_DB: ${POSTGRES_DB:-monaco}
    ports:
      - "54323:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monaco} -d ${POSTGRES_DB:-monaco}"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  monaco_pg_data:
  monaco_nats_data:
