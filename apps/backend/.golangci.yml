    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - nilerr
    - nilnil
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - durationcheck
    - makezero
    - copyloopvar
    - exhaustive
    - gosec
    - musttag
    - asasalint
    - reassign
    - errorlint
    - wrapcheck
    - errname
    - err113
    - contextcheck
    - containedctx
    - fatcontext
    - noctx
    - spancheck
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - ireturn
    - interfacebloat
    - cyclop
    - gocognit
    - funlen
    - nestif
    - maintidx
    - revive
    - gocritic
    - unparam
    - unconvert
    - usestdlibvars
    - intrange
    - perfsprint
    - prealloc
    - sloglint
    - predeclared
    - exptostd
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting
