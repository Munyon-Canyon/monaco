# Code generated by scripts/gen-golangci from .golangci.base.yml and internal/modules/*/lint.yml. DO NOT EDIT.
version: "2"
run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  build-tags: [faultpoints]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - nilerr
    - nilnil
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - durationcheck
    - makezero
    - copyloopvar
    - exhaustive
    - gosec
    - musttag
    - asasalint
    - reassign
    - errorlint
    - wrapcheck
    - errname
    - err113
    - contextcheck
    - containedctx
    - fatcontext
    - noctx
    - spancheck
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - ireturn
    - interfacebloat
    - cyclop
    - gocognit
    - funlen
    - nestif
    - maintidx
    - revive
    - gocritic
    - unparam
    - unconvert
    - usestdlibvars
    - intrange
    - perfsprint
    - prealloc
    - sloglint
    - predeclared
    - exptostd
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting
  settings:
    cyclop: { max-complexity: 12 }
    gocognit: { min-complexity: 15 }
    funlen: { lines: 70, statements: 40 }
    nestif: { min-complexity: 4 }
    exhaustive: { default-signifies-exhaustive: false }
    sloglint: { attr-only: true, context: all, static-msg: true, no-global: all }
    interfacebloat: { max: 5 }
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - 'github\.com/monaco/monaco/apps/backend/internal/events\.Event$'
        - 'github\.com/monaco/monaco/apps/backend/internal/platform/db/sqlc\.DBTX$'
    reassign: { patterns: [".*"] }
    wrapcheck:
      ignore-package-globs: ["github.com/monaco/monaco/apps/backend/internal/*"]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(fmt\.Print.*|print|println)$'
          msg: use slog
        - pattern: '^context\.(Background|TODO)$'
          msg: only main, tests and bus roots create root contexts
        - pattern: '^time\.(Now|Since|Until)$'
          msg: inject platform/clock.Clock
        - pattern: '^os\.Getenv$'
          msg: read config through platform/config at boot
        - pattern: '^float(32|64)$'
          msg: money is integer base units (platform/money)
        - pattern: '^log\.'
          msg: use slog
        - pattern: '^(pgxpool\.New|pgx\.Connect|sql\.Open|nats\.Connect)$'
          msg: platform/db, platform/bus and testkit own connections
        - pattern: '^errors\.New$'
          msg: every error carries a Code; use errs.New
        - pattern: '^slog\.(Logger\.)?(Error|Warn)(Context)?$'
          msg: modules return errors; boundaries log them once
        - pattern: '^uuid\.(MustParse|Must)$'
          msg: fixtures take ids from the injected generator
        - pattern: '^rand\.(Int.*|Uint.*|Float.*|N|NormFloat64|ExpFloat64|Perm|Shuffle|Read|Seed)$'
          pkg: '^math/rand(/v2)?$'
          msg: inject the random source from platform
        - pattern: '^uuid\.New(V7)?$'
          msg: inject the id generator from platform
        - pattern: '^time\.Sleep$'
          msg: tests wait on a signal; use synctest.Test, testkit.Eventually or testkit.AssertNoRedelivery
        - pattern: '^(pgx\.Tx|pgx\.Conn|pgxpool\.Pool|pgxpool\.Conn|pgxpool\.Tx)\.(Begin|BeginTx|Commit)$'
          msg: open transactions through platform/db UnitOfWork
        - pattern: '^pgx\.(BeginFunc|BeginTxFunc)$'
          msg: open transactions through platform/db UnitOfWork
        - pattern: '^http\.(DefaultClient|Get|Post|PostForm|Head)$'
          msg: outbound HTTP goes through platform/httpclient
    depguard:
      rules:
        domain:
          files: ["**/domain/**"]
          deny:
            - { pkg: "github.com/jackc/pgx", desc: "domain is pure" }
            - { pkg: "github.com/nats-io", desc: "domain is pure" }
            - { pkg: "net/http", desc: "domain is pure" }
            - { pkg: "github.com/monaco/monaco/apps/backend/internal/platform/db", desc: "domain is pure" }
            - { pkg: "github.com/monaco/monaco/apps/backend/internal/platform/bus", desc: "domain is pure" }
        app:
          files: ["**/app/**"]
          deny:
            - { pkg: "github.com/jackc/pgx", desc: "declare a port" }
            - { pkg: "github.com/nats-io", desc: "emit via Tx.Events" }
            - { pkg: "net/http", desc: "use cases are transport-free" }
        boundary:
          files:
            - "$all"
            - "!**/internal/platform/**"
            - "!**/internal/testkit/**"
            - "!**/cmd/**"
          deny:
            - pkg: "github.com/monaco/monaco/apps/backend/internal/platform/observability/boundary"
              desc: "modules return errors; only platform, testkit and cmd log Warn and Error"
        nats:
          files:
            - "$all"
            - "!**/internal/platform/bus/**"
            - "!**/internal/testkit/**"
          deny:
            - pkg: "github.com/nats-io/nats.go$"
              desc: "only platform/bus and testkit open NATS connections; use bus.Connect"
        # BEGIN GENERATED depguard
        module-system: { list-mode: lax, files: ["**/internal/modules/system/**"], allow: ["github.com/monaco/monaco/apps/backend/internal/modules/system$", "github.com/monaco/monaco/apps/backend/internal/modules/system/"], deny: [{ pkg: "github.com/monaco/monaco/apps/backend/internal/modules/", desc: "modules never import each other; send an event or use a query port" }] }
        # END GENERATED depguard
  exclusions:
    presets: [comments]
    rules:
      - path: _test\.go$
        linters: [funlen, err113, wrapcheck]
      - path: ^internal/(platform/lint|tools/gen)/.*_test\.go$
        linters: [gosec]
      - path: _test\.go$
        linters: [gosec]
        text: G404
      - path: _test\.go$
        linters: [forbidigo]
        text: only main, tests and bus roots create root contexts
      - path: main_test\.go$
        linters: [gochecknoglobals]
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^internal/platform/(db|bus|httpx|observability|lint)/
        linters: [forbidigo]
      - path: ^internal/errs/
        linters: [forbidigo]
      - path: ^internal/testkit/
        linters: [forbidigo]
      - path: ^internal/testkit/(seed|db|nats|perf|chaos/seeds)\.go$
        linters: [gochecknoglobals]
        text: seedFlag|current|natsCurrent|perfUpdate|baselineMu
      # testing.AllocsPerRun reads the process-wide malloc counter, so allocation tests run alone (#721).
      - path: allocs_test\.go$
        linters: [paralleltest]
      # goleak.IgnoreCurrent snapshots every goroutine, so the Close leak check runs alone (#801).
      - path: ^internal/platform/bus/close_test\.go$
        linters: [paralleltest]
      - path: ^internal/testkit/(db|mainproc)\.go$
        linters: [gosec]
        text: G204
      - path: ^internal/testkit/db\.go$
        linters: [revive]
        text: blank-imports
      - path: ^internal/platform/config/config\.go$
        linters: [gosec]
        text: "G101: Potential hardcoded credentials: Password in URL"
      - path: ^internal/(testkit/ids|testkit/consumer|testkit/chaos/dispatch|platform/db/uow)\.go$
        linters: [gosec]
        text: G404
      - path: ^internal/platform/db/idempotency\.go$
        linters: [gosec]
        text: G115
      - path: ^internal/testkit/clock\.go$
        linters: [ireturn]
      # A meter double must return the otel instrument interface to exercise NewRunner's error branch.
      - path: ^internal/platform/poller/poller_test\.go$
        linters: [ireturn]
      - path: ^internal/platform/db/idempotency_test\.go$
        linters: [ireturn]
      # A failing sqlc.DBTX double has to return the pgx row interfaces to reach Take's store-error branches.
      - path: ^internal/platform/httpx/ratelimit/take_test\.go$
        linters: [ireturn]
      - path: ^internal/testkit/.*_test\.go$
        linters: [gosec]
        text: G204
      - path: ^internal/testkit/perf(_internal_test)?\.go$
        linters: [gosec]
        text: G304
      - path: ^scripts/
        linters: [gosec, err113]
      - path: ^cmd/monacoctl/flows(_test)?\.go$
        linters: [gosec]
        text: "G204|G703"
      - path: ^cmd/monacoctl/(migrate|bench)(_test)?\.go$
        linters: [gosec]
        text: G204|G702|G306|G304
      - path: ^cmd/monacoctl/agents/
        linters: [gosec]
        text: G204|G304|G403
      - path: ^cmd/monacoctl/agents/.*_test\.go$
        linters: [cyclop, gocognit, maintidx, revive]
      - path: ^cmd/monacoctl/(coverage|mutation)(_test)?\.go$
        linters: [gosec]
        text: G204|G304
      - path: ^cmd/monacoctl/verify/
        linters: [gosec]
        text: G101|G204|G304|G306
      - path: ^internal/platform/lint/nogo/
        linters: [nilnil]
      # The log message registry is package-level so call sites name a Msg and the registry test can read it.
      - path: ^internal/platform/observability/msgs(_\w+)?\.go$
        linters: [gochecknoglobals]
      # Generated per-file init functions add each tool or module here, so no shared list conflicts.
      - path: ^cmd/(api|monacoctl|worker)/registry\.go$
        linters: [gochecknoglobals]
      # MONACO_FAULTPOINT arms a crash point for the whole process, so the armed name is process state.
      - path: ^internal/platform/faultpoint/hit_on\.go$
        linters: [gochecknoglobals]
      # Crash is a panic value, not a returned error; the name reads at the recover site.
      - path: ^internal/platform/faultpoint/faultpoint\.go$
        linters: [errname]
      # AllocsPerRun counts process-wide mallocs and Configure arms the process, so these must not overlap parallel tests.
      - path: ^internal/platform/faultpoint/(alloc|hit_on)_test\.go$
        linters: [paralleltest]
      # The one place that turns a registered Msg into a slog call; call sites pass a Msg, never a string.
      - path: ^internal/platform/observability/internal/emit/
        linters: [sloglint]
        text: message should be a string literal or a constant
      - path: ^internal/platform/clock/
        linters: [forbidigo]
        text: inject platform/clock\.Clock
      - path: ^internal/platform/clock/
        linters: [ireturn]
      # oapi-codegen strict handlers must return the generated per-operation response interface.
      - linters: [ireturn]
        text: returns interface \(github\.com/monaco/monaco/apps/backend/internal/platform/httpx/api\.\w+ResponseObject\)
      # A fake OTel meter has to return the metric interfaces it implements.
      - path: ^internal/platform/(bus/meter|httpx/sse/hub)_test\.go$|^internal/testkit/meters\.go$
        linters: [ireturn]
      - path: ^internal/platform/bus/(dispatch|start_internal)_test\.go$
        linters: [ireturn]
      - path: ^internal/platform/
        linters: [forbidigo]
        text: inject the (random source|id generator) from platform
      - path: ^internal/platform/httpclient/
        linters: [forbidigo]
        text: outbound HTTP goes through platform/httpclient
      - path: ^internal/platform/httpclient/
        linters: [gosec]
        text: G404|G704
      - path-except: _test\.go$
        linters: [forbidigo]
        text: tests wait on a signal
      - path-except: ^internal/(modules|events|platform/money)/
        linters: [forbidigo]
        text: money is integer base units
      # BEGIN GENERATED exclusions
      # END GENERATED exclusions
formatters:
  enable: [gofumpt, gci, golines]
  settings:
    gci: { sections: [standard, default, localmodule] }
    golines: { max-len: 120 }
