version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/platform
    gen:
      go:
        package: sqlc
        out: internal/platform/db/sqlc
        sql_package: pgx/v5
        emit_interface: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  # BEGIN GENERATED modules
  - engine: postgresql
    schema: migrations
    queries: queries/system
    gen:
      go:
        package: sqlc
        out: internal/modules/system/sqlc
        sql_package: pgx/v5
        emit_interface: false
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  # END GENERATED modules
