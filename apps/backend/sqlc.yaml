version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/platform
    gen:
      go:
        package: sqlc
        out: internal/platform/db/sqlc
        sql_package: pgx/v5
        emit_interface: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  # BEGIN GENERATED modules
  # END GENERATED modules
