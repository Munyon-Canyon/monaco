name: Checkpoint

# A checkpoint is a PR into main from a feature branch <name>-<N> that carries the integration label.
# docs/architecture/ci.md#feature-branches
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  detect:
    name: Detect a checkpoint
    if: >-
      github.event.pull_request.merged &&
      contains(github.event.pull_request.labels.*.name, 'integration') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checkpoint: ${{ steps.name.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - id: name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if scripts/ci/feature-branch-name.sh "$HEAD_REF" >/dev/null; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_REF is not a feature branch <name>-<N>, so this merge is not a checkpoint."
          fi

  tree-matches:
    name: Main matches the feature branch
    needs: detect
    if: needs.detect.outputs.checkpoint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - env:
          GH_TOKEN: ${{ github.token }}
          SQUASH: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/checkpoint-tree.sh "$SQUASH" "$HEAD"

  next-branch:
    name: Cut the next feature branch from main
    needs: tree-matches
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - env:
          GH_TOKEN: ${{ secrets.MERGE_BACK_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SQUASH: ${{ github.event.pull_request.merge_commit_sha }}
        run: scripts/ci/next-branch.sh "$HEAD_REF" "$SQUASH"
