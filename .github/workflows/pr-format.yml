name: PR format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  # pr-format and pr-size take their verdict from the checkers at the base commit. The merge ref carries the PR's own
  # copy, and GitHub keeps serving the old merge ref for a while after a base change, so a job on it ran an old checker
  # on the new base. The unit tests run from the head, so a PR that edits a checker still runs its own tests. They run
  # after the verdict, even a failed one, because the head's tests import the head's checker. Run first, that code
  # could rewrite the copy that judges the PR.
  pr-format:
    name: PR format (title, body and commits)
    # The Graphite merge queue waits for every required check on its gtmq_ draft. Each PR was checked on its own head.
    if: ${{ !github.event.pull_request.draft || startsWith(github.head_ref, 'gtmq_') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pass the merge queue draft
        if: startsWith(github.head_ref, 'gtmq_')
        run: echo "Each PR in the queue draft passed this check on its own head."
      - uses: actions/checkout@v4
        if: ${{ !startsWith(github.head_ref, 'gtmq_') }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the head commit
        if: ${{ !startsWith(github.head_ref, 'gtmq_') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Check title, body and commits
        if: ${{ !startsWith(github.head_ref, 'gtmq_') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/check-pr-format.py
      - name: Checker unit tests
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'gtmq_') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          python3 "$RUNNER_TEMP/head/scripts/test_check_pr_format.py"

  pr-size:
    name: PR size (under 1000 lines)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # pr-size is not a required check, so a red run alone does not stop the Graphite merge queue. The job takes
    # fast-track off a PR of 100 or more lines itself.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Check size
        id: size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-pr-size.py
      - name: Take fast-track off a PR of 100 or more lines
        if: failure() && steps.size.outputs.fast_track_too_big == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --remove-label fast-track
      - name: Checker unit tests
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          python3 "$RUNNER_TEMP/head/scripts/test_check_pr_size.py"

  gate-changes:
    name: Gate changes (no weakened test gate)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checker unit tests
        run: python3 scripts/test_check_gate_changes.py
      - name: Check gate changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/check-gate-changes.py

  changelog:
    name: Changelog (checkpoint into main)
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect a checkpoint
        id: detect
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == staging ]]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_REF is not staging, so this PR is not a checkpoint."
          fi
      - name: Checker unit tests
        if: steps.detect.outputs.checkpoint == 'true'
        run: python3 scripts/test_check_changelog.py
      - name: Check the backend CHANGELOG
        if: steps.detect.outputs.checkpoint == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-changelog.py "$BASE_SHA" "$HEAD_SHA"
