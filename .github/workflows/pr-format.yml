name: PR format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-format:
    name: PR format (title and body)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Checker unit tests
        run: python3 scripts/test_check_pr_format.py
      - name: Check title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-pr-format.py
