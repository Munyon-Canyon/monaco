name: Staging

# The full suite on every push to staging, as an indicator only: no ruleset requires it and nothing waits on it.
# A PR's own run already gated what lands; this run tests the combined trunk, which the light queue check does
# not. The README badge shows its result. docs/architecture/ci.md#check-stages
on:
  push:
    branches: [staging]
  workflow_dispatch:

# One run at a time and none cancelled: a newer push waits behind the active run, replacing any older pending one.
concurrency:
  group: staging-ci
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  staging:
    uses: ./.github/workflows/ci-jobs.yml
    with:
      stage: staging

  # Each backend leg above saves a per-SHA Go cache (ci-jobs.yml). Keep the newest per leg on this ref.
  prune:
    needs: [staging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune superseded Go caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          PREFIX: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
        run: |
          scripts/ci/prune-caches.sh "$REF" \
            "${PREFIX}short-1-" "${PREFIX}short-2-" "${PREFIX}rest-1-" "${PREFIX}rest-2-"
