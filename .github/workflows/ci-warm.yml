name: Warm the mobile caches

# PR runs restore the mobile caches and never save them, and a run can restore only caches saved
# on its own branch or its base branch. So a push to a base branch saves them here. No required
# check runs in this workflow, so it may filter on paths. docs/architecture/ci.md#fast-and-deterministic
on:
  push:
    branches: [main, 'backend-rewrite*']
    paths:
      - apps/mobile/**
      - packages/mobile-core/**
      - apps/backend/api/openapi.yaml
      - .xcode-version
      - .github/workflows/ci-warm.yml
      - .github/workflows/ci-ios.yml
      - .github/workflows/ci-mobile-core.yml

permissions:
  contents: read

jobs:
  ios:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-ios.yml
    with:
      save-cache: true

  mobile-core:
    uses: ./.github/workflows/ci-mobile-core.yml
    with:
      save-cache: true

  # One Actions cache per prefix on this ref. xcode-cas-* and spm-ios-* artifacts
  # uploaded by ci-ios.yml are outside the 10 GB cache and are not pruned.
  # ci-ios.yml restores spm-ios- and does not save it, so that prefix is absent.
  # A list or delete error must not fail the warm run.
  prune:
    needs: [ios, mobile-core]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune superseded mobile caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: scripts/ci/prune-caches.sh "$REF" xcode-cas-macOS- swiftpm-linux-6.3- swiftpm-macos-
