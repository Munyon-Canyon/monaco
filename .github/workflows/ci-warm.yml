name: Warm the mobile caches

# PR runs restore the Linux mobile-core cache and never save it, and a run can
# restore only caches saved on its own branch, its base branch or the default
# branch (staging). So a push to a base branch saves it here. No required check runs in this workflow, so it may
# filter on paths. docs/architecture/ci.md#fast-and-deterministic
on:
  push:
    branches: [staging, main, 'backend-rewrite*']
    paths:
      - packages/mobile-core/**
      - apps/backend/api/openapi.yaml
      - .github/workflows/ci-warm.yml
      - .github/workflows/ci-mobile-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-core:
    uses: ./.github/workflows/ci-mobile-core.yml
    with:
      save-cache: true

  # One Actions cache per prefix on this ref and on main.
  prune:
    needs: [mobile-core]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune superseded mobile caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          scripts/ci/prune-caches.sh "$REF" swiftpm-linux-6.3-
          if [[ "$REF" != "refs/heads/main" ]]; then
            scripts/ci/prune-caches.sh refs/heads/main swiftpm-linux-6.3-
          fi
