name: Warm the Go cache for staging

# PR and merge-queue runs restore the Go cache through backend-test-env and never save it. A run can
# restore caches saved on its own ref, its base branch and the default branch (staging), so every
# push to staging or main saves a fresh one here, build cache included. The key matches nightly.yml's
# warm-cache job.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Build apps/backend and save the Go cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: 'false'

      - name: Build apps/backend
        working-directory: apps/backend
        run: go build ./...

      # Compile the test binaries with the flags scripts/test-backend.sh uses, so PR test legs hit the
      # build cache. -c only compiles: many TestMains need the test Postgres, which this job lacks.
      - name: Compile apps/backend tests
        working-directory: apps/backend
        run: |
          go test -c -o "$RUNNER_TEMP/tests-faultpoints/" -tags faultpoints -race -coverpkg=./... ./...
          go test -c -o "$RUNNER_TEMP/tests/" -race ./...

      - uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # One Go cache per ref: each push saves a new per-SHA key.
  prune:
    needs: [warm]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune superseded Go caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: scripts/ci/prune-caches.sh "$REF" "go-${{ runner.os }}-"
