name: CI iOS

# Called from ci-jobs.yml's ios job. Kept in its own file so the `plan` job's `ios` path
# filter can key on this file instead of every `ci*.yml`, which every backend PR touches.
# workflow_dispatch runs it alone on a branch, to measure the build. docs/architecture/ci.md#triggers
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the compilation cache. PRs restore and never save.
        type: boolean
        default: false
      restore-cache:
        description: Restore the compilation cache and the warm artifacts. A dispatch can turn this off to measure a cold build.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the compilation cache.
        type: boolean
        default: false
      restore-cache:
        description: Restore the compilation cache and the warm artifacts. Turn this off to measure a cold build.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS app (build, MonacoTests)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # actions/cache rejects a path with `..` in it, so this resolves github.workspace/../DerivedData
      # to the same directory without one. The path must not change between runs.
      - name: Resolve the DerivedData path
        run: |
          {
            echo "DERIVED_DATA=$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/DerivedData"
            echo "CAS_ARTIFACT_NAME=xcode-cas-${{ runner.os }}-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}"
            echo "SPM_ARTIFACT_NAME=spm-ios-${{ runner.os }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # Boot returns before the simulator is ready. The warm-up xcodebuild uses
      # $RUNNER_TEMP/warmup, never the build DerivedData. -list is omitted: the
      # probe's -list started package resolution and took 151 s.
      - name: Start simulator boot and toolchain warm-up
        shell: bash
        run: scripts/ci/start-ios-warmup.sh

      - name: Install the pinned xcsift
        run: scripts/install-xcsift.sh

      - name: Restore Swift packages
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ios-${{ runner.os }}-

      # The compilation cache keys each compile on content, so it hits after a fresh checkout, but
      # only while the DerivedData path and the checkout path stay the same between runs. The
      # saved key ends in the commit because a cache key is immutable: a fixed key would keep the
      # first save forever while the app source moves on.
      - name: Restore the compilation cache
        id: cas
        if: inputs.restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}/CompilationCache.noindex
          key: xcode-cas-${{ runner.os }}-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-cas-${{ runner.os }}-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-
            xcode-cas-${{ runner.os }}-${{ hashFiles('.xcode-version') }}-

      # actions/cache misses on a merge-queue ref and on a stacked PR. ci-warm.yml's
      # artifacts are the fallback. Both downloads run together; each is best effort.
      # restore-cache false skips them so a cold dispatch still resolves from the network.
      - name: Fetch the warm cache artifacts
        id: warm-artifacts
        if: inputs.restore-cache && (steps.spm.outputs.cache-matched-key == '' || steps.cas.outputs.cache-matched-key == '')
        continue-on-error: true
        shell: bash
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH }}
          GH_TOKEN: ${{ github.token }}
          SPM_KEY: ${{ steps.spm.outputs.cache-matched-key }}
          CAS_KEY: ${{ steps.cas.outputs.cache-matched-key }}
        run: |
          set +e
          start=$(date +%s)
          spm_file="$RUNNER_TEMP/spm-fetch.txt"
          cas_file="$RUNNER_TEMP/cas-fetch.txt"
          : > "$spm_file"
          : > "$cas_file"
          pids=()
          if [[ -z "$SPM_KEY" ]]; then
            scripts/ci/fetch-warm-cache.sh "$SPM_ARTIFACT_NAME" "$DERIVED_DATA/SourcePackages" > "$spm_file" &
            pids+=($!)
          fi
          if [[ -z "$CAS_KEY" ]]; then
            scripts/ci/fetch-warm-cache.sh "$CAS_ARTIFACT_NAME" "$DERIVED_DATA/CompilationCache.noindex" > "$cas_file" &
            pids+=($!)
          fi
          for pid in "${pids[@]}"; do
            wait "$pid" || true
          done
          {
            echo "spm_source=$(tr -d '\n' < "$spm_file")"
            echo "cas_source=$(tr -d '\n' < "$cas_file")"
          } >> "$GITHUB_OUTPUT"
          printf 'Fetch the warm cache artifacts\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"
          exit 0

      # Compile-only Privy config: no .env.local, no secret. Unit tests need no environment.
      - name: Placeholder app config
        run: scripts/ensure-ios-privy-config.sh placeholder

      - name: Sample-screen manifest covers every harness
        run: scripts/qa/screens.sh --check

      # The warm-up must finish before resolve, which is the next xcodebuild
      # on a different DerivedData. Waiting here measures only the leftover.
      - name: Wait for the toolchain warm-up
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          pid="$(cat "$RUNNER_TEMP/warmup.pid")"
          while kill -0 "$pid" 2>/dev/null; do
            sleep 1
          done
          echo "warmup log:"
          cat "$RUNNER_TEMP/warmup.log"
          printf 'Toolchain warm-up wait\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"
          if [[ -f "$RUNNER_TEMP/warmup-started" ]]; then
            echo "warmup wall: $(( $(date +%s) - $(cat "$RUNNER_TEMP/warmup-started") ))s"
          fi
          status="$(cat "$RUNNER_TEMP/warmup-status" 2>/dev/null || echo 1)"
          exit "$status"

      # exact: SourcePackages came from this Package.resolved (primary cache key or the
      # warm artifact named with that hash) and workspace-state.json is present.
      # A prefix restore can leave the state file from a different resolved file.
      - name: Decide Swift package resolve mode
        id: spm-mode
        shell: bash
        env:
          SPM_HIT: ${{ steps.spm.outputs.cache-hit }}
          SPM_FETCH: ${{ steps.warm-artifacts.outputs.spm_source }}
          STATE_FILE: ${{ env.DERIVED_DATA }}/SourcePackages/workspace-state.json
        run: |
          mode="$(scripts/ci/spm-resolve-mode.sh)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "spm resolve mode: $mode"

      # Its own step so a cold resolve's time stays visible. Same DerivedData as the
      # build, so the build reuses these checkouts. Most of this step is xcodebuild
      # start-up before "Command line invocation" (80-190 s, flags or not). The
      # package part, after that line, took 25-86 s with -skipPackageUpdates and
      # -disableAutomaticPackageResolution (runs 36783138702, 36788034354,
      # 36789464219, 36791595837) and 28-87 s without them, so the flags show no
      # measurable saving yet. The job-level saving came from the parallel fetch
      # and the warm cache. The flags stay because they avoid network work when
      # the exact cache is present. They apply only for an exact restore. A cold
      # run, or a prefix restore, keeps only
      # -onlyUsePackageVersionsFromResolvedFile. The cold path keeps this step so
      # its time stays visible. Folding it into build-for-testing on the warm path
      # was slower, so the warm path keeps it too.
      - name: Resolve Swift packages
        id: resolve
        shell: bash
        env:
          SPM_MODE: ${{ steps.spm-mode.outputs.mode }}
        run: |
          set -o pipefail
          set +e
          start=$(date +%s)
          flags=(-onlyUsePackageVersionsFromResolvedFile)
          if [[ "$SPM_MODE" == "exact" ]]; then
            flags+=(-skipPackageUpdates -disableAutomaticPackageResolution)
          fi
          echo "resolve flags: ${flags[*]}"
          xcodebuild -resolvePackageDependencies -project apps/mobile/Monaco.xcodeproj -scheme Monaco -derivedDataPath "$DERIVED_DATA" "${flags[@]}" 2>&1 | scripts/ci/stamp-log.sh | tee "$RUNNER_TEMP/resolve.log"
          status=$?
          set -e
          printf 'Resolve Swift packages\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"
          exit "$status"

      # One xcodebuild test builds and runs MonacoTests, so the job pays one
      # start-up instead of a build-for-testing plus a test-without-building.
      # bootstatus waits until the simulator booted at the start of the job is ready.
      # Exact mode adds the same package flags as resolve. -only-testing stays
      # MonacoTests. MonacoUITests is still compiled; the probe did not show that
      # skipping it saves more than 10 s.
      - name: Wait for the simulator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          xcrun simctl bootstatus "$SIM" -b
          printf 'Simulator bootstatus\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"

      - name: Build and run MonacoTests
        id: build
        shell: bash
        env:
          SPM_MODE: ${{ steps.spm-mode.outputs.mode }}
        run: |
          set -o pipefail
          set +e
          start=$(date +%s)
          flags=(-onlyUsePackageVersionsFromResolvedFile -skipMacroValidation -skipPackagePluginValidation)
          if [[ "$SPM_MODE" == "exact" ]]; then
            flags+=(-skipPackageUpdates -disableAutomaticPackageResolution)
          fi
          echo "test flags: ${flags[*]}"
          xcodebuild -project apps/mobile/Monaco.xcodeproj -scheme Monaco -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MonacoTests.xcresult" \
            -showBuildTimingSummary \
            "${flags[@]}" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$DERIVED_DATA/CompilationCache.noindex" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            -only-testing:MonacoTests test 2>&1 | scripts/ci/stamp-log.sh | tee "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/MonacoTests.log" | .bin/xcsift --exit-on-failure
          status=$?
          set -e
          printf 'Build and run MonacoTests\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"
          exit "$status"

      - name: Compilation cache hits
        if: always()
        shell: bash
        env:
          CAS_KEY: ${{ steps.cas.outputs.cache-matched-key }}
          CAS_FETCH: ${{ steps.warm-artifacts.outputs.cas_source }}
          SPM_KEY: ${{ steps.spm.outputs.cache-matched-key }}
          SPM_FETCH: ${{ steps.warm-artifacts.outputs.spm_source }}
        run: |
          cache_source() {
            local key="$1" fetched="$2"
            if [[ -n "$key" ]]; then
              printf 'actions-cache %s' "$key"
            elif [[ -n "$fetched" ]]; then
              printf '%s' "$fetched"
            else
              printf 'nothing'
            fi
          }
          log="$RUNNER_TEMP/build.log"
          if [[ -f "$log" ]]; then
            read -r hits misses < <(awk 'tolower($0) ~ /replay cache hit/ {h++} tolower($0) ~ /replay cache miss/ {m++} END {print h+0, m+0}' "$log")
            echo "compilation cache: $hits hits, $misses misses (restored: $(cache_source "$CAS_KEY" "$CAS_FETCH"))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "swift packages: restored: $(cache_source "$SPM_KEY" "$SPM_FETCH")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the compilation cache
        if: inputs.save-cache && inputs.restore-cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA }}/CompilationCache.noindex
          key: ${{ steps.cas.outputs.cache-primary-key }}

      # -parallel-testing-enabled YES was tried and reverted: it clones the simulator and runs
      # workers side by side, and on a shared macOS runner (a handful of vCPUs) that starved
      # the app's own concurrency-sensitive tests (spinner/cancellation races such as
      # AssetDetailModelTests and CabalsTabModelTests) of real CPU time, turning them flaky.
      # Every passing test's reported duration roughly tripled (19-31s for trivial unit tests
      # that run in well under a second sequentially), confirming CPU contention, not a bug in
      # the tests. Sequential (the default) is both correct and, per the measurements in
      # docs/architecture/ci.md, not the bottleneck. The build and the tests are one
      # xcodebuild test above, still without parallel testing.

      # Artifacts, not the Actions cache: a merge_group ref and a stacked PR cannot
      # restore a cache saved on the feature branch. PR 1 measured resolve at 383 s,
      # over the 45 s line, so SourcePackages is uploaded too. success() keeps a
      # failed warm run from publishing a cache the fetch script would refuse.
      # upload-artifact v4 drops modes and follows symlinks, so each directory is
      # tarred first. compression-level 0 skips a second zip of an already-packed file.
      - name: Pack the compilation cache artifact
        if: inputs.save-cache && success()
        run: tar -C "$DERIVED_DATA" -cf "$RUNNER_TEMP/cas.tar" CompilationCache.noindex

      - name: Upload the compilation cache artifact
        if: inputs.save-cache && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAS_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/cas.tar
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

      - name: Pack the Swift package artifact
        if: inputs.save-cache && success()
        run: tar -C "$DERIVED_DATA" -cf "$RUNNER_TEMP/spm.tar" SourcePackages

      - name: Upload the Swift package artifact
        if: inputs.save-cache && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SPM_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/spm.tar
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

      # xcodebuild test ignores -showBuildTimingSummary, so the top 15 comes
      # from the result bundle. The block goes to its own file: build.log stays
      # the raw test log, and job-summary.sh reads BUILD_LOG for the timing rows.
      - name: Write the job summary
        if: always()
        env:
          STEP_TIMES: ${{ runner.temp }}/step-times.tsv
          BUILD_LOG: ${{ runner.temp }}/build-timing.txt
          TEST_LOG: ${{ runner.temp }}/MonacoTests.log
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          fail="$RUNNER_TEMP/fail-logs.tsv"
          : > "$fail"
          if [[ "$RESOLVE_OUTCOME" == "failure" ]]; then printf 'Resolve Swift packages\t%s\n' "$RUNNER_TEMP/resolve.log" >> "$fail"; fi
          if [[ "$BUILD_OUTCOME" == "failure" ]]; then printf 'Build and run MonacoTests\t%s\n' "$RUNNER_TEMP/build.log" >> "$fail"; fi
          if [[ -d "$RUNNER_TEMP/MonacoTests.xcresult" ]]; then
            scripts/ci/build-timing-summary.sh "$RUNNER_TEMP/MonacoTests.xcresult" > "$RUNNER_TEMP/build-timing.txt" || true
          fi
          FAIL_LOGS="$fail" scripts/ci/job-summary.sh >> "$GITHUB_STEP_SUMMARY"

      # xcsift keeps only errors and warnings; the raw log holds the rest, such as why package
      # resolution failed and the compilation cache remarks.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-log
          path: ${{ runner.temp }}/MonacoTests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-xcresult
          path: ${{ runner.temp }}/MonacoTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
