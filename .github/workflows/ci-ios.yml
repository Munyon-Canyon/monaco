name: CI iOS

# Called from ci-jobs.yml's ios job in the pr and staging stages, never in the queue stage.
# Kept in its own file so the `plan` job's `ios` path filter can key on this file instead of
# ci-jobs.yml, which most CI PRs touch. docs/architecture/ci.md#what-runs-where
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the Swift package and build caches. PRs restore and never save.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the Swift package and build caches.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # actions/cache rejects a path with `..` in it, and a cache entry only matches the same path string.
      # The simulator boots in the background so the cache restores don't wait on it; the processes a
      # step starts live until the job ends, and the build step waits for the boot with bootstatus.
      - name: Resolve DerivedData and the simulator
        run: |
          sim="$(scripts/resolve-ios-sim.sh)"
          nohup xcrun simctl boot "$sim" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
          {
            echo "DERIVED_DATA=$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/DerivedData"
            echo "SIM=$sim"
          } >> "$GITHUB_ENV"

      # The checkouts plus workspace-state.json resolve offline from Package.resolved, so the
      # repositories git mirrors (about 1 GB) stay out of the cache.
      - name: Restore Swift packages
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}/SourcePackages/checkouts
            ${{ env.DERIVED_DATA }}/SourcePackages/artifacts
            ${{ env.DERIVED_DATA }}/SourcePackages/workspace-state.json
          key: spm-ios-v2-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}

      # DerivedData/Build from the last staging run: the compiled Swift packages, the
      # swift-openapi-generator output, mobile-core and the app. The DerivedData path is the same on
      # every runner, so xcodebuild builds incrementally on top of it. Each staging save gets its own
      # key; PRs restore the newest entry for the same Xcode and Package.resolved files, and
      # staging.yml's prune job keeps only the newest.
      - name: Restore the build
        id: build
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}/Build
          key: xcode-build-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-build-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-

      # The Swift driver decides what to recompile from each source's mtime, and a fresh checkout
      # stamps every file with the current time. Give each tracked file an mtime derived from its blob
      # hash instead: unchanged content keeps the mtime the restored build recorded, changed content
      # gets a new one and recompiles.
      - name: Stamp source mtimes from content
        run: |
          git ls-files -s -z | python3 -c '
          import os, sys
          base = 946684800  # 2000-01-01
          for entry in sys.stdin.buffer.read().split(b"\0"):
              if not entry:
                  continue
              meta, path = entry.split(b"\t", 1)
              mode, blob = meta.split()[:2]
              if mode == b"120000":
                  continue
              ns = (base + int(blob[:7], 16)) * 10**9 + int(blob[7:14], 16) % 10**9
              os.utime(path, ns=(ns, ns))
          '

      - name: Placeholder app config
        run: scripts/ensure-ios-privy-config.sh placeholder

      # One xcodebuild test compiles the app and MonacoTests, then runs MonacoTests. The MonacoTests
      # test plan leaves MonacoUITests out, so CI never compiles it; the scheme's default plan keeps both.
      - name: Build the app and run MonacoTests
        run: |
          xcrun simctl bootstatus "$SIM" -b
          xcodebuild -project apps/mobile/Monaco.xcodeproj -scheme Monaco -testPlan MonacoTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MonacoTests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation \
            -quiet CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO test

      - name: Save Swift packages
        if: inputs.save-cache && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}/SourcePackages/checkouts
            ${{ env.DERIVED_DATA }}/SourcePackages/artifacts
            ${{ env.DERIVED_DATA }}/SourcePackages/workspace-state.json
          key: spm-ios-v2-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}

      - name: Save the build
        if: inputs.save-cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA }}/Build
          key: xcode-build-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-xcresult
          path: ${{ runner.temp }}/MonacoTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
