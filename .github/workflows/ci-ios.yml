name: CI iOS

# Called from ci-jobs.yml's ios job in the pr and staging stages, never in the queue stage.
# Kept in its own file so the `plan` job's `ios` path filter can key on this file instead of
# ci-jobs.yml, which most CI PRs touch. docs/architecture/ci.md#what-runs-where
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the Swift package and build caches. PRs restore and never save.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the Swift package and build caches.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # actions/cache rejects a path with `..` in it, and a cache entry only matches the same path string.
      # Picking the simulator starts CoreSimulator, which took up to 55 s on a fresh runner, so the pick
      # and the boot run in the background while the cache restores; the processes a step starts live
      # until the job ends. The build step reads the pick from $RUNNER_TEMP/sim.
      - name: Resolve DerivedData and start the simulator
        run: |
          echo "DERIVED_DATA=$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/DerivedData" >> "$GITHUB_ENV"
          nohup bash -c 'sim="$(scripts/resolve-ios-sim.sh)" && echo "$sim" > "$RUNNER_TEMP/sim.tmp" && mv "$RUNNER_TEMP/sim.tmp" "$RUNNER_TEMP/sim" && xcrun simctl boot "$sim"' \
            > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &

      # One cache entry holds the Swift package checkouts and DerivedData/Build from the last staging
      # run, because each actions/cache step costs its own setup and extraction. The checkouts plus
      # workspace-state.json resolve offline from Package.resolved, so the repositories git mirrors
      # (about 1 GB) stay out. Build holds the compiled Swift packages, the swift-openapi-generator
      # output, mobile-core and the app; the DerivedData path is the same on every runner, so
      # xcodebuild builds incrementally on top of it. Each staging save gets its own key; PRs restore
      # the newest entry for the same Xcode and Package.resolved files, and staging.yml's prune job
      # keeps only the newest.
      - name: Restore the Swift packages and the build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}/SourcePackages/checkouts
            ${{ env.DERIVED_DATA }}/SourcePackages/artifacts
            ${{ env.DERIVED_DATA }}/SourcePackages/workspace-state.json
            ${{ env.DERIVED_DATA }}/Build
          key: xcode-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-

      # The Swift driver decides what to recompile from each source's mtime, and a fresh checkout
      # stamps every file with the current time. Give each tracked file an mtime derived from its blob
      # hash instead: unchanged content keeps the mtime the restored build recorded, changed content
      # gets a new one and recompiles.
      - name: Stamp source mtimes from content
        run: |
          git ls-files -s -z | python3 -c '
          import os, sys
          base = 946684800  # 2000-01-01
          for entry in sys.stdin.buffer.read().split(b"\0"):
              if not entry:
                  continue
              meta, path = entry.split(b"\t", 1)
              mode, blob = meta.split()[:2]
              if mode == b"120000":
                  continue
              ns = (base + int(blob[:7], 16)) * 10**9 + int(blob[7:14], 16)
              os.utime(path, ns=(ns, ns))
          '

      - name: Placeholder app config
        run: scripts/ensure-ios-privy-config.sh placeholder

      # build-for-testing compiles the app and MonacoTests without a booted simulator, so the boot
      # started above overlaps the build. The MonacoTests test plan leaves MonacoUITests out, so CI
      # never compiles it; the scheme's default plan keeps both.
      - name: Build the app and MonacoTests
        run: |
          # With restored checkouts, skip resolution: otherwise SwiftPM fetches every repository
          # again, and privy-ios alone took 184 s (#3349).
          for _ in $(seq 120); do [[ -s "$RUNNER_TEMP/sim" ]] && break; sleep 1; done
          if [[ ! -s "$RUNNER_TEMP/sim" ]]; then
            cat "$RUNNER_TEMP/simctl-boot.log"
            exit 1
          fi
          SIM="$(cat "$RUNNER_TEMP/sim")"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          offline=()
          if [[ -f "$DERIVED_DATA/SourcePackages/workspace-state.json" ]]; then
            offline=(-skipPackageUpdates -disableAutomaticPackageResolution)
          fi
          xcodebuild build-for-testing -project apps/mobile/Monaco.xcodeproj -scheme Monaco -testPlan MonacoTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation "${offline[@]}" \
            -showBuildTimingSummary CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run MonacoTests
        run: |
          xcrun simctl bootstatus "$SIM" -b
          xcodebuild test-without-building -project apps/mobile/Monaco.xcodeproj -scheme Monaco -testPlan MonacoTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MonacoTests.xcresult" \
            -quiet CODE_SIGNING_ALLOWED=NO

      - name: Save the Swift packages and the build
        if: inputs.save-cache && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}/SourcePackages/checkouts
            ${{ env.DERIVED_DATA }}/SourcePackages/artifacts
            ${{ env.DERIVED_DATA }}/SourcePackages/workspace-state.json
            ${{ env.DERIVED_DATA }}/Build
          key: xcode-ios-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-xcresult
          path: ${{ runner.temp }}/MonacoTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
