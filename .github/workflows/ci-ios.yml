name: CI iOS

# Called from ci-jobs.yml's ios job in the pr and staging stages, never in the queue stage.
# Kept in its own file so the `plan` job's `ios` path filter can key on this file instead of
# ci-jobs.yml, which most CI PRs touch. docs/architecture/ci.md#what-runs-where
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the Swift package and build caches. PRs restore and never save.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the Swift package and build caches.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # actions/cache rejects a path with `..` in it, and a cache entry only matches the same path string.
      # A fresh runner's first simulator boot runs the iOS data migration, which took 5 min 26 s on its
      # own (locationd's migrator most of it), so the pick and the boot start here, in the background,
      # and overlap the restore and the build even though they slow both; booting only before the tests
      # made the job no faster. The processes a step starts live until the job ends. The test step reads
      # the pick from $RUNNER_TEMP/sim.
      - name: Resolve DerivedData and start the simulator
        run: |
          work="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          {
            echo "DERIVED_DATA=$work/DerivedData"
            echo "DERIVED_DATA_IMAGE=$work/derived-data-image/DerivedData.sparseimage"
          } >> "$GITHUB_ENV"
          nohup bash -c 'sim="$(scripts/resolve-ios-sim.sh)" && echo "$sim" > "$RUNNER_TEMP/sim.tmp" && mv "$RUNNER_TEMP/sim.tmp" "$RUNNER_TEMP/sim" && xcrun simctl boot "$sim"' \
            > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &

      # The whole DerivedData of the last staging run lives in one APFS disk image: the Swift package
      # checkouts and git mirrors, the module caches, and Build with the compiled packages, the
      # swift-openapi-generator output, mobile-core and the app. Extracting the same files from a tar
      # took 229 s on a macos-26 runner (tens of thousands of small files); the image is one file,
      # extracted in seconds and mounted at the DerivedData path xcodebuild always uses, so xcodebuild
      # resolves packages offline and builds incrementally. Each staging save gets its own key; PRs
      # restore the newest entry for the same Xcode and Package.resolved files, and staging.yml's prune
      # job keeps only the newest.
      - name: Restore DerivedData
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA_IMAGE }}
          key: xcode-ios-dd-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-ios-dd-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-

      - name: Mount DerivedData
        run: |
          if [[ ! -f "$DERIVED_DATA_IMAGE" ]]; then
            mkdir -p "$(dirname "$DERIVED_DATA_IMAGE")"
            hdiutil create -quiet -size 40g -type SPARSE -fs APFS -volname DerivedData "$DERIVED_DATA_IMAGE"
          fi
          mkdir -p "$DERIVED_DATA"
          hdiutil attach -quiet -nobrowse -noverify -noautofsck -noautoopen -mountpoint "$DERIVED_DATA" "$DERIVED_DATA_IMAGE"
          sudo mdutil -i off "$DERIVED_DATA" > /dev/null || true

      # Before the stamp below, because writing the config changes its directory's mtime.
      - name: Placeholder app config
        run: scripts/ensure-ios-privy-config.sh placeholder

      # The build system decides what to redo from the mtimes of sources and of the directories that
      # hold them (asset catalogs), and a fresh checkout stamps everything with the current time. Give
      # each tracked file an mtime derived from its blob hash, and each directory one derived from its
      # tree hash: unchanged content keeps the mtime the restored build recorded, changed content gets
      # a new one and rebuilds.
      - name: Stamp source mtimes from content
        run: |
          { git ls-files -s -z; git ls-tree -r -d -z HEAD; } | python3 -c '
          import os, sys
          base = 946684800  # 2000-01-01
          for entry in sys.stdin.buffer.read().split(b"\0"):
              if not entry:
                  continue
              meta, path = entry.split(b"\t", 1)
              fields = meta.split()
              if fields[0] == b"120000":
                  continue
              obj = fields[1] if fields[1] != b"tree" else fields[2]
              ns = (base + int(obj[:7], 16)) * 10**9 + int(obj[7:14], 16)
              os.utime(path, ns=(ns, ns))
          '

      # build-for-testing compiles the app and MonacoTests for the generic simulator, arm64 only, so it
      # doesn't wait for the booting device. The MonacoTests test plan leaves MonacoUITests out, so CI
      # never compiles it; the scheme's default plan keeps both.
      - name: Build the app and MonacoTests
        run: |
          # With the restored package graph, skip resolution, which otherwise fetches every package
          # again (216 s, privy-ios alone 184 s).
          offline=()
          if [[ -f "$DERIVED_DATA/SourcePackages/workspace-state.json" ]]; then
            offline=(-skipPackageUpdates -disableAutomaticPackageResolution)
          fi
          xcodebuild build-for-testing -project apps/mobile/Monaco.xcodeproj -scheme Monaco -testPlan MonacoTests -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation "${offline[@]}" \
            -showBuildTimingSummary ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run MonacoTests
        run: |
          for _ in $(seq 180); do [[ -s "$RUNNER_TEMP/sim" ]] && break; sleep 1; done
          if [[ ! -s "$RUNNER_TEMP/sim" ]]; then
            cat "$RUNNER_TEMP/simctl-boot.log"
            exit 1
          fi
          SIM="$(cat "$RUNNER_TEMP/sim")"
          xcrun simctl bootstatus "$SIM" -b
          xcodebuild test-without-building -project apps/mobile/Monaco.xcodeproj -scheme Monaco -testPlan MonacoTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MonacoTests.xcresult" \
            -quiet CODE_SIGNING_ALLOWED=NO

      - name: Unmount DerivedData
        if: inputs.save-cache && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$DERIVED_DATA/Logs" "$DERIVED_DATA/TestResults"
          hdiutil detach -quiet "$DERIVED_DATA" || hdiutil detach -quiet -force "$DERIVED_DATA"
          hdiutil compact -quiet "$DERIVED_DATA_IMAGE"
          ls -lh "$DERIVED_DATA_IMAGE"

      - name: Save DerivedData
        if: inputs.save-cache && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA_IMAGE }}
          key: xcode-ios-dd-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/mobile-core/Package.resolved') }}-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-xcresult
          path: ${{ runner.temp }}/MonacoTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
