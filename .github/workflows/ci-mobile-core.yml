name: CI mobile-core

# Called from ci-jobs.yml's mobile-core job. Kept in its own file so the `plan` job's
# `mobile-core` path filter can key on this file instead of every `ci*.yml`, which every
# backend PR touches. workflow_dispatch runs it alone on a branch, to measure it.
# docs/architecture/ci.md#triggers
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the .build cache. PRs restore and never save.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the .build cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mobile-core:
    # Darwin-only MonacoCore code is not compiled here. A PR that touches it
    # passes a local macOS `swift test` before it is pushed.
    name: Swift (mobile-core, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned xcsift
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null
          scripts/install-xcsift.sh

      - name: Restore .build
        id: build
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile-core/.build
          key: swiftpm-linux-6.3-${{ hashFiles('packages/mobile-core/Package.resolved') }}
          restore-keys: swiftpm-linux-6.3-

      - name: Swift format lint
        run: swift format lint --strict --recursive --parallel apps/mobile packages/mobile-core

      - name: Test mobile-core
        id: test
        working-directory: packages/mobile-core
        shell: bash
        run: set +e; start=$(date +%s); ../../scripts/mobile-core-test.sh 2>&1 | tee "$RUNNER_TEMP/mobile-core.log" | ../../.bin/xcsift --exit-on-failure; status=$?; set -e; printf 'Test mobile-core\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"; exit "$status"

      - name: Probe the feature generator
        id: probe
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          scripts/gen-mobile-feature.sh CiProbe
          status=$?
          if [[ "$status" -eq 0 ]]; then
            scripts/mobile-core-test.sh --filter CiProbeModelTests 2>&1 | tee "$RUNNER_TEMP/ci-probe.log"
            status=${PIPESTATUS[0]}
            pass_pat="$(printf '%s' "^Test Case '[^']*CiProbeModelTests[^']*' (passed|failed)")"
            executed="$(grep -Ec "$pass_pat" "$RUNNER_TEMP/ci-probe.log" || true)"
            if [[ "$status" -eq 0 && "${executed:-0}" -lt 1 ]]; then
              echo "probe: no executed CiProbeModelTests" >&2
              status=1
            fi
          fi
          set -e
          printf 'Probe the feature generator\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"
          exit "$status"

      - name: Write the job summary
        if: always()
        shell: bash
        env:
          CACHE_KEY: ${{ steps.build.outputs.cache-matched-key }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          echo "compilation cache: not used (build cache restored: ${CACHE_KEY:-nothing})" >> "$GITHUB_STEP_SUMMARY"
          fail="$RUNNER_TEMP/fail-logs.tsv"
          : > "$fail"
          if [[ "$TEST_OUTCOME" == "failure" ]]; then printf 'Test mobile-core\t%s\n' "$RUNNER_TEMP/mobile-core.log" >> "$fail"; fi
          FAIL_LOGS="$fail" STEP_TIMES="$RUNNER_TEMP/step-times.tsv" TEST_LOG="$RUNNER_TEMP/mobile-core.log" scripts/ci/job-summary.sh >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(coverage|no coverage floor)' "$RUNNER_TEMP/mobile-core.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          sed -n 's/^coverage rose: /::warning title=coverage rose::/p' "$RUNNER_TEMP/mobile-core.log" || true

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-core-linux-log
          path: ${{ runner.temp }}/mobile-core.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save .build
        if: inputs.save-cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile-core/.build
          key: ${{ steps.build.outputs.cache-primary-key }}

  # The swift container has no python3, so the growth check runs on its own runner. Against the
  # merge base with trunk, so a stacked PR is judged for the whole stack.
  legacy-growth:
    name: Legacy growth (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the growth check
        run: python3 scripts/test_check_legacy_growth.py

      # Labels are read live: `gh run rerun` replays the original payload, which lacks a label
      # added after it.
      - name: Resolve the base and labels
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base="$(scripts/ci/fetch-base.sh)"
          labels='[]'
          if [[ -n "$PR_NUMBER" ]]; then
            labels="$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name]')"
          fi
          {
            echo "BASE_SHA=${base}"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "PR_LABELS=${labels}"
          } >> "$GITHUB_ENV"

      - name: Check legacy growth
        run: python3 scripts/check-legacy-growth.py

  # No swiftlint container: the ratchet needs git for the base blobs, so it runs the pinned image
  # through Docker on the runner.
  swiftlint:
    name: SwiftLint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the base and labels
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base="$(scripts/ci/fetch-base.sh)"
          echo "swiftlint base: ${base}"
          labels='[]'
          if [[ -n "$PR_NUMBER" ]]; then
            labels="$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name]')"
          fi
          {
            echo "BASE_SHA=${base}"
            echo "PR_LABELS=${labels}"
          } >> "$GITHUB_ENV"

      - name: Run the ratchet
        run: scripts/swiftlint-ratchet.sh --base "$BASE_SHA"
