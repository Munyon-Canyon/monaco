name: CI mobile-core

# Called from ci-jobs.yml's mobile-core job. Kept in its own file so the `plan` job's
# `mobile-core` path filter can key on this file instead of every `ci*.yml`, which every
# backend PR touches. workflow_dispatch runs it alone on a branch, to measure it.
# docs/architecture/ci.md#triggers
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the .build cache. PRs restore and never save.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save the .build cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mobile-core:
    # The macOS job below compiles the Darwin-only code this skips.
    name: Swift (mobile-core, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned xcsift
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null
          scripts/install-xcsift.sh

      - name: Restore .build
        id: build
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile-core/.build
          key: swiftpm-linux-6.3-${{ hashFiles('packages/mobile-core/Package.resolved') }}
          restore-keys: swiftpm-linux-6.3-

      - name: Test mobile-core
        id: test
        working-directory: packages/mobile-core
        shell: bash
        run: set +e; start=$(date +%s); swift test --force-resolved-versions -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/mobile-core.log" | ../../.bin/xcsift --exit-on-failure; status=$?; set -e; printf 'Test mobile-core\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"; exit "$status"

      - name: Write the job summary
        if: always()
        shell: bash
        env:
          STEP_TIMES: ${{ runner.temp }}/step-times.tsv
          TEST_LOG: ${{ runner.temp }}/mobile-core.log
          CACHE_KEY: ${{ steps.build.outputs.cache-matched-key }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          echo "compilation cache: not used (build cache restored: ${CACHE_KEY:-nothing})" >> "$GITHUB_STEP_SUMMARY"
          fail="$RUNNER_TEMP/fail-logs.tsv"
          : > "$fail"
          if [[ "$TEST_OUTCOME" == "failure" ]]; then printf 'Test mobile-core\t%s\n' "$RUNNER_TEMP/mobile-core.log" >> "$fail"; fi
          FAIL_LOGS="$fail" scripts/ci/job-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-core-linux-log
          path: ${{ runner.temp }}/mobile-core.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save .build
        if: inputs.save-cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile-core/.build
          key: ${{ steps.build.outputs.cache-primary-key }}

  mobile-core-macos:
    # Xcode builds MonacoCore with -suppress-warnings, so only a SwiftPM build fails on a warning
    # in Darwin-only code. docs/architecture/ci.md#what-runs-where
    name: Swift (mobile-core, macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Install the pinned xcsift
        run: scripts/install-xcsift.sh

      - name: Restore .build
        id: build
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile-core/.build
          key: swiftpm-macos-${{ hashFiles('.xcode-version') }}-${{ hashFiles('packages/mobile-core/Package.resolved') }}

      - name: Build mobile-core and its tests
        id: buildtests
        working-directory: packages/mobile-core
        shell: bash
        # swift build --build-tests prints "Build complete!", which xcsift treats as success.
        run: set +e; start=$(date +%s); swift build --build-tests --force-resolved-versions -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/mobile-core.log" | ../../.bin/xcsift --exit-on-failure; status=$?; set -e; printf 'Build mobile-core and its tests\t%s\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/step-times.tsv"; exit "$status"

      - name: Write the job summary
        if: always()
        shell: bash
        env:
          STEP_TIMES: ${{ runner.temp }}/step-times.tsv
          TEST_LOG: ${{ runner.temp }}/mobile-core.log
          CACHE_KEY: ${{ steps.build.outputs.cache-matched-key }}
          BUILD_OUTCOME: ${{ steps.buildtests.outcome }}
        run: |
          echo "compilation cache: not used (build cache restored: ${CACHE_KEY:-nothing})" >> "$GITHUB_STEP_SUMMARY"
          fail="$RUNNER_TEMP/fail-logs.tsv"
          : > "$fail"
          if [[ "$BUILD_OUTCOME" == "failure" ]]; then printf 'Build mobile-core and its tests\t%s\n' "$RUNNER_TEMP/mobile-core.log" >> "$fail"; fi
          FAIL_LOGS="$fail" scripts/ci/job-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-core-macos-log
          path: ${{ runner.temp }}/mobile-core.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save .build
        if: inputs.save-cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile-core/.build
          key: ${{ steps.build.outputs.cache-primary-key }}
