name: CI

# A draft skips the ci job, which leaves no "ci / ci-ok" check, so the PR cannot merge.
on:
  # Every PR, so a stacked PR whose base is another ticket branch gets CI on its own diff.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dormant: a personal-account repo has no merge queue. docs/architecture/ci.md#feature-branches
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-jobs.yml
