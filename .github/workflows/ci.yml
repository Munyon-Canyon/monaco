name: CI

# A draft skips the ci job, which leaves no "ci / ci-ok" check, so the PR cannot merge.
# So does a PR based on Graphite's temporary graphite-base/N branch: Graphite deletes that base
# after the restack and ci-retarget.yml runs on the retarget to the real trunk.
# A PR runs stage 1, every check and test. The Graphite merge queue tests what it is about to land on a
# draft PR whose head starts with gtmq_; that draft and the push to its branch both run stage 2, the light
# build, vet and generated-files check. docs/architecture/ci.md#check-stages
on:
  # Every PR, so a stacked PR whose base is another ticket branch gets CI on its own diff.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Also the push to a queue branch: a queue draft based on the draft below it closes when that one lands and
  # its branch is deleted, and a draft closed before GitHub started its pull_request run never gets one (#2844).
  # The draft's own pull_request run still runs stage 2 too, since Graphite reads the check from it (#2868).
  push:
    branches: ['gtmq_**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  ci:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      ((!github.event.pull_request.draft || startsWith(github.head_ref, 'gtmq_')) &&
      !startsWith(github.base_ref, 'graphite-base/')) }}
    uses: ./.github/workflows/ci-jobs.yml
    with:
      stage: ${{ startsWith(github.head_ref || github.ref_name, 'gtmq_') && 'queue' || 'pr' }}
