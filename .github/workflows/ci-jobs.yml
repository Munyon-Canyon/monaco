name: CI jobs

# Called by ci.yml and ci-retarget.yml through their `ci` job, so every check is named
# "ci / <job>" and the required check is "ci / ci-ok". docs/architecture/ci.md#triggers
# `stage: pr` runs stage 1, the repo-wide checks and no tests except mobile-core and ios. `stage: queue` runs stage 2, stage 1
# plus every test. docs/architecture/ci.md#check-stages
on:
  workflow_call:
    inputs:
      stage:
        description: pr (pull_request) or queue (merge_group).
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint, nogo, comments, OpenAPI, migrations)
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: 'false'

      - name: Install the pinned atlas community build
        working-directory: .
        run: scripts/install-atlas.sh

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: apps/backend
          args: ./...

      - name: No bare go statements outside platform and cmd
        run: go run ./internal/platform/lint/nogo/cmd/nogo ./...

      - name: No comments in hand-written Go
        run: go run ./cmd/monacoctl lint comments

      - name: OpenAPI spec lint
        run: |
          for attempt in 1 2 3; do
            docker pull -q dshanley/vacuum:v0.30.6 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          docker run --rm -v "$PWD/api:/api:ro" dshanley/vacuum:v0.30.6 lint -b -q -n warn -r /api/.vacuum.yaml /api/openapi.yaml

      - name: Lint the latest migration
        run: go run ./cmd/monacoctl migrate lint

      - name: Install oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          v=1.32.1
          base="https://github.com/oasdiff/oasdiff/releases/download/v$v"
          curl -fsSLO "$base/oasdiff_${v}_linux_amd64.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep " oasdiff_${v}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "oasdiff_${v}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Breaking-change check passes a new error code and fails a removed path
        working-directory: .
        run: scripts/ci/oasdiff-breaking-test.sh

      - name: OpenAPI spec has no breaking changes
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
        run: |
          base="${BASE_REF#refs/heads/}"
          git fetch --no-tags --depth=1 origin "$base"
          if ! git cat-file -e FETCH_HEAD:apps/backend/api/openapi.yaml 2>/dev/null; then
            echo "no api/openapi.yaml on $base"
            exit 0
          fi
          git show FETCH_HEAD:apps/backend/api/openapi.yaml > "$RUNNER_TEMP/base-openapi.yaml"
          ../../scripts/ci/oasdiff-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" api/openapi.yaml

  backend:
    name: Backend tests (race, time budget, -short-skipped)
    needs: plan
    if: inputs.stage == 'queue' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      # go test keys its result cache on file mtimes, and a fresh checkout gives every file a new one.
      - name: Pin testdata mtimes
        working-directory: .
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: ./.github/actions/backend-test-env

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # The lint package's rule tests run golangci-lint and fail in CI when it is missing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      - name: Race tests, the time budget and the flows.tsv check
        run: ../../scripts/test-backend.sh

  e2e:
    name: E2E (monacoctl verify on the real binaries)
    needs: plan
    if: inputs.stage == 'queue' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - name: Install the pinned atlas community build
        run: scripts/install-atlas.sh

      - name: Every flow, then the after-publish crash point, against a throwaway stack
        run: scripts/ci/e2e.sh

      - name: Upload the verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: apps/backend/.verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ready:
    name: Ready (vet on go.mod's Go, tidy, generated files)
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: 'false'

      - run: scripts/install-sqlc.sh

      - run: scripts/ci/ready.sh

  vuln:
    name: Vuln (govulncheck)
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - name: Install the pinned govulncheck
        working-directory: .
        run: scripts/install-govulncheck.sh

      - name: Reachable vulnerabilities in the backend and its dependencies
        run: ../../.bin/govulncheck ./...

  scripts:
    needs: plan
    if: inputs.stage == 'queue' && (needs.plan.outputs.scripts == 'true' || needs.plan.outputs.unknown == 'true')
    uses: ./.github/workflows/ci-scripts.yml

  mobile-core:
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.mobile-core == 'true' || needs.plan.outputs.unknown == 'true')
    uses: ./.github/workflows/ci-mobile-core.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      patch-id: ${{ steps.reuse.outputs.patch-id }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile-core: ${{ steps.filter.outputs.mobile-core }}
      ios: ${{ steps.filter.outputs.ios }}
      backend-tests: ${{ steps.filter.outputs.backend-tests }}
      scripts: ${{ steps.filter.outputs.scripts == 'true' || steps.every.outputs.scripts == 'true' }}
      unknown: ${{ steps.every.outputs.unknown }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2 never reuses: it tests the combined queue entry, not one PR's diff.
      - name: Reuse the last green stage 1 when the diff is unchanged
        id: reuse
        if: inputs.stage == 'pr' && github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/ci/stage1-reuse.sh

      - name: Standard runner labels only
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/ci/check-runners.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Outside a PR the action diffs against the default branch, which runs every job on a feature branch.
          base: ${{ github.event.pull_request.base.ref || vars.FEATURE_BRANCH || 'main' }}
          filters: |
            backend:
              - 'apps/backend/**'
              - 'scripts/ci/ready.sh'
              - 'scripts/ci/oasdiff-*'
              - 'scripts/install-atlas.sh'
              - 'scripts/install-sqlc.sh'
              - 'scripts/install-govulncheck.sh'
              - 'scripts/gen-docs.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/ci/e2e.sh'
              - 'scripts/require-docker.sh'
              - '.github/actions/backend-test-env/**'
              - 'docker-compose.yml'
              - 'Justfile'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            backend-tests:
              - 'apps/backend/**/*_test.go'
              - 'apps/backend/**/testdata/**'
              - 'scripts/ci/flake-tests.sh'
            mobile-core:
              - 'packages/mobile-core/**'
              - 'apps/backend/api/openapi.yaml'
              - 'scripts/install-xcsift.sh'
              - '.xcode-version'
              - 'scripts/ci/select-xcode.sh'
              - '.github/workflows/ci-mobile-core.yml'
            web:
              - 'apps/web/**'
            scripts:
              - 'scripts/**/*.go'
              - 'scripts/go.mod'
              - 'scripts/go.sum'
              - 'scripts/githooks/**'
              - 'scripts/testdata/**'
              - 'scripts/ci/stage1-reuse.sh'
              - 'Justfile'
              - '.claude/settings.json'
              - '.claude/hooks/**'
              - '.github/workflows/ci-scripts.yml'
            ios:
              - 'apps/mobile/**'
              - 'packages/mobile-core/**'
              - 'apps/backend/api/openapi.yaml'
              - '.xcode-version'
              - 'scripts/ensure-ios-privy-config.sh'
              - 'scripts/resolve-ios-sim.sh'
              - 'scripts/ci/select-xcode.sh'
              - 'scripts/ci/fetch-warm-cache.sh'
              - 'scripts/ci/stamp-log.sh'
              - 'scripts/ci/toolchain-probe.sh'
              - 'scripts/ci/probe-list-resolved.sh'
              - 'scripts/ci/start-ios-warmup.sh'
              - 'scripts/ci/ios-warmup-commands.sh'
              - 'scripts/ci/build-timing-summary.sh'
              - 'scripts/install-xcsift.sh'
              - 'scripts/qa/screens.sh'
              - 'scripts/qa/sample-screens.txt'
              - '.github/workflows/ci-ios.yml'

      # Negated patterns only exclude under `every`, so these two filters need their own step.
      # `unknown` is a changed file no filter above owns and no line below calls inert: it runs
      # every job, so a new file can never pass ci-ok with nothing tested. The inert paths are
      # docs/architecture/backend-platform.md#verification-scope's no-check rows.
      - uses: dorny/paths-filter@v3
        id: every
        with:
          base: ${{ github.event.pull_request.base.ref || vars.FEATURE_BRANCH || 'main' }}
          predicate-quantifier: every
          filters: |
            scripts:
              - 'scripts/*'
              - '!scripts/cloud-setup.sh'
            unknown:
              - '**'
              - '!apps/backend/**'
              - '!apps/mobile/**'
              - '!apps/web/**'
              - '!packages/mobile-core/**'
              - '!scripts/**'
              - '!.github/**'
              - '!.claude/**'
              - '!.cursor/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.qa-screenshots/**'
              - '!ci/profiles/**'
              - '!mkdocs.yml'
              - '!requirements-docs.txt'
              - '!.python-version'
              - '!.xcode-version'
              - '!.gitignore'
              - '!.env.local'
              - '!.env.example'
              - '!Justfile'
              - '!docker-compose.yml'

      # A workflow-only change runs this lint, not the jobs the workflow defines.
      - name: Lint workflows
        if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Required workflows have no workflow-level path filter
        if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.workflows == 'true'
        working-directory: scripts
        run: go test -short -count=1 ./ci/

      - if: inputs.stage == 'queue' && steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web landing page tests
        if: inputs.stage == 'queue' && steps.filter.outputs.web == 'true'
        working-directory: apps/web
        run: npm test

  ios:
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.ios == 'true' || needs.plan.outputs.unknown == 'true')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-ios.yml

  flake:
    name: Flake (changed tests, count 20)
    needs: plan
    if: inputs.stage == 'queue' && (needs.plan.outputs.backend-tests == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || vars.FEATURE_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin "$BASE_REF"

      - uses: ./.github/actions/backend-test-env

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat apps/backend/.golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # The lint package's rule tests run golangci-lint and fail in CI when it is missing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      - name: Rerun the changed test files on this host's Postgres
        run: scripts/ci/flake-tests.sh --base "origin/${BASE_REF}"

  # Required as "ci / ci-ok". A skipped check passes a required check, so ci-ok must never skip
  # once this workflow starts: keep always(), not !cancelled(), so a cancelled run fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, lint, backend, e2e, ready, vuln, scripts, mobile-core, ios, flake]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      checks: write
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, backend, e2e, ready, vuln, scripts, mobile-core, ios, flake

      # The next stage 1 run of this PR reads the patch ID back to decide whether it can reuse this result.
      - name: Record the diff's patch ID on this check run
        if: inputs.stage == 'pr' && needs.plan.outputs.patch-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ID: ${{ needs.plan.outputs.patch-id }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name == "ci / ci-ok") | .check_run_url | split("/") | last')"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" \
            -f "output[title]=stage 1" -f "output[summary]=patch-id: $PATCH_ID" >/dev/null ||
            echo "::warning::could not record the patch ID; the next unchanged push reruns stage 1"
