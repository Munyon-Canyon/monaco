name: CI jobs

# Called by ci.yml and ci-retarget.yml through their `ci` job, so every check is named
# "ci / <job>" and the required check is "ci / ci-ok". docs/architecture/ci.md#triggers
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet, race tests)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      # go test keys its result cache on file mtimes, and a fresh checkout gives every file a new one.
      - name: Pin testdata mtimes
        working-directory: .
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: apps/backend
          args: ./...

      - name: No bare go statements outside platform and cmd
        run: go run ./internal/platform/lint/nogo/cmd/nogo ./...

      - name: No comments in hand-written Go
        run: go run ./cmd/monacoctl lint comments

      - name: Generated files are fresh
        run: go generate ./... && git diff --exit-code

      - name: OpenAPI spec lint
        run: docker run --rm -v "$PWD/api:/api:ro" dshanley/vacuum:v0.30.6 lint -b -q -n warn -r /api/.vacuum.yaml /api/openapi.yaml

      - name: Install the pinned atlas community build
        run: ../../scripts/install-atlas.sh

      - name: Lint the latest migration
        run: go run ./cmd/monacoctl migrate lint

      - name: Generated sqlc code is fresh
        run: ../../scripts/install-sqlc.sh && ../../.bin/sqlc diff

      - name: Install oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          v=1.32.1
          base="https://github.com/oasdiff/oasdiff/releases/download/v$v"
          curl -fsSLO "$base/oasdiff_${v}_linux_amd64.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep " oasdiff_${v}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "oasdiff_${v}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Breaking-change check passes a new error code and fails a removed path
        working-directory: .
        run: scripts/ci/oasdiff-breaking-test.sh

      - name: OpenAPI spec has no breaking changes
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$base"
          if ! git cat-file -e FETCH_HEAD:apps/backend/api/openapi.yaml 2>/dev/null; then
            echo "no api/openapi.yaml on $base"
            exit 0
          fi
          git show FETCH_HEAD:apps/backend/api/openapi.yaml > "$RUNNER_TEMP/base-openapi.yaml"
          ../../scripts/ci/oasdiff-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" api/openapi.yaml

      # Only the nightly warm-cache job on main saves this cache. PRs restore and never save.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
          restore-keys: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

      - run: go vet ./...

      - name: Start the tmpfs test Postgres that testkit.DB clones from
        working-directory: .
        run: docker compose --profile test up -d --wait postgres-test

      - name: Race tests, the time budget and the flows.tsv check
        run: ../../scripts/test-backend.sh

  # The ios job compiles mobile-core on Darwin, which covers the Darwin-only code this skips.
  mobile-core:
    name: Swift (mobile-core, Linux)
    needs: plan
    if: needs.plan.outputs.mobile-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4

      - name: Test mobile-core
        working-directory: packages/mobile-core
        run: swift test

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile-core: ${{ steps.filter.outputs.mobile-core }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Standard runner labels only
        run: scripts/ci/check-runners.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'scripts/ci/**'
              - 'scripts/install-atlas.sh'
              - 'scripts/install-sqlc.sh'
              - '.github/workflows/ci*.yml'
            mobile-core:
              - 'packages/mobile-core/**'
              - '.github/workflows/ci*.yml'
            web:
              - 'apps/web/**'
            ios:
              - 'apps/mobile/**'
              - 'packages/mobile-core/**'
              - 'scripts/ensure-ios-privy-config.sh'
              - 'scripts/resolve-ios-sim.sh'
              - 'scripts/ci/select-xcode.sh'
              - 'scripts/qa/screens.sh'
              - 'scripts/qa/sample-screens.txt'
              - '.github/workflows/ci*.yml'

      - if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web landing page tests
        if: steps.filter.outputs.web == 'true'
        working-directory: apps/web
        run: npm test

  ios:
    name: iOS app (build, MonacoTests)
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DERIVED_DATA: ${{ github.workspace }}/../DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # Only the resolved Swift packages are cached. Build products are not: a fresh checkout
      # gives every source a new mtime, so a restored DerivedData is rebuilt from scratch anyway.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ios-${{ runner.os }}-

      # Compile-only Privy config: no .env.local, no secret. Unit tests need no environment.
      - name: Placeholder app config
        run: scripts/ensure-ios-privy-config.sh placeholder

      - name: Sample-screen manifest covers every harness
        run: scripts/qa/screens.sh --check

      # Booting here lets the simulator start while the app compiles.
      - name: Pick and boot a simulator
        run: |
          sim="$(scripts/resolve-ios-sim.sh)"
          xcrun simctl list devices available | grep -F "$sim"
          xcrun simctl boot "$sim"
          echo "SIM=$sim" >> "$GITHUB_ENV"

      - name: Build app and tests
        run: |
          xcodebuild -project apps/mobile/Monaco.xcodeproj -scheme Monaco -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO -quiet build-for-testing

      - name: Run MonacoTests
        run: |
          xcodebuild -project apps/mobile/Monaco.xcodeproj -scheme Monaco -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MonacoTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO -only-testing:MonacoTests test-without-building

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonacoTests-xcresult
          path: ${{ runner.temp }}/MonacoTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Required as "ci / ci-ok". A skipped check passes a required check, so ci-ok must never skip
  # once this workflow starts: keep always(), not !cancelled(), so a cancelled run fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, backend, mobile-core, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: backend, mobile-core, ios
