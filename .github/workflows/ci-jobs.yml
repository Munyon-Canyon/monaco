name: CI jobs

# Called by ci.yml and ci-retarget.yml through their `ci` job, so every check is named
# "ci / <job>" and the required check is "ci / ci-ok". docs/architecture/ci.md#triggers
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet, race tests)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      # go test keys its result cache on file mtimes, and a fresh checkout gives every file a new one.
      - name: Pin testdata mtimes
        working-directory: .
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: ./.github/actions/backend-test-env

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: apps/backend
          args: ./...

      - name: No bare go statements outside platform and cmd
        run: go run ./internal/platform/lint/nogo/cmd/nogo ./...

      - name: No comments in hand-written Go
        run: go run ./cmd/monacoctl lint comments

      - name: Generated files are fresh
        run: go generate ./... && git diff --exit-code

      - name: Generated reference docs are fresh
        run: ../../scripts/gen-docs.sh && git add --intent-to-add ../../docs/reference && git diff --exit-code ../../docs/reference

      - name: OpenAPI spec lint
        run: docker run --rm -v "$PWD/api:/api:ro" dshanley/vacuum:v0.30.6 lint -b -q -n warn -r /api/.vacuum.yaml /api/openapi.yaml

      - name: Lint the latest migration
        run: go run ./cmd/monacoctl migrate lint

      - name: Generated sqlc code is fresh
        run: ../../scripts/install-sqlc.sh && ../../.bin/sqlc diff

      - name: Install oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          v=1.32.1
          base="https://github.com/oasdiff/oasdiff/releases/download/v$v"
          curl -fsSLO "$base/oasdiff_${v}_linux_amd64.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep " oasdiff_${v}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "oasdiff_${v}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Breaking-change check passes a new error code and fails a removed path
        working-directory: .
        run: scripts/ci/oasdiff-breaking-test.sh

      - name: OpenAPI spec has no breaking changes
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$base"
          if ! git cat-file -e FETCH_HEAD:apps/backend/api/openapi.yaml 2>/dev/null; then
            echo "no api/openapi.yaml on $base"
            exit 0
          fi
          git show FETCH_HEAD:apps/backend/api/openapi.yaml > "$RUNNER_TEMP/base-openapi.yaml"
          ../../scripts/ci/oasdiff-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" api/openapi.yaml

      - run: go vet ./...

      - name: Race tests, the time budget and the flows.tsv check
        run: ../../scripts/test-backend.sh

      - name: Tests that -short skips because they build or run other binaries
        run: go test -race ./internal/platform/lint/... ./internal/testkit/... ./cmd/monacoctl

  # Mutants on the lines this change touches (gremlins --diff). A pull request compares with its base;
  # a manual run compares with the parent commit. The nightly mutates every line of every package.
  # mutation-plan lists the changed packages and mutation runs one job per package, so the wall time
  # is the slowest package, not the sum.
  mutation-plan:
    name: Mutation plan
    needs: plan
    if: needs.plan.outputs.backend-go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: List the packages with changed Go files
        id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          packages=$(go run ./cmd/monacoctl mutation --base "$BASE" --list)
          echo "$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  # GitHub rejects a matrix built from an empty list, so no changed package skips the job instead.
  mutation:
    name: Mutation (${{ matrix.pkg }})
    needs: mutation-plan
    if: needs.mutation-plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.mutation-plan.outputs.packages) }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same setup as the backend job: gremlins runs each package's tests, and the ones on
      # testkit.DB need atlas to build the template database on a fresh runner.
      - uses: ./.github/actions/backend-test-env

      - name: Install the pinned gremlins
        run: ../../scripts/install-gremlins.sh

      - name: Mutants on the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          PKG: ${{ matrix.pkg }}
        run: go run ./cmd/monacoctl mutation --base "$BASE" --pkg "$PKG"

  mobile-core:
    needs: plan
    if: needs.plan.outputs.mobile-core == 'true'
    uses: ./.github/workflows/ci-mobile-core.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-go: ${{ steps.filter.outputs.backend-go }}
      mobile-core: ${{ steps.filter.outputs.mobile-core }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Standard runner labels only
        run: scripts/ci/check-runners.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'scripts/ci/**'
              - 'scripts/install-atlas.sh'
              - 'scripts/install-sqlc.sh'
              - 'scripts/gen-docs.sh'
              - '.github/actions/backend-test-env/**'
              - 'docs/reference/**'
              - '.github/workflows/ci*.yml'
            backend-go:
              - 'apps/backend/**/*.go'
              - 'apps/backend/go.mod'
              - 'apps/backend/mutants.allow'
            mobile-core:
              - 'packages/mobile-core/**'
              - 'apps/backend/api/openapi.yaml'
              - '.github/workflows/ci-mobile-core.yml'
            web:
              - 'apps/web/**'
            ios:
              - 'apps/mobile/**'
              - 'packages/mobile-core/**'
              - 'scripts/ensure-ios-privy-config.sh'
              - 'scripts/resolve-ios-sim.sh'
              - 'scripts/ci/select-xcode.sh'
              - 'scripts/qa/screens.sh'
              - 'scripts/qa/sample-screens.txt'
              - '.github/workflows/ci-ios.yml'

      - if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web landing page tests
        if: steps.filter.outputs.web == 'true'
        working-directory: apps/web
        run: npm test

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/ci-ios.yml

  # Required as "ci / ci-ok". A skipped check passes a required check, so ci-ok must never skip
  # once this workflow starts: keep always(), not !cancelled(), so a cancelled run fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, backend, mutation-plan, mutation, mobile-core, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: backend, mutation-plan, mutation, mobile-core, ios
