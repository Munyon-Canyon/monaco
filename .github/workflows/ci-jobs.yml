name: CI jobs

# Called by ci.yml and ci-retarget.yml through their `ci` job, so every check is named
# "ci / <job>" and the required check is "ci / ci-ok". docs/architecture/ci.md#triggers
on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (backend, domain, reference bot)
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monaco
          POSTGRES_PASSWORD: monaco
          POSTGRES_DB: monaco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monaco -d monaco"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway service container, not a secret. Backend tests derive and migrate a
      # sibling monaco_test database from this URL (internal/postgres/testdb.go).
      # application_name changes every run. go test keys cached results on the env vars a test
      # reads, so tests that read DATABASE_URL always rerun and only Postgres-free ones are cached.
      DATABASE_URL: postgres://monaco:monaco@localhost:5432/monaco?sslmode=disable&application_name=ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # go test keys its result cache on file mtimes, and a fresh checkout gives every file a new one.
      - name: Pin testdata mtimes
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      # Only the nightly warm-cache job on main saves this cache. PRs restore and never save.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
          restore-keys: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

      - name: Apply migrations to a clean database
        working-directory: apps/backend
        run: go run ./cmd/migrate

      - name: Vet backend
        working-directory: apps/backend
        run: go vet ./...

      # -p 1 matches `just test backend`: packages share one monaco_test database.
      # -race: pollers, the alert queue and the price chain all share state across goroutines.
      - name: Test backend
        working-directory: apps/backend
        run: go test -race -p 1 ./...

      - name: Vet and test domain
        working-directory: packages/domain
        run: |
          go vet ./...
          go test -race ./...

      - name: Vet and test reference bot
        working-directory: agents/momentum-bot
        run: |
          go vet ./...
          go test -race ./...

  mobile-core:
    needs: plan
    if: needs.plan.outputs.mobile-core == 'true'
    uses: ./.github/workflows/ci-mobile-core.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      mobile-core: ${{ steps.filter.outputs.mobile-core }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Standard runner labels only
        run: scripts/ci/check-runners.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'apps/backend/**'
              - 'packages/domain/**'
              - 'agents/momentum-bot/**'
              - 'supabase/migrations/**'
              - 'docs/legacy/api.md'
              - 'scripts/ci/**'
              - '.github/workflows/ci*.yml'
            mobile-core:
              - 'packages/mobile-core/**'
              - '.github/workflows/ci-mobile-core.yml'
            web:
              - 'apps/web/**'
            ios:
              - 'apps/mobile/**'
              - 'packages/mobile-core/**'
              - 'scripts/ensure-ios-privy-config.sh'
              - 'scripts/resolve-ios-sim.sh'
              - 'scripts/ci/select-xcode.sh'
              - 'scripts/qa/screens.sh'
              - 'scripts/qa/sample-screens.txt'
              - '.github/workflows/ci-ios.yml'

      - if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web landing page tests
        if: steps.filter.outputs.web == 'true'
        working-directory: apps/web
        run: npm test

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/ci-ios.yml

  # Required as "ci / ci-ok". A skipped check passes a required check, so ci-ok must never skip
  # once this workflow starts: keep always(), not !cancelled(), so a cancelled run fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, go, mobile-core, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: go, mobile-core, ios
