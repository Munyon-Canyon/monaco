name: CI jobs

# Called by ci.yml and ci-retarget.yml through their `ci` job, so every check is named
# "ci / <job>" and the required check is "ci / ci-ok". docs/architecture/ci.md#triggers
# `stage: pr` runs stage 1, every check and test, on the top PR of a stack. `stage: queue` runs stage 2 as one job:
# every other job skips and ci-ok runs ready's steps (build, vet, tidy, generated files). `stage: staging` (staging.yml) runs every stage 1 job but the
# flake reruns on each push to staging, as an advisory indicator. docs/architecture/ci.md#check-stages
on:
  workflow_call:
    inputs:
      stage:
        description: pr (a PR), queue (a Graphite merge queue draft, head gtmq_*) or staging (a push to staging).
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint, nogo, comments, OpenAPI, migrations)
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: 'false'

      - name: Install the pinned atlas community build
        working-directory: .
        run: scripts/install-atlas.sh

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: apps/backend
          args: ./...

      - name: No bare go statements outside platform and cmd
        run: go run ./internal/platform/lint/nogo/cmd/nogo ./...

      - name: No comments in hand-written Go
        run: go run ./cmd/monacoctl lint comments

      - name: OpenAPI spec lint
        run: |
          for attempt in 1 2 3; do
            docker pull -q dshanley/vacuum:v0.30.6 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          docker run --rm -v "$PWD/api:/api:ro" dshanley/vacuum:v0.30.6 lint -b -q -n warn -r /api/.vacuum.yaml /api/openapi.yaml

      - name: Lint the latest migration
        run: go run ./cmd/monacoctl migrate lint

      - name: Install oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          v=1.32.1
          base="https://github.com/oasdiff/oasdiff/releases/download/v$v"
          curl -fsSLO "$base/oasdiff_${v}_linux_amd64.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep " oasdiff_${v}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "oasdiff_${v}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Breaking-change check passes a new error code and fails a removed path
        working-directory: .
        run: scripts/ci/oasdiff-breaking-test.sh

      - name: OpenAPI spec has no breaking changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref }}
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
        run: |
          base="$(DEPTH=1 ../../scripts/ci/fetch-base.sh)"
          if ! git cat-file -e "$base:apps/backend/api/openapi.yaml" 2>/dev/null; then
            echo "no api/openapi.yaml on $base"
            exit 0
          fi
          git show "$base:apps/backend/api/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml"
          ../../scripts/ci/oasdiff-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" api/openapi.yaml

  # Four legs run the passes of scripts/test-backend.sh side by side on their own runners; backend-report
  # merges their output. A failed leg fails the matrix job, and ci-ok needs it.
  backend:
    name: Backend tests (${{ matrix.name }})
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: short 1 of 2
            pass: 'short:1/2'
            artifact: short-1
          - name: short 2 of 2
            pass: 'short:2/2'
            artifact: short-2
          - name: rest 1 of 2
            pass: 'rest:1/2'
            artifact: rest-1
          - name: rest 2 of 2
            pass: 'rest:2/2'
            artifact: rest-2
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      # go test keys its result cache on file mtimes, and a fresh checkout gives every file a new one.
      - name: Pin testdata mtimes
        working-directory: .
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: ./.github/actions/backend-test-env
        with:
          cache-leg: ${{ matrix.artifact }}

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # The lint package's rule tests run golangci-lint and fail in CI when it is missing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      - name: Race tests for this pass
        env:
          TEST_BACKEND_PASS: ${{ matrix.pass }}
          TEST_BACKEND_OUT: ${{ runner.temp }}/test-out
        run: ../../scripts/test-backend.sh

      - name: Upload this pass's test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-${{ matrix.artifact }}
          path: ${{ runner.temp }}/test-out
          retention-days: 1
          if-no-files-found: error
          # Artifacts belong to the run, not the attempt: without this, a rerun leg adds a second copy and
          # backend-report merges the earlier attempt's failures back in, so a rerun can never clear a flake.
          overwrite: true

      # Every pass builds with -race, which caches apart from a plain build. Jobs that restore the newest leg's
      # cache and then go run monacoctl, or build the binaries mobile-integration.sh boots, would compile them cold.
      - name: Build the cmd binaries into this leg's Go cache
        if: always() && inputs.stage == 'staging'
        run: |
          go build ./cmd/...
          CGO_ENABLED=0 go build -o /dev/null ./cmd/monacoctl

      # Only the staging run saves the Go cache, one key per leg, even after a test failure. The PR leg of the same
      # name restores it through backend-test-env, and staging.yml's prune job keeps the newest per leg.
      - name: Save this leg's Go cache
        if: always() && inputs.stage == 'staging'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ matrix.artifact }}-${{ github.sha }}

  backend-report:
    name: Backend tests report
    needs: [plan, backend]
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - uses: actions/download-artifact@v4
        with:
          pattern: backend-test-*
          merge-multiple: true
          path: ${{ runner.temp }}/test-out

      - name: Time budget, flows check and the 100% coverage gate over every pass
        env:
          TEST_BACKEND_PASS: report
          TEST_BACKEND_OUT: ${{ runner.temp }}/test-out
        run: ../../scripts/test-backend.sh

  e2e:
    name: E2E (monacoctl verify on the real binaries)
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - name: Install the pinned atlas community build
        run: scripts/install-atlas.sh

      - name: Every flow, then every registered crash point, against a throwaway stack
        run: scripts/ci/e2e.sh

      - name: Upload the verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: apps/backend/.verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ready:
    name: Ready (vet on go.mod's Go, tidy, generated files)
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/backend-test-env
        with:
          db: 'false'

      - run: scripts/install-sqlc.sh

      - run: scripts/ci/ready.sh

  vuln:
    name: Vuln (govulncheck)
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - name: Install the pinned govulncheck
        working-directory: .
        run: scripts/install-govulncheck.sh

      - name: Reachable vulnerabilities in the backend and its dependencies
        run: ../../.bin/govulncheck ./...

  scripts:
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.scripts == 'true' || needs.plan.outputs.unknown == 'true')
    uses: ./.github/workflows/ci-scripts.yml

  journeys:
    name: Journeys
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.journeys == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - run: |
          python3 scripts/qa/journey.py check
          python3 scripts/qa/test_journey.py
          python3 scripts/qa/test_skill_eval.py

  mobile-core:
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.mobile-core == 'true' || needs.plan.outputs.flows == 'true' || needs.plan.outputs.unknown == 'true')
    uses: ./.github/workflows/ci-mobile-core.yml

  # Runs the F<id>IntegrationTests of only the flows the stack touches; a flow-path change that
  # touches no flow with an integration test class exits 0 before anything boots.
  mobile-integration:
    name: Mobile integration (mobile-core against the real API)
    needs: plan
    if: inputs.stage != 'queue' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.flows == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The merge-base with trunk, so a stacked PR checks the flows of the whole stack.
      - name: Resolve the base commit
        if: inputs.stage == 'pr'
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
        run: |
          base="$(scripts/ci/fetch-base.sh)"
          echo "BASE_COMMIT=${base}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/backend-test-env
        with:
          db: false

      - name: Install the pinned atlas community build
        run: scripts/install-atlas.sh

      # The staging indicator runs every flow's integration tests.
      - name: List the affected flows
        if: inputs.stage == 'pr'
        working-directory: apps/backend
        run: |
          ids="$(go run ./cmd/monacoctl flows --affected --base "$BASE_COMMIT")"
          echo "FLOWS=${ids//$'\n'/,}" >> "$GITHUB_ENV"

      - name: mobile-core integration tests against api, worker and fakes
        run: |
          if [[ -v FLOWS ]]; then
            scripts/ci/mobile-integration.sh --flows "$FLOWS"
          else
            scripts/ci/mobile-integration.sh
          fi

      - name: Upload the api and worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-integration-logs
          path: ${{ runner.temp }}/mobile-integration
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: Plan
    if: inputs.stage != 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      patch-id: ${{ steps.reuse.outputs.patch-id }}
      ci-id: ${{ steps.reuse.outputs.ci-id }}
      # Under steps.top.outputs.skip every filter is false, so every job skips and ci-ok still passes.
      backend: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.backend == 'true' }}
      mobile-core: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.mobile-core == 'true' }}
      backend-tests: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.backend-tests == 'true' }}
      mobile-tests: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.mobile-tests == 'true' }}
      flows: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.flows == 'true' }}
      journeys: ${{ steps.top.outputs.skip != 'true' && steps.filter.outputs.journeys == 'true' }}
      scripts: ${{ steps.top.outputs.skip != 'true' && (steps.filter.outputs.scripts == 'true' || steps.every.outputs.scripts == 'true') }}
      # A stacked PR's base is the PR below it, so the filters see only this PR's own files: run everything.
      # The staging stage runs everything too.
      unknown: ${{ steps.top.outputs.skip != 'true' && (steps.every.outputs.unknown == 'true' || steps.stacked.outputs.stacked == 'true' || inputs.stage == 'staging') }}
    steps:
      # CI runs on the top PR of a stack only. A PR that another open non-draft PR builds on reports every filter false,
      # so every job skips and its ci-ok passes; `monacoctl agents check` proved it before the push. Fails open.
      - name: Is this PR the top of its stack
        id: top
        if: inputs.stage == 'pr' && github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! above="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$HEAD_REF" --json number,isDraft \
            --jq 'map(select(.isDraft | not) | "#\(.number)") | join(" ")')"; then
            echo "::warning::could not list the PRs above this one, so CI runs"
            above=""
          fi
          if [[ -n "$above" ]]; then
            echo "::notice::not the top of its stack ($above builds on it), so CI runs on the top PR"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.top.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Is this PR stacked on another PR
        id: stacked
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRUNK: ${{ vars.FEATURE_BRANCH || 'main' }}
        run: |
          stacked=false
          if [[ -n "$BASE_REF" && "$BASE_REF" != "$TRUNK" && "$BASE_REF" != main ]]; then
            stacked=true
          fi
          echo "stacked=$stacked" | tee -a "$GITHUB_OUTPUT"

      # Stage 2 never reuses: it tests the combined queue entry, not one PR's diff. A stacked PR never reuses
      # either: its patch ID ignores the PRs below it, which a restack changes.
      - name: Reuse the last green stage 1 when the diff and workflow tree are unchanged
        id: reuse
        if: steps.top.outputs.skip != 'true' && inputs.stage == 'pr' && github.event.pull_request && steps.stacked.outputs.stacked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/ci/stage1-reuse.sh

      - name: Standard runner labels only
        if: steps.top.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: scripts/ci/check-runners.sh

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.top.outputs.skip != 'true'
        with:
          # A PR diffs with git (plan fetches full history), so the shared GITHUB_TOKEN rate limit cannot fail it.
          # A queue draft's base is the draft below it, which Graphite deletes once it merges, so git cannot fetch
          # it; the draft uses the PR files API instead (one call).
          token: ${{ inputs.stage == 'queue' && github.token || '' }}
          # Outside a PR the action diffs against the default branch, which runs every job on a feature branch.
          base: ${{ github.event.pull_request.base.ref || vars.FEATURE_BRANCH || 'main' }}
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/flows/**'
              - 'scripts/ci/ready.sh'
              - 'scripts/ci/oasdiff-*'
              - 'scripts/install-atlas.sh'
              - 'scripts/install-sqlc.sh'
              - 'scripts/install-govulncheck.sh'
              - 'scripts/gen-docs.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/test-shard.awk'
              - 'scripts/ci/e2e.sh'
              - 'scripts/require-docker.sh'
              - '.github/actions/backend-test-env/**'
              - 'docker-compose.yml'
              - 'Justfile'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            backend-tests:
              - 'apps/backend/**/*_test.go'
              - 'apps/backend/**/testdata/**'
              - 'scripts/ci/flake-tests.sh'
            mobile-tests:
              - 'packages/mobile-core/Tests/**/*.swift'
              - 'scripts/ci/flake-tests-swift.sh'
            mobile-core:
              - 'packages/mobile-core/**'
              - 'packages/flows/**'
              - 'apps/backend/api/openapi.yaml'
              - 'scripts/install-xcsift.sh'
              - '.xcode-version'
              - 'scripts/ci/select-xcode.sh'
              - 'scripts/mobile-core-test.sh'
              - '.github/workflows/ci-mobile-core.yml'
              - 'apps/mobile/**/*.swift'
              - '.swift-format'
              - '.swiftlint.yml'
              - '.swiftlint-baseline.tsv'
              - 'scripts/swiftlint-ratchet.sh'
              - 'scripts/gen-mobile-feature.sh'
              - 'scripts/ci/mobile-integration.sh'
            flows:
              - 'packages/flows/**'
              - 'apps/backend/api/**'
              - 'packages/mobile-core/Sources/**'
              - 'packages/mobile-core/Tests/**'
              - 'apps/backend/internal/testkit/**'
              - 'apps/backend/internal/modules/**'
              - 'apps/backend/internal/tools/flows/**'
              - 'scripts/ci/mobile-integration.sh'
            journeys:
              - 'apps/mobile/**'
              - 'docs/journeys/**'
              - 'apps/mobile/qa/**'
              - 'scripts/qa/**'
            web:
              - 'apps/web/**'
            scripts:
              - 'scripts/**/*.go'
              - 'scripts/go.mod'
              - 'scripts/go.sum'
              - 'scripts/githooks/**'
              - 'scripts/testdata/**'
              - 'scripts/ci/stage1-reuse.sh'
              - 'Justfile'
              - '.claude/settings.json'
              - '.claude/hooks/**'
              - '.github/workflows/ci-scripts.yml'

      # Negated patterns only exclude under `every`, so these two filters need their own step.
      # `unknown` is a changed file no filter above owns and no line below calls inert: it runs
      # every job, so a new file can never pass ci-ok with nothing tested. The inert paths are
      # docs/architecture/backend-platform.md#verification-scope's no-check rows.
      - uses: dorny/paths-filter@v3
        id: every
        if: steps.top.outputs.skip != 'true'
        with:
          # A PR diffs with git (plan fetches full history), so the shared GITHUB_TOKEN rate limit cannot fail it.
          # A queue draft's base is the draft below it, which Graphite deletes once it merges, so git cannot fetch
          # it; the draft uses the PR files API instead (one call).
          token: ${{ inputs.stage == 'queue' && github.token || '' }}
          base: ${{ github.event.pull_request.base.ref || vars.FEATURE_BRANCH || 'main' }}
          predicate-quantifier: every
          filters: |
            scripts:
              - 'scripts/*'
              - '!scripts/cloud-setup.sh'
            unknown:
              - '**'
              - '!apps/backend/**'
              - '!apps/mobile/**'
              - '!apps/web/**'
              - '!packages/mobile-core/**'
              - '!packages/flows/**'
              - '!scripts/**'
              - '!.github/**'
              - '!.claude/**'
              - '!.cursor/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.qa-screenshots/**'
              - '!ci/profiles/**'
              - '!mkdocs.yml'
              - '!requirements-docs.txt'
              - '!.python-version'
              - '!.xcode-version'
              - '!.gitignore'
              - '!.env.local'
              - '!.env.example'
              - '!Justfile'
              - '!docker-compose.yml'

      # A workflow-only change runs this lint, not the jobs the workflow defines.
      - name: Lint workflows
        if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Required workflows have no workflow-level path filter
        if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.workflows == 'true'
        working-directory: scripts
        run: go test -short -count=1 ./ci/

      - if: inputs.stage != 'queue' && steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web landing page tests
        if: inputs.stage != 'queue' && steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.web == 'true'
        working-directory: apps/web
        run: npm test

  flake:
    name: Flake (changed tests, count 20)
    needs: plan
    if: inputs.stage == 'pr' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.backend-tests == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The merge-base with trunk, so a stacked PR reruns the changed tests of the whole stack.
      - name: Resolve the base commit
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
        run: |
          base="$(scripts/ci/fetch-base.sh)"
          echo "BASE_COMMIT=${base}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/backend-test-env

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat apps/backend/.golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # The lint package's rule tests run golangci-lint and fail in CI when it is missing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      - name: Rerun the changed test files on this host's Postgres
        run: scripts/ci/flake-tests.sh --base "$BASE_COMMIT"

  flake-swift:
    name: Flake (changed Swift tests, count 10)
    needs: plan
    if: inputs.stage == 'pr' && needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.mobile-tests == 'true' || needs.plan.outputs.unknown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container runs as root over a checkout the runner user owns, so git refuses it
      # ("detected dubious ownership") unless the workspace is marked safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The merge-base with trunk, so a stacked PR reruns the changed tests of the whole stack.
      - name: Resolve the base commit
        env:
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH || 'main' }}
        run: |
          base="$(scripts/ci/fetch-base.sh)"
          echo "BASE_COMMIT=${base}" >> "$GITHUB_ENV"

      - name: Build the package and its tests once
        working-directory: packages/mobile-core
        run: swift build --build-tests --force-resolved-versions

      - name: Rerun the changed Swift test files on the built package
        run: scripts/ci/flake-tests-swift.sh --base "$BASE_COMMIT"

  # Required as "ci / ci-ok". A skipped check passes a required check, so ci-ok must never skip
  # once this workflow starts: keep always(), not !cancelled(), so a cancelled run fails it.
  # In stage 2 every other job skips and ci-ok runs ready's steps itself, so a queue draft waits for one runner.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, lint, backend, backend-report, e2e, ready, vuln, scripts, journeys, mobile-core, mobile-integration, flake, flake-swift]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.stage == 'queue' && 6 || 2 }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: re-actors/alls-green@release/v1
        if: inputs.stage != 'queue'
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, backend, backend-report, e2e, ready, vuln, scripts, journeys, mobile-core, mobile-integration, flake, flake-swift

      - uses: actions/checkout@v4
        if: inputs.stage == 'queue'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/backend-test-env
        if: inputs.stage == 'queue'
        with:
          db: 'false'

      - if: inputs.stage == 'queue'
        run: scripts/install-sqlc.sh

      - if: inputs.stage == 'queue'
        run: scripts/ci/ready.sh

      # A run cancelled before ci-ok starts skips every step above, and a job of skipped steps passes.
      - name: Fail a cancelled queue run
        if: inputs.stage == 'queue' && cancelled()
        run: exit 1

      # The next stage 1 run of this PR reads this summary back to decide whether it can reuse this result.
      - name: Record the diff's patch ID on this check run
        if: inputs.stage == 'pr' && needs.plan.outputs.patch-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ID: ${{ needs.plan.outputs.patch-id }}
          CI_ID: ${{ needs.plan.outputs.ci-id }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name == "ci / ci-ok") | .check_run_url | split("/") | last')"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" \
            -f "output[title]=stage 1" -f "output[summary]=patch-id: $PATCH_ID ci-id: $CI_ID" >/dev/null ||
            echo "::warning::could not record the reuse key; the next unchanged push reruns stage 1"
