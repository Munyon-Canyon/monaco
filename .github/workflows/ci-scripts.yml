name: CI scripts

# Called from ci-jobs.yml's scripts job. Kept in its own file so the `plan` job's `scripts` path
# filter can key on it, the same as ci-mobile-core.yml. docs/architecture/ci.md#triggers
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    name: Go tests (scripts ${{ matrix.leg }} of 2)
    # Pinned: the timeout leg of the xcode-lock tests fails on Ubuntu 26.04's coreutils. Back to
    # ubuntu-latest once those tests pass on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # The staged-lint hook test lints an apps/backend package, so it needs the backend's Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat apps/backend/.golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # lint_staged_go_test.go fails in CI without golangci-lint; the Justfile tests skip without just.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      # A pinned release download, not extractions/setup-just: that action lists releases through the API,
      # which fails the job when the shared GITHUB_TOKEN rate limit is spent.
      - name: Install the pinned just
        working-directory: ${{ runner.temp }}
        run: |
          v=1.58.0
          f="just-${v}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/casey/just/releases/download/$v/$f"
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  $f" | sha256sum -c -
          tar -xzf "$f" just
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The root package is 293 s of the serial run, so the legs split its top-level tests by sorted
      # position. Leg 1 also runs every other package and the Python tests.
      - name: Test scripts
        working-directory: scripts
        env:
          LEG: ${{ matrix.leg }}
        run: |
          names="$(go test -list '^Test' . | grep '^Test' | sort | awk -v leg="$LEG" '(NR - leg) % 2 == 0' | paste -sd '|' -)"
          go test -short -run "^($names)\$" .
          if [ "$LEG" = 1 ]; then
            mapfile -t others < <(go list ./... | grep -v '^github.com/monaco/monaco/scripts$')
            go test -short "${others[@]}"
          fi

      - name: Test Python scripts
        if: matrix.leg == 1
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
