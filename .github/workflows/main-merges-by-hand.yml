name: Main merges by hand

# Auto-merge is one repo-wide setting, and feature branches need it. This turns it back off on any PR into main.
on:
  pull_request_target:
    types: [auto_merge_enabled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  disable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: gh pr merge "${{ github.event.pull_request.number }}" --disable-auto --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
