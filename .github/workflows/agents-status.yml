name: Agents status

# Rewrites the tracking issue's status comment, so the operator reads it instead of asking.
# batch.json lives under .git/pstack/ on the root's machine, so CI reads the batch the root last embedded in that comment.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed, enqueued, dequeued]
  merge_group:
  push:
    branches: [main, '*-checkpoint-[0-9]*']
  # GitHub runs schedules from the default branch's copy of this file.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# One group per PR: GitHub keeps one pending run per group and cancels the one it replaces,
# which leaves a red status check. The publish is idempotent, so parallel runs are safe.
concurrency:
  group: agents-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read
  issues: write

jobs:
  detect:
    name: Detect a feature branch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      feature: ${{ steps.name.outputs.feature }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - id: name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if scripts/ci/feature-branch-name.sh "$REF_NAME" >/dev/null; then
            echo "feature=true" >> "$GITHUB_OUTPUT"
          fi

  status:
    needs: detect
    if: >-
      !cancelled() && (github.event_name != 'push' || github.ref_name == 'main' ||
      needs.detect.outputs.feature == 'true' || github.ref_name == vars.FEATURE_BRANCH)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && vars.FEATURE_BRANCH || '' }}

      - name: Skip a scheduled run once every batch ticket merged
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r tracking; do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$tracking/comments" \
              --jq '.[].body | select(contains("<!-- monacoctl agents status -->"))' |
              grep -qF '<!-- monacoctl agents active batch -->'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(sed -n 's/^tracking = //p' .monaco/agents.toml)

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Publish the status comment
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/monacoctl agents status --publish
