name: CI retarget

# Graphite restacks a PR while its base is a temporary graphite-base/N branch, then retargets
# it to its trunk without a new push, so ci.yml never runs for that head. `edited` lives here, not
# in ci.yml: an edit run in ci.yml would cancel the real run in its concurrency group. A title
# or body edit skips the ci job and leaves only a skipped "ci" check, never "ci / ci-ok".
# workflow_dispatch is no substitute: its checks do not satisfy a required check.
on:
  pull_request:
    branches: [main, '*-[0-9]*']
    types: [edited]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  detect:
    name: Detect a feature branch base
    if: github.event.changes.base != null && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      feature: ${{ steps.name.outputs.feature }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - id: name
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if scripts/ci/feature-branch-name.sh "$BASE_REF" >/dev/null; then
            echo "feature=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: detect
    if: >-
      github.base_ref == 'main' || needs.detect.outputs.feature == 'true' ||
      github.base_ref == vars.FEATURE_BRANCH
    uses: ./.github/workflows/ci-jobs.yml
    with:
      stage: pr
