name: Nightly QA

# scripts/qa/night.sh, the same runner as `just qa-night` on a laptop, run on a GitHub macOS
# runner against main every night. A failing night opens (or comments on) one GitHub issue
# labelled nightly-failure; the next passing night comments and closes it.
on:
  schedule:
    # 07:00 UTC = 03:00 US Eastern in summer (EDT), 02:00 in winter (EST).
    - cron: "0 7 * * *"
  workflow_dispatch:
  # A change to this workflow or to the QA scripts runs it on its own PR, when that PR is based
  # on main. PR runs never touch issues: the alert job only prints what it would have done.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nightly.yml
      - scripts/qa/**

concurrency:
  group: nightly-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A scheduled night whose main head already passed a nightly run skips qa and warm-cache.
  changed:
    name: Has main changed since the last green night
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            last="$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')"
            echo "main head $GITHUB_SHA, last green nightly head ${last:-none}"
            [[ "$last" == "$GITHUB_SHA" ]] && run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  qa:
    name: night.sh (backend, host tests, app, sample UI tests, screenshots)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MONACO_QA_IOS_CONFIG: placeholder
      MONACO_QA_SCREENSHOTS: "1"
      MONACO_QA_DERIVED_DATA: ${{ github.workspace }}/../DerivedData
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Install just
        run: command -v just || brew install just

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.MONACO_QA_DERIVED_DATA }}/SourcePackages
          key: spm-nightly-${{ runner.os }}-${{ hashFiles('apps/mobile/Monaco.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-nightly-${{ runner.os }}-

      - name: Run night.sh
        id: night
        run: scripts/qa/night.sh

      - name: Write report to the job summary
        if: always()
        run: |
          dir="$(find .logs/qa -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1)"
          if [[ -n "$dir" && -f "$dir/report.md" ]]; then
            cat "$dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            shots="$(find "$dir/screens" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
            {
              echo
              echo "Artifacts: \`nightly-qa-report\` (report, logs, per-class recordings) and \`nightly-qa-screens\` (${shots} sample screens)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "night.sh wrote no report; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report, logs and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-report
          path: |
            .logs/qa/
            !.logs/qa/*/screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-screens
          path: .logs/qa/*/screens/
          if-no-files-found: ignore
          retention-days: 14

  # The only job that saves the Go cache the backend job in ci-jobs.yml restores. It runs that job's
  # tests with the same flags, so PRs also reuse main's results for packages they do not change.
  warm-cache:
    name: Warm the Go cache for PRs
    needs: changed
    if: >-
      needs.changed.outputs.run == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pin testdata mtimes
        run: find . -path '*/testdata/*' -exec touch -t 200001010000 {} +

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Build and test backend
        working-directory: apps/backend
        run: |
          go build ./...
          go vet ./...
          RAPID_CHECKS=500 RAPID_STEPS=40 RAPID_NOFAILFILE=1 go test -race -shuffle=on -short ./...

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  backend:
    name: Backend unbounded suites (100k rapid, fuzz, seed sweep, mutation, benchstat)
    needs: changed
    if: needs.changed.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # atlas for testkit.DB and the tmpfs test Postgres, the same setup as the PR backend job.
      - uses: ./.github/actions/backend-test-env

      # monacoctl mutation runs the pinned gremlins from .bin, where this script installs it.
      - name: Install gremlins and benchstat
        run: |
          scripts/install-gremlins.sh
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download the last green night's benchmarks
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          [[ -n "$id" ]] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n nightly-bench -D "$RUNNER_TEMP/prev"

      - name: Run the unbounded suites
        env:
          OUT: ${{ runner.temp }}/nightly-backend
          PREV_BENCH: ${{ runner.temp }}/prev/bench.txt
        run: scripts/ci/nightly-backend.sh

      - name: Upload tonight's benchmarks for the next comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench
          path: ${{ runner.temp }}/nightly-backend/bench.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backend-logs
          path: ${{ runner.temp }}/nightly-backend/
          retention-days: 14

  alert:
    name: Open, update or close the nightly-failure issue
    needs: [qa, backend]
    if: >-
      always() && (needs.qa.result == 'success' || needs.qa.result == 'failure') &&
      needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa

      - name: Download report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nightly-qa-report
          path: qa-report

      - name: Update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RESULT: ${{ (needs.qa.result == 'failure' || needs.backend.result == 'failure') && 'failure' || 'success' }}
          QA_JOB_RESULT: ${{ needs.qa.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only the scheduled run, or a manual run on main, speaks for main.
          DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && '0' || '1' }}
        run: |
          dir="$(find qa-report -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1)"
          scripts/qa/nightly-alert.sh "$dir"
