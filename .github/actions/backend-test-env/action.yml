name: Backend test environment
description: >-
  Everything apps/backend tests need on a fresh runner: Go from go.mod, the Go cache go-cache.yml saved,
  the pinned atlas that builds the testkit template database, the pinned sqlc, and the tmpfs test Postgres.
  With db false, only Go and the Go cache.
inputs:
  db:
    description: Install atlas and sqlc and start the test Postgres.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: apps/backend/go.mod
        cache: false

    # go-cache.yml (on a push to backend-rewrite-3 or main) and the nightly warm-cache job save this
    # cache. PRs and the merge queue restore and never save.
    - uses: actions/cache/restore@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
        restore-keys: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

    - name: Download Go modules, retrying proxy errors
      shell: bash
      working-directory: apps/backend
      run: |
        for attempt in 1 2 3; do
          go mod download && exit 0
          echo "::warning::go mod download failed (attempt $attempt of 3)"
          sleep $((attempt * 10))
        done
        exit 1

    - name: Tools the workflows and scripts invoke
      shell: bash
      run: |
        ci_tools=(
          awk basename bc benchstat brew caffeinate cat chmod cp curl cut date dirname
          docker dotenvx du ffmpeg ffprobe find gh git go golangci-lint grep gt head id
          install jq just kill ln ls lsof magick mkdir mktemp npm oasdiff open pgrep
          pkill python3 rm sed seq sha256sum shasum simslim sleep sort swift sysctl tail
          tar tee tr uname uuidgen wc xcode-select xcodebuild xcrun
        )
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y jq
        fi

    - name: Install the pinned atlas community build
      if: inputs.db == 'true'
      shell: bash
      run: scripts/install-atlas.sh

    - name: Install the pinned sqlc that the query generator's golden test runs
      if: inputs.db == 'true'
      shell: bash
      run: scripts/install-sqlc.sh

    - name: Start the tmpfs test Postgres that testkit.DB clones from
      if: inputs.db == 'true'
      shell: bash
      run: docker compose --profile test up -d --wait postgres-test
