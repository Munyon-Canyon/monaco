name: Backend test environment
description: >-
  Everything apps/backend tests need on a fresh runner: Go from go.mod, the Go cache nightly saved,
  the pinned atlas that builds the testkit template database, the pinned sqlc, and the tmpfs test Postgres.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: apps/backend/go.mod
        cache: false

    # Only the nightly warm-cache job on main saves this cache. PRs restore and never save.
    - uses: actions/cache/restore@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
        restore-keys: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

    - name: Tools the workflows and scripts invoke
      shell: bash
      run: |
        ci_tools=(
          awk basename bc benchstat brew caffeinate cat chmod cp curl cut date dirname
          docker dotenvx du ffmpeg ffprobe find gh git go golangci-lint grep gt head id
          install jq just kill ln ls lsof magick mkdir mktemp npm oasdiff open pgrep
          pkill python3 rm sed seq sha256sum shasum simslim sleep sort swift sysctl tail
          tar tee tr uname uuidgen wc xcode-select xcodebuild xcrun
        )
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y jq
        fi

    - name: Install the pinned atlas community build
      shell: bash
      run: scripts/install-atlas.sh

    - name: Install the pinned sqlc that the query generator's golden test runs
      shell: bash
      run: scripts/install-sqlc.sh

    - name: Start the tmpfs test Postgres that testkit.DB clones from
      shell: bash
      run: docker compose --profile test up -d --wait postgres-test
