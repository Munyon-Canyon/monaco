name: Backend test environment
description: >-
  Everything apps/backend tests need on a fresh runner: Go from go.mod, the Go module and build caches staging.yml saved,
  the pinned atlas that builds the testkit template database, the pinned sqlc, and the tmpfs test Postgres.
  With db false, only Go and the Go cache. With go-cache false, no Go cache: modules download from the proxy.
inputs:
  db:
    description: Install atlas and sqlc and start the test Postgres.
    required: false
    default: 'true'
  cache-leg:
    description: >-
      The backend matrix leg (its artifact name). Restores that leg's build cache first, then any leg's.
    required: false
    default: ''
  go-cache:
    description: >-
      Restore the Go module cache and the build cache staging.yml saved. A job that only needs module
      sources, such as govulncheck, sets false: a cold go mod download is faster than the restore.
    required: false
    default: 'true'
outputs:
  go-mod-cache-hit:
    description: >-
      'true' when the module cache restored from its exact go.sum key, 'false' on a miss or a restore-key match,
      empty when the Go cache is off.
    value: ${{ steps.go-mod.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: apps/backend/go.mod
        cache: false

    # staging.yml saves the module cache once per go.sum (the rest leg) and a build cache per backend leg.
    # PRs and the merge queue restore them from staging, the default branch, and never save. A backend leg restores its own leg's build cache first; every other job takes the
    # newest build cache of any leg.
    - id: go-mod
      uses: actions/cache/restore@v4
      if: inputs.go-cache == 'true'
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - uses: actions/cache/restore@v4
      if: inputs.go-cache == 'true'
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ inputs.cache-leg }}
        restore-keys: |
          ${{ inputs.cache-leg != '' && format('go-build-{0}-{1}-{2}-', runner.os, hashFiles('**/go.sum'), inputs.cache-leg) || '' }}
          go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

    - name: Download Go modules, retrying proxy errors
      shell: bash
      working-directory: apps/backend
      run: |
        for attempt in 1 2 3; do
          go mod download && exit 0
          echo "::warning::go mod download failed (attempt $attempt of 3)"
          sleep $((attempt * 10))
        done
        exit 1

    - name: Tools the workflows and scripts invoke
      shell: bash
      run: |
        ci_tools=(
          apt-get awk basename bc benchstat brew caffeinate cat chmod cp curl cut date dirname
          docker dotenvx du ffmpeg ffprobe find gh git go golangci-lint grep gt hdiutil head id
          install ioreg jq just kill ln ls lsof magick mdutil mkdir mkfifo mktemp mv nats npm npx oasdiff open pgrep
          pkill ps python3 rm sed seq sha256sum shasum simslim sleep sort stat swift sysctl tail
          tar tee touch tr uname uuidgen wc xcode-select xcodebuild xcrun zstd
        )
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y jq
        fi

    - name: Install the pinned atlas community build
      if: inputs.db == 'true'
      shell: bash
      run: scripts/install-atlas.sh

    - name: Install the pinned sqlc that the query generator's golden test runs
      if: inputs.db == 'true'
      shell: bash
      run: scripts/install-sqlc.sh

    - name: Start the tmpfs test Postgres that testkit.DB clones from
      if: inputs.db == 'true'
      shell: bash
      run: |
        scripts/ci/pull-image.sh public.ecr.aws/docker/library/postgres:16-alpine
        docker compose --profile test up -d --wait postgres-test
