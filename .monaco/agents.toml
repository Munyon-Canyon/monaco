# status --publish rewrites the tracking issue comment that contains "<!-- monacoctl agents status -->".
repo = "Munyon-Canyon/monaco"
# "auto" is MONACO_FEATURE_BRANCH, else the FEATURE_BRANCH repo variable, which each checkpoint moves to <name>-<N+1>.
feature_branch = "auto"
tracking = 508
lanes = 3
verifier_app = "5101392"
verifier_installation = 166018497
milestone = "m8"
# Adding this label to a PR queues it in the Graphite merge queue; removing it dequeues it.
queue_label = "merge-queue"
# Graphite's merge queue concurrency, the most queue drafts it runs at once. With that many gtmq_ drafts open,
# land-stack and watch print "waiting for a Graphite queue slot" instead of "run land-stack again". Unset means
# unknown. Three drafts ran at once on 2026-10-03, so the setting is at least 3.
queue_concurrency = 3

[batch]
# The most tickets one batch admits.
size = 6
# batch admits two tickets whose Touches overlap when both globs lie inside these. A conflict here is a
# new file, a one-line append or regenerated output; docs/architecture/ci.md#shared-files says why each is safe.
shared = [
  # Written by go generate ./... (sqlc.yaml's module list too); a restack stops on a generated file with
  # no markers (merge=binary), and go generate ./... settles it.
  "apps/backend/internal/platform/httpx/api/**/*.gen.go",
  "apps/backend/sqlc.yaml",
  "apps/backend/.golangci.yml",
  "apps/backend/cmd/api/**",
  "docs/reference/**",
  # New files with unique timestamp names; a restack stops on atlas.sum (merge=binary) and go generate ./...
  # rehashes it.
  "apps/backend/migrations/**",
  # One file per flow; two tickets edit the same file only when they own the same flow.
  "packages/flows/backend/**",
  ".claude/skills/verify-backend/feature-map/**",
  "packages/mobile-core/Tests/MonacoCoreTests/Flows/**",
  # merge=union in .gitattributes.
  "apps/backend/CHANGELOG.md",
  # One registrations file per module.
  "apps/backend/internal/events/**",
  # One file per feature's error codes with its own golden; area goldens are merge=union. A conflict in an
  # existing codes_<area>.go is real and keeps both sides. The bundler injects the ErrorCode schema, and
  # cmd/gen errors writes the Swift case list one case per line.
  "apps/backend/internal/errs/codes_*.go",
  "apps/backend/internal/errs/testdata/codes_*.golden",
  "packages/mobile-core/Tests/MonacoAPITests/ErrorCodeCases.gen.swift",
  # One registry file per flow.
  "packages/flows/app/*.tsv",
  # Generated by cmd/gen flows; a restack stops on one with no markers (merge=binary), and go generate ./...
  # rewrites it.
  "packages/flows/Sources/MonacoFlows/Flow*.gen.swift",
  # New per-flow and per-scenario files.
  "apps/backend/internal/testkit/flows/**",
  "apps/backend/internal/testkit/fakes/**",
  "apps/backend/internal/testkit/scenarios/**",
  # Generated bundle of api/spec/*.yaml; a restack stops on it with no markers (merge=binary), and go
  # generate ./... rewrites it. Each
  # api/spec/<module>.yaml is owned by its module's tickets and is not listed.
  "apps/backend/api/openapi.yaml",
]

[dispatch]
# dispatch refuses while the stage 0 queue holds more live tickets than max_queue x [check] slots. --urgent bypasses it.
max_queue = 3

[check]
# The most `agents check` runs that execute rows at once on this machine; later runs queue in arrival order.
slots = 2

# agents check gives each row its own budget, except `go test -short`, which is budgeted per package
# (`package`, twice the 60 s that fails a package in `monacoctl test-report`, so an Intel laptop can finish a wide backend diff). The go budget applies to
# go build and go vet separately; lint covers golangci-lint, nogo and the comment lint.
# Outside CI, `package` scales by max(1, load1 / cores), capped at 4x; the values below are the unscaled base.
[check.budget]
go = "60s"
package = "120s"
lint = "60s"
swift = "150s"
# The app build plus MonacoTests takes 6 to 7 minutes on the operator's Intel laptop.
xcode = "600s"
# The agent-guard tests run serially and take 30 to 100 s under load when scripts/agent-guard.py changes.
scripts = "120s"
# The gate-checker suite takes 16.1 s quiet and 22 to 31 s loaded on the operator's Intel laptop.
python = "45s"
shell = "10s"
ready = "90s"
migrate = "30s"
openapi = "30s"
docs = "30s"
pr = "15s"
flows = "60s"
journeys = "30s"
